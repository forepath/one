services:
  postgres:
    image: docker.io/library/postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    container_name: loadweaver-control-plane-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loadweaver
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loadweaver-control-plane-network
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:9.0.6-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
    container_name: loadweaver-control-plane-valkey
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loadweaver-control-plane-network
    restart: unless-stopped

  backend-control-plane:
    image: ghcr.io/forepath/loadweaver-control-plane-api:latest
    pull_policy: never
    container_name: loadweaver-control-plane-api
    environment:
      <<: *backend-control-plane-environment
    ports:
      - '${PORT:-3400}:${PORT:-3400}'
      - '${LOADWEAVER_GRPC_PORT:-7443}:${LOADWEAVER_GRPC_PORT:-7443}'
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - loadweaver-control-plane-network
    restart: unless-stopped

  mailhog:
    image: docker.io/mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: loadweaver-control-plane-mailhog
    ports:
      - '${SMTP_HOST_PORT:-1027}:${SMTP_PORT:-1025}'
      - '${MAILHOG_HOST_PORT:-8027}:8025'
    networks:
      - loadweaver-control-plane-network
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:

networks:
  loadweaver-control-plane-network:
    driver: bridge
