<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self'; font-src 'self'"
    />
    <title></title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--chrome-bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 12.5px;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        height: 100%;
        box-sizing: border-box;
        /* Same edge as the console sidebar (--bs-border-color) */
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
        padding-left: 12px;
      }
      .mark {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
        color: var(--fg-emphasis);
      }
      body.blurred .title,
      body.blurred .mark {
        opacity: 0.55;
      }
      .controls {
        display: flex;
        align-items: stretch;
        height: 100%;
        -webkit-app-region: no-drag;
      }
      .controls button {
        width: 46px;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--fg);
        transition: background-color 0.1s;
      }
      .controls button:hover {
        background: var(--hover);
        color: var(--fg-emphasis);
      }
      .controls button:active {
        background: var(--active);
      }
      .controls button.close:hover {
        background: var(--close-hover);
        color: #fff;
      }
      .controls button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: -4px;
      }
      .controls button.settings {
        width: 40px;
      }
      .controls button.settings:hover {
        color: var(--primary-text);
      }
      .separator {
        width: 1px;
        margin: 9px 4px;
        background: var(--border);
      }
      .controls svg {
        width: 10px;
        height: 10px;
        stroke: currentColor;
        stroke-width: 1;
        fill: none;
        shape-rendering: crispEdges;
      }
      .controls .close svg,
      .controls .settings svg {
        shape-rendering: geometricPrecision;
      }
      .controls .settings svg {
        width: 15px;
        height: 15px;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      body.blurred .controls button:not(:hover) {
        color: var(--fg-muted);
      }
      .restore-icon {
        display: none;
      }
      body.maximized .restore-icon {
        display: block;
      }
      body.maximized .maximize-icon {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="brand">
        <img class="mark" src="logo.svg" alt="" />
        <div class="title" id="title"></div>
      </div>
      <div class="controls">
        <button type="button" tabindex="-1" id="settings" class="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <div class="separator" aria-hidden="true"></div>
        <button type="button" tabindex="-1" id="minimize" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5H10" /></svg>
        </button>
        <button type="button" tabindex="-1" id="maximize" title="Maximize" aria-label="Maximize">
          <svg class="maximize-icon" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.5" y="0.5" width="9" height="9" />
          </svg>
          <svg class="restore-icon" viewBox="0 0 10 10" aria-hidden="true">
            <rect x="0.5" y="2.5" width="7" height="7" />
            <path d="M2.5 2.5V0.5H9.5V7.5H7.5" />
          </svg>
        </button>
        <button type="button" tabindex="-1" id="close" class="close" title="Close" aria-label="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5L9.5 9.5M9.5 0.5L0.5 9.5" /></svg>
        </button>
      </div>
    </div>
    <script src="titlebar.js"></script>
  </body>
</html>
