<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agenstra</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" sizes="any" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" sizes="any" type="image/svg+xml" href="assets/images/favicon.svg" />
    <!-- Apply theme early to prevent flash -->
    <script>
      (function () {
        const stored = localStorage.getItem('theme-preference');
        const isDark =
          stored === 'dark' ||
          (stored === null && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
      })();
    </script>
    <!-- Import map for Monaco Editor (external dependency) -->
    <script type="importmap">
      {
        "imports": {
          "monaco-editor": "./assets/monaco/esm/vs/editor/editor.main.js"
        }
      }
    </script>
    <!--
      Sibling boot loader (not app-root:empty). :empty vanishes as soon as Angular mounts
      app-root, which caused load → blank → Angular overlay. This element survives bootstrap
      until the container removes it after the first paint.
    -->
    <style>
      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Fallbacks mirror the brand palette until Bootstrap CSS loads. */
        background: var(--bs-body-bg, #f2eff9);
      }
      [data-bs-theme='dark'] #app-boot-loader {
        background: var(--bs-body-bg, #0f0f11);
      }
      #app-boot-loader::after {
        content: '';
        width: 3rem;
        height: 3rem;
        border: 0.375rem solid #7a3fff;
        border-top-color: transparent;
        border-radius: 50%;
        animation: app-boot-spin 0.75s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-boot-loader" role="status" aria-live="polite" aria-label="Loading"></div>
    <app-root></app-root>
  </body>
</html>
