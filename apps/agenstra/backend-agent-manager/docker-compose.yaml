services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-manager-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-manager-network
    restart: unless-stopped

  backend-agent-manager:
    image: ghcr.io/forepath/agenstra-manager-api:latest
    pull_policy: never
    container_name: agent-manager-api
    environment:
      # Backend API configuration
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      WEBSOCKET_NAMESPACE: ${WEBSOCKET_NAMESPACE:-socket/agents}
      WEBSOCKET_CORS_ORIGIN: ${WEBSOCKET_CORS_ORIGIN:-*}
      NODE_ENV: ${NODE_ENV:-development}
      # Agent configuration
      AGENT_DEFAULT_IMAGE: ${AGENT_DEFAULT_IMAGE:-ghcr.io/forepath/agenstra-manager-worker:latest}
      AGENT_DOCKER_NETWORK: ${AGENT_DOCKER_NETWORK:-agent-manager-network}
      DOCKER_HOST_GATEWAY: ${DOCKER_HOST_GATEWAY:-host.docker.internal}
      # Dynamic provider plugins (pipeline / chat filters; OpenCode is the only agent harness)
      DYNAMIC_PIPELINE_PROVIDERS: ${DYNAMIC_PIPELINE_PROVIDERS:-}
      DYNAMIC_CHAT_FILTERS: ${DYNAMIC_CHAT_FILTERS:-}
      DYNAMIC_PROVIDERS_FAIL_FAST: ${DYNAMIC_PROVIDERS_FAIL_FAST:-false}
      DYNAMIC_PROVIDER_PLUGIN_PATH: ${DYNAMIC_PROVIDER_PLUGIN_PATH:-}
      DYNAMIC_PROVIDER_PLUGIN_INSTALL: ${DYNAMIC_PROVIDER_PLUGIN_INSTALL:-}
      # Database configuration
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-postgres}
      # Static API key authentication configuration
      STATIC_API_KEY: ${STATIC_API_KEY:-}
      # AES-256-GCM key for encrypted columns (base64-encoded 32 bytes)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # GIT repository configuration
      GIT_REPOSITORY_URL: ${GIT_REPOSITORY_URL:-}
      GIT_USERNAME: ${GIT_USERNAME:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_PASSWORD: ${GIT_PASSWORD:-}
      GIT_PRIVATE_KEY: ${GIT_PRIVATE_KEY:-}
      # CORS configuration (comma-separated list of allowed origins)
      # In production: CORS is disabled by default. Set CORS_ORIGIN to allow specific origins.
      # In development: CORS allows all origins by default.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Rate limiting configuration
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-100}
      # Keycloak configuration
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-}
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_TOKEN_VALIDATION: ${KEYCLOAK_TOKEN_VALIDATION:-online}
      # Environment variables for users authentication (when AUTHENTICATION_METHOD=users)
      JWT_SECRET: ${JWT_SECRET:-}
      # Docker images (AGENT_DEFAULT_IMAGE is set above under Agent configuration)
      OPENCODE_AGENT_DOCKER_IMAGE: ${OPENCODE_AGENT_DOCKER_IMAGE:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_USERNAME: ${OTEL_USERNAME:-}
      OTEL_PASSWORD: ${OTEL_PASSWORD:-}
      OTEL_METRICS_PATH: ${OTEL_METRICS_PATH:-/otel/metrics}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      # Mount Docker socket for Docker-in-Docker functionality
      - /var/run/docker.sock:/var/run/docker.sock
      - ./provider-plugins:/var/lib/forepath/provider-plugins
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-manager-network
    extra_hosts:
      # Linux: resolve host.docker.internal for published-port OpenCode health checks
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  agent-manager-network:
    name: agent-manager-network
    driver: bridge
