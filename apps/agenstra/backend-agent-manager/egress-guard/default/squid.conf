# Boot default (no policy applied yet): listeners exist, every request is denied.
http_port 127.0.0.1:3128 name=explicit
http_port 127.0.0.1:3129 intercept name=http_intercept
https_port 127.0.0.1:3130 intercept ssl-bump name=https_intercept tls-cert=/var/lib/agenstra-egress/bootstrap.pem generate-host-certificates=off
pid_filename /run/agenstra-egress/squid.pid
cache_effective_user egressproxy
cache_effective_group egressproxy
cache deny all
cache_mem 8 MB
cache_log /var/log/agenstra-egress/cache.log
logfile_rotate 1
coredump_dir /tmp
strip_query_terms on
via off
forwarded_for delete
httpd_suppress_version_string on
shutdown_lifetime 1 seconds
acl step1 at_step SslBump1
note agenstra_rule guard all
http_access deny all
ssl_bump peek step1
ssl_bump terminate all
logformat agenstra AGENSTRA_EGRESS %ts.%03tu %Ss %>Hs %rm %#ru %#>rd %#ssl::>sni %<a %<st %>st %tr %#{agenstra_rule}note %err_code
access_log stdio:/var/log/agenstra-egress/access.log agenstra
