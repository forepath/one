              {
                type: object,
                description: Discovery report (agent protocol `discoveryReportSchema`),
              }
        items:
          type: array
          items:
            type: object
            properties:
              id:
                {
                  type: string,
                  description: '`compose:<project>` or `container:<name>`',
                }
              kind: { type: string, enum: [compose, container] }
              name: { type: string }
              containers: { type: array, items: { type: string } }
              services: { type: array, items: { type: string } }
              ports: { type: array, items: { type: object } }
              mounts: { type: array, items: { type: object } }
              stateful: { type: boolean }
              managed: { type: boolean }
        projects: { type: array, items: { type: string } }
        selection:
          {
            oneOf:
              [
                { $ref: '#/components/schemas/ImportSelectionView' },
                { type: 'null' },
              ],
          }
    ImportSelections:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1024
          items:
            type: object
            required: [item, choice]
            properties:
              item: { type: string }
              choice: { type: string, enum: [import, migrate, ignore] }
              project: { type: string }
              deployment: { type: string }
              http:
                {
                  type: object,
                  additionalProperties: { type: string },
                  description: Hostname per host port,
                }
              volumes:
                type: object
                additionalProperties:
                  { type: string, enum: [copy, empty, keep] }
                description: Per mount key (`volume:<name>` / `bind:<source>`)
              variables:
                { type: object, additionalProperties: { type: string } }
        wipeFormerIdentity: { type: boolean }
    ImportSelectionView:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ImportStatus' }
        discoveryId: { type: string, format: uuid }
        selections: { $ref: '#/components/schemas/ImportSelections' }
        joinPlan: { $ref: '#/components/schemas/JoinPlan' }
        planId: { type: [string, 'null'], format: uuid }
        steps:
          type: object
          description: Progress per step id
          additionalProperties:
            type: object
            properties:
              status:
                {
                  type: string,
                  enum: [pending, running, done, failed, skipped],
                }
              message: { type: string }
              bytes: { type: integer }
              startedAt: { type: string, format: date-time }
              finishedAt: { type: string, format: date-time }
        released: { type: array, items: { type: string } }
        error: { type: [string, 'null'] }
    JoinPlan:
      type: object
      properties:
        node: { type: string }
        former:
          {
            type: [object, 'null'],
            description: 'Former installation: same-cluster (reusable / discarded replicas) or other-cluster (requires the wipe)',
          }
        conflicts:
          type: array
          items:
            type: object
            properties:
              kind:
                {
                  type: string,
                  enum: [port, interface, subnet, hostname, name, tunnel],
                }
              severity: { type: string, enum: [error, resolved, warning] }
              subject: { type: string }
              reason: { type: string }
              resolution: { type: string }
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        deployments: { type: array, items: { type: object } }
        steps:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind:
                type: string
                enum:
                  [
                    components,
                    wipe-identity,
                    reuse-replicas,
                    activate,
                    precopy,
                    stop,
                    final-sync,
                    release,
                    verify,
                    handover,
                  ]
              description: { type: string }
              deployment: { type: string }
        reservedPorts:
          type: object
          properties:
            tcp: { type: array, items: { type: integer } }
            udp: { type: array, items: { type: integer } }
        leftovers: { type: array, items: { type: string } }
        wipeFormerIdentity: { type: boolean }
    JoinResponse:
      type: object
      properties:
        clusterId: { type: string }
        nodeName: { type: string }
        certificatePem: { type: string }
        caCertificatePem: { type: string }
        controlPlaneEndpoints: { type: array, items: { type: string } }
        pending:
          type: boolean
          enum: [true]
          description: Joined for an import (only answered to `discover` joins)
    NodePlatformComponentDto:
      type: object
      required: [id, component, label, state]
      properties:
        id:
          type: string
          description: Stable per node (`etcd`, `object-store:2`, `registry-mirror:docker.io`).
        component:
          type: string
          enum:
            [
              etcd,
              postgres,
              queue,
              control-plane-api,
              log-store,
              object-store,
              registry,
              registry-mirror,
              ingress,
              dns,
              vpn-gateway,
              bgp,
              rate-limiter,
              backup-server,
            ]
        label:
          type: string
          description: English label (consoles localize by `component`).
        role:
          type: string
          enum: [leader, replica, member, witness, pending, active, standby]
          description: >-
            `leader` / `replica` for Postgres (Patroni; `member` when it couldn't be asked), `pending` for the API replica
            while the database handover is outstanding, `active` / `standby` for the VPN gateway.
        state:
          type: string
          enum: [running, failed, unknown]
        detail:
          type: string
          description: Short facts (generation, replication, counts) or the failed layer's error.
    NodeResponseDto:
      type: object
      properties:
        name: { type: string }
        site: { type: string }
        lifecycle:
          {
            type: string,
            enum:
              [pending, importing, active, cordoned, draining, leaving, left],
          }
        labels: { type: object, additionalProperties: { type: string } }
        effectiveLabels:
          type: object
          additionalProperties: { type: string }
          description: 'Labels selectors see: the node labels, `loadweaver.com/site` / `loadweaver.com/node` and the derived runtime labels (`runtime.loadweaver.com/<level>: ready`, `loadweaver.com/runtime: <strongest ready level>`)'
        runtimes:
          type: array
          items:
            { type: string, enum: [runc, sandboxed, sandboxed-kvm, microvm] }
          description: Ready isolation levels in ladder order; a workload runs only on nodes with exactly its level
        controlPlane: { type: boolean }
        witness: { type: boolean }
        agentVersion: { type: [string, 'null'] }
        endpointHost: { type: [string, 'null'] }
        overlayV4: { type: [string, 'null'] }
        overlayV6: { type: [string, 'null'] }
        podSubnetV4: { type: [string, 'null'] }
        podSubnetV6: { type: [string, 'null'] }
        appliedRevision: { type: integer }
        applyStatus: { type: [string, 'null'] }
        connected: { type: boolean }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        joinedAt: { type: string, format: date-time }
    CreateJoinTokenDto:
      type: object
      properties:
        site: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        witness: { type: boolean }
        ttlMinutes: { type: integer, minimum: 1, maximum: 1440 }
        description: { type: string, maxLength: 255 }
    JoinTokenResponseDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tokenPrefix: { type: string }
        site: { type: string }
        witness: { type: boolean }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: [string, 'null'], format: date-time }
        usedByNode: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'], format: date-time }
    CreatedJoinTokenDto:
      allOf:
        - $ref: '#/components/schemas/JoinTokenResponseDto'
        - type: object
          properties:
            token: { type: string, description: Shown once }
    DraftOpInput:
      type: object
      required: [op]
      properties:
        op: { type: string, enum: [upsert, delete] }
        document:
          {
            type: string,
            description: 'Upsert: the resource as one YAML document',
          }
        kind: { type: string, description: 'Delete: the resource kind' }
        name: { type: string }
        project: { type: string }
        baseGeneration:
          {
            type: integer,
            minimum: 0,
            description: Generation the client edited (default the current one),
          }
    DraftOp:
      type: object
      properties:
        op: { type: string, enum: [upsert, delete] }
        kind: { type: string }
        name: { type: string }
        project: { type: [string, 'null'] }
        document: { type: string }
        baseGeneration:
          { type: integer, description: '0 = the resource did not exist' }
        by: { type: string }
        at: { type: string, format: date-time }
    Draft:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        owner: { type: string }
        projects: { type: array, items: { type: string } }
        clusterScope: { type: [string, 'null'], enum: [infra, admin, null] }
        ops: { type: array, items: { $ref: '#/components/schemas/DraftOp' } }
        version: { type: integer }
        status: { type: string, enum: [open, submitted, discarded] }
        planId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SavedView:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { type: string }
        name: { type: string }
        state:
          type: object
          additionalProperties: true
          description: Opaque console state (query, filters, columns, sort, tree view, density …)
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateSavedViewDto:
      type: object
      required: [scope, name, state]
      additionalProperties: false
      properties:
        scope: { type: string, pattern: '^[a-z0-9][a-z0-9:._-]{0,99}$' }
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed
        state:
          type: object
          additionalProperties: true
          description: At most 16 KiB serialized
    UpdateSavedViewDto:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed
        state:
          type: object
          additionalProperties: true
          description: At most 16 KiB serialized
    DraftConflict:
      type: object
      properties:
        key: { type: string }
        kind: { type: string }
        name: { type: string }
        project: { type: [string, 'null'] }
        baseGeneration: { type: integer }
        currentGeneration: { type: integer, description: '0 = deleted since' }
    CreatePlanDto:
      type: object
      properties:
        documents:
          { type: string, description: Multi-document YAML bundle (max 2 MiB) }
        delete:
          type: array
          items:
            type: object
            required: [kind, name]
            properties:
              kind: { type: string }
              name: { type: string }
              project: { type: string }
        refresh:
          type: array
          description: Deployments whose image digests and secret versions are resolved again (3.22)
          items:
            type: object
            required: [kind, name]
            properties:
              kind: { type: string, const: Deployment }
              name: { type: string }
              project: { type: string }
        dryRun:
          type: boolean
          description: Preview only (3.36) — build and return the plan without storing it
    CertificateSummary:
      type: object
      properties:
        id: { type: string }
        names: { type: array, items: { type: string } }
        source: { type: string, enum: [acme, custom] }
        notAfter: { type: [string, 'null'], format: date-time }
        failures: { type: integer, description: Consecutive ACME failures }
        lastError: { type: [string, 'null'] }
    DnsZoneStatus:
      type: object
      properties:
        zone: { type: string, description: DnsZone resource name }
        provider: { type: string }
        syncedAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        conflicts:
          {
            type: array,
            items: { type: string },
            description: Names managed by someone else,
          }
        changes: { type: integer }
        drift:
          {
            type: [string, 'null'],
            description: 'Secondaries: which servers are behind the primary',
          }
    DnssecZone:
      type: object
      properties:
        zone: { type: string }
