        pins: { type: array, items: { type: string } }
        repositories:
          type: array
          items:
            type: object
            properties:
              scope: { type: string }
              port: { type: integer }
              fingerprint: { type: string }
              keyGeneration: { type: integer }
        targets:
          type: array
          items:
            type: object
            properties:
              target: { type: string }
              scope: { type: string }
              at: { type: string, format: date-time }
              ok: { type: boolean }
              error: { type: string }
        usage:
          type: array
          items:
            type: object
            properties:
              project: { type: string }
              bytes: { type: integer }
              uploadedBytes: { type: integer }
              backups: { type: integer }
        deletionDelayHours: { type: number }
    Migration:
      type: object
      description: One migration attempt (3.10).
      properties:
        id: { type: string, format: uuid }
        replica:
          { type: string, description: '`project/deployment/service/index`' }
        project: { type: string }
        deployment: { type: string }
        fromNode: { type: string }
        toNode: { type: string }
        method:
          { type: string, enum: [live, stop-and-copy, blue-green, short-stop] }
        methodLabel:
          type: string
          description: 'As shown in the plan, e.g. `live`, `stop-and-copy (gVisor)`, `short-stop (privileged container)`'
        attempt: { type: integer, minimum: 1 }
        phase:
          type: string
          description: |
            Checkpoint attempts: `prepare`, `precopy`, `freeze`, `transfer`, `restore`, `cutover`, `done`, or
            `aborting` → `fallback`. Blue / green and short stop: `starting` / `stopping`, `done`, `failed`.
            `cancelled` when the move was abandoned (replica removed, plan replaced, target lost).
        reason: { type: string, enum: [plan, drain] }
        fallbackReason: { type: [string, 'null'] }
        freezeMs: { type: [integer, 'null'] }
        checkpointBytes: { type: [integer, 'null'] }
        precopyRounds: { type: [integer, 'null'] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    ImageScan:
      type: object
      properties:
        digest: { type: string, description: '`sha256:<hex>`' }
        image: { type: string }
        scannedAt: { type: string, format: date-time }
        node: { type: string, description: Node that reported the scan }
        scanner: { type: string, description: 'e.g. `trivy 0.76.0`' }
        summary:
          type: object
          properties:
            counts:
              type: object
              description: Per severity (CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN)
              additionalProperties:
                type: object
                properties:
                  total: { type: integer }
                  fixable:
                    {
                      type: integer,
                      description: Findings with a fixed version,
                    }
        findings:
          type: array
          description: The most severe findings (at most 50)
          items:
            type: object
            properties:
              id: { type: string, description: 'e.g. a CVE id' }
              severity: { type: string }
              package: { type: string }
              installed: { type: string }
              fixed: { type: [string, 'null'] }
    EnrollVpnDeviceDto:
      type: object
      required: [name, publicKey]
      properties:
        name: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        publicKey:
          type: string
          pattern: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$'
          description: WireGuard public key generated on the device
    RenewVpnDeviceDto:
      type: object
      properties:
        publicKey:
          type: string
          pattern: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$'
          description: New public key (optional key rotation)
    CreateVpnMachineDto:
      type: object
      required: [name, publicKey, groups, subnets]
      properties:
        name: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        publicKey:
          { type: string, pattern: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$' }
        groups:
          type: array
          maxItems: 32
          items:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
          description: Client groups
        subnets:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 18 }
          description: IPv4 office networks behind the machine
        lifetimeDays:
          {
            type: integer,
            minimum: 1,
            maximum: 3650,
            description: 'Default 365',
          }
    RenewVpnMachineDto:
      type: object
      properties:
        lifetimeDays:
          {
            type: integer,
            minimum: 1,
            maximum: 3650,
            description: 'Default 365',
          }
    PostureReportDto:
      type: object
      description: Posture report protocol v1.
      required: [platform, osVersion]
      additionalProperties: false
      properties:
        platform: { type: string, enum: [macos, windows, linux, ios, android] }
        osVersion: { type: string, pattern: '^[0-9A-Za-z.+-]{1,32}$' }
        appVersion: { type: string, pattern: '^[0-9A-Za-z.+-]{1,32}$' }
        diskEncryption: { type: boolean }
        firewall: { type: boolean }
        screenLock: { type: boolean }
        deviceId:
          type: string
          pattern: '^[0-9A-Za-z._:-]{1,128}$'
          description: MDM / EDR device id (Intune / Entra device id, Defender machine id, CrowdStrike AID, SentinelOne agent id / UUID)
        serialNumber: { type: string, pattern: '^[0-9A-Za-z._-]{1,64}$' }
        hostname: { type: string, maxLength: 253 }
        certificate:
          type: object
          required: [pem]
          properties:
            pem: { type: string, maxLength: 16384 }
            proof:
              type: object
              required: [timestamp, signature]
              properties:
                timestamp: { type: string, format: date-time }
                signature:
                  {
                    type: string,
                    description: 'Base64 signature over `loadweaver-posture-v1:<device id>:<timestamp>` (ECDSA P-256 / P-384 raw or DER, RSA PKCS#1 v1.5 SHA-256)',
                  }
    PostureIntegrationFact:
      type: object
      properties:
        integration: { type: string }
        type: { type: string }
        category: { type: string, enum: [mdm, edr] }
        status: { type: string, enum: [compliant, non-compliant, unknown] }
        risk: { type: string, enum: [low, medium, high] }
        reasons: { type: array, items: { type: string } }
        checkedAt: { type: string, format: date-time }
        staleAt: { type: string, format: date-time }
        matchedBy: { type: string, enum: [serial, deviceId, hostname] }
    VpnClientPosture:
      type: object
      properties:
        reportedAt: { type: [string, 'null'], format: date-time }
        platform: { type: [string, 'null'] }
        osVersion: { type: [string, 'null'] }
        appVersion: { type: [string, 'null'] }
        diskEncryption: { type: [boolean, 'null'] }
        firewall: { type: [boolean, 'null'] }
        screenLock: { type: [boolean, 'null'] }
        serialNumber: { type: [string, 'null'] }
        hostname: { type: [string, 'null'] }
        integrations:
          {
            type: array,
            items: { $ref: '#/components/schemas/PostureIntegrationFact' },
          }
        certificate:
          type: [object, 'null']
          properties:
            source: { type: string, enum: [company, loadweaver] }
            valid: { type: boolean }
            revoked: { type: boolean }
            serialNumber: { type: string }
            notAfter: { type: string, format: date-time }
            reasons: { type: array, items: { type: string } }
            checkedAt: { type: string, format: date-time }
    PosturePluginInfo:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        category: { type: string, enum: [mdm, edr] }
        defaultMatchBy:
          {
            type: array,
            items: { type: string, enum: [serial, deviceId, hostname] },
            description: Never contains hostname (self-reported; opt-in per integration with a warning),
          }
        supportsUserMatch:
          {
            type: boolean,
            description: Vendor records carry the device user (e-mail / UPN); integrations then require it to match the VPN client owner by default,
          }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              secret: { type: boolean }
              required: { type: boolean }
              options: { type: array, items: { type: string } }
              default: { type: string }
              description: { type: string }
    PostureIntegrationInput:
      type: object
      properties:
        name:
          {
            type: string,
            pattern: '^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$',
            description: Create only; used in conditions,
          }
        type: { type: string, description: Create only; plugin id }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: { type: string } }
        matchBy:
          {
            type: array,
            items: { type: string, enum: [serial, deviceId, hostname] },
            minItems: 1,
            maxItems: 3,
            description: Defaults to the plugin's defaultMatchBy. hostname is weak (self-reported,
            not unique) and adds a warning,
          }
        requireUserMatch:
          {
            type: boolean,
            description: "The vendor's device user must match the VPN client owner (e-mail / UPN, case-insensitive). Default true where the plugin supports it; true for a plugin without user data is refused (400). Machine clients are never user-matched",
          }
        intervalMinutes:
          { type: integer, minimum: 5, maximum: 1440, default: 30 }
        maxAgeMinutes:
          { type: integer, minimum: 10, maximum: 10080, default: 1440 }
    PostureIntegration:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        displayName: { type: string }
        category: { type: string, enum: [mdm, edr] }
        enabled: { type: boolean }
        config:
          {
            type: object,
            additionalProperties: { type: string },
            description: Non-secret fields only,
          }
        secretsSet:
          {
            type: array,
            items: { type: string },
            description: Secret fields that have a stored value,
          }
        matchBy: { type: array, items: { type: string } }
        requireUserMatch: { type: boolean }
        warnings:
          {
            type: array,
            items: { type: string },
            description: Weak matching settings (hostname matching,
            user match turned off),
          }
        intervalMinutes: { type: integer }
        maxAgeMinutes: { type: integer }
        status: { type: string, enum: [ok, failing, pending, disabled] }
        lastSyncAt: { type: [string, 'null'], format: date-time }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        failures: { type: integer }
        nextSyncAt: { type: [string, 'null'], format: date-time }
        vendorDevices: { type: integer }
        matchedDevices: { type: integer }
    IntegrationEnvStatus:
      type: object
      required: [id, label, active, details]
      properties:
        id:
          {
            type: string,
            enum:
              [smtp, otlp, geoip, releases, postureSync, kms, auth, plugins],
          }
        label:
          {
            type: string,
            description: Plain English; the console translates by id,
          }
        active: { type: boolean }
        details:
          type: object
          additionalProperties: { type: string }
          description: Non-secret settings, e.g. `server` / `from` (smtp), `enabled` / `endpoint` (otlp), `source` / `path` (geoip), `repository` / `updateCheck` / `cron` / `rollout` (releases), `cron` / `source` (postureSync), `provider` / `address` / `namespace` / `mount` / `key` (kms), `method` / `keycloakUrl` / `realm` / `clientId` (auth), module names per plugin kind (plugins).
    IntegrationTestResult:
      type: object
      required: [ok, message, durationMs]
      properties:
        ok: { type: boolean }
        message:
          { type: string, description: Sanitized, at most 300 characters }
        details: { type: object, additionalProperties: { type: string } }
        durationMs: { type: integer }
    PostureTestResult:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
    TrustedFleetKey:
      type: object
      required: [kid, publicKey, addedAt, fingerprint]
      properties:
        kid: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
        publicKey: { type: string, description: Ed25519 public key, SPKI PEM }
        addedAt: { type: string, format: date-time }
        fingerprint:
          {
            type: string,
            description: '`SHA256:<base64url>` of the key (SPKI DER), as the fleet shows it',
          }
    TrustedFleet:
      type: object
      required: [issuer, name, keys, createdBy, createdAt, updatedAt]
      properties:
        issuer: { type: string }
        name: { type: string }
        keys:
          type: array
          items: { $ref: '#/components/schemas/TrustedFleetKey' }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TrustedFleetInput:
      type: object
      required: [name, keys]
      properties:
        name: { type: string, maxLength: 255 }
        keys:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            required: [kid, publicKey]
            properties:
              kid: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
              publicKey: { type: string, maxLength: 1024 }
    FleetIdentityStatus:
      type: object
      required: [version, clusterId, verified, issuer, person, reason]
      properties:
        version: { type: integer, example: 1 }
        clusterId: { type: string }
        verified: { type: boolean }
        issuer: { type: string, nullable: true }
        person:
          { type: string, nullable: true, description: '`fleet:<iss>:<sub>`' }
        reason: { type: string, nullable: true }
    CertificateTrustSettings:
      type: object
      properties:
        companyCaPem: { type: [string, 'null'] }
        crlPem: { type: [string, 'null'] }
        trustClusterCa: { type: boolean }
        requireProof: { type: boolean }
        companyCaSubjects: { type: array, items: { type: string } }
        updatedAt: { type: [string, 'null'], format: date-time }
    IssuedDeviceCertificate:
      type: object
      properties:
        certificatePem: { type: string }
        caCertificatePem: { type: string }
        serialNumber: { type: string }
        notAfter: { type: string, format: date-time }
    VpnClientSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [user, machine] }
        name: { type: string }
        owner: { type: string, description: 'Email / user name, or `machine`' }
        address: { type: string, description: Address in the client network }
        subnets: { type: array, items: { type: string } }
        groups: { type: array, items: { type: string } }
        effectiveGroups:
          type: array
          items: { type: string }
          description: Groups after posture (failing ones replaced by their restricted group); empty when not active
        restrictions:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Why the device fails, per group
        posture: { $ref: '#/components/schemas/VpnClientPosture' }
        status: { type: string, enum: [active, expired, revoked] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        lastHandshakeAt: { type: [string, 'null'], format: date-time }
        lastEndpoint: { type: [string, 'null'] }
    VpnClientConfigResponse:
      type: object
      properties:
        client: { $ref: '#/components/schemas/VpnClientSummary' }
        config:
          type: string
          description: wg-quick configuration with a placeholder for the private key; empty when the device isn't active
        routes:
          { type: array, items: { type: string }, description: AllowedIPs }
        dns: { type: string, description: The gateway's client-network address }
        names:
          {
            type: array,
            items: { type: string },
            description: Names the device may resolve,
          }
    PlanResponseDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum:
            [
              pending,
              applying,
              applied,
              failed,
              discarded,
              rolling-back,
              rolled-back,
              rollback-failed,
            ]
          description: |
            `applying` until every expected node reported the revision; a failure, timeout or cancel rolls back
            (`rolling-back` → `rolled-back`). `rollback-failed` keeps its locks until a fix-forward plan is applied;
            the failed plan then becomes `failed`.
        changes:
          type: array
          items:
            type: object
            properties:
              action:
                { type: string, enum: [create, update, delete, unchanged] }
              kind: { type: string }
              name: { type: string }
              project: { type: [string, 'null'] }
              baseGeneration: { type: integer }
        networkChanges:
          type: array
          items:
            type: object
            properties:
              layer:
                {
                  type: string,
                  enum: [tunnels, routing, filtering, dns, services],
                }
              action: { type: string }
              node: { type: string }
              summary: { type: string }
        diagnostics: { type: array, items: { type: object } }
        workloadChanges:
          type: array
          description: |
            Replicas started, stopped or moved (3.10). Moves carry the method chosen per service (`live`,
            `stop-and-copy`, `blue-green`, `short-stop`) and `methodLabel` with the reason, e.g.
            `short-stop (privileged container)`. The method is checked again at apply; the label's estimates may differ.
            `copy` entries list volume copies the plan adds to existing volumes (`volume`, node `to`, `copy`: `sync` /
            `remote`), e.g. one held back while a node was joining; they are informational (not compared at apply).
          items:
            type: object
            properties:
              action: { type: string, enum: [start, stop, move, copy] }
              replica: { type: string }
              volume:
                {
                  type: string,
                  description: 'Only for `copy`: `project/deployment/volume`',
                }
              copy:
                {
                  type: string,
                  enum: [sync, remote],
                  description: 'Only for `copy`',
                }
              from: { type: string }
              to: { type: string }
              method:
                {
                  type: string,
                  enum: [live, stop-and-copy, blue-green, short-stop],
                }
              methodLabel: { type: string }
        failureAnalysis:
          type: [object, 'null']
          description: Single points of failure and N+1 capacity (3.12)
        deploymentStates:
          type: object
          description: Per deployment the image digests and secret versions this plan deploys (3.22)
          additionalProperties:
            type: object
            properties:
              images: { type: object, additionalProperties: { type: string } }
              secretVersions:
                { type: object, additionalProperties: { type: integer } }
        warnings:
          type: array
          description: Pins (need confirm at apply), uncached registries, compose warnings
          items: { type: object }
        createdBy: { type: [string, 'null'] }
        createdByEmail: { type: [string, 'null'] }
        creatorRoles:
          type: object
          description: The author's role in each touched project when the plan was made; approvals depend on it (3.17)
          additionalProperties: { $ref: '#/components/schemas/ProjectRole' }
        risk:
          type: object
          description: Per project, why its part is risky for the `risky` approval mode (`unacknowledged pins`, `internet exposure`)
          additionalProperties: { type: array, items: { type: string } }
        approvals:
          type: array
          items:
            type: object
            properties:
              project: { type: string }
              userId: { type: string }
              userEmail: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
        progress:
          oneOf:
            - $ref: '#/components/schemas/PlanProgress'
            - type: 'null'
          description: Live progress of an apply or rollback; null for plans never applied
        resolves:
          type: [string, 'null']
          format: uuid
          description: The `rollback-failed` plan this fix-forward plan resolves; only it may take over that plan's locks
        source:
          oneOf:
            - $ref: '#/components/schemas/PlanSource'
            - type: 'null'
          description: Where the plan came from (null for plans created before GitOps)
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        appliedAt: { type: [string, 'null'], format: date-time }
        dryRun:
          type: boolean
          description: Set on dry-run previews (3.36); `id` is then `dry-run` and nothing was stored
    PlanSource:
      type: object
      required: [kind]
      description: Where a plan came from (3.29)
      properties:
        draft:
          type: object
          description: The Workspace draft the plan was submitted from (3.36)
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
        kind:
          type: string
          enum: [git, ui, api, drift, system]
          description: '`system`: fix-forward plans of failed rollbacks'
        connection:
          { type: string, format: uuid, description: 'Git: the connection' }
        commit: { type: string, description: 'Git: the synced commit' }
        ref: { type: string, description: 'Git: e.g. `refs/heads/main`' }
        pr:
          {
            type: integer,
            description: 'Git: the pull request the commit belongs to (plan bot); such plans are applied only by `loadweaver apply` on it',
          }
        prUrl:
          { type: string, description: 'Git: the pull request URL (plan bot)' }
        supersedes:
          {
            type: string,
            format: uuid,
            description: 'Plan bot: the UI / API plan of an authoritative scope this pull request plan replaces',
          }
        supersededBy:
          {
            type: string,
            format: uuid,
            description: 'UI / API plan replaced (discarded) by the plan of its pull request',
          }
        author:
          {
            type: string,
            description: 'Git: `Name <email>` of the commit author; UI / API: the user id',
          }
        authors:
          type: array
          items: { type: string }
          description: 'Git: Loadweaver users behind the change (pull request author, pusher of a default-branch head; through linked accounts). They cannot approve the plan.'
        limited:
          {
            type: string,
            description: 'Plan bot: planned only for this project or path (`loadweaver plan <x>`); not merged after the apply',
          }
        pullRequests:
          type: array
          description: Authoritative scopes — the pull requests (or branches on plain Git) this plan was turned into; the plan is applied through them
          items:
            type: object
            required: [connection, branch]
            properties:
              connection: { type: string, format: uuid }
              branch:
                {
                  type: string,
                  example: loadweaver/plan-0b0e6f6e-3f4c-4c38-9d55-1f2b3c4d5e6f,
                }
              url: { type: string }
              number: { type: integer }
              error:
                {
                  type: string,
                  description: Why the pull request couldn't be opened,
                }
              pending:
                {
                  type: boolean,
                  description: 'The pull request is being opened (in the background after `POST /plans`); `url` / `error` follow',
                }
    GitConnection:
      type: object
      properties:
        id: { type: string, format: uuid }
        project:
          { type: [string, 'null'], description: null = the cluster scope }
        provider: { type: string, enum: [github, gitlab, gitea, git] }
        repoUrl: { type: string, example: 'https://github.com/acme/infra.git' }
        branch: { type: string, example: main }
        path: { type: string, example: clusters/prod }
        mode: { type: string, enum: [authoritative, bidirectional] }
        credentials:
          { type: [string, 'null'], example: 'secret://shop/git-token' }
        apiUrl: { type: [string, 'null'] }
        caCertificate: { type: [string, 'null'] }
        pollIntervalSeconds: { type: [integer, 'null'] }
        webhook: { type: boolean }
        webhookPath:
          {
            type: string,
            example: /api/git/webhooks/6f1c1b0e-0000-4000-8000-000000000001,
          }
        webhookGeneration:
          {
            type: integer,
            description: How often the webhook secret was rotated (0 = the original),
          }
        approvalByMergeReview: { type: boolean }
        membershipsFromGit: { type: boolean }
        autoMerge: { type: boolean }
        sops: { type: boolean }
        githubApp:
          {
            type: boolean,
            description: GitHub without own credentials uses the cluster's GitHub App,
          }
        sopsRecipient:
          {
            type: [string, 'null'],
            description: The cluster's age recipient to encrypt SOPS files to (with sops on,
            once it exists),
          }
        hostKey:
          {
            type: [string, 'null'],
            description: Pinned SSH host key(s) as known_hosts lines,
          }
        lastSyncedCommit: { type: [string, 'null'] }
        lastSyncAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GitAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [github, gitlab] }
        providerUserId:
          { type: string, description: The provider's numeric user id }
        login: { type: string }
        createdAt: { type: string, format: date-time }
    GitConnectionSettings:
      type: object
      properties:
        provider: { type: string, enum: [github, gitlab, gitea, git] }
        repoUrl:
          type: string
          maxLength: 2048
          description: '`https://…`, `ssh://user@host[:port]/path` or `user@host:path`; no credentials, `file://`, `git://`, `ext::`, plain HTTP or local paths'
        branch: { type: string, maxLength: 200 }
        path:
          {
            type: string,
            maxLength: 512,
            description: Relative directory,
            no `..` or `.git`,
          }
        mode: { type: string, enum: [authoritative, bidirectional] }
        credentials:
          type: [string, 'null']
          pattern: '^secret://[a-z0-9-]+/[a-z0-9][a-z0-9._-]*$'
          description: A token, an SSH private key, or JSON `{ token, username, sshPrivateKey }`; project connections only their own project's secrets
        apiUrl:
          {
            type: [string, 'null'],
            description: https API base for self-hosted providers,
          }
        caCertificate:
          {
            type: [string, 'null'],
            maxLength: 65536,
            description: PEM CA certificates,
          }
        pollIntervalSeconds:
          { type: [integer, 'null'], minimum: 10, maximum: 86400 }
        webhook: { type: boolean, default: true }
        approvalByMergeReview: { type: boolean, default: false }
        membershipsFromGit: { type: boolean, default: false }
        autoMerge: { type: boolean, default: true }
        sops: { type: boolean, default: false }
        githubApp:
          type: boolean
          default: false
          description: GitHub only. Use the cluster's GitHub App installation token when the connection has no own credentials; only cluster admins may set it (a non-admin changing the repository turns it off)
    GitCommit:
      type: object
      properties:
        id: { type: string, format: uuid }
        sha: { type: string }
        ref: { type: string }
        kind: { type: string, enum: [push, commit-back, export, plan-branch] }
        planId: { type: [string, 'null'], format: uuid }
        author: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        state:
          type: string
          enum:
            [
              pending,
              approved,
              applying,
              applied,
              failed,
              discarded,
              rejected,
              no-changes,
              synced,
            ]
        reportedState:
          {
            type: [string, 'null'],
            description: State last reported as commit status,
          }
        reason:
          {
            type: [string, 'null'],
            description: 'Why it was rejected / not plannable (file, line, rule; never a secret)',
          }
        prUrl: { type: [string, 'null'] }
        prNumber: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
    GitSyncResult:
      type: object
      properties:
        commit: { type: [string, 'null'] }
        state:
          type: string
          enum: [unchanged, error, pending, no-changes, failed, rejected]
        planId: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'] }
    GitAheadEntry:
      type: object
      description: A scope whose default branch is ahead of the cluster
      properties:
        connection: { type: string, format: uuid }
        scope: { type: string, description: '`cluster` or the project' }
        commit: { type: string }
        planId: { type: [string, 'null'], format: uuid }
        state: { type: string }
        reason: { type: [string, 'null'] }
        since: { type: string, format: date-time }
    PlanProgress:
      type: object
      required: [phase, baseRevision, targets, step, percent, startedAt, nodes]
      properties:
        phase: { type: string, enum: [apply, rollback] }
        baseRevision:
          type: integer
          description: Cluster revision before this phase; nodes whose desired state moved past it have to report
        targets:
          type: [object, 'null']
          description: Per node the desired-state revision it has to reach; null until compiled
          additionalProperties: { type: integer }
        step:
          type: string
          description: 'What happens now, e.g. `Applying: waiting for n1, n2` or `Rolled back`'
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Share of nodes done; at most 99 until the phase is done
        startedAt: { type: string, format: date-time }
        nodes:
          type: object
          additionalProperties:
            type: object
            required: [state]
            properties:
              state:
                type: string
                enum: [pending, applied, failed, skipped]
                description: '`skipped`: not connected or no fresh heartbeat; converges when back'
              steps:
                type: array
                description: Layers the node reported for the target revision
                items:
                  type: object
                  properties:
                    layer: { type: string }
                    status: { type: string }
              error: { type: string }
        failure:
          type: string
          description: Why this phase failed (first failing node, `cancelled`, or the apply timeout)
        cause:
          type: string
          description: Rollback phase only; why the apply was rolled back
    PlanLockConflict:
      type: object
      properties:
        message: { type: string, example: Resources are locked by another plan }
        locks:
          type: array
          description: Conflicting locks as `<scope> (plan <id>)`; scope is `<kind>/<project>/<name>` or `cluster`
          items: { type: string }
    DriftReport:
      type: object
      properties:
        containers:
          type: array
          description: Containers on nodes that Loadweaver doesn't manage (e.g. `docker run`)
          items:
            type: object
            properties:
              node: { type: string }
              id: { type: string }
              name: { type: string }
              image: { type: string }
              state: { type: string }
              ports:
                type: array
                description: Published ports as Docker shows them, e.g. `0.0.0.0:8080->80/tcp`
                items: { type: string }
              reportedAt: { type: string, format: date-time }
        delegated:
          type: array
          description: |
            Containers a workload started itself through the node's Docker socket (an acknowledged pin): foreign
            containers carrying a label prefix the workload declares in `loadweaver.com/delegates` (e.g. Agenstra's
            `io.agenstra.`). Owned by that replica, not drift; they can't be proposed as plans.
          items:
            type: object
            properties:
              node: { type: string }
              id: { type: string }
              name: { type: string }
              image: { type: string }
              state: { type: string }
              ports: { type: array, items: { type: string } }
              reportedAt: { type: string, format: date-time }
              delegatedTo:
                { type: string, description: 'The replica that started it' }
        inconsistent:
          type: array
          description: Failed rollbacks; configuration and reality may differ until their fix-forward plan is applied
          items:
            type: object
            properties:
              planId: { type: string, format: uuid }
              error: { type: [string, 'null'] }
              fixForward:
                type: [string, 'null']
                format: uuid
                description: The pending fix-forward plan, if any
        gitAhead:
          type: array
          description: Git scopes whose default branch is ahead of the cluster (the head's plan isn't applied, or the push was rejected)
          items:
            $ref: '#/components/schemas/GitAheadEntry'
    PlanBlockers:
      type: object
      properties:
        message: { type: string }
        blockers:
          type: array
          description: Missing approvals and cross-project acceptances
          items: { type: string }
    ClusterRole:
      { type: string, enum: [cluster-admin, infra-operator, auditor] }
    ProjectRole: { type: string, enum: [viewer, developer, operator, admin] }
    ApprovalMode:
      type: string
      enum: [developers, risky, everyone]
      description: |
        `developers`: plans by developers need an approval; `risky`: also plans with unacknowledged pins or
        internet exposure; `everyone`: every plan.
    ClusterMember:
      type: object
      properties:
        userId: { type: string }
        userEmail: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/ClusterRole' }
        createdBy: { type: [string, 'null'] }
        createdByEmail: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ProjectMember:
      type: object
      properties:
        project: { type: string }
        userId: { type: string }
        userEmail: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/ProjectRole' }
        createdBy: { type: [string, 'null'] }
        createdByEmail: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ProjectSettings:
      type: object
      properties:
        project: { type: string }
        approvalMode: { $ref: '#/components/schemas/ApprovalMode' }
        developerExec:
          {
            type: boolean,
            description: "Developers may open terminals in the project's replicas and use the file browser on its replicas and volumes (default false)",
          }
        recordTerminals:
          {
            type: boolean,
            description: "Record terminal sessions in the project's replicas even when the Cluster's `terminalRecording` is `off` (default false)",
          }
        createdBy:
          {
            type: [string, 'null'],
            description: Author of the plan that created the project; assigns any project role,
          }
    CrossProjectRequest:
      type: object
      properties:
        project: { type: string, description: Project owning the policy }
        policy: { type: string }
        peer: { type: string, description: The project asked to accept }
        specHash: { type: string, description: SHA-256 of the policy spec }
        planId:
          {
            type: [string, 'null'],
            format: uuid,
            description: Pending plan proposing it; null for an applied policy,
          }
        accepted: { type: boolean }
    Resource:
      type: object
      description: Declarative resource; per-kind JSON Schemas are served at `/schemas/{kind}`.
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: { type: string, const: loadweaver.com/v1 }
        kind: { type: string }
        metadata:
          type: object
          properties:
            name: { type: string }
            project: { type: string }
            labels: { type: object, additionalProperties: { type: string } }
        spec: { type: object }
    DashboardQuery:
      description: A query-builder query; exactly one of `metrics`, `flows`, `logs`
      oneOf:
        - type: object
          required: [metrics]
          additionalProperties: false
          properties:
            metrics:
              type: object
              required: [metric]
              additionalProperties: false
              properties:
                metric: { type: string, pattern: '^[a-z][a-z0-9_.]{0,63}$' }
                entity:
                  {
                    type: string,
                    maxLength: 255,
                    description: Exact entity or a prefix ending in `*`,
                  }
                node: { type: string, maxLength: 63 }
                aggregation:
                  { type: string, enum: [avg, min, max, sum], default: avg }
                groupBy:
                  {
                    type: string,
                    enum: [entity, node, project, none],
                    default: entity,
                  }
        - type: object
          required: [flows]
          additionalProperties: false
          properties:
            flows:
              type: object
              additionalProperties: false
              properties:
                decision: { type: string, enum: [allowed, denied, observed] }
                node: { type: string, maxLength: 63 }
                policy: { type: string, maxLength: 255 }
                limit: { type: integer, minimum: 1, maximum: 500, default: 20 }
        - type: object
          required: [logs]
          additionalProperties: false
          properties:
            logs:
              type: object
              additionalProperties: false
              properties:
                sources:
                  type: array
                  maxItems: 10
                  items: { $ref: '#/components/schemas/LogSource' }
                levels:
                  type: array
                  maxItems: 4
                  items: { $ref: '#/components/schemas/LogLevel' }
                text: { type: string, maxLength: 256 }
                service: { type: string, maxLength: 63 }
                deployment: { type: string, maxLength: 63 }
                limit:
                  { type: integer, minimum: 1, maximum: 1000, default: 100 }
    DashboardQueryRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { $ref: '#/components/schemas/DashboardQuery' }
        from:
          {
            type: string,
            format: date-time,
            description: With offset; defaults as in the underlying API,
          }
        to: { type: string, format: date-time }
        project:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
          description: Narrows metrics and logs to one project
    DashboardQueryResult:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/MetricQueryResult'
            - type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [series] }
        - type: object
          required: [kind, rows]
          properties:
            kind: { type: string, enum: [flows] }
            rows:
              type: array
              items: { $ref: '#/components/schemas/Flow' }
        - type: object
          required: [kind, lines]
          properties:
            kind: { type: string, enum: [logs] }
            lines:
              type: array
              items: { $ref: '#/components/schemas/LogLine' }
      discriminator:
        propertyName: kind
    GrafanaQueryRequest:
      type: object
      required: [range, targets]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        targets:
          type: array
          maxItems: 20
          items:
            type: object
            required: [target]
            properties:
              target:
                {
                  type: string,
                  pattern: '^[a-z][a-z0-9_.]{0,63}$',
                  description: Metric name,
                }
              refId: { type: string, maxLength: 16 }
              payload:
                type: object
                properties:
                  entity: { type: string, maxLength: 255 }
                  node: { type: string, maxLength: 63 }
                  project: { type: string, maxLength: 63 }
                  aggregation: { type: string, enum: [avg, min, max, sum] }
                  groupBy: { type: string, enum: [entity, node, project, none] }
    LogSource:
      type: string
      enum:
        [
          container,
          proxy,
          firewall,
          routing,
          tunnel,
          ingress,
          failover,
          storage,
          runtime,
          control-plane,
        ]
    LogLevel:
      type: string
      enum: [debug, info, warn, error]
    LogLine:
      type: object
      required: [id, at, source, level, message, node, labels, fields]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/LogSource' }
        level: { $ref: '#/components/schemas/LogLevel' }
        message: { type: string, maxLength: 16384 }
        node:
          type: string
          description: Sending node (from the authenticated agent stream), or `control-plane` for the control plane's own events
        site: { type: [string, 'null'] }
        cluster: { type: string, description: Cluster id }
        labels:
          type: object
          properties:
            project: { type: string }
            deployment: { type: string }
            service: { type: string }
            replica:
              {
                type: string,
                description: '`<project>/<deployment>/<service>/<index>`',
              }
            policy:
              {
                type: string,
                description: Policy of the firewall rule that matched,
              }
            peer: { type: string, description: WireGuard peer key }
            component:
              type: string
              description: Platform component, WireGuard interface or BGP session
            stream: { type: string, enum: [stdout, stderr] }
        fields:
          type: object
          description: "Source-specific details: firewall `decision`, `src`, `dst`, `proto`, `spt`, `dpt`, …; Docker `event`; `plan`; node-proxy egress decisions (attributed to the requesting workload's project / deployment / service / replica labels) `egressDecision` (`allowed`, `blocked`, `observed`), `egressRule` (`deny_host`, `private_network`, `ip_literal`, `deny_url`, `offline`, `not_allowlisted`), `egressHost`"
          additionalProperties: { type: [string, number, boolean] }
    LogPage:
      type: object
      required: [lines, cursor, after]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/LogLine' }
        cursor:
          type: [string, 'null']
          description: Set when the page is full (there may be more); pass as `cursor` for the next page
        after:
          type: [string, 'null']
          description: Position after the last line; null on an empty page
    UsageReport:
      type: object
      required:
        [cluster, from, to, granularity, meters, rows, totals, truncated]
      properties:
        cluster:
          {
            type: string,
            description: Cluster id (part of the idempotency keys),
          }
        from:
          {
            type: string,
            format: date-time,
            description: Floored to the granularity (UTC),
          }
        to: { type: string, format: date-time }
        granularity: { type: string, enum: [hour, day, month] }
        meters:
          type: array
          items:
            type: object
            required: [key, unit, description]
            properties:
              key: { $ref: '#/components/schemas/UsageMeterKey' }
              unit:
                {
                  type: string,
                  examples: [core-hours, GiB-hours, GB, IP-hours],
                }
              description: { type: string }
        rows:
          type: array
          items:
            type: object
            required: [project, bucket, meter, value, final]
            properties:
              project: { type: string }
              bucket: { type: string, format: date-time }
              meter: { $ref: '#/components/schemas/UsageMeterKey' }
              value:
                {
                  type: number,
                  minimum: 0,
                  description: In the meter's unit,
                  6 decimals,
                }
              final: { type: boolean }
              idempotencyKey: { type: string, description: Hourly rows only }
              billingSubscription:
                { type: [string, 'null'], description: Hourly rows only }
        totals:
          type: array
          items:
            type: object
            required: [project, meter, value]
            properties:
              project: { type: string }
              meter: { $ref: '#/components/schemas/UsageMeterKey' }
              value: { type: number }
        truncated:
          {
            type: boolean,
            description: More than 50 000 rows matched; narrow the range or the projects,
          }
    UsageMeterKey:
      type: string
      enum:
        - cpu_core_hours
        - memory_gib_hours
        - storage_gib_hours
        - storage_replica_gib_hours
        - traffic_in_gb
        - traffic_out_gb
        - public_ip_hours
    MetricQueryResult:
      type: object
      required: [step, series]
      properties:
        step:
          type: string
          enum: [10 seconds, 1 minute, 1 hour]
          description: Resolution picked by the length of the range
        series:
          type: array
          maxItems: 200
          items:
            type: object
            required: [key, points]
            properties:
              key:
                type: string
                description: The entity, node or project of the series (`all` with `groupBy=none`)
              points:
                type: array
                description: '`[time, value]` pairs, oldest first'
                items:
                  type: array
                  prefixItems:
                    - { type: string, format: date-time }
                    - { type: number }
                  minItems: 2
                  maxItems: 2
    Flow:
      type: object
      required: [policy, src, dst, protocol, port, decision, packets, bytes]
      properties:
        policy:
          {
            type: string,
            description: Policy of the rule; empty for denied flows,
          }
        src: { type: string }
        dst: { type: string }
        protocol: { type: string, enum: [tcp, udp, icmp, any] }
        port: { type: integer, minimum: 0, maximum: 65535 }
        decision: { type: string, enum: [allowed, denied, observed] }
        packets: { type: integer }
        bytes: { type: integer, description: 0 for denied flows }
    MetricEvent:
      type: object
      required: [id, time, kind, entity, project, message]
      properties:
        id: { type: string, format: uuid }
        time: { type: string, format: date-time }
        kind: { type: string, description: e.g. `plan` }
        entity: { type: string, description: The plan id for plan events }
        project: { type: [string, 'null'] }
        message: { type: string }
    AlertSeverity: { type: string, enum: [info, warning, critical] }
    Alert:
      type: object
      required:
        [
          id,
          rule,
          key,
          project,
          severity,
          state,
          title,
          message,
          value,
          startedAt,
          firedAt,
          resolvedAt,
          silenced,
          acknowledgedBy,
          acknowledgedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        rule:
          type: string
          description: '`builtin:<name>`, or `rule:<project>/<name>` (`rule:_/<name>` for cluster-wide `AlertRule`s)'
        key:
          {
            type: string,
            description: 'What the alert is about: node, replica, certificate, series, …',
          }
        project: { type: [string, 'null'] }
        severity: { $ref: '#/components/schemas/AlertSeverity' }
        state: { type: string, enum: [pending, firing, resolved] }
        title: { type: string }
        message: { type: string }
        value: { type: [number, 'null'] }
        startedAt: { type: string, format: date-time }
        firedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        silenced:
          {
            type: boolean,
            description: Silenced or in maintenance at the last evaluation,
          }
        acknowledgedBy: { type: [string, 'null'] }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
    AlertSilence:
      type: object
      required: [id, rule, project, key, reason, createdBy, startsAt, endsAt]
      properties:
        id: { type: string, format: uuid }
        rule: { type: [string, 'null'] }
        project: { type: [string, 'null'] }
        key: { type: [string, 'null'] }
        reason: { type: string }
        createdBy: { type: [string, 'null'] }
        createdByEmail: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    CreateAlertSilence:
      type: object
      required: [reason, endsAt]
      additionalProperties: false
      properties:
        rule:
          type: string
          pattern: '^[a-z0-9:_/.*-]{1,255}$'
          description: A rule name (`builtin:node-down`, `rule:<project>/<name>`) or a prefix ending in `*`
        project:
          { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        key: { type: string, maxLength: 255 }
        reason: { type: string, maxLength: 1024, pattern: '\S' }
        startsAt: { type: string, format: date-time, description: Default now }
        endsAt:
          {
            type: string,
            format: date-time,
            description: At most 30 days ahead,
          }
    HealthState:
      { type: string, enum: [healthy, degraded, at-risk, failed, unknown] }
    HealthReason:
      type: object
      required: [code, message]
      properties:
        code:
          {
            type: string,
            description: 'Machine-readable, e.g. `node-down`, `single-site`, `quorum-reduced`',
          }
        message: { type: string }
        entities:
          type: array
          description: Keys of the entities behind the reason
          items: { type: string }
    HealthEntity:
      type: object
      required: [key, kind, name, parent, project, state, reasons, since]
      properties:
        key:
          {
            type: string,
            description: '`cluster`, `site/<site>`, `node/<node>`, `project/<p>`, `deployment/<p>/<d>`, `service/<p>/<d>/<s>`, `replica/<id>`, `volume/<id>`',
          }
        kind:
          {
            type: string,
            enum:
              [
                cluster,
                site,
                node,
                project,
                deployment,
                service,
                replica,
                volume,
              ],
          }
        name: { type: string }
        parent: { type: [string, 'null'] }
        project: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/HealthState' }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/HealthReason' }
        since:
          {
            type: string,
            format: date-time,
            description: When the entity entered its state,
          }
    HealthHistory:
      type: object
      required: [key, changes, durations]
      properties:
        key: { type: string }
        changes:
          type: array
          items:
            type: object
            required: [at, from, to, message]
            properties:
              at: { type: string, format: date-time }
              from:
                oneOf:
                  - $ref: '#/components/schemas/HealthState'
                  - type: 'null'
              to: { $ref: '#/components/schemas/HealthState' }
              message: { type: string }
        durations:
          type: object
          description: Milliseconds spent in each state within the range
          additionalProperties: { type: number }
    InboxItem:
      type: object
      required: [kind, severity, title, link]
      properties:
        kind:
          type: string
          enum:
            [
              rollback-failed,
              health,
              approval,
              pins,
              drift,
              alert,
              certificate,
              cross-project-request,
              git-ahead,
              git-push-rejected,
              git-error,
            ]
        severity: { type: string, enum: [critical, warning, info] }
        title: { type: string }
        link: { type: string, description: Console route where it is resolved }
        project: { type: string }
        since: { type: string, format: date-time }
    OverviewHeadline:
      type: object
      required: [state, message, key]
      properties:
        state: { $ref: '#/components/schemas/HealthState' }
        message: { type: string }
        key: { type: [string, 'null'] }
    OverviewSummary:
      type: object
      required:
        [
          sites,
          nodes,
          deployments,
          capacity,
          requestsPerSecond,
          deniedPackets5m,
          alertsFiring,
          slos,
        ]
      properties:
        sites: { type: integer }
        nodes:
          type: object
          required: [total, up]
          properties:
            total: { type: integer }
            up: { type: integer }
        deployments: { type: integer }
        capacity:
          type: [object, 'null']
          description: Cluster roles without a project filter only
          properties:
            cpuMillis:
              type: object
              properties:
                used: { type: number }
                total: { type: number }
            memoryBytes:
              type: object
              properties:
                used: { type: number }
                total: { type: number }
                reserve:
                  {
                    type: number,
                    description: "N+1: the largest node's memory",
                  }
        requestsPerSecond: { type: [number, 'null'] }
        deniedPackets5m: { type: [number, 'null'] }
        alertsFiring: { type: integer }
        slos:
          type: object
          properties:
            total: { type: integer }
            ok: { type: integer }
            burning: { type: integer }
            exhausted: { type: integer }
        readOnly:
          type: object
          description: >-
            Only while the control plane is read-only (3.43): health, alerts, nodes, capacity and traffic are live, the
            SLOs reach until `metricsAsOf` (the last stored metric sample)
          required: [metricsAsOf]
          properties:
            metricsAsOf: { type: [string, 'null'], format: date-time }
    Overview:
      type: object
      required: [headline, inbox, summary, activity]
      properties:
        headline: { $ref: '#/components/schemas/OverviewHeadline' }
        inbox:
          type: array
          items: { $ref: '#/components/schemas/InboxItem' }
        summary: { $ref: '#/components/schemas/OverviewSummary' }
        activity:
          type: array
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              kind: { type: string }
              entity: { type: string }
              project: { type: [string, 'null'] }
              message: { type: string }
    SloObjective:
      type: object
      required: [target, sli, budget, consumed, burnRate1h, state]
      properties:
        target: { type: number, description: Percent }
        sli:
          {
            type: [number, 'null'],
            description: Percent of good events in the window; null without traffic,
          }
        budget: { type: number, description: 100 − target }
        consumed:
          { type: number, description: Share of the budget used (1 = used up) }
        burnRate1h:
          {
            type: [number, 'null'],
            description: Last hour's error rate relative to the budget,
          }
        state: { type: string, enum: [ok, burning, exhausted, no-data] }
    AutoscaledService:
      type: object
      required:
        [
          id,
          project,
          deployment,
          service,
          min,
          max,
          metric,
          customMetric,
          target,
          replicas,
          desiredReplicas,
          status,
          lastScaleAt,
          lastReason,
          lastValue,
        ]
      properties:
        id: { type: string, description: '`project/deployment/service`' }
        project: { type: string }
        deployment: { type: string }
        service: { type: string }
        min: { type: integer, minimum: 1 }
        max: { type: integer, maximum: 1000 }
        metric: { type: string, enum: [cpu, memory, requests, custom] }
        customMetric:
          {
            type: [string, 'null'],
            description: 'Metric name for `custom` (a series of the service, its replicas or its hostnames)',
          }
        target:
          type: number
          description: CPU / memory in percent of the request, requests per second per replica, or the custom metric's value
        replicas: { type: integer, description: Replicas placed now }
        desiredReplicas:
          {
            type: integer,
            description: The count plans use (the autoscaler's last decision,
            within min..max),
          }
        status:
          type: [object, 'null']
          description: The last evaluation (null before the first one)
          required:
            [
              metric,
              target,
              min,
              max,
              value,
              desired,
              action,
              reason,
              blocked,
              atMax,
              evaluatedAt,
            ]
          properties:
            metric: { type: string }
            target: { type: number }
            min: { type: integer }
            max: { type: integer }
            value:
              {
                type: [number, 'null'],
                description: Average of the last minute; null when missing (the autoscaler holds),
              }
            desired:
              {
                type: integer,
                description: 'Recommendation within min..max: ceil(replicas × value / target), 10 % tolerance',
              }
            action: { type: string, enum: [up, down, hold] }
            reason:
              {
                type: string,
                example: 'cpu 100 % / target 50 %: stabilising, scale-down to 2 once lower for 5 min',
              }
            blocked:
              type: [string, 'null']
              description: Why a wanted scale-up is limited or refused (project quota, cluster capacity, N+1 reserve, at max)
            atMax: { type: boolean }
            evaluatedAt: { type: string, format: date-time }
        lastScaleAt: { type: [string, 'null'], format: date-time }
        lastReason:
          { type: [string, 'null'], example: '2 → 4: cpu 100 % / target 50 %' }
        lastValue: { type: [number, 'null'] }
    Slo:
      type: object
      required:
        [project, deployment, service, hosts, window, monthlyUptime, state]
      properties:
        project: { type: string }
        deployment: { type: string }
        service: { type: string }
        hosts:
          type: array
          items: { type: string }
        window: { type: string, enum: [7d, 28d, 30d] }
        availability: { $ref: '#/components/schemas/SloObjective' }
        latency:
          allOf:
            - $ref: '#/components/schemas/SloObjective'
            - type: object
              properties:
                percentile: { type: string, enum: [p95, p99] }
                thresholdMs: { type: integer }
        monthlyUptime:
          {
            type: [number, 'null'],
            description: Availability since the start of the month (UTC),
            percent,
          }
        state: { type: string, enum: [ok, burning, exhausted, no-data] }
        asOf:
          type: string
          format: date-time
          description: Only while the control plane is read-only (3.43) — evaluated as of the last stored metric sample
    PublicServiceState:
      { type: string, enum: [operational, degraded, outage, unknown] }
    IncidentStatus:
      { type: string, enum: [investigating, identified, monitoring, resolved] }
    PublicStatus:
      type: object
      required: [title, status, services, incidents, updatedAt]
      properties:
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/PublicServiceState' }
        services:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string, description: Display name }
              status: { $ref: '#/components/schemas/PublicServiceState' }
              uptime:
                {
                  type: number,
                  description: Percent this month (with `showUptime` and an availability SLO),
                }
        incidents:
          type: array
          items:
            type: object
            required: [title, status, updates, resolvedAt]
            properties:
              title: { type: string }
              status: { $ref: '#/components/schemas/IncidentStatus' }
              updates:
                type: array
                items:
                  type: object
                  required: [at, status, message]
                  properties:
                    at: { type: string, format: date-time }
                    status: { $ref: '#/components/schemas/IncidentStatus' }
                    message: { type: string }
              resolvedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    Incident:
      type: object
      required:
        [id, project, title, status, updates, createdAt, updatedAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        project: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        updates:
          type: array
          items:
            type: object
            required: [at, status, message]
            properties:
              at: { type: string, format: date-time }
              status: { $ref: '#/components/schemas/IncidentStatus' }
              message: { type: string }
              by: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
    CreateIncident:
      type: object
      required: [title, status, message]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        message: { type: string, minLength: 1, maxLength: 4000, pattern: '\S' }
    UpdateIncident:
      type: object
      required: [status, message]
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/IncidentStatus' }
        message: { type: string, minLength: 1, maxLength: 4000, pattern: '\S' }
    SearchResponse:
      type: object
      required: [results, actions]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, kind, title, project, link, favourite]
            properties:
              id: { type: string, description: '`Kind:key`' }
              kind: { type: string }
              title: { type: string }
              project: { type: [string, 'null'] }
              link: { type: string, description: Console route }
              favourite: { type: boolean }
        actions:
          type: array
          items:
            type: object
            required: [title, kind]
            properties:
              title: { type: string }
              kind: { type: string, enum: [navigate, api] }
              link: { type: string, description: 'Console route (`navigate`)' }
              request:
                type: object
                description: API call (`api`); the console confirms first
                properties:
                  method: { type: string, enum: [POST] }
                  path: { type: string }
    WallboardToken:
      type: object
      required:
        [id, name, projects, createdBy, createdAt, expiresAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        projects:
          type: [array, 'null']
          description: Null for cluster-wide tokens
          items: { type: string }
        createdBy: { type: [string, 'null'] }
        createdByEmail: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    CreateWallboardToken:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        projects:
          type: array
          maxItems: 20
          description: 'Projects shown (project admins); none: the whole cluster (cluster admins)'
          items:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
    Wallboard:
      type: object
      required: [name, sections]
      properties:
        name: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [scope, headline, inbox, summary]
            properties:
              scope: { type: string, description: '`cluster` or a project' }
              headline: { $ref: '#/components/schemas/OverviewHeadline' }
              inbox:
                type: array
                items: { $ref: '#/components/schemas/InboxItem' }
              summary: { $ref: '#/components/schemas/OverviewSummary' }
    Report:
      type: object
      required: [id, scope, year, month, status, files, error, completedAt]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, description: '`cluster` or a project' }
        year: { type: integer }
        month: { type: integer, minimum: 1, maximum: 12 }
        status: { type: string, enum: [pending, running, completed, failed] }
        files:
          type: array
          items:
            type: object
            required: [name, path, bytes, sha256]
            properties:
              name: { type: string, enum: [report.html, report.json] }
              path: { type: string }
              bytes: { type: integer }
              sha256: { type: string }
        error: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'], format: date-time }
    RunReport:
      type: object
      required: [scope, year, month]
      additionalProperties: false
      properties:
        scope:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
          description: '`cluster` or a project'
        year: { type: integer, minimum: 2020, maximum: 2100 }
        month: { type: integer, minimum: 1, maximum: 12 }
    LiveFileEntry:
      type: object
      required: [name, type, size, modifiedAt, mode]
      properties:
        name: { type: string }
        type: { type: string, enum: [file, directory, symlink, other] }
        size: { type: integer, description: Bytes (0 for everything but files) }
        modifiedAt: { type: string, format: date-time }
        mode: { type: integer, description: Permission bits (0–07777) }
    LiveFileMove:
      type: object
      required: [destination]
      properties:
        destination: { type: string, maxLength: 4096 }
        overwrite: { type: boolean, default: false }
    TerminalSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: [string, 'null'] }
        userEmail: { type: [string, 'null'] }
        project:
          { type: [string, 'null'], description: '`null` for node shells' }
        target:
          {
            type: string,
            description: '`replica/<project/deployment/service/index>` or `node/<name>`',
          }
        node: { type: string }
        recorded: { type: boolean }
        hasRecording:
          {
            type: boolean,
            description: A recording is stored (not yet deleted by retention),
          }
        exitCode: { type: [integer, 'null'] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    LiveTunnel:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: [string, 'null'] }
        userEmail: { type: [string, 'null'] }
        project: { type: string }
        replica: { type: string }
        node: { type: string }
        port: { type: integer }
        openedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ReportFileEntry:
      type: object
      required: [name, path, type]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [folder, file] }
        bytes: { type: integer }
        updatedAt: { type: string, format: date-time }
    AccessMe:
      type: object
      required: [userId, clusterRole, projects]
      properties:
        userId:
          type: [string, 'null']
          description: '`null` for the static API key'
        clusterRole:
          oneOf:
            - $ref: '#/components/schemas/ClusterRole'
            - type: 'null'
        projects:
          type: object
          description: Project name → the caller's role in it
          additionalProperties: { $ref: '#/components/schemas/ProjectRole' }
        emailLogin2faSuspended:
          type: boolean
          description: |
            Cluster admins only (always `false` for everyone else): `users` authentication forces email login 2FA
            (`DISABLE_FORCE_LOGIN_2FA` not set) but SMTP is not configured (`SMTP_HOST` / `SMTP_PORT`), so logins
            succeed without the email code until it is. The console shows a warning banner.
    TopologyElement:
      type: object
      required: [id, kind, label, data]
      properties:
        id:
          type: string
          description: |
            `site:<site>`, `node:<node>`, `replica:<replica id>`, `group:<project>/<group>`,
            `volume:<project>/<deployment>/<volume>`, `hostname:<host>`, `address:<address>`, `external:<cidr, hosts,
            builtin:<name> or address>`
        kind:
          {
            type: string,
            enum:
              [site, node, replica, group, volume, hostname, address, external],
          }
        label: { type: string }
        parent:
          type: string
          description: Compound parent (the site of a node, the node of a replica; not set for project members)
        project: { type: [string, 'null'] }
        data:
          type: object
          description: |
            Per kind: site `health`; node `health`, `controlPlane`, `witness`, `ingress`, `overlay` (addresses);
            replica `deployment`, `service`, `addresses`, `state`, `health`; group `exposed`; volume `crossSite`,
            `health`; address `owner`.
          additionalProperties: true
    TopologyEdge:
      type: object
      required: [id, kind, source, target, layer, data]
      properties:
        id: { type: string }
        kind:
          {
            type: string,
            enum: [tunnel, policy, member, flow, volume, exposure, address],
          }
        source: { type: string, description: Element id }
        target: { type: string, description: Element id }
        layer:
          { type: string, enum: [tunnels, policies, storage, dns, addressing] }
        data:
          type: object
          description: |
            Per kind: policy `policy`, `mode`, `action`, `rules`, `project` (and `proposed: true` for edges of a plan's
            new or changed policy); flow `protocol`, `port`, `decision`, `policy`, `packets`, `bytes`,
            `bytesPerSecond`; volume `role` (`primary`, `sync`, `async`); exposure `service`
            (`<project>/<deployment>/<service>`).
          additionalProperties: true
    Topology:
      type: object
      required: [elements, edges, at]
      properties:
        elements:
          type: array
          items: { $ref: '#/components/schemas/TopologyElement' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/TopologyEdge' }
        at:
          type: string
          format: date-time
          description: The time of the flows
        overlay:
          type: object
          description: Only with `plan`; element or edge id → what the plan does to it
          additionalProperties: { type: string, enum: [create, update, delete] }
    TopologyTrace:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          items:
            type: object
            required: [kind, id, label]
            properties:
              kind: { type: string, enum: [hostname, address, replica, volume] }
              id: { type: string, description: Element id on the map }
              label:
                type: string
                description: '`<address> → <node>` for addresses, `<service>/<index> on <node>` for replicas (node for cluster roles only)'
    VirtualMachineSummary:
      type: object
      properties:
        project: { type: string }
        name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        description: { type: [string, 'null'] }
        image: { type: string }
        pinnedImage:
          {
            type: [string, 'null'],
            description: Digest-pinned image of the last apply,
          }
        runStrategy: { type: string, enum: [Always, Manual, Halted] }
        power: { type: string, enum: [running, stopped] }
        phase:
          {
            type: string,
            enum:
              [
                Pending,
                Importing,
                Starting,
                Running,
                Stopping,
                Stopped,
                Migrating,
                Failed,
              ],
          }
        node: { type: [string, 'null'] }
        vcpus: { type: integer }
        memoryBytes: { type: integer }
        diskBytes: { type: integer }
        disks: { type: integer }
        nics: { type: integer }
        addresses: { type: array, items: { type: string } }
        graphical: { type: boolean }
        invalid:
          { type: string, description: Validation error of an invalid spec }
        importProgress:
          type: object
          description: >-
            Progress of the boot disk import while the node reports one (absent otherwise); same fields as
            status.importProgress of a single VM.
          properties:
            phase: { type: string, enum: [queued, fetching, writing, failed] }
            bytes: { type: integer }
            totalBytes: { type: integer }
    VirtualMachine:
      allOf:
        - $ref: '#/components/schemas/VirtualMachineSummary'
        - type: object
          properties:
            spec:
              {
                type: [object, 'null'],
                description: The `VirtualMachine` spec with defaults,
              }
            generation: { type: integer }
            updatedAt: { type: string, format: date-time }
            status:
              type: object
              properties:
                phase: { type: string }
                node: { type: [string, 'null'] }
                state: { type: [string, 'null'] }
                guestPower:
                  {
                    type: [string, 'null'],
                    description: 'Guest power from the launcher: running, paused, shutting-down, shut-off, crashed, suspended, unknown',
                  }
                importing:
                  {
                    type: boolean,
                    description: The boot disk is being written from its image,
                  }
                importProgress:
                  type: [object, 'null']
                  description: >-
                    Progress of the boot disk import on the node (a background job): queued, fetching (bytes downloaded),
                    writing (bytes of totalBytes = the image's virtual size), failed (retried later; see message).
                  properties:
                    phase:
                      {
                        type: string,
                        enum: [queued, fetching, writing, failed],
                      }
                    bytes: { type: integer }
                    totalBytes: { type: integer }
                message: { type: [string, 'null'] }
                exitCode: { type: [integer, 'null'] }
                reportedAt: { type: [string, 'null'], format: date-time }
                lastBoot: { type: [string, 'null'], format: date-time }
                migration:
                  {
                    type: [object, 'null'],
                    properties: { targetNode: { type: [string, 'null'] } },
                  }
            powerDetail:
              type: object
              properties:
                graceful: { type: boolean }
                changedBy: { type: [string, 'null'] }
                changedByEmail: { type: [string, 'null'] }
                changedAt: { type: [string, 'null'], format: date-time }
                instanceGeneration: { type: integer }
            nicStatus:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  index: { type: integer }
                  primary: { type: boolean }
                  mac: { type: string }
                  groups: { type: array, items: { type: string } }
                  labels:
                    { type: object, additionalProperties: { type: string } }
                  families:
                    { type: array, items: { type: string, enum: [v4, v6] } }
                  addresses: { type: array, items: { type: string } }
            diskStatus:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  volume: { type: string }
                  source: { type: string, enum: [image, blank] }
                  boot: { type: boolean }
                  sizeBytes: { type: integer }
                  bus: { type: string }
                  cache: { type: string }
                  replicas: { type: [integer, 'null'] }
                  crossSite: { type: [string, 'null'] }
                  primaryNode: { type: [string, 'null'] }
                  syncReplicas: { type: array, items: { type: string } }
                  remoteReplicas: { type: array, items: { type: string } }
            consoles:
              type: object
              properties:
                replica: { type: string }
                namespace: { type: string, enum: [socket/consoles] }
                serial: { $ref: '#/components/schemas/VmConsoleAvailability' }
                vnc: { $ref: '#/components/schemas/VmConsoleAvailability' }
            actions:
              type: array
              items:
                {
                  type: string,
                  enum:
                    [start, stop, force-off, shutdown, reboot, reset, reimage],
                }
            permissions:
              type: object
              properties:
                power: { type: boolean }
                snapshot: { type: boolean }
                console: { type: boolean }
                edit: { type: boolean }
            commands:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  type: { type: string, enum: [vmPower, vmImageImport] }
                  action: { type: string }
                  node: { type: string }
                  status:
                    {
                      type: string,
                      enum: [pending, sent, running, succeeded, failed],
                      description: 'The node reports the outcome as an event; it is folded back here',
                    }
                  error: { type: [string, 'null'] }
                  requestedBy: { type: [string, 'null'] }
                  requestedByEmail: { type: [string, 'null'] }
                  createdAt: { type: string, format: date-time }
                  sentAt: { type: [string, 'null'], format: date-time }
    VmConsoleAvailability:
      type: object
      properties:
        available: { type: boolean }
        reason: { type: string }
    VmSnapshot:
      type: object
      properties:
        id: { type: string, format: uuid }
        project: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        consistency: { type: string, enum: [crash, application] }
        status: { type: string, enum: [running, succeeded, failed, partial] }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        disks:
          type: array
          items:
            type: object
            properties:
              disk: { type: string }
              backupId: { type: string, format: uuid }
              status: { type: [string, 'null'] }
              bytes: { type: [integer, 'null'] }
              error: { type: [string, 'null'] }
              finishedAt: { type: [string, 'null'], format: date-time }
    VmImageCatalogEntry:
      type: object
      required:
        [id, source, distro, label, version, arch, url, checksum, suggestedRef]
      properties:
        id:
          {
            type: string,
            description: '`ubuntu-24.04-amd64`, `cluster:<name>-<arch>`, `upstream:<distro>-<version>-<arch>-<build>`',
          }
        source: { type: string, enum: [shipped, cluster, upstream] }
        distro:
          {
            type: string,
            description: '`ubuntu`, `debian`, … (the entry name for cluster entries)',
          }
        label: { type: string, description: 'e.g. "Ubuntu 24.04 LTS"' }
        version: { type: string }
        arch: { type: string, enum: [amd64, arm64] }
        url: { type: string, format: uri }
        checksum:
          type: object
          required: [algorithm, value]
          properties:
            algorithm: { type: string, enum: [sha256, sha512] }
            value: { type: string, description: Lower-case hex }
        firmware: { type: array, items: { type: string, enum: [uefi, bios] } }
        guestAgent: { type: boolean }
        description: { type: string }
        suggestedRef:
          {
            type: string,
            description: '`<repository>:<tag>` for the import, e.g. `ubuntu:24.04`',
          }
        build:
          { type: string, description: The distro's dated build id where known }
    VmRegistryImage:
      type: object
      properties:
        project: { type: string }
        repository: { type: string }
        tag: { type: string }
        reference:
          {
            type: string,
            description: '`registry.lw/<project>/<repository>:<tag>@<digest>`',
          }
        digest: { type: string }
        variants:
          type: array
          items:
            type: object
            properties:
              arch: { type: string, enum: [amd64, arm64] }
              format: { type: string, enum: [qcow2, raw] }
              virtualSize: { type: integer }
              firmware:
                { type: array, items: { type: string, enum: [uefi, bios] } }
              guestAgent: { type: boolean }
              layerBytes: { type: integer }
    VmImageImport:
      type: object
      properties:
        id: { type: string, format: uuid }
        project: { type: string }
        repository: { type: string }
        tag: { type: string }
        reference:
          {
            type: string,
            description: '`registry.lw/<project>/<repository>:<tag>[@digest]`',
          }
        url: { type: string, description: Without credentials and query }
        sha256:
          {
            type: [string, 'null'],
            description: 'Expected SHA-256 (null when the import names a sha512)',
          }
        sha512:
          {
            type: [string, 'null'],
            description: 'Expected SHA-512 (null when the import names a sha256)',
          }
        arch: { type: string, enum: [amd64, arm64] }
        firmware: { type: array, items: { type: string, enum: [uefi, bios] } }
        guestAgent: { type: boolean }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        step:
          {
            type: [string, 'null'],
            enum: [download, verify, convert, push, null],
          }
        format: { type: [string, 'null'], enum: [qcow2, raw, null] }
        containerDisk: { type: boolean }
        downloadedBytes: { type: integer }
        virtualSize: { type: [integer, 'null'] }
        digest: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        requestedBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
