            notice: { type: [string, 'null'] }
        nodes:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              site: { type: string }
              controlPlane: { type: boolean }
              connected: { type: boolean }
              agentVersion: { type: [string, 'null'] }
              release: { type: [string, 'null'] }
              target: { type: [string, 'null'] }
              os: { type: [string, 'null'] }
              kernel: { type: [string, 'null'] }
              rebootRequired: { type: boolean }
              overrides: { type: array, items: { type: string } }
              components:
                {
                  type: boolean,
                  description: 'The agent supports release components (protocol feature `components`)',
                }
              window:
                type: object
                properties:
                  open: { type: boolean }
                  opensAt: { type: [string, 'null'], format: date-time }
                  closesAt: { type: [string, 'null'], format: date-time }
                  windows: { type: array, items: { type: string } }
        contractMigrations:
          type: object
          properties:
            ready: { type: boolean }
            blockers: { type: array, items: { type: string } }
    PlatformBackupRun:
      type: object
