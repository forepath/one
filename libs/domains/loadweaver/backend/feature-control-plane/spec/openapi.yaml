          {
            type: array,
            items: { type: string },
            description: 'e.g. `example.com. IN DS 12345 13 2 <hex>`',
          }
        keys:
          type: array
          items:
            type: object
            properties:
              keyTag: { type: integer }
              state: { type: string, enum: [active, retired] }
              createdAt: { type: string, format: date-time }
              retiredAt: { type: [string, 'null'], format: date-time }
              dsAtParent: { type: boolean }
              dsCheckedAt: { type: [string, 'null'], format: date-time }
              ds: { type: string }
        nextRolloverAt: { type: [string, 'null'], format: date-time }
    DnsFailoverState:
      type: object
      properties:
        name: { type: string }
        state:
          type: object
          properties:
            endpoints:
              type: object
              additionalProperties:
                type: object
                properties:
                  healthy: { type: boolean }
                  streak:
                    {
                      type: integer,
                      description: Consecutive rounds,
                      positive healthy,
                      negative failed,
                    }
                  since: { type: string, format: date-time }
            active:
              {
                type: array,
                items: { type: string },
                description: Endpoints answered now,
              }
            failbackPending: { type: boolean }
            latency:
              type: object
              properties:
                default: { type: string }
                byContinent:
                  { type: object, additionalProperties: { type: string } }
        switchedAt: { type: [string, 'null'], format: date-time }
        failbackConfirmed: { type: boolean }
        propagation:
          type: [object, 'null']
          properties:
            done: { type: boolean }
            lagging: { type: array, items: { type: string } }
            checkedAt: { type: string, format: date-time }
    CronRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        cron: { type: string, description: '`project/deployment/service`' }
        project: { type: string }
        scheduledAt: { type: string, format: date-time }
        attempt: { type: integer }
        workload: { type: [string, 'null'] }
        node: { type: [string, 'null'] }
        state:
          {
            type: string,
            enum:
              [
                running,
                succeeded,
                failed,
                timed-out,
                cancelled,
                skipped,
                node-lost,
              ],
          }
        exitCode: { type: [integer, 'null'] }
        message: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Release:
      type: object
      description: A release known to the cluster (3.26).
      properties:
        version: { type: string }
        channel: { type: string, enum: [stable, beta] }
        status:
          {
            type: string,
            enum: [announced, importing, available, failed, installed],
          }
        source: { type: string, enum: [github, mirror, upload, installed] }
        signed: { type: boolean }
        keyId: { type: [string, 'null'] }
        notes: { type: array, items: { type: string } }
        components:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind:
                {
                  type: string,
                  enum: [image, binary, tarball, kernel-module, packages],
                }
              version: { type: string }
        clusterImages:
          {
            type: array,
            items: { type: string },
            description: 'Components imported into the cluster registry',
          }
        announcement:
          type: [object, 'null']
          properties:
            name: { type: string }
            htmlUrl: { type: string }
            publishedAt: { type: string }
            changelog: { type: array, items: { type: string } }
        error: { type: [string, 'null'] }
        importedAt: { type: [string, 'null'], format: date-time }
        importedBy: { type: [string, 'null'] }
    Rollout:
      type: object
      description: An update plan and its rollout (3.26).
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum:
            [
              planned,
              approved,
              running,
              paused,
              rolling-back,
              rolled-back,
              rollback-failed,
              completed,
              cancelled,
              superseded,
            ]
        kind: { type: string, enum: [patch, minor, major, os, downgrade] }
        fromVersion: { type: [string, 'null'] }
        toVersion: { type: string }
        options:
          type: object
          properties:
            windows: { type: string, enum: [respect, ignore] }
            host: { type: boolean }
            osUpgrade: { type: boolean }
            snapshot: { type: string }
            drbdSpaas:
              type: boolean
              description: Online cluster (not air-gapped) — DRBD may build with LINBIT's SPAAS for kernels the release ships no compat patch / prebuilt module for.
            automatic: { type: boolean }
            emergency: { type: boolean }
        diff:
          type: array
          items:
            type: object
            properties:
              node: { type: string }
              component: { type: string }
              from: { type: [string, 'null'] }
              to: { type: [string, 'null'] }
              method: { type: string }
        notes: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        failureAnalysis:
          type: array
          items:
            type: object
            properties:
              wave: { type: integer }
              nodes: { type: array, items: { type: string } }
              risk: { type: array, items: { type: string } }
        createdBy: { type: [string, 'null'] }
        createdByEmail: { type: [string, 'null'] }
        approvedBy: { type: [string, 'null'] }
        approvedByEmail: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        pauseReason: { type: [string, 'null'] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        progress:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
            currentWave: { type: [integer, 'null'] }
        steps:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              wave: { type: integer }
              phase: { type: string, enum: [control-plane, canary, wave] }
              node: { type: string }
              site: { type: string }
              kind: { type: string, enum: [components, host] }
              state:
                type: string
                enum:
                  [
                    pending,
                    waiting-window,
                    draining,
                    switchover,
                    applying,
                    rebooting,
                    verifying,
                    done,
                    failed,
                    rolling-back,
                    rolled-back,
                    rollback-failed,
                    skipped,
                  ]
              from: { type: [string, 'null'] }
              to: { type: [string, 'null'] }
              error: { type: [string, 'null'] }
              gates:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      {
                        type: string,
                        enum:
                          [
                            reconnected,
                            action,
                            version,
                            reboot,
                            health,
                            slo,
                            replication,
                            quorum,
                          ],
                      }
                    ok: { type: boolean }
                    message: { type: string }
              startedAt: { type: [string, 'null'], format: date-time }
              finishedAt: { type: [string, 'null'], format: date-time }
    UpdatesStatus:
      type: object
      properties:
        clusterVersion: { type: [string, 'null'] }
        controlPlaneVersion: { type: [string, 'null'] }
        policy:
          type: object
          properties:
            policy: { type: string, enum: [notify, auto-patch, manual] }
            channel: { type: string, enum: [stable, beta] }
            source: { type: string, enum: [github, mirror, upload] }
            mirrorUrl: { type: string }
            osUpdates: { type: boolean }
            settleSeconds: { type: integer }
            stepTimeoutMinutes: { type: integer }
        activeRollout: { type: [string, 'null'], format: uuid }
        latestAvailable: { type: [string, 'null'] }
        unsignedBundles:
          type: object
