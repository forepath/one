openapi: 3.1.0
info:
  title: Loadweaver Control Plane API
  version: 1.0.0
  description: |
    HTTP API of the Loadweaver control plane: cluster identity, desired state (resources), plan → apply, drift,
    nodes, join tokens, cron runs, the built-in registry, image scans, ingress certificates, DNS (zones, DNSSEC,
    failover), remote access (VPN devices), project access, logs, metrics (with a Prometheus scrape target), alerts, dashboards (with a Grafana data source), the overview and health tree, the topology map, SLOs, public status pages and incidents, search, wallboard tokens, periodic reports, live sessions (file browser, terminal sessions and recordings, debug tunnels), Git connections (GitOps: sync, commit statuses, pull requests, export, webhooks), the audit log and SIEM forwarding state, and updates (release bundles, update plans and their rollout, the cluster-local apt source; every response carries the control plane's release in `X-Loadweaver-Version`). Node agents use a separate mutually
    authenticated gRPC stream (`loadweaver.agent.v1.NodeAgent/Connect`, see
    `libs/domains/loadweaver/shared/util-agent-protocol/proto/agent.proto`).

    The built-in private registry is served under `/v2` (outside the `/api` prefix) for `docker login`,
    `docker push` and `docker pull` of `registry.lw/<project>/<repository>` images: requests are streamed to the
    registry instances on the control-plane members, which authenticate with tokens from `/registry/token`.

    Fleet services (3.24) call this API with a PAT of a dedicated service user and send the acting fleet user in
    `X-Loadweaver-On-Behalf-Of`. The header is recorded as `details.onBehalfOf` in the audit log only when the PAT
    carries the opt-in scope `fleet:on-behalf-of` (ignored for interactive sessions, the static API key and other
    tokens); the audit actor stays the service user. `fleet:on-behalf-of` can only be granted (`POST /auth/tokens`,
    `PATCH /auth/tokens/{id}`) by accounts with a cluster-wide role (cluster admins, the fleet service user); 403
    for everyone else.

    **Signed fleet identities** (3.24): a fleet registered under `/trusted-fleets` (natively, by a cluster admin)
    additionally sends `X-Loadweaver-Fleet-Identity`: a compact JWS (`EdDSA` / Ed25519, header `kid`) with `iss`,
    `aud` (this cluster's `clusterId`), `sub`, `email` / `email_verified`, `role` + `prj` (the fleet grant), `htm` /
    `htu` (method + `/api/…` URL as sent), `bh` (base64url SHA-256 of the JSON body bytes), `iat` / `exp` (≤ 60 s)
    and `jti`. On state-changing requests of a PAT with `fleet:on-behalf-of` the control plane verifies it (30 s
    clock skew, each `jti` once across all replicas); the acting person is then `fleet:<iss>:<sub>` — stored as
    creator / requester / approver, recorded as `details.onBehalfOf` (+ `onBehalfOfEmail`), with the fleet grant's
    roles capped by the service user's own. Claims of unknown issuers are ignored; a trusted fleet's claim that
    fails a check is refused (403 `fleet identity claim refused: …`). Approvals and acceptances by a PAT with
    `fleet:on-behalf-of` need a verified claim (403 otherwise); plans / requests the service user created itself
    (before claims) are approved natively only. Two-person rules treat the same verified email of a fleet person and
    another account as the same person (exclusion only).
  contact:
    name: ForePath
    email: hi@forepath.io
    url: https://loadweaver.com
servers:
  - url: http://localhost:3400/api
    description: HTTP API (global prefix `/api`). Listen port from env `PORT` (default 3400).
security:
  - bearerAuth: []
paths:
  /projects/{project}/secrets:
    parameters:
      - in: path
        name: project
        required: true
        schema: { type: string }
    get:
      summary: List project secret version metadata
      description: Cluster admins only. PATs require `secrets:read`. Values are never returned.
      operationId: listProjectSecrets
      responses:
        '200':
          description: Secret names and version metadata, never values
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    project: { type: string }
                    name: { type: string }
                    versions:
                      type: array
                      items: { $ref: '#/components/schemas/SecretVersionDto' }
        '403':
          description: Missing cluster-admin role or PAT without `secrets:read`
  /projects/{project}/secrets/names:
    get:
      summary: List project secret names for reference suggestions
      description: |
        Same authorization as secret metadata reads: cluster admins only; PATs require `secrets:read` and never
        inherit an interactive admin role. Verified fleet grants are capped by the service user's cluster role,
        exactly as on the existing read route. Project membership alone does not grant access. Lists are not audited.
        Project is required: the store and `secret://<project>/<name>` references have no cluster-level namespace.
        One query selects distinct names only, sorts by name, applies a case-insensitive literal substring filter
        and caps the result. Deleted secrets have all versions physically removed and do not appear; no soft-delete
        column exists. No values, ciphertext, wrapped keys, fingerprints or other value-derived metadata are read
        or returned. Keys, versions, updatedAt and total are omitted.
      operationId: listProjectSecretNames
      parameters:
        - in: path
          name: project
          required: true
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
          description: Case-insensitive literal substring of the secret name (empty matches all)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Names only (empty items when no secrets match)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      additionalProperties: false
                      required: [name]
                      properties:
                        name:
                          {
                            type: string,
                            pattern: '^[a-z0-9][a-z0-9._-]{0,127}$',
                          }
        '400':
          description: Invalid project, q (over 200 characters or not a string), or limit (not an integer in 1..200)
        '403':
          description: Missing cluster-admin role or PAT without `secrets:read` (before secret lookup)
  /projects/{project}/secrets/{name}:
    parameters:
      - in: path
        name: project
        required: true
        schema: { type: string }
      - in: path
        name: name
        required: true
        schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$' }
    put:
      summary: Set a project secret (new version)
      description: |
        Project admins and operators, or cluster admins. Infra operators must also hold an allowed role in this
        project; developers, viewers and non-members cannot write. Names starting with `lw-` are platform-reserved
        and require a cluster admin, including via PAT. PATs require `secrets:write` and are bounded by their owner's
        current effective roles. Authorization precedes project lookup so denied callers cannot discover project
        existence. Audits actor, project and secret name, never the value. Values remain unreadable through the API.
      operationId: setProjectSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  {
                    type: string,
                    maxLength: 1048576,
                    description: UTF-8 value (1 byte to 1 MiB),
                  }
                valueBase64:
                  {
                    type: string,
                    format: byte,
                    description: Binary value (1 byte to 1 MiB); takes precedence over value,
                  }
      responses:
        '200':
          description: New version metadata, never the value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretVersionDto' }
        '400':
          description: Invalid name or value (empty or over 1 MiB)
        '403':
          description: Missing project admin/operator or cluster-admin role, reserved `lw-` name without cluster-admin role, or PAT without `secrets:write`
        '404':
          description: Project does not exist (authorized callers only)
    delete:
      summary: Delete all versions of a project secret
      description: |
        Project admins and operators, or cluster admins. Infra operators must also hold an allowed project role.
        Platform-reserved `lw-` names require a cluster admin, including via PAT. PATs require `secrets:write` and
        never exceed their owner's current effective roles. Denied callers receive 403 before any lookup, regardless
        of project existence. Audits actor, project and secret name, never the value. No values are returned.
      operationId: deleteProjectSecret
      responses:
        '204':
          description: All versions deleted
        '403':
          description: Missing project admin/operator or cluster-admin role, reserved `lw-` name without cluster-admin role, or PAT without `secrets:write`
        '404':
          description: Secret not found (authorized callers only)
  /cluster:
    get:
      summary: Cluster summary
      description: Cluster id, CA certificate, node counts and control-plane membership (1 → 3 → 5, witness). Scope `cluster:read`.
      operationId: getCluster
      responses:
        '200':
          description: Cluster summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSummaryDto'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cluster/audit/verify:
    get:
      summary: Verify the hash-chained audit log
      description: |
        Recomputes the chain, reports the first broken entry and compares the newest 1,000 chain-head anchors in the
        log store with it (3.18). `ok` is false when the chain breaks or an anchored entry is missing or has a
        different hash (`anchors.mismatched`). Requires the auditor or cluster-admin role, scope `audit:read`.
      operationId: verifyAuditLog
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerification'
  /cluster/siem:
    get:
      summary: SIEM delivery state
      description: |
        Delivery state per SIEM target configured in `Cluster.spec.observability.siem` (3.18), ordered by name.
        Requires the auditor or cluster-admin role, scope `audit:read`.
      operationId: getSiemStatus
      responses:
        '200':
          description: One entry per target that has been forwarded to
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SiemTargetStatus' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit:
    get:
      summary: Search the audit log
      description: |
        One page of audit entries (3.18), newest first, from Postgres. Auditors and cluster admins see every entry,
        project admins the entries of their projects. `text` is a full-text query over the log-store mirror (its
        10,000 best matches) when the log store is enabled, a case-insensitive substring match otherwise. Page with
        `before`. Scope `audit:read`.
      operationId: listAuditEntries
      parameters:
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditProject'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditTarget'
        - $ref: '#/components/parameters/AuditText'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - $ref: '#/components/parameters/AuditBefore'
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          description: Invalid parameter, time range or cursor
        '403':
          description: Token without the `audit:read` scope
        '404':
          description: The `project` is not one the caller is admin of, or the caller sees no audit entries at all
  /audit/export:
    get:
      summary: Export the audit log
      description: |
        Every entry matching the filter (same filters and scoping as `GET /audit`), newest first, at most 50,000
        entries, as an attachment. `ndjson`: one `AuditEntry` per line. `csv`: header
        `seq,at,actorType,actorId,actorEmail,action,target,project,details,hash`, `details` as JSON, text quoted and cells that
        start like a formula (`=`, `+`, `-`, `@`, tab, CR) prefixed with `'`. `limit` is accepted but doesn't apply.
        Scope `audit:read`.
      operationId: exportAuditEntries
      parameters:
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditProject'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditTarget'
        - $ref: '#/components/parameters/AuditText'
        - $ref: '#/components/parameters/AuditBefore'
        - in: query
          name: format
          schema: { type: string, enum: [ndjson, csv], default: ndjson }
      responses:
        '200':
          description: 'NDJSON or CSV (sent as `text/plain`, `Content-Disposition: attachment`)'
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid parameter, time range or cursor
        '403':
          description: Token without the `audit:read` scope
        '404':
          description: The `project` is not one the caller is admin of, or the caller sees no audit entries at all
  /nodes/join:
    post:
      summary: Join a node
      description: |
        Called by the one-line installer. Authenticated by a single-use, short-lived join token instead of a user
        session. The control plane decides the node identity, site, labels and addresses; the CSR only provides
        the public key. Rate limited to 10 requests per minute.
      operationId: joinNode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '200':
          description: Node certificate and control-plane endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid, used, revoked or expired join token (always the same error)
        '409':
          description: A node with this name is already part of the cluster
  /nodes:
    get:
      summary: List nodes
      operationId: listNodes
      description: Scope `cluster:read`.
      parameters:
        - {
            name: runtime,
            in: query,
            required: false,
            description: 'Isolation level filter (3.1): `microvm` = nodes where that level is ready (exact), `>=sandboxed-kvm` = nodes whose strongest ready level is at least that one. Levels: `runc`, `sandboxed`, `sandboxed-kvm`, `microvm`.',
            schema: { type: string, example: '>=sandboxed-kvm' },
          }
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeResponseDto'
        '400':
          description: Malformed `runtime` filter
  /nodes/{name}/isolation-probe:
    post:
      summary: Re-run a node's isolation probes
      operationId: requestNodeIsolationProbe
      description: |
        Puts a fresh probe nonce into the node's desired state (`host.probeNonce`); the agent re-probes every isolation
        level and reports its new capabilities when done (3.1). Audited as `node.isolation-probe`. Infra operators and
        cluster admins, scope `cluster:nodes`.
      parameters:
        - $ref: '#/components/parameters/NodeName'
      responses:
        '202':
          description: Probe requested
          content:
            application/json:
              schema:
                type: object
                required: [node, probeNonce]
                properties:
                  node: { type: string }
                  probeNonce: { type: string, format: uuid }
        '400':
          description: The node is not part of the cluster
  /nodes/{name}:
    get:
      summary: Get a node
      operationId: getNode
      parameters:
        - $ref: '#/components/parameters/NodeName'
      responses:
        '200':
          description: Node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponseDto'
        '404':
          description: Unknown node
  /nodes/{name}/platform:
    get:
      summary: Platform components a node runs
      operationId: getNodePlatform
      description: >-
        Read-only list of the platform components the node runs (etcd, Postgres / Patroni, job queue, control-plane API
        replica, log store, object-store generations, registry and mirrors, ingress, authoritative DNS, VPN gateway,
        external BGP, rate limiter, backup repository servers), derived from the node's current desired state; the state
        from the agent's last apply report per layer (`unknown` while the agent is disconnected or hasn't reported the
        layer); Postgres `leader` / `replica` from the member's Patroni. No secrets. Same access as reading the node
        (scope `cluster:read`); relayed by the fleet as a viewer read.
      parameters:
        - $ref: '#/components/parameters/NodeName'
      responses:
        '200':
          description: Platform components (empty for nodes without platform roles)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodePlatformComponentDto'
        '404':
          description: Unknown node
  /nodes/{name}/cordon:
    post:
      summary: Cordon a node (no new workloads)
      operationId: cordonNode
      description: Runtime action, audited. Infra operators and cluster admins, scope `cluster:nodes`.
      parameters:
        - $ref: '#/components/parameters/NodeName'
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponseDto'
  /nodes/{name}/uncordon:
    post:
      summary: Uncordon a node
      operationId: uncordonNode
      parameters:
        - $ref: '#/components/parameters/NodeName'
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponseDto'
  /nodes/{name}/drain:
    post:
      summary: Drain a node before it leaves
      operationId: drainNode
      parameters:
        - $ref: '#/components/parameters/NodeName'
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponseDto'
  /nodes/{name}/confirm-lost:
    post:
      summary: Confirm that a node is gone
      description: |
        Operator confirmation that a node is permanently lost, so its stateful workloads may fail over without
        control-plane quorum (3.2). Revokes the node identity. Cluster admins, scope `cluster:nodes`.
      operationId: confirmNodeLost
      parameters:
        - $ref: '#/components/parameters/NodeName'
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponseDto'
  /nodes/{name}/leave:
    post:
      summary: Remove a drained node from the cluster
      description: |
        Revokes the node identity immediately and recompiles the network. Refused while the node still runs
        replicas, holds volume copies or object-store data (no data loss on leave, 3.2). The last node cannot leave.
      operationId: leaveNode
      parameters:
        - $ref: '#/components/parameters/NodeName'
      responses:
        '200':
          description: Node marked as left
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponseDto'
        '409':
          description: Node not drained, or last node
  /join-tokens:
    post:
      summary: Create a join token
      description: The plaintext token is returned once; only its SHA-256 hash is stored. Scope `cluster:nodes`.
      operationId: createJoinToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJoinTokenDto'
      responses:
        '201':
          description: Created token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedJoinTokenDto'
    get:
      summary: List active join tokens
      operationId: listJoinTokens
      responses:
        '200':
          description: Active tokens (without secrets)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JoinTokenResponseDto'
  /join-tokens/{id}:
    delete:
      summary: Revoke a join token
      operationId: revokeJoinToken
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked
  /plans:
    post:
      summary: Create a plan
      description: |
        Diffs the submitted YAML bundle (and deletions) against the current desired state and compiles the
        effect on every network layer. Nothing changes until the plan is applied. Scope `plans:create`.
        With `dryRun: true` (3.36) the full plan is built and returned (`id: dry-run`, `dryRun: true`) but not
        stored, and no events, notifications or pull requests are triggered.
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanDto'
      responses:
        '201':
          description: Plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponseDto'
        '400':
          description: Invalid resources (issues per document and path)
    get:
      summary: List plans
      operationId: listPlans
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                pending,
                applying,
                applied,
                failed,
                discarded,
                rolling-back,
                rolled-back,
                rollback-failed,
              ]
        - in: query
          name: project
          description: Only plans with a change in this project
          schema:
            type: string
      responses:
        '200':
          description: Plans, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanResponseDto'
  /plans/{id}:
    get:
      summary: Get a plan
      operationId: getPlan
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponseDto'
  /plans/{id}/apply:
    post:
      summary: Apply a plan
      description: |
        Locks exactly the resources the plan touches (the cluster lock for `Cluster` changes) and refuses if any of
        them changed since the plan was created (create a new plan then). Workloads are planned again at apply time;
        a different outcome refuses the apply. Unacknowledged pins in the plan's warnings need `confirm: true`.
        Recorded in the audit log in the same transaction. Scope `plans:apply`.

        The apply is tracked (3.19): the plan stays `applying` until every connected node with a fresh heartbeat
        reported the new revision, and ends `applied`. A failed node, the timeout (`LOADWEAVER_APPLY_TIMEOUT_MS`,
        default 10 minutes) or a cancel rolls back automatically (`rolling-back` → `rolled-back`); a failed rollback
        stays `rollback-failed` with its locks and gets a fix-forward plan. The response comes once the plan
        settled, or after 5 seconds with the current `progress` (follow it with `GET /plans/{id}` or the
        `socket/plans` namespace).
      operationId: applyPlan
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  {
                    type: boolean,
                    description: Confirms the unacknowledged pins listed in the plan's warnings,
                  }
      responses:
        '200':
          description: Plan once settled (`applied`, `rolled-back`, `rollback-failed`), or still `applying` / `rolling-back` after 5 seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponseDto'
        '403':
          description: Missing cluster permission, or below the developer role in a touched project
        '409':
          description: |
            Plan not pending, or stale, or pins not confirmed. Missing approvals or cross-project acceptances
            (3.17) answer with `blockers`; resources locked by another plan answer with `locks`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlanBlockers'
                  - $ref: '#/components/schemas/PlanLockConflict'
  /plans/{id}/approve:
    post:
      summary: Approve a pending plan
      description: |
        Approves the plan for every touched project where the caller is operator or admin and didn't create the
        plan (3.17). The approval is bound to this plan; a new plan needs a new approval. Audited as `plan.approve`.
        Scope `plans:approve`.
      operationId: approvePlan
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Plan with its approvals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponseDto'
        '403':
          description: Not operator or admin in any touched project, or the plan's author
        '404':
          description: Unknown plan, or not visible to the caller
        '409':
          description: Plan not pending
  /plans/{id}/cancel:
    post:
      summary: Cancel a running apply
      description: |
        Stops an `applying` plan at the next safe point (between node reports, never inside an apply on a node);
        it then rolls back automatically (3.19). Needs the same rights as apply. Audited as `plan.cancel`.
        Returns once the plan settled, or as it is after 5 seconds. Scope `plans:apply`.
      operationId: cancelPlan
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Plan (usually `rolling-back` or `rolled-back`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponseDto'
        '403':
          description: Missing cluster permission, or below the developer role in a touched project
        '404':
          description: Unknown plan
        '409':
          description: Plan not `applying`
  /imports:
    get:
      summary: List hosts joined for an import
      description: |
        Nodes that joined with `install.sh --discover` (3.21): their latest discovery summary, former-installation
        marker and the state of their join plan. Scope `cluster:read`, any cluster role.
      operationId: listImports
      responses:
        '200':
          description: Imports
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/ImportSummary' },
                }
        '403': { description: Missing cluster permission }
  /imports/{node}:
    parameters:
      - {
          name: node,
          in: path,
          required: true,
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' },
        }
    get:
      summary: Discovery and import wizard state of a node
      description: |
        The node's discovery report (secrets redacted), the discovered items (compose projects, standalone containers)
        with ports and mounts, the projects to import into and the latest selection with its join plan and step
        progress. Scope `cluster:read`, any cluster role.
      operationId: getImport
      responses:
        '200':
          description: Import detail
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/ImportDetail' } },
            }
        '404': { description: Unknown node or no discovery }
    delete:
      summary: Discard an import
      description: |
        Discards the open selection (not while its join plan runs). A node that is still `pending` leaves the
        cluster right away (nothing on the host was changed). Scope `plans:create`, cluster admin or infra operator.
      operationId: discardImport
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  { discarded: { type: boolean }, nodeLeft: { type: boolean } }
        '409': { description: The join plan is running }
  /imports/{node}/discover:
    parameters:
      - { name: node, in: path, required: true, schema: { type: string } }
    post:
      summary: Discover again
      description: |
        Asks the pending node (connected, agent with feature `node-import`) for a fresh read-only discovery; the
        answer replaces the stored report. Scope `plans:create`, cluster admin or infra operator.
      operationId: rediscoverImport
      responses:
        '202':
          description: Request sent
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties: { request: { type: string, format: uuid } },
                    },
                },
            }
        '409':
          {
            description: Not pending,
            not connected or the agent can't discover,
          }
  /imports/{node}/selection:
    parameters:
      - { name: node, in: path, required: true, schema: { type: string } }
    put:
      summary: Save the wizard's selection and build the join plan
      description: |
        Per discovered item: import (deployment pinned to the node), migrate (stateless only, runs on other nodes)
        or ignore (stays as drift); target project, deployment name, hostnames for HTTP ports, handling of each volume /
        bind mount (`copy` into a replicated volume, `empty`, `keep` the host path), values for redacted variables;
        `wipeFormerIdentity` for a former node of another cluster. Returns the join plan (conflicts, former
        installation, deployments, steps, errors); nothing is applied. Scope `plans:create`, cluster admin or infra
        operator.
      operationId: saveImportSelection
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ImportSelections' } },
          }
      responses:
        '200':
          description: Selection with its join plan
          content:
            {
              application/json:
                {
                  schema: { $ref: '#/components/schemas/ImportSelectionView' },
                },
            }
        '409':
          {
            description: The node isn't pending or its join plan is planned / running,
          }
  /imports/{node}/plan:
    parameters:
      - { name: node, in: path, required: true, schema: { type: string } }
    post:
      summary: Create the join plan's plan
      description: |
        Rebuilds the join plan from the current discovery and creates one pending plan: the imported `Deployment`s
        plus the node's `NodeImport` (the steps). Reviewed, approved and applied like any plan; applying it makes the
        node `importing` and the import controller runs the steps (components, activation, rsync pre-copy, stop, final
        pass, release, verify, port handover; rollback restarts the source). Scope `plans:create`, cluster admin or
        infra operator; normal plan rights apply.
      operationId: createImportPlan
      responses:
        '201':
          description: Plan
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/PlanResponseDto' } },
            }
        '400': { description: The join plan has errors (`errors`) }
        '409':
          { description: The node isn't pending or the selection isn't a draft }
  /drift:
    get:
      summary: Drift report
      description: |
        What was changed outside Loadweaver (3.8): foreign containers the nodes report with every heartbeat
        (never touched), failed rollbacks whose configuration and reality may differ until their fix-forward
        plan is applied, and Git scopes whose default branch is ahead of the cluster (3.29). Needs a cluster role.
        Scope `cluster:read`.
      operationId: getDrift
      responses:
        '200':
          description: Drift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftReport'
        '403':
          $ref: '#/components/responses/Forbidden'
  /drift/plans:
    post:
      summary: Propose a plan from a foreign container
      description: |
        Creates a pending plan that takes a foreign container over as a `Deployment` of a project: same image and
        published ports. Environment and volumes are not copied (they may hold secrets and host paths). The
        resource is annotated `loadweaver.com/adopted-from: <node>/<container id>`. Normal plan rights apply. In a
        Git scope it becomes a pull request (authoritative) or is committed back after the apply (bidirectional).
        Scope `plans:create`.
      operationId: proposeDriftPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node, container, project, deployment]
              properties:
                node:
                  {
                    type: string,
                    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$',
                  }
                container:
                  type: string
                  pattern: '^[0-9a-f]{12,64}$'
                  description: Container id or an id prefix of at least 12 characters
                project:
                  {
                    type: string,
                    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$',
                  }
                deployment:
                  {
                    type: string,
                    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$',
                  }
      responses:
        '201':
          description: Proposed plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponseDto'
        '400':
          description: Invalid input or resources
        '403':
          description: Below the developer role in the project
        '404':
          description: No such foreign container on the node
  /plans/{id}/discard:
    post:
      summary: Discard a pending plan
      operationId: discardPlan
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Discarded plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponseDto'
  /resources:
    get:
      summary: List desired state
      operationId: listResources
      parameters:
        - in: query
          name: kind
          schema:
            type: string
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
  /resources/export:
    get:
      summary: Export desired state as one YAML bundle
      operationId: exportResources
      responses:
        '200':
          description: YAML bundle
          content:
            application/yaml:
              schema:
                type: string
  /resources/{kind}/{name}:
    get:
      summary: Get one resource
      operationId: getResource
      parameters:
        - in: path
          name: kind
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: project
          schema:
            type: string
      responses:
        '200':
          description: Resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: Unknown resource
  /projects/{project}/deployments/{deployment}/status:
    get:
      summary: Where a deployment runs
      description: |
        Replicas (cron runs excluded) with node, addresses and the node's last reported state, and the service
        addresses (stable across restarts, migrations and failover). For machine clients that drive deployments
        through plans, e.g. Agenstra's agent manager reaching its environments. Project members; scope
        `resources:read`. `404` when the deployment has neither replicas nor service addresses.
      operationId: getDeploymentStatus
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - {
            name: deployment,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  deployment: { type: string }
                  replicas:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        service: { type: string }
                        node: { type: string }
                        addresses: { type: array, items: { type: string } }
                        state:
                          {
                            type: string,
                            description: '`running`, `starting`, `exited`, ...; `pending` before the first report; `draining` for a removed replica (scale-down, deleted service): out of routing, stopped at `drainUntil`',
                          }
                        drainUntil:
                          {
                            type: string,
                            format: date-time,
                            description: 'Only while draining: when the replica is stopped',
                          }
                        exitCode: { type: integer }
                        message: { type: string }
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        addressV4: { type: [string, 'null'] }
                        addressV6: { type: [string, 'null'] }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
  /projects/{project}/isolation-capabilities:
    get:
      summary: Isolation levels a project's placement offers
      description: |
        Aggregated isolation capabilities (3.1, 3.35) of the project's placement: for each level (`runc`, `sandboxed`,
        `sandboxed-kvm`, `microvm`) whether at least one schedulable node (lifecycle active, reachable, no witness,
        matching `selector`, level probe passed, agent with the protocol features the level needs) would take a replica.
        Otherwise the most common cause among the placement's nodes (`unsupported`, `probe-failed`,
        `disabled-by-admin` for nodes opted out of KVM) with Agenstra's reason code and the scheduler's per-node reason.
        Capacity is not considered: a plan can still fail for lack of capacity, and workloads always run at exactly
        their level. Used by Agenstra's agent manager (its project-scoped service PAT) for its isolation capabilities.
        Project members; scope `resources:read`.
      operationId: getIsolationCapabilities
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - {
            name: selector,
            in: query,
            required: false,
            description: 'Narrows the placement: `key=value[,key=value]` on node labels (incl. `loadweaver.com/site`, `loadweaver.com/node` and the derived runtime labels)',
            schema: { type: string },
          }
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                required:
                  [project, selector, nodes, strongest, levels, checkedAt]
                properties:
                  project: { type: string }
                  selector: { type: [string, 'null'] }
                  nodes:
                    {
                      type: integer,
                      description: 'Schedulable nodes in the placement',
                    }
                  strongest:
                    {
                      type: [string, 'null'],
                      enum: [runc, sandboxed, sandboxed-kvm, microvm, null],
                      description: 'Strongest ready level (display only)',
                    }
                  levels:
                    type: object
                    required: [runc, sandboxed, sandboxed-kvm, microvm]
                    properties:
                      runc:
                        $ref: '#/components/schemas/IsolationLevelCapability'
                      sandboxed:
                        $ref: '#/components/schemas/IsolationLevelCapability'
                      sandboxed-kvm:
                        $ref: '#/components/schemas/IsolationLevelCapability'
                      microvm:
                        $ref: '#/components/schemas/IsolationLevelCapability'
                  checkedAt: { type: string, format: date-time }
        '400':
          description: Malformed selector
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown project (or no access)
  /virtual-machines:
    get:
      summary: Virtual machines the caller may read
      description: |
        Full virtual machines (3.35) of every project the caller may read, with phase, node, sizing and addresses.
        `?project=` filters. Scope `resources:read`.
      operationId: listAllVirtualMachines
      parameters:
        - {
            name: project,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        '200':
          description: Virtual machines
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/VirtualMachineSummary' },
                }
  /projects/{project}/virtual-machines:
    get:
      summary: Virtual machines of a project
      operationId: listVirtualMachines
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Virtual machines
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/VirtualMachineSummary' },
                }
        '404':
          description: Project not found (or not readable)
  /projects/{project}/virtual-machines/{name}:
    get:
      summary: A virtual machine with its status
      description: |
        Spec (as applied) and status: phase `Pending | Importing | Starting | Running | Stopping | Stopped | Migrating |
        Failed`, node, the node's last report, NICs (MAC, groups, addresses per NIC), disks (DRBD block volumes with
        their placement), console availability (`socket/consoles`, replica `<project>/lw-vm/<name>/0`), the actions the
        VM's state and the caller's role allow, and the last node commands. Scope `resources:read`.
      operationId: getVirtualMachine
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The virtual machine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '404':
          description: Not found
  /projects/{project}/virtual-machines/{name}/{action}:
    post:
      summary: Power action
      description: |
        `start`, `stop` (ACPI shutdown within the launcher's grace), `force-off` (hard power-off via `vmPower destroy`,
        no grace) and `shutdown` (ACPI via `vmPower`) change
        the operational power of `Manual` VMs (409 "managed by the spec" for `Always` / `Halted`): the replica is placed
        (quotas and the scheduler apply) or drained right away and the network recompiled — no plan. `reboot` (ACPI) and
        `reset` (hard) go to the VM's node as `vmPower` (node feature `virtual-machines`). Operators and admins,
        developers when the project allows exec; audited (`vm.<action>`). Scope `live:access`.
      operationId: virtualMachineAction
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - {
            name: action,
            in: path,
            required: true,
            schema:
              {
                type: string,
                enum: [start, stop, force-off, shutdown, reboot, reset],
              },
          }
      responses:
        '200':
          description: The virtual machine after the action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
        '409':
          description: Not allowed in the VM's state (run strategy, already running / stopped, no capacity, quota, node without `virtual-machines`)
  /projects/{project}/virtual-machines/{name}/reimage:
    post:
      summary: Re-image the boot disk
      description: |
        Writes a stopped VM's boot disk again from its pinned image on the disk's primary (`vmImageImport`) and bumps
        the cloud-init instance generation, so first-boot configuration runs again. Operators; audited
        (`vm.reimage`). Scope `plans:apply`.
      operationId: reimageVirtualMachine
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The virtual machine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VirtualMachine' }
        '409':
          description: Not stopped, disk or image not placed / pinned yet
  /projects/{project}/virtual-machines/{name}/snapshots:
    get:
      summary: Snapshots of a virtual machine
      operationId: listVirtualMachineSnapshots
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Snapshots, newest first
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/VmSnapshot' },
                }
    post:
      summary: Take a snapshot
      description: |
        One Kopia backup per disk now (as "back up now"); application-consistent when the pinned image declares the
        guest agent (fsfreeze), else crash-consistent. Restores are `Restore` resources (plans). Operators; audited
        (`vm.snapshot`). Scope `plans:apply`.
      operationId: createVirtualMachineSnapshot
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 1024 }
      responses:
        '201':
          description: The snapshot (backups running)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VmSnapshot' }
        '409':
          description: Disks not placed yet, or a backup of a disk is running
  /projects/{project}/vm-images/import:
    post:
      summary: Import a VM image
      description: |
        Background job: downloads `url` (HTTPS to public addresses only, checked on every redirect hop), verifies
        the checksum (exactly one of `sha256` / `sha512`, else 400), accepts qcow2, raw (stored zstd-compressed) and KubeVirt containerDisk tars (`/disk/*.qcow2|*.img`,
        also gzip-compressed), and pushes an OCI VM image artifact (`artifactType`
        `application/vnd.loadweaver.vm-image.v1`) to `registry.lw/<project>/<ref>`. Operators; audited. Scope
        `registry:push`.
      operationId: importVmImage
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, ref]
              properties:
                url: { type: string, format: uri }
                sha256:
                  {
                    type: string,
                    description: 'Hex SHA-256 of the file (optionally `sha256:` prefixed); exactly one of sha256 / sha512',
                  }
                sha512:
                  {
                    type: string,
                    description: 'Hex SHA-512 of the file (optionally `sha512:` prefixed); exactly one of sha256 / sha512',
                  }
                ref:
                  {
                    type: string,
                    description: '`<repository>:<tag>` in the project',
                  }
                arch: { type: string, enum: [amd64, arm64], default: amd64 }
                firmware:
                  {
                    type: array,
                    items: { type: string, enum: [uefi, bios] },
                    default: [uefi],
                  }
                guestAgent: { type: boolean, default: false }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VmImageImport' }
        '400':
          description: Invalid request
  /vm-images/catalog:
    get:
      summary: VM image catalog
      description: |
        Recommended VM images (3.42): the list shipped with the release (`source: shipped`, pinned dated builds with
        the publishers' checksums) and the cluster's own entries (`source: cluster`, `Cluster.spec.vmImages.catalog`).
        Choosing one runs `POST /projects/{project}/vm-images/import` with its `url`, `checksum` and `suggestedRef`.
        Any project membership or cluster role. Scope `resources:read`.
      operationId: listVmImageCatalog
      responses:
        '200':
          description: Catalog entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    {
                      type: array,
                      items:
                        { $ref: '#/components/schemas/VmImageCatalogEntry' },
                    }
        '403':
          description: Neither a project membership nor a cluster role
  /vm-images/catalog/upstream:
    get:
      summary: Current builds from the distros (live lookup)
      description: |
        Reads the published indexes and checksum lists of a fixed set of official HTTPS sources (Ubuntu, Debian,
        AlmaLinux, Rocky Linux, Fedora, Alpine) and returns their current builds (`source: upstream`). Cached for 10
        minutes per line; each line times out after 10 s and is size-capped. A line that fails is left out and named
        in `warnings` (never an error). Any project membership or cluster role; 10 requests per minute and caller.
        Scope `resources:read`.
      operationId: listVmImageCatalogUpstream
      responses:
        '200':
          description: Entries and warnings
          content:
            application/json:
              schema:
                type: object
                required: [entries, warnings]
                properties:
                  entries:
                    {
                      type: array,
                      items:
                        { $ref: '#/components/schemas/VmImageCatalogEntry' },
                    }
                  warnings: { type: array, items: { type: string } }
        '403':
          description: Neither a project membership nor a cluster role
        '429':
          description: Too many lookups
  /projects/{project}/vm-images:
    get:
      summary: VM images in the project's registry
      description: |
        VM image artifacts (`artifactType` `application/vnd.loadweaver.vm-image.v1`, also inside an OCI index) in the
        project's repositories of the built-in registry — pushed with `loadweaver vm-image push`, any OCI client or an
        import. Read from the registry catalog, tags and manifests (at most 100 repositories, 50 tags each; cached
        30 s). Project readers.
      operationId: listVmImages
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: VM images, by repository
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/VmRegistryImage' },
                }
  /projects/{project}/vm-images/imports:
    get:
      summary: VM image imports of a project
      operationId: listVmImageImports
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Imports, newest first
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/VmImageImport' },
                }
  /projects/{project}/vm-images/imports/{id}:
    get:
      summary: One VM image import
      operationId: getVmImageImport
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: The import
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VmImageImport' }
        '404':
          description: Not found
  /projects/{project}/cron-runs:
    get:
      summary: Cron job runs of a project
      description: |
        Every run of the project's cron jobs (3.23), newest first: due time, attempt, node, state and exit code.
        The last 50 runs per job are kept. Scope `cluster:read`.
      operationId: listCronRuns
      parameters:
        - in: path
          name: project
          required: true
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        - in: query
          name: job
          description: '`<deployment>/<service>`'
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CronRun'
  /updates/status:
    get:
      summary: Update status of the cluster
      description: |
        The release the cluster runs (target of the last completed update, else the control plane's own version), the
        update policy (`Cluster.spec.updates`), the newest imported release of the channel, the running update plan,
        every node's agent version, release, target, kernel, pending reboot, development image overrides and
        maintenance window state, and whether contract migrations may run (3.26). Any cluster role, scope
        `cluster:read`.
      operationId: getUpdatesStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdatesStatus' }
  /updates/releases:
    get:
      summary: Known releases
      description: |
        Releases announced through the shared updates feature (GitHub releases of the channel; `beta` includes
        prereleases), imported bundles (`available`, signed or explicitly allowed unsigned development bundles),
        failed imports and the installed baseline, newest first. Any cluster role, scope `cluster:read`.
      operationId: listReleases
      responses:
        '200':
          description: Releases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Release' }
  /updates/releases/{version}/download:
    post:
      summary: Download and import a release bundle
      description: |
        Downloads the bundle once from the GitHub release (`loadweaver-bundle-<version>.tar`, or its parts
        `.part000`, `.part001`, … for large bundles) or the configured mirror, verifies the signature with the
        compiled-in release keys and every artifact's checksum, then imports it (images into the cluster registry as
        `lw-system/<component>`, files into the object store). Runs in the background; poll `/updates/releases`.
        Cluster admins, scope `cluster:admin`.
      operationId: downloadRelease
      parameters:
        - in: path
          name: version
          required: true
          schema:
            {
              type: string,
              pattern: '^\d{1,6}\.\d{1,6}\.\d{1,6}(-[0-9A-Za-z.-]{1,40})?$',
            }
      responses:
        '202':
          description: Download started
        '400':
          description: Invalid version
  /updates/bundles:
    post:
      summary: Import an uploaded release bundle (air-gapped)
      description: |
        The bundle (or its parts concatenated in order) as the request body, streamed: the manifest and its
        signature are verified before anything is stored; a bundle with a bad signature, an unsigned bundle (unless
        `LOADWEAVER_ALLOW_UNSIGNED_BUNDLES=true`, in production additionally
        `LOADWEAVER_ALLOW_UNSIGNED_BUNDLES_IN_PRODUCTION=i-understand`), an unlisted or tampered artifact, or one above
        `LOADWEAVER_BUNDLE_MAX_BYTES` (default 8 GiB) is refused and audited (`update.bundle-refused`). Cluster
        admins, scope `cluster:admin`. With `X-Loadweaver-Content-SHA256` the received bytes must match it and
        `Content-Length` (checked after receipt, before the release is recorded); through a fleet the signed identity
        claim binds these two (`bh` = `stream:<length>:<sha256 hex>`) instead of the body hash.
      operationId: uploadBundle
      parameters:
        - name: X-Loadweaver-Content-SHA256
          in: header
          required: false
          schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
          description: SHA-256 (hex) of the whole body; requires `Content-Length`.
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '400':
          description: Refused (signature, format) — nothing was imported
        '409':
          description: Release already imported, or another import runs on this replica
        '413':
          description: Bundle too large
  /updates/rollouts:
    get:
      summary: Update plans
      description: Newest first, with their steps. Any cluster role, scope `cluster:read`.
      operationId: listRollouts
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Update plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rollout' }
    post:
      summary: Plan an update
      description: |
        An update is a plan (3.26): the per-node, per-component diff (current → target and how each component
        updates), the release's compatibility notes, warnings (nodes whose agent predates release components,
        unsigned bundles, development image overrides, downgrades) and the failure analysis of every wave. Steps:
        control-plane members one at a time (the Patroni leader last, after a switchover), then a canary node, then
        waves — one site at a time and never more nodes than the failure domain tolerates. `host`: also OS
        packages, kernel, gVisor and the DRBD module from a frozen apt snapshot taken now (drain → update → reboot →
        rejoin). Without `version`: host updates of the current release. A new plan supersedes pending plans and a
        failed rollback (fix forward). Cluster admins, scope `cluster:admin`.
      operationId: createRollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version: { type: string }
                host: { type: boolean }
                osUpgrade:
                  {
                    type: boolean,
                    description: 'Upgrade every OS package to the snapshot (default with host updates)',
                  }
      responses:
        '201':
          description: Planned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
        '400':
          description: Invalid request or nothing to update
        '409':
          description: Release not imported, minimum version not met, or no node can take release components
  /updates/rollouts/{id}:
    get:
      summary: An update plan
      operationId: getRollout
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Update plan with steps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
        '404':
          description: Not found
  /updates/rollouts/{id}/approve:
    post:
      summary: Approve an update plan
      description: |
        The rollout controller starts it in the next maintenance window of each node (clusters without windows:
        right away). `emergency` runs it outside maintenance windows (emergency security fixes, explicit approval).
        One update runs at a time. Cluster admins, scope `cluster:admin`.
      operationId: approveRollout
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                emergency: { type: boolean }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
        '409':
          description: Not pending, or another update is active
  /updates/rollouts/{id}/pause:
    post:
      summary: Pause an update
      description: No new steps start; steps in progress finish. Cluster admins, scope `cluster:admin`.
      operationId: pauseRollout
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
  /updates/rollouts/{id}/resume:
    post:
      summary: Resume a paused update
      description: A step that failed and was rolled back is tried again. Cluster admins, scope `cluster:admin`.
      operationId: resumeRollout
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
  /updates/rollouts/{id}/rollback:
    post:
      summary: Roll an update back
      description: |
        Updated nodes return to their previous release one by one in reverse order (nodes first, control-plane
        members last). Host updates (packages, kernel) are not undone automatically: such steps end
        `rollback-failed` with the node's real state, and a new update plan fixes forward. Cluster admins, scope
        `cluster:admin`.
      operationId: rollbackRollout
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Rolling back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
  /updates/rollouts/{id}/cancel:
    post:
      summary: Cancel an update plan
      description: A plan that hasn't run, or a paused update stopped where it is (refused while steps are in flight — wait for them or roll back). Cluster admins, scope `cluster:admin`.
      operationId: cancelRollout
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rollout' }
        '409':
          {
            description: 'The plan is in another status, or steps are still in flight (the message names their nodes)',
          }
  /updates/artifacts/{sha256}:
    get:
      summary: Release artifact by checksum
      description: |
        Files of imported bundles (agent binaries, gVisor tarballs, DRBD sources / modules) for the nodes, which fetch
        only from the cluster and verify every byte against the signed manifest. Public like the installer.
      operationId: getReleaseArtifact
      security: []
      parameters:
        - {
            in: path,
            name: sha256,
            required: true,
            schema: { type: string, pattern: '^[0-9a-f]{64}$' },
          }
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: Not stored
  /updates/apt/{snapshot}/{source}/{path}:
    get:
      summary: Cluster-local apt source
      description: |
        A frozen apt snapshot (taken when the update was planned, or shipped with a bundle): `dists/…` serves the
        upstream `InRelease` / `Packages` files exactly as frozen (also by hash), `pool/…` the packages (fetched once
        from the upstream archive, then from the object store). apt on the node verifies the distribution's
        signatures and every checksum itself. Public like the installer.
      operationId: getAptFile
      security: []
      parameters:
        - { in: path, name: snapshot, required: true, schema: { type: string } }
        - { in: path, name: source, required: true, schema: { type: string } }
        - {
            in: path,
            name: path,
            required: true,
            schema: { type: string },
            description: '`dists/…` or `pool/…`',
          }
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: Not in this snapshot
  /updates/announcements:
    get:
      summary: Release announcements (shared updates feature)
      description: |
        The shared updates feature for Loadweaver: the newest GitHub release of the cluster's channel with the
        Loadweaver-scoped changelog, the installed version and the control-plane instances. `/status` for the
        summary, `POST /check` to check now. Global admins and the API key, scope `updates:admin`.
      operationId: getUpdateAnnouncements
      responses:
        '200':
          description: Full state of the shared updates feature
  /backups/platform:
    get:
      summary: Control-plane data backups
      description: |
        Backups of the control plane's own data (3.20): Postgres + TimescaleDB (WAL-G base backups, WAL archived
        continuously → point-in-time recovery), OpenSearch snapshots and etcd snapshots, with their schedules and
        retention from `Cluster.spec.backups.platform`, the last run per kind, the catalogued backups
        (`lw_backups`, resource `platform/<kind>`), the database's recovery window and the point-in-time restores.
        Any cluster role, scope `cluster:read`.
      operationId: getPlatformBackups
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformBackupStatus' }
  /backups/platform/{kind}/run:
    post:
      summary: Back up now
      description: |
        Runs a backup of one kind now (then its retention), outside the schedule; `busy` while a run of the kind is
        in progress or the object store switches generations, `unavailable` when the kind can't run here (e.g. no
        `repository-s3` plugin in a development OpenSearch image). Audited. Cluster admins, scope `cluster:admin`.
      operationId: runPlatformBackup
      parameters:
        - {
            name: kind,
            in: path,
            required: true,
            schema: { type: string, enum: [postgres, opensearch, etcd] },
          }
      responses:
        '200':
          description: Result of the run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformBackupRun' }
  /backups/platform/postgres/restores:
    get:
      summary: Point-in-time restores of the control-plane database
      description: The last 50 restores, newest first. Any cluster role, scope `cluster:read`.
      operationId: listPlatformRestores
      responses:
        '200':
          description: Restores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlatformRestore' }
    post:
      summary: Restore the control-plane database to a point in time
      description: |
        Clones the database into a new Patroni scope (`<cluster>-r<id>`) on one control-plane member, side by side
        with the running cluster (ports 5442 / 8008+10): the newest base backup before the target time plus the WAL
        up to it. The running cluster is untouched; making the clone the control-plane database is a cut-over
        (`…/restores/{id}/cutover`). One active restore at a time (409). `targetTime` (ISO 8601) defaults to the end of the
        archive and must lie inside the recovery window. Audited. Cluster admins, scope `cluster:admin`.
      operationId: requestPlatformRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                targetTime: { type: string, format: date-time }
                node:
                  {
                    type: string,
                    description: 'Member to run the clone on (default: first connected member)',
                  }
      responses:
        '201':
          description: Restore requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformRestore' }
        '400':
          description: Outside the recovery window, no base backup yet, or no suitable member
        '409':
          description: Another restore is active
  /backups/platform/postgres/restores/{id}:
    delete:
      summary: Discard a point-in-time restore
      description: Stops the clone and removes its data on the member; the restore stays in the history. Cluster admins, scope `cluster:admin`.
      operationId: discardPlatformRestore
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Discarded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformRestore' }
  /backups/platform/opensearch/restore:
    post:
      summary: Restore indices from an OpenSearch snapshot
      description: |
        Index-level restore from a platform snapshot into the log store; restored indices are renamed
        `<renamePrefix><index>` (default `restored-`; empty restores under the original names, which must not exist
        or be closed). Waits for completion. Audited. Cluster admins, scope `cluster:admin`.
      operationId: restorePlatformOpenSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshot, indices]
              properties:
                snapshot: { type: string }
                indices:
                  {
                    type: array,
                    items: { type: string },
                    minItems: 1,
                    maxItems: 100,
                  }
                renamePrefix: { type: string }
      responses:
        '200':
          description: Restored indices
          content:
            application/json:
              schema:
                type: object
                properties:
                  indices: { type: array, items: { type: string } }
                  failedShards: { type: integer }
        '404':
          description: Unknown snapshot
  /backups/platform/etcd/{name}:
    get:
      summary: Download an etcd snapshot
      description: |
        The snapshot as `etcdctl snapshot save` writes it (database + SHA-256 trailer), for `etcdutl snapshot restore`
        (whole-cluster recovery). Audited. Cluster admins, scope `cluster:admin`.
      operationId: downloadPlatformEtcdSnapshot
      parameters:
        - {
            name: name,
            in: path,
            required: true,
            schema: { type: string, pattern: '^etcd-\d{8}t\d{6}z$' },
          }
      responses:
        '200':
          description: Snapshot
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: Unknown snapshot
  /backups/platform/copies/run:
    post:
      summary: Copy the control-plane data to the external targets now
      description: |
        Copies the platform bucket (WAL archive, base backups, OpenSearch / etcd snapshots, DR envelopes) to the
        external `BackupTarget`s (`Cluster.spec.backups.platform.targets`, default every target): new or rewritten
        objects only, encrypted under the backup key before they leave, verified on the target, with object-lock
        retention where the target declares it; runs also after every control-plane backup and every few minutes.
        Cluster admins, scope `cluster:admin`.
      operationId: copyPlatformBackups
      responses:
        '200':
          description: Result per target
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    target: { type: string }
                    status: { type: string, enum: [succeeded, failed] }
                    copied: { type: integer }
                    pruned: { type: integer }
                    error: { type: [string, 'null'] }
  /backups/platform/dr-info:
    get:
      summary: Download the DR info file
      description: |
        What `loadweaver-agent bootstrap --restore --dr-info` needs besides the recovery kit and the target's
        credentials: cluster id, database scope, the external targets (locations, no credentials), the backup-key
        generations with kit shape and KMS-wrapped roots. No secrets. Audited. Cluster admins, scope `cluster:admin`.
      operationId: downloadDrInfo
      responses:
        '200':
          description: DR info (attachment)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrInfo' }
  /backups/platform/cutovers:
    get:
      summary: Cut-overs of the control-plane database
      description: The last 20 cut-overs to point-in-time clones, newest first. Any cluster role, scope `cluster:read`.
      operationId: listPlatformCutovers
      responses:
        '200':
          description: Cut-overs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlatformCutover' }
  /backups/platform/postgres/restores/{id}/cutover:
    post:
      summary: Plan the cut-over to a point-in-time clone
      description: |
        Plans switching the control-plane database to a ready clone: steps, members, warnings — data written after
        the clone's target time is lost; a final base backup of the current database is kept. Needs every member
        connected with the `platform-cutover` protocol feature and no other open cut-over (409). Nothing changes
        before a second cluster admin approves. Audited. Cluster admins, scope `cluster:admin`.
      operationId: planPlatformCutover
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '201':
          description: Planned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformCutover' }
        '404':
          description: Unknown restore
        '409':
          description: Not possible now (reason in the message)
  /backups/platform/cutovers/{id}/approve:
    post:
      summary: Approve a cut-over (second cluster admin)
      description: |
        Starts the switch: final base backup, the cut-over written into the clone's database, members switch through
        their desired state; done when every member runs in the new scope. The requester can't approve (403).
        Cluster admins, scope `cluster:admin`.
      operationId: approvePlatformCutover
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformCutover' }
        '403':
          description: The requester (a second admin has to approve)
        '409':
          description: Not planned (any more)
  /backups/platform/cutovers/{id}/cancel:
    post:
      summary: Cancel a planned or approved cut-over
      operationId: cancelPlatformCutover
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformCutover' }
        '400':
          description: Already switching or finished
  /dr/master-key:
    post:
      summary: Hand the master key over to a restored control plane
      description: |
        Whole-cluster disaster recovery (3.20): `loadweaver-agent bootstrap --restore` hands over the master key from
        the DR envelope; accepted only while the API runs with `LOADWEAVER_DR_RECOVERY` and authenticated by the
        recovery's one-time secret (header `x-loadweaver-dr-secret`), and only if it is the active master key. It is
        then sealed to the new member(s). Public route (no user exists yet), rate limited.
      operationId: drHandOverMasterKey
      security: []
      parameters:
        - {
            name: x-loadweaver-dr-secret,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [keyId, masterKey]
              properties:
                keyId: { type: string, pattern: '^[0-9a-f]{16}$' }
                masterKey:
                  { type: string, description: base64 of the 32-byte key }
      responses:
        '200':
          description: Recovery status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrStatus' }
        '401':
          description: No recovery in progress, or a wrong secret
  /dr/status:
    get:
      summary: Status of a whole-cluster disaster recovery
      description: Same authentication as `/dr/master-key`.
      operationId: drStatus
      security: []
      parameters:
        - {
            name: x-loadweaver-dr-secret,
            in: header,
            required: true,
            schema: { type: string },
          }
      responses:
        '200':
          description: Recovery status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrStatus' }
        '401':
          description: No recovery in progress, or a wrong secret
  /migrations:
    get:
      summary: Migration history
      description: |
        Every attempt of moving a replica (3.10), newest first: method (`live`, `stop-and-copy`, `blue-green`,
        `short-stop`) with the reason shown in the plan, phases, the fallback reason of a failed live attempt (the
        short-stop / blue-green attempt that followed has the next attempt number), freeze time, checkpoint size and
        pre-copy rounds. Cluster roles see every project, others the projects they can read. Scope `projects:read`.
      operationId: listMigrations
      parameters:
        - in: query
          name: replica
          description: '`project/deployment/service/index`'
          schema: { type: string }
        - in: query
          name: project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        - in: query
          name: deployment
          description: Needs `project`.
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Migration'
        '400':
          description: Invalid filter
        '404':
          description: Project not found (or not readable)
  /backups/status:
    get:
      summary: Backup status
      description: |
        Key / recovery-kit state, pins (kit not confirmed, no external target), repositories (cluster roles),
        secondary-copy results, stored backup bytes per readable project, and the deletion delay (3.20). Scope
        `projects:read`.
      operationId: getBackupsStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupsStatus'
  /backups:
    get:
      summary: Backup catalog
      description: |
        Backups newest first, filtered by project / volume; cluster-scope backups (control-plane data) for cluster
        roles only. Deleted backups only with `includeDeleted=true` (the timeline). Scope `projects:read`.
      operationId: listBackups
      parameters:
        - in: query
          name: project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        - in: query
          name: resource
          description: Volume `project/deployment/volume`.
          schema: { type: string }
        - in: query
          name: includeDeleted
          schema: { type: boolean, default: false }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        '200':
          description: Backups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Backup'
        '400':
          description: Invalid filter
        '404':
          description: Project not found (or not readable)
  /backups/now:
    post:
      summary: Back up a volume now
      description: Starts a backup of one volume on the node holding its primary (operators of the project). Scope `plans:apply`.
      operationId: backupNow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [volume]
              properties:
                volume:
                  { type: string, description: '`project/deployment/volume`' }
      responses:
        '201':
          description: Backup started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        '403':
          description: Not an operator of the project
        '404':
          description: Volume not found
        '409':
          description: A backup of the volume is running
  /backups/now/all:
    post:
      summary: Back up every volume now (final backup)
      description: |
        Cluster admins only (scope `cluster:admin`): starts one backup per placed volume that has none running, e.g.
        the final backup a fleet service runs before a Loadweaver Cloud teardown (3.24). Secondary copies to external
        targets follow after each backup; platform backups are separate (`/backups/platform/{kind}/run`). Audited as
        `backup.all-started`.
      operationId: backupAllNow
      responses:
        '200':
          description: Volumes whose backup started, and the ones skipped (running / not placed)
          content:
            application/json:
              schema:
                type: object
                required: [started, skipped]
                properties:
                  started: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
        '403':
          description: Not a cluster admin
  /backups/imports:
    post:
      summary: Import a backup archive (cross-cluster restore target)
      description: |
        Imports a tar archive exported by another cluster (`GET /backups/{id}/archive`) into the catalog of the target
        volume's project, as a new backup without policy (no retention removes it; deletion requests apply). Restore
        it with a `Restore` resource through plan / apply. Operators of the project; scope `backups:import`. The body
        is streamed to a temporary file, capped by `LOADWEAVER_BACKUP_ARCHIVE_MAX_BYTES` (default 50 GiB); only files,
        directories and symbolic links are accepted. Audited as `backup.imported` with the source labels (3.20, 3.24).
      operationId: importBackupArchive
      parameters:
        - in: query
          name: volume
          required: true
          description: Target volume `project/deployment/volume` (must be placed)
          schema: { type: string }
        - in: query
          name: sourceCluster
          schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
        - in: query
          name: sourceBackup
          schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: The imported backup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        '400':
          description: Invalid volume / labels / archive, or not sent as application/x-tar
        '403':
          description: Not an operator of the project
        '404':
          description: Volume not found
        '409':
          description: A backup of the volume is running
        '413':
          description: Archive larger than the limit
  /backups/diff:
    get:
      summary: Diff two backups of a volume
      description: Added, removed and changed files between two backups of the same volume (Kopia diff). Needs read access to the project's sensitive data. Scope `projects:read`.
      operationId: diffBackups
      parameters:
        - {
            in: query,
            name: from,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: to,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDiff'
        '400':
          description: Not the same volume, or a backup is not available
        '404':
          description: Backup not found
  /backups/restore-tests:
    get:
      summary: Restore tests
      operationId: listRestoreTests
      parameters:
        - { in: query, name: project, schema: { type: string } }
        - { in: query, name: resource, schema: { type: string } }
      responses:
        '200':
          description: Restore tests, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestoreTest'
  /backups/restores:
    get:
      summary: Restores
      description: Executions of `Restore` resources (created through plans) with live progress.
      operationId: listRestores
      parameters:
        - { in: query, name: project, schema: { type: string } }
      responses:
        '200':
          description: Restores, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restore'
  /backups/deletions:
    get:
      summary: Deletion requests
      description: Requests to delete backups or to shorten a policy's retention, readable for the scope's members.
      operationId: listBackupDeletions
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupDeletion'
    post:
      summary: Request a deletion of backups
      description: |
        Admins of the scope (project admin, cluster admin for the cluster) request; a second admin approves; the
        deletion takes effect after the delay (`LOADWEAVER_BACKUP_DELETION_DELAY_HOURS`, default 72 h). One request
        per repository (project). Scope `projects:admin`.
      operationId: requestBackupDeletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backupIds, reason]
              properties:
                backupIds:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '201':
          description: Pending request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDeletion'
        '403':
          description: Not an admin of the scope
        '404':
          description: Backup not found
  /backups/deletions/{id}/approve:
    post:
      summary: Approve a deletion request (second admin)
      operationId: approveBackupDeletion
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '201':
          description: Approved; takes effect at `notBefore`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDeletion'
        '403':
          description: Not an admin of the scope, the requester, or the request isn't pending
  /backups/deletions/{id}/cancel:
    post:
      summary: Cancel a deletion request before it took effect
      operationId: cancelBackupDeletion
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '201':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDeletion'
        '409':
          description: Already executed or cancelled
  /backups/keys:
    get:
      summary: Backup key generations and recovery kits
      description: Cluster admins only (scope `cluster:admin`); the first generation is created on first use.
      operationId: listBackupKeys
      responses:
        '200':
          description: Generations, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupKeyGeneration'
  /backups/keys/rotate:
    post:
      summary: Rotate the backup key
      description: A new generation with a new recovery kit; older generations stay for restores.
      operationId: rotateBackupKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupKitSize'
      responses:
        '201':
          description: New generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupKeyGeneration'
  /backups/keys/{generation}/kit:
    post:
      summary: Re-issue the recovery kit
      description: A new Shamir split of the same root (e.g. a share was lost); the kit has to be confirmed again.
      operationId: reissueBackupKit
      parameters:
        - {
            in: path,
            name: generation,
            required: true,
            schema: { type: integer },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupKitSize'
      responses:
        '201':
          description: Generation with the new kit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupKeyGeneration'
  /backups/keys/{generation}/kit/shares/{index}:
    post:
      summary: Download one recovery-kit share (once)
      description: The share as text (with a JSON block and checksum); the stored copy is erased, a second download is refused.
      operationId: downloadBackupKitShare
      parameters:
        - {
            in: path,
            name: generation,
            required: true,
            schema: { type: integer },
          }
        - { in: path, name: index, required: true, schema: { type: integer } }
      responses:
        '201':
          description: The share
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    {
                      type: object,
                      description: 'format, version, cluster, generation, rootId, index, shares, threshold, share, createdAt, checksum',
                    }
                  text: { type: string }
        '409':
          description: Already downloaded
  /backups/keys/{generation}/kit/confirm:
    post:
      summary: Confirm the recovery kit
      description: Enter `threshold` shares back (text, JSON or the bare `lws1.` share); they must reconstruct the generation's root.
      operationId: confirmBackupKit
      parameters:
        - {
            in: path,
            name: generation,
            required: true,
            schema: { type: integer },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shares]
              properties:
                shares:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 16,
                    items: { type: string },
                  }
      responses:
        '201':
          description: Confirmed
        '400':
          description: Wrong, mixed, duplicate or too few shares (or a checksum typo)
  /backups/keys/{generation}/escrow:
    post:
      summary: Escrow the backup key in the configured KMS
      operationId: escrowBackupKey
      parameters:
        - {
            in: path,
            name: generation,
            required: true,
            schema: { type: integer },
          }
      responses:
        '201':
          description: Escrowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupKeyGeneration'
        '400':
          description: No KMS configured
  /backups/{id}:
    get:
      summary: One backup
      operationId: getBackup
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Backup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        '404':
          description: Not found (or not readable)
  /backups/{id}/files:
    get:
      summary: Browse a backup
      description: Directory listing inside a backup (file browser over the catalog). Needs read access to the project's sensitive data.
      operationId: listBackupFiles
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { in: query, name: path, schema: { type: string, maxLength: 4096 } }
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    directory: { type: boolean }
                    mode: { type: string }
                    size: { type: integer }
                    modified: { type: string }
                    object: { type: string }
        '400':
          description: Invalid path, or the backup is not available
  /backups/{id}/download:
    get:
      summary: Download one file of a backup
      description: Streams the file (audited as `backup.file-downloaded`).
      operationId: downloadBackupFile
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: path,
            required: true,
            schema: { type: string, maxLength: 4096 },
          }
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /backups/{id}/archive:
    get:
      summary: Export a whole backup as a tar archive (cross-cluster restore source)
      description: |
        The backup restored into a tar archive by the control plane (decrypted with this cluster's backup key) and
        streamed; the source side of a cross-cluster restore / clone through the fleet service (3.20, 3.24). Project
        backups only; operators of the project; scope `backups:export`. Audited as `backup.exported`.
      operationId: exportBackupArchive
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Tar archive
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        '400':
          description: The backup is not available
        '403':
          description: Not an operator of the project
        '404':
          description: Backup not found (or cluster-scoped)
        '413':
          description: Backup larger than `LOADWEAVER_BACKUP_ARCHIVE_MAX_BYTES`
  /backups/{id}/restore-test:
    post:
      summary: Run a restore test of a backup now
      description: Scratch restore on the volume's node and the service's check hook (operators). Scope `plans:apply`.
      operationId: startRestoreTest
      parameters:
        - {
            in: path,
            name: id,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreTest'
  /cluster/members:
    get:
      summary: List cluster members
      description: Cluster roles (3.17) held through membership; global admins are cluster admins without one. Any cluster role, scope `cluster:read`.
      operationId: listClusterMembers
      responses:
        '200':
          description: Members, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClusterMember'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cluster/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      summary: Set a user's cluster role
      description: Immediate (not plan / apply) and audited as `cluster.member.set`. Cluster admins, scope `cluster:admin`.
      operationId: setClusterMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/ClusterRole' }
      responses:
        '204':
          description: Set
        '400':
          description: Invalid user id or role
        '403':
          description: Cluster admin role required
    delete:
      summary: Remove a user's cluster role
      description: Audited as `cluster.member.remove`. Cluster admins, scope `cluster:admin`.
      operationId: removeClusterMember
      responses:
        '204':
          description: Removed (or was no member)
        '403':
          description: Cluster admin role required
  /projects/{project}/members:
    get:
      summary: List project members
      description: Whoever may read the project (members, cluster admins, auditors, infra operators). Scope `projects:read`.
      operationId: listProjectMembers
      parameters:
        - $ref: '#/components/parameters/ProjectName'
      responses:
        '200':
          description: Members, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
        '404':
          description: Unknown project, or not readable by the caller
  /projects/{project}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
      - $ref: '#/components/parameters/UserId'
    put:
      summary: Set a user's project role
      description: |
        Cluster admins and the project's creator assign any role; project admins assign `operator`, `developer` and
        `viewer` and can't change or remove another admin (3.17). Immediate and audited as `project.member.set`.
        Scope `projects:admin`.
      operationId: setProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/ProjectRole' }
      responses:
        '204':
          description: Set
        '400':
          description: Invalid user id or role
        '403':
          description: Project admin role required, or only cluster admins and the creator manage project admins
        '404':
          description: Unknown project
    delete:
      summary: Remove a user from a project
      description: Same rules as setting a role. Audited as `project.member.remove`. Scope `projects:admin`.
      operationId: removeProjectMember
      responses:
        '204':
          description: Removed (or was no member)
        '403':
          description: Project admin role required, or only cluster admins and the creator manage project admins
        '404':
          description: Unknown project
  /projects/{project}/settings:
    parameters:
      - $ref: '#/components/parameters/ProjectName'
    get:
      summary: Project access settings
      description: Whoever may read the project. Scope `projects:read`.
      operationId: getProjectSettings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSettings'
        '404':
          description: Unknown project, or not readable by the caller
    put:
      summary: Change project access settings
      description: Only the given fields change. Project admins (and cluster admins); audited as `project.settings`. Scope `projects:admin`.
      operationId: updateProjectSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approvalMode: { $ref: '#/components/schemas/ApprovalMode' }
                developerExec: { type: boolean }
                recordTerminals: { type: boolean }
      responses:
        '200':
          description: Settings after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSettings'
        '403':
          description: Project admin role required
        '404':
          description: Unknown project
  /projects/{project}/requests:
    get:
      summary: Cross-project requests towards a project
      description: |
        Policies of other projects reaching this project's groups (3.17), from pending plans and applied policies,
        with whether this project accepted exactly that spec. Whoever may read the project. Scope `projects:read`.
      operationId: listProjectRequests
      parameters:
        - $ref: '#/components/parameters/ProjectName'
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrossProjectRequest'
        '404':
          description: Unknown project, or not readable by the caller
  /projects/{project}/acceptances:
    post:
      summary: Accept another project's policy
      description: |
        Accepts a listed request, bound to its exact policy spec (`specHash`); a changed policy needs a new
        acceptance. Operators and admins of the accepting project; audited as `project.policy.accept`.
        Scope `projects:admin`.
      operationId: acceptPolicy
      parameters:
        - $ref: '#/components/parameters/ProjectName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, policy, specHash]
              properties:
                project:
                  {
                    type: string,
                    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$',
                    description: Project owning the policy,
                  }
                policy:
                  {
                    type: string,
                    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$',
                  }
                specHash: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '204':
          description: Accepted
        '403':
          description: Operator or admin role in the accepting project required
        '404':
          description: No such request
  /access/me:
    get:
      summary: The caller's roles
      description: |
        Who the caller is in this cluster (3.17): user id, cluster role and the role in each project they are a member
        of. Used for the console's navigation and `loadweaver whoami`. Anyone authenticated, scope `cluster:read`.
      operationId: getAccessMe
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessMe'
        '403':
          description: Token without the `cluster:read` scope
  /access/export:
    get:
      summary: Export access as YAML
      description: Every cluster member and every project with its settings and members (3.17). Cluster admins, scope `cluster:admin`.
      operationId: exportAccess
      responses:
        '200':
          description: Access document
          content:
            application/yaml:
              schema:
                type: string
        '403':
          description: Cluster admin role required
  /access/import:
    post:
      summary: Import access from YAML
      description: |
        Makes access match the document in one transaction (3.17). `clusterMembers`, when not empty, replace all
        cluster members. Every listed project must exist; its settings are set (missing: `developers`, `false`)
        and its members become exactly `members` (missing: none). Projects not listed stay as they are. Unknown
        keys and YAML aliases are rejected. Audited as `access.import`. Cluster admins, scope `cluster:admin`.
      operationId: importAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string, maxLength: 1048576 }
      responses:
        '200':
          description: Number of memberships added, changed or removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: integer }
        '400':
          description: Invalid document, or a listed project does not exist
        '403':
          description: Cluster admin role required
  /registry/token:
    get:
      summary: Token realm of the built-in registry
      description: |
        Docker token authentication for `docker login` / `push` / `pull` against `/v2` (3.22). Docker sends the
        API key or a personal access token as the Basic password. Repositories live under existing project names and
        access follows the caller's project role there (no cluster role needed): viewers and up pull, developers and
        up push; cluster admins every project, auditors / infra operators pull everywhere; `lw-system/…` never. PATs
        need scope `registry:pull`, push additionally `registry:push`. Repositories (or actions) the caller may not use
        are left out of the token instead of failing. `registry:catalog:*` is granted to cluster roles only. The
        token is an ES256 JWT with an x5c chain to the cluster's registry-token key, valid for 5 minutes.
      operationId: registryToken
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: service
          schema: { type: string, const: loadweaver-registry }
        - in: query
          name: scope
          description: '`repository:<project>/<repository>:pull[,push]`, repeatable'
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  access_token: { type: string }
                  expires_in: { type: integer }
                  issued_at: { type: string, format: date-time }
        '401':
          description: Missing or invalid credentials
        '403':
          description: No project membership and no cluster role, or a PAT without `registry:pull`
  /certificates:
    get:
      summary: Ingress certificates
      description: |
        Certificates of the ingress (3.6): issued by the built-in ACME client for every exposed hostname (renewed
        30 days before expiry, with backoff after failures) or uploaded. Private keys are never returned. Scope
        `cluster:read`.
      operationId: listCertificates
      responses:
        '200':
          description: Certificates
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/CertificateSummary' },
                }
  /certificates/{id}:
    put:
      summary: Upload a certificate
      description: |
        Uploaded certificates take precedence over ACME for the names they cover. The chain and key are validated
        (key matches, not expired); the key is stored encrypted and only reaches ingress nodes at push time.
        Scope `certificates:write`, infra rights.
      operationId: uploadCertificate
      parameters:
        - $ref: '#/components/parameters/CertificateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificatePem, privateKeyPem]
              properties:
                certificatePem:
                  {
                    type: string,
                    maxLength: 65536,
                    description: Leaf first,
                    then intermediates,
                  }
                privateKeyPem: { type: string, maxLength: 16384 }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateSummary' }
        '400':
          description: Invalid certificate or key
    delete:
      summary: Delete an uploaded certificate
      description: ACME-issued certificates are managed by the cluster and can't be deleted. Scope `certificates:write`.
      operationId: deleteCertificate
      parameters:
        - $ref: '#/components/parameters/CertificateId'
      responses:
        '204':
          description: Deleted
        '400':
          description: Not an uploaded certificate
  /dns/zones:
    get:
      summary: State of the managed zones per provider
      description: |
        Last reconciliation per zone and provider (3.15): when, errors, names other owners manage (never changed),
        changes made, and for secondaries how far they are behind the primary (`drift`). Scope `cluster:read`.
      operationId: listDnsZones
      responses:
        '200':
          description: Zone states
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/DnsZoneStatus' },
                }
  /dns/dnssec:
    get:
      summary: DNSSEC state of bind9-hosted zones
      description: |
        Per signed zone (3.15): its keys, whether the parent publishes each key's DS, the DS records the parent
        should publish now (by hand, unless a registrar plugin does it) and the next yearly rollover. Scope
        `cluster:read`.
      operationId: listDnssec
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/DnssecZone' },
                }
  /dns/failover:
    get:
      summary: DNS failover state
      description: |
        Per `DnsFailover` (3.28): endpoint health from the probe votes, the endpoints answered now, a pending manual
        fail-back, latency choices, and whether the last switch reached every authoritative server. Scope
        `cluster:read`.
      operationId: listDnsFailovers
      responses:
        '200':
          description: States
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/DnsFailoverState' },
                }
  /dns/failover/{name}/failback:
    post:
      summary: Confirm a manual fail-back
      description: 'For `failback: manual`: moves the answer back to the primary endpoint once it is healthy again. Scope `cluster:nodes`.'
      operationId: confirmDnsFailback
      parameters:
        - in: path
          name: name
          required: true
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties: { confirmed: { type: boolean, const: true } },
                }
        '404':
          description: No fail-back pending
  /images/scans:
    get:
      summary: Image vulnerability scans
      description: |
        The latest scan per image digest (3.22), as the nodes reported them (Trivy, at most once a day per digest;
        only for images of workloads the reporting node runs). Newest first, at most 500. Scope `cluster:read`.
      operationId: listImageScans
      responses:
        '200':
          description: Scans
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/ImageScan' },
                }
        '403':
          $ref: '#/components/responses/Forbidden'
  /vpn/devices:
    get:
      summary: Remote access devices
      description: |
        The caller's own devices (3.31); with `all=true`, every client (users and machines, at most 5000), which
        needs the `infra` cluster role. Scope `vpn:read`.
      operationId: listVpnDevices
      parameters:
        - in: query
          name: all
          required: false
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/VpnClientSummary' },
                }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Enroll a device
      description: |
        Self-service enrollment of a user device (3.31). The key pair is generated on the device; only the public
        key is sent. The device joins every client group whose `idpGroups` contain one of the caller's roles. Needs
        an interactive login (no API key or personal access token), with a second factor (`amr`) when a group sets
        `requireMfa`. At most 20 active devices and 20 enrollments per day per user. The returned configuration has
        a placeholder for the private key.
      operationId: enrollVpnDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollVpnDeviceDto' }
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnClientConfigResponse' }
        '400':
          description: Invalid name or public key
        '403':
          description: No interactive login, not in any client group, or second factor missing
        '409':
          description: Remote access not configured, device name taken, device or daily enrollment limit reached, key already enrolled or client network full
  /vpn/devices/{id}/config:
    get:
      summary: Device configuration
      description: |
        The device's wg-quick configuration (without the private key), its routes, DNS address and the names it may
        resolve, compiled from the current policies. Empty for expired or revoked devices. Owner or infra rights.
        Scope `vpn:read`.
      operationId: getVpnDeviceConfig
      parameters:
        - $ref: '#/components/parameters/VpnClientId'
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnClientConfigResponse' }
        '404':
          description: Device not found
        '409':
          description: Remote access not configured
  /vpn/devices/{id}/renew:
    post:
      summary: Renew a device
      description: |
        Extends the device's expiry by the shortest `keyLifetimeDays` of its groups, takes the groups from the
        caller's current roles and optionally rotates the public key. Own user devices only; needs an interactive
        login (with a second factor when a group sets `requireMfa`). Machines are renewed with
        `POST /vpn/machines/{id}/renew`.
      operationId: renewVpnDevice
      parameters:
        - $ref: '#/components/parameters/VpnClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewVpnDeviceDto' }
      responses:
        '201':
          description: Renewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnClientSummary' }
        '400':
          description: Invalid public key
        '403':
          description: No interactive login, not in any client group, or second factor missing
        '404':
          description: Device not found or revoked
        '409':
          description: Remote access not configured, or key already enrolled
  /vpn/devices/{id}/posture:
    post:
      summary: Report device posture
      description: |
        Posture report protocol v1 (`postureReportSchema` in util-model): core checks and identifiers reported by the
        device, plus an optional device certificate with a proof of possession (signature over
        `loadweaver-posture-v1:<device id>:<timestamp>` with the certificate's key, timestamp within 5 minutes).
        MDM / EDR results come from the posture integrations' syncs (`/posture/integrations`), not from this call; a
        device reporting new identifiers triggers a sync. Devices failing a group's requirements get its
        `restrictedGroup` instead. Reports older than 24 hours count as missing. A user device reports only for
        itself; infra admins only for machines. Needs an interactive login. `deviceId` and `serialNumber` are pinned
        at the first report: later reports with other values are rejected, and no other valid client may report a
        pinned value.
      operationId: reportVpnPosture
      parameters:
        - $ref: '#/components/parameters/VpnClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostureReportDto' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnClientSummary' }
        '400':
          description: Invalid report, or a `deviceId` / `serialNumber` other than the pinned one
        '404':
          description: Device not found
        '409':
          description: The `deviceId` or `serialNumber` belongs to another enrolled device
  /vpn/devices/{id}/certificate:
    post:
      summary: Issue a device certificate
      description: |
        A device certificate from the cluster CA for the caller's own device (identity
        `spiffe://<cluster>.loadweaver/client/<device id>`), valid until the device key expires; a posture fact
        (`device.certificate.valid`). The key pair is generated on the device (CSR, ECDSA P-256). A new certificate
        supersedes the previous one. Needs an interactive login.
      operationId: issueVpnDeviceCertificate
      parameters:
        - $ref: '#/components/parameters/VpnClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr]
              properties:
                csr:
                  {
                    type: string,
                    maxLength: 8192,
                    description: PEM PKCS#10 certificate request,
                  }
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedDeviceCertificate' }
        '400':
          description: Invalid CSR (signature, key type) or no interactive login
        '404':
          description: Device not found (not yours, revoked or expired)
  /vpn/devices/{id}:
    delete:
      summary: Revoke a device
      description: Takes effect with the next push to the gateways. Owners revoke their own devices, infra admins any client. Scope `vpn:write`.
      operationId: revokeVpnDevice
      parameters:
        - $ref: '#/components/parameters/VpnClientId'
      responses:
        '204':
          description: Revoked (or already revoked)
        '404':
          description: Device not found
  /vpn/machines:
    post:
      summary: Add a machine client
      description: |
        A machine client, optionally with office networks behind it (site-to-site). Subnets must be IPv4 and may not
        overlap the client network, the pod, service and overlay ranges or other machines' subnets. Infra rights.
        Scope `vpn:write`.
      operationId: createVpnMachine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVpnMachineDto' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnClientConfigResponse' }
        '400':
          description: Invalid input, unknown client groups or overlapping subnets
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Remote access not configured, machine name taken, key already enrolled or client network full
  /vpn/machines/{id}/renew:
    post:
      summary: Renew a machine client
      description: |
        Machines have no login to renew with: infra admins extend them. The new expiry is `lifetimeDays` (default
        365) from now. Revoked machines can't be renewed. Scope `vpn:write`.
      operationId: renewVpnMachine
      parameters:
        - $ref: '#/components/parameters/VpnClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewVpnMachineDto' }
      responses:
        '201':
          description: Renewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VpnClientSummary' }
        '400':
          description: Invalid lifetime
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Machine not found or revoked
  /vpn/users/{userId}/revoke:
    post:
      summary: Revoke all devices of a user
      description: Offboarding, e.g. when the identity provider removed the user. Infra rights. Scope `vpn:write`.
      operationId: revokeVpnUser
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, maxLength: 255 }
      responses:
        '201':
          description: Revoked
          content:
            application/json:
              schema:
                { type: object, properties: { revoked: { type: integer } } }
        '403':
          $ref: '#/components/responses/Forbidden'
  /integrations:
    get:
      summary: Env-configured integrations
      description: |
        Read-only status of the integrations configured through the control plane's environment (3.41): SMTP, OTLP,
        GeoIP, releases / update checks, posture sync schedule, master-key KMS, authentication and provider plugins.
        Shows which are active and their non-secret settings (hosts, names, schedules, paths); never passwords,
        tokens, client secrets, user names or file contents. Cluster admins only, scope `cluster:read`.
      operationId: getIntegrationsStatus
      responses:
        '200':
          description: One entry per env integration (`smtp`, `otlp`, `geoip`, `releases`, `postureSync`, `kms`, `auth`, `plugins`)
          content:
            application/json:
              schema:
                type: object
                required: [env]
                properties:
                  env:
                    type: array
                    items: { $ref: '#/components/schemas/IntegrationEnvStatus' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /integrations/test:
    post:
      summary: Test an applied integration
      description: |
        Connection test of the applied configuration with its resolved credentials (3.41): `DnsProvider` (API
        providers list their zones and the zones using them must exist there; bind9: the node group exists and a
        name-server node is connected; axfr: the servers answer the SOA of a zone using them), `BackupTarget` (S3:
        head-bucket and the declared object lock; SFTP: connect with the host key checked and stat the path),
        `IpPool` (`failover: provider`: the provider reports the holders of the pool's addresses) and `SiemTarget`
        (`Cluster.spec.observability.siem[].name`: one event marked as a test is sent). A failing test is
        `200 { ok: false }`; messages are sanitized and never contain credentials or provider response bodies.
        Bounded by 10 s, audited as `integration.test`, rate-limited (10 per minute). Access: the write rule of the
        resource: infra operators and cluster admins for `DnsProvider` / `BackupTarget` / `IpPool` (PAT scopes
        `cluster:read` + `cluster:nodes`), cluster admins for `SiemTarget` (`cluster:read` + `cluster:admin`).
        Denials come before not-found.
      operationId: testIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind:
                  {
                    type: string,
                    enum: [DnsProvider, BackupTarget, IpPool, SiemTarget],
                  }
                name:
                  {
                    type: string,
                    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$',
                  }
      responses:
        '200':
          description: Test result (also when the test failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationTestResult' }
        '400':
          description: Invalid body, or an `IpPool` without a failover-IP provider
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such resource / SIEM target
        '429':
          description: Too many tests
  /posture/plugins:
    get:
      summary: List posture plugins
      description: Built-in (Intune, Jamf Pro, Kandji, Defender for Endpoint, CrowdStrike Falcon, SentinelOne) and `DYNAMIC_POSTURE_PLUGINS`, with their configuration fields. Scope `cluster:read`.
      operationId: listPosturePlugins
      responses:
        '200':
          description: Plugins
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/PosturePluginInfo' },
                }
  /posture/integrations:
    get:
      summary: List posture integrations
      description: MDM / EDR integrations with their sync state. Secret fields are never returned (`secretsSet` names them). Infra operators and cluster admins; scope `cluster:read`.
      operationId: listPostureIntegrations
      responses:
        '200':
          description: Integrations
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/PostureIntegration' },
                }
    post:
      summary: Create a posture integration
      description: Validates the configuration with the plugin (HTTPS, allowed hosts, formats) and stores it encrypted. The first sync runs with the next coordinator round. Cluster admins; scope `cluster:admin`.
      operationId: createPostureIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostureIntegrationInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostureIntegration' }
        '400':
          description: Unknown plugin, invalid name or configuration
        '409':
          description: Name taken, or 16 integrations exist
  /posture/integrations/test:
    post:
      summary: Test an unsaved configuration
      description: Authenticates and reads one page. The message never contains credentials. Scope `cluster:admin`.
      operationId: testUnsavedPostureIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, config]
              properties:
                type: { type: string }
                config: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostureTestResult' }
  /posture/integrations/{id}:
    patch:
      summary: Change a posture integration
      description: Name and type are fixed. Omitted secret fields keep their stored value, an empty string clears a field. New configuration or matching resets the failure streak and syncs soon. Scope `cluster:admin`.
      operationId: updatePostureIntegration
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostureIntegrationInput' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostureIntegration' }
        '404':
          description: Not found
    delete:
      summary: Delete a posture integration
      description: Removes the integration and its results from every device; devices re-evaluate at once (conditions on it fail closed). Scope `cluster:admin`.
      operationId: deletePostureIntegration
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '204':
          description: Deleted
  /posture/integrations/{id}/test:
    post:
      summary: Test a saved integration
      operationId: testPostureIntegration
      description: Scope `cluster:admin`.
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostureTestResult' }
  /posture/integrations/{id}/sync:
    post:
      summary: Sync now
      description: Enqueues a sync (deduplicated per minute). Scope `cluster:admin`.
      operationId: syncPostureIntegration
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '202':
          description: Enqueued
  /posture/certificates:
    get:
      summary: Device certificate trust
      description: Company CA bundle and CRLs, whether the cluster CA's device certificates count, and whether reports must prove possession. Scope `cluster:read`.
      operationId: getPostureCertificateTrust
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateTrustSettings' }
    put:
      summary: Change device certificate trust
      description: The bundle may only contain CA certificates (≤ 64, ≤ 256 KiB); `null` clears. Scope `cluster:admin`.
      operationId: updatePostureCertificateTrust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                companyCaPem: { type: [string, 'null'] }
                crlPem: { type: [string, 'null'] }
                trustClusterCa: { type: boolean }
                requireProof: { type: boolean }
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateTrustSettings' }
        '400':
          description: Not a CA certificate, expired, or invalid CRL
  /trusted-fleets:
    get:
      summary: Trusted fleets
      description: |
        The fleets whose signed identity claims this cluster accepts (3.24), with their Ed25519 public keys and
        fingerprints. Cluster admins only, never through a fleet (403 for PATs with `fleet:on-behalf-of`); scope
        `cluster:admin`.
      operationId: listTrustedFleets
      responses:
        '200':
          description: Trusted fleets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrustedFleet' }
        '403':
          description: Not a cluster admin, or called through a fleet
  /trusted-fleets/{issuer}:
    parameters:
      - name: issuer
        in: path
        required: true
        description: The fleet's issuer id (shown by the fleet next to its keys)
        schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
    put:
      summary: Trust a fleet (or change its keys)
      description: |
        Creates or replaces a trusted fleet: a name and 1–3 Ed25519 public keys (SPKI PEM) by `kid`, so the fleet can
        rotate (register the next key, the fleet activates it, remove the old one). Audited as `fleet.trust.create` /
        `fleet.trust.update` with the key fingerprints. Cluster admins only, natively; scope `cluster:admin`.
      operationId: putTrustedFleet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrustedFleetInput' }
      responses:
        '200':
          description: The trusted fleet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrustedFleet' }
        '400':
          description: Invalid issuer, name, key id or key (not Ed25519), duplicate key ids, more than 3 keys
        '403':
          description: Not a cluster admin, or called through a fleet
    delete:
      summary: Stop trusting a fleet
      description: Audited as `fleet.trust.delete`. Cluster admins only, natively; scope `cluster:admin`.
      operationId: deleteTrustedFleet
      responses:
        '204':
          description: Removed
        '403':
          description: Not a cluster admin, or called through a fleet
        '404':
          description: Not a trusted fleet
  /fleet-identity:
    get:
      summary: Fleet identity feature detection
      description: |
        For fleets (3.24): the claim protocol `version`, this cluster's `clusterId` (the claims' audience) and whether
        the request's own `X-Loadweaver-Fleet-Identity` claim verified (`verified`, `issuer`, `person`, else
        `reason`). No nonce is used up. Older clusters answer 404 — the fleet keeps approvals native for them. Scope
        `cluster:read`.
      operationId: getFleetIdentityStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetIdentityStatus' }
  /vpn/sessions:
    get:
      summary: Active remote access sessions
      description: Active clients with a handshake on the active gateway in the last 3 minutes. Needs the `infra` cluster role. Scope `cluster:read`.
      operationId: listVpnSessions
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                {
                  type: array,
                  items: { $ref: '#/components/schemas/VpnClientSummary' },
                }
        '403':
          $ref: '#/components/responses/Forbidden'
  /logs:
    get:
      summary: Query logs
      description: |
        One page of log lines (3.14), newest first by default. Scoped by access: cluster admins and auditors see
        everything, infra operators platform lines (without a project) and their projects, project members their
        projects. `from` / `to` default to the hour before now. Page with `cursor`; `after` is the position after
        the last line (pass it as `cursor` with `order=asc` to get only newer lines). Scope `logs:read`.
      operationId: queryLogs
      parameters:
        - $ref: '#/components/parameters/LogFrom'
        - $ref: '#/components/parameters/LogTo'
        - $ref: '#/components/parameters/LogSources'
        - $ref: '#/components/parameters/LogLevels'
        - $ref: '#/components/parameters/LogProject'
        - $ref: '#/components/parameters/LogDeployment'
        - $ref: '#/components/parameters/LogService'
        - $ref: '#/components/parameters/LogReplica'
        - $ref: '#/components/parameters/LogNode'
        - $ref: '#/components/parameters/LogPolicy'
        - $ref: '#/components/parameters/LogText'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: desc }
        - in: query
          name: cursor
          description: '`cursor` or `after` of a previous page, with the same filter'
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '400':
          description: Invalid parameter, time range or cursor
        '403':
          description: Token without the `logs:read` scope
        '404':
          description: The `project` is not visible to the caller, or the caller sees no logs at all
  /logs/export:
    get:
      summary: Export logs
      description: |
        Every line matching the filter (same scoping as `GET /logs`), oldest first, at most 50,000 lines.
        `ndjson`: one `LogLine` per line. `csv`: header `at,source,level,node,project,deployment,service,replica,policy,message`,
        every value quoted. `limit`, `cursor` and `order` are accepted but don't apply. Scope `logs:read`.
      operationId: exportLogs
      parameters:
        - $ref: '#/components/parameters/LogFrom'
        - $ref: '#/components/parameters/LogTo'
        - $ref: '#/components/parameters/LogSources'
        - $ref: '#/components/parameters/LogLevels'
        - $ref: '#/components/parameters/LogProject'
        - $ref: '#/components/parameters/LogDeployment'
        - $ref: '#/components/parameters/LogService'
        - $ref: '#/components/parameters/LogReplica'
        - $ref: '#/components/parameters/LogNode'
        - $ref: '#/components/parameters/LogPolicy'
        - $ref: '#/components/parameters/LogText'
        - in: query
          name: format
          schema: { type: string, enum: [ndjson, csv], default: ndjson }
      responses:
        '200':
          description: NDJSON or CSV (sent as `text/plain`)
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid parameter or time range
        '403':
          description: Token without the `logs:read` scope
        '404':
          description: The `project` is not visible to the caller, or the caller sees no logs at all
  /metrics/names:
    get:
      summary: Metric names
      description: Names of the metrics with samples in the last hour the caller can read. Scope `metrics:read`.
      operationId: listMetricNames
      responses:
        '200':
          description: Metric names, sorted
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /metrics/query:
    get:
      summary: Query a metric
      description: |
        The series of one metric over a range (3.18), at the resolution the length of the range calls for: raw 10 s
        samples up to 6 hours, 1-minute roll-ups up to 7 days, hourly roll-ups beyond. At most 200 series. Scoped by
        access: cluster roles see everything, project members the `replica.*` samples of their projects (node,
        network, WireGuard and ingress metrics carry no project). Scope `metrics:read`.
      operationId: queryMetrics
      parameters:
        - $ref: '#/components/parameters/MetricName'
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
        - $ref: '#/components/parameters/MetricEntity'
        - $ref: '#/components/parameters/MetricNode'
        - $ref: '#/components/parameters/MetricProject'
        - $ref: '#/components/parameters/MetricGroupBy'
        - $ref: '#/components/parameters/MetricAggregation'
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricQueryResult'
        '400':
          description: Invalid parameter or time range
        '403':
          description: Token without the `metrics:read` scope
        '404':
          description: The `project` is not visible to the caller, or the caller sees no project at all
  /metrics/export:
    get:
      summary: Export a metric
      description: |
        The result of `GET /metrics/query` (same parameters and scoping). `csv`: header `series,time,value`, the series
        key quoted. `json`: the `MetricQueryResult`. Sent as `text/plain`. Scope `metrics:read`.
      operationId: exportMetrics
      parameters:
        - $ref: '#/components/parameters/MetricName'
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
        - $ref: '#/components/parameters/MetricEntity'
        - $ref: '#/components/parameters/MetricNode'
        - $ref: '#/components/parameters/MetricProject'
        - $ref: '#/components/parameters/MetricGroupBy'
        - $ref: '#/components/parameters/MetricAggregation'
        - in: query
          name: format
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        '200':
          description: CSV or JSON (sent as `text/plain`)
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid parameter or time range
        '403':
          description: Token without the `metrics:read` scope
        '404':
          description: The `project` is not visible to the caller, or the caller sees no project at all
  /metrics/prometheus:
    get:
      summary: Prometheus scrape target
      description: |
        The newest sample of every series from the last 2 minutes in the Prometheus text format 0.0.4 (3.18): every
        metric a gauge `loadweaver_<metric>` (`.` → `_`) with labels `node`, `entity` and `project` (when set) and
        the sample's timestamp. At most 50,000 series. Scoped like `GET /metrics/query`. Use a PAT with
        `metrics:read` as bearer token. Scope `metrics:read`.
      operationId: scrapePrometheus
      parameters:
        - $ref: '#/components/parameters/MetricProject'
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid parameter
        '403':
          description: Token without the `metrics:read` scope
        '404':
          description: The `project` is not visible to the caller, or the caller sees no project at all
  /metrics/flows:
    get:
      summary: Top flows
      description: |
        Traffic decisions per policy edge over a range (3.18), summed and ordered by packets. Raw 10 s flows up to
        7 days, hourly roll-ups beyond. Denied flows (from the firewall log) have an empty `policy`. Cluster roles only.
        Scope `metrics:read`.
      operationId: listFlows
      parameters:
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
        - in: query
          name: decision
          schema: { type: string, enum: [allowed, denied, observed] }
        - $ref: '#/components/parameters/MetricNode'
        - in: query
          name: policy
          description: Exact policy
          schema: { type: string, maxLength: 255 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: Flows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Flow' }
        '400':
          description: Invalid parameter or time range
        '403':
          description: Token without the `metrics:read` scope
        '404':
          description: The caller has no cluster role
  /metrics/events:
    get:
      summary: Event markers
      description: |
        Markers for graphs (3.18), newest first: today plan events, once per touched project. `from` defaults to
        the day before `to`. Cluster roles see every event, project members the events of their projects.
        Scope `metrics:read`.
      operationId: listMetricEvents
      parameters:
        - $ref: '#/components/parameters/MetricFrom'
        - $ref: '#/components/parameters/MetricTo'
        - in: query
          name: kind
          schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$' }
        - $ref: '#/components/parameters/MetricProject'
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricEvent' }
        '400':
          description: Invalid parameter
        '403':
          description: Token without the `metrics:read` scope
        '404':
          description: The `project` is not visible to the caller
  /usage:
    get:
      summary: Usage of all projects
      description: |
        Usage metering (3.24): per project and meter, buckets of an hour, day or month (UTC) in `[from, to)`. Hourly
        buckets are the billing record; they are recomputed until they are **final** (15 minutes after the hour) and
        never change afterwards. Days / months are final once all their hours are and they have ended. Hourly rows
        carry an `idempotencyKey` (`loadweaver:<cluster>:<project>:<meter>:<hour>`) and the Decabill subscription the
        project was mapped to (`spec.billing.decabillSubscriptionId`) when the bucket was computed. Cluster roles only
        (cluster admins, infra operators, auditors); Decabill's Loadweaver usage module reads
        `?billingSubscription=<id>&granularity=hour&finalOnly=true` with an auditor's PAT. Scope `usage:read`.
      operationId: getClusterUsage
      parameters:
        - $ref: '#/components/parameters/UsageFrom'
        - $ref: '#/components/parameters/UsageTo'
        - $ref: '#/components/parameters/UsageGranularity'
        - $ref: '#/components/parameters/UsageMeter'
        - $ref: '#/components/parameters/UsageFinalOnly'
        - in: query
          name: project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        - in: query
          name: billingSubscription
          description: Only buckets of projects mapped to this Decabill subscription.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageReport' }
        '400':
          description: Invalid parameter, or the range is too long for the granularity (hour 93, day 400, month 800 days)
        '403':
          description: Token without the `usage:read` scope, or the caller has no cluster role
  /usage/export:
    get:
      summary: Export the usage of all projects as CSV
      description: |
        `GET /usage` (same parameters and scoping) as CSV: header
        `project,bucket,granularity,meter,unit,value,final,idempotency_key`. Scope `usage:read`.
      operationId: exportClusterUsage
      parameters:
        - $ref: '#/components/parameters/UsageFrom'
        - $ref: '#/components/parameters/UsageTo'
        - $ref: '#/components/parameters/UsageGranularity'
        - $ref: '#/components/parameters/UsageMeter'
        - $ref: '#/components/parameters/UsageFinalOnly'
        - in: query
          name: project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        - in: query
          name: billingSubscription
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        '400':
          description: Invalid parameter or range
        '403':
          description: Token without the `usage:read` scope, or the caller has no cluster role
  /projects/{project}/usage:
    parameters:
      - in: path
        name: project
        required: true
        schema: { type: string }
    get:
      summary: Usage of a project
      description: |
        `GET /usage` for one project: everyone who may read the project (members, auditors, infra operators, cluster
        admins). Scope `usage:read`.
      operationId: getProjectUsage
      parameters:
        - $ref: '#/components/parameters/UsageFrom'
        - $ref: '#/components/parameters/UsageTo'
        - $ref: '#/components/parameters/UsageGranularity'
        - $ref: '#/components/parameters/UsageMeter'
        - $ref: '#/components/parameters/UsageFinalOnly'
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageReport' }
        '400':
          description: Invalid parameter or range
        '403':
          description: Token without the `usage:read` scope
        '404':
          description: Project not visible to the caller
  /projects/{project}/usage/export:
    parameters:
      - in: path
        name: project
        required: true
        schema: { type: string }
    get:
      summary: Export the usage of a project as CSV
      description: '`GET /projects/{project}/usage` as CSV (columns as `GET /usage/export`). Scope `usage:read`.'
      operationId: exportProjectUsage
      parameters:
        - $ref: '#/components/parameters/UsageFrom'
        - $ref: '#/components/parameters/UsageTo'
        - $ref: '#/components/parameters/UsageGranularity'
        - $ref: '#/components/parameters/UsageMeter'
        - $ref: '#/components/parameters/UsageFinalOnly'
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        '400':
          description: Invalid parameter or range
        '403':
          description: Token without the `usage:read` scope
        '404':
          description: Project not visible to the caller
  /alerts:
    get:
      summary: List alerts
      description: |
        Alerts (3.18), newest first. Cluster alerts (without a project) for cluster roles; project alerts also for
        everyone who may read the project. Scope `alerts:read`.
      operationId: listAlerts
      parameters:
        - in: query
          name: state
          description: '`open`: pending and firing'
          schema: { type: string, enum: [open, resolved, all], default: open }
        - in: query
          name: project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
        '400':
          description: Invalid parameter
        '403':
          description: Token without the `alerts:read` scope
        '404':
          description: The `project` is not visible to the caller
  /alerts/export:
    get:
      summary: Export alerts
      description: |
        The alert list (same filters and scoping as `GET /alerts`, but `state` defaults to `all` and `limit` to
        1,000) as an attachment. `csv`: header
        `id,rule,key,project,severity,state,title,value,startedAt,firedAt,resolvedAt,acknowledgedBy`, text quoted and
        cells that start like a formula prefixed with `'`. `json`: an array of `Alert`. Scope `alerts:read`.
      operationId: exportAlerts
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [open, resolved, all], default: all }
        - in: query
          name: project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
        - in: query
          name: format
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        '200':
          description: 'CSV or JSON (sent as `text/plain`, `Content-Disposition: attachment`)'
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid parameter
        '403':
          description: Token without the `alerts:read` scope
        '404':
          description: The `project` is not visible to the caller
  /alerts/{id}:
    get:
      summary: Get an alert
      description: One alert (any state), if the caller may read it. Scope `alerts:read`.
      operationId: getAlert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: The alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '404':
          description: Alert not found or not visible
  /alerts/{id}/acknowledge:
    post:
      summary: Acknowledge an alert
      description: |
        Stops repeats and escalation of a firing alert until it resolves; audited, published as `alert.acknowledged`.
        Acknowledging twice returns the alert unchanged. Project operators and admins for project alerts, cluster
        admins and infra operators for every alert. Scope `alerts:write`.
      operationId: acknowledgeAlert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: The acknowledged alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          description: The alert is not firing
        '403':
          description: Missing operator role, or token without the `alerts:write` scope
        '404':
          description: Alert not found or not visible
  /alerts/silences:
    get:
      summary: List silences
      description: |
        Active and upcoming silences, newest start first (at most 1,000). Silences without a project for cluster
        roles; project silences also for everyone who may read the project. Scope `alerts:read`.
      operationId: listAlertSilences
      parameters:
        - in: query
          name: expired
          description: Include silences that ended
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Silences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertSilence' }
        '403':
          description: Token without the `alerts:read` scope
    post:
      summary: Create a silence
      description: |
        Keeps matching alerts quiet (nothing sent, repeated or escalated) between `startsAt` and `endsAt`, at most
        30 days ahead. Needs at least one of `rule`, `project`, `key`; every field set has to match. Audited. Project
        operators and admins for silences of their project (with `project`), cluster admins and infra operators for
        any. Scope `alerts:write`.
      operationId: createAlertSilence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertSilence'
      responses:
        '201':
          description: The silence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSilence'
        '400':
          description: No matcher, invalid time range or longer than 30 days
        '403':
          description: Missing operator role, or token without the `alerts:write` scope
        '404':
          description: The `project` is not visible to the caller
  /alerts/silences/{id}:
    delete:
      summary: End a silence
      description: Ends the silence now; it stays as history. Audited. Same roles as creating it. Scope `alerts:write`.
      operationId: endAlertSilence
      parameters:
        - $ref: '#/components/parameters/AlertSilenceId'
      responses:
        '204':
          description: Ended
        '403':
          description: Missing operator role, or token without the `alerts:write` scope
        '404':
          description: Silence not found or not visible
  /dashboards/query:
    post:
      summary: Run a dashboard widget query
      description: |
        Runs one query-builder query (3.18) over metrics, flows or logs within the global filter, through the same
        scoped services as `GET /metrics/query`, `GET /metrics/flows` (cluster roles only) and `GET /logs`. Dashboards
        themselves are `Dashboard` resources. Scope `metrics:read`.
      operationId: runDashboardQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardQueryRequest'
      responses:
        '200':
          description: Series, flows or log lines, by `kind`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardQueryResult'
        '400':
          description: Invalid query or time range
        '403':
          description: Token without the `metrics:read` scope
        '404':
          description: The `project` is not visible to the caller, the caller sees no data of that kind, or a flows query without a cluster role
  /grafana:
    get:
      summary: Grafana data source test
      description: |
        Connection test of the Grafana-compatible data source (SimpleJSON / JSON API protocol, 3.18). Point Grafana at
        `/api/grafana` with a PAT (`metrics:read`) as bearer token; it sees what the token's owner may read.
      operationId: grafanaHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '403':
          description: Token without the `metrics:read` scope
  /grafana/search:
    post:
      summary: Grafana metric names
      description: Metric names with samples in the last hour that the caller can read (up to 1,000). The request body is ignored. Scope `metrics:read`.
      operationId: grafanaSearch
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Metric names
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '403':
          description: Token without the `metrics:read` scope
  /grafana/query:
    post:
      summary: Grafana time series
      description: |
        One time series per target and group, datapoints as `[value, epoch ms]`. A series is named
        `<metric> <group key>`, or `<metric>` for a single ungrouped series. Scoped like `GET /metrics/query`.
        Scope `metrics:read`.
      operationId: grafanaQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrafanaQueryRequest'
      responses:
        '200':
          description: Time series
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [target, datapoints]
                  properties:
                    target: { type: string }
                    datapoints:
                      type: array
                      items:
                        type: array
                        prefixItems:
                          - { type: number, description: Value }
                          - { type: integer, description: Epoch milliseconds }
        '400':
          description: Invalid query or time range
        '403':
          description: Token without the `metrics:read` scope
        '404':
          description: A `payload.project` the caller can't see, or the caller sees no project at all
  /grafana/annotations:
    post:
      summary: Grafana annotations
      description: Event markers (`GET /metrics/events`) in the range, newest first, up to 500. Scope `metrics:read`.
      operationId: grafanaAnnotations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [range]
              properties:
                range:
                  type: object
                  required: [from, to]
                  properties:
                    from: { type: string, format: date-time }
                    to: { type: string, format: date-time }
      responses:
        '200':
          description: Annotations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [time, title, text, tags]
                  properties:
                    time: { type: integer, description: Epoch milliseconds }
                    title: { type: string, description: The event kind }
                    text: { type: string }
                    tags:
                      type: array
                      items: { type: string }
                      description: The kind and, if any, the project
        '400':
          description: Invalid body
        '403':
          description: Token without the `metrics:read` scope
  /overview:
    get:
      summary: Cluster overview
      description: |
        The overview (3.25): health headline (worst root with its first reason), needs-attention inbox (critical
        first, then oldest; at most 100, each with the console route where it is resolved), summary bar and the newest
        20 events. Project members get the same layout for their projects without infrastructure numbers (sites,
        nodes, capacity, traffic and denies empty). Scope `cluster:read`.
      operationId: getOverview
      parameters:
        - in: query
          name: project
          description: Only this project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '403':
          description: Token without the `cluster:read` scope
        '404':
          description: The `project` is not visible, or the caller has no cluster role and no project
  /health/tree:
    get:
      summary: Explained health tree
      description: |
        Stored health entities (evaluated every 30 s): cluster → site → node for cluster roles, project →
        deployment → service → replica (+ volumes) for readers of the project, each with state, reasons and the time
        it entered the state. `/health` itself is the liveness check. Scope `cluster:read`.
      operationId: getHealthTree
      parameters:
        - in: query
          name: project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        - in: query
          name: root
          description: 'An entity key (`cluster`, `site/fra`, `project/shop`, `deployment/shop/web`, …): it and its descendants'
          schema: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Health entities, ordered by key (depth-first from `root`)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HealthEntity' }
        '403':
          description: Token without the `cluster:read` scope
        '404':
          description: The `project` or `root` is not visible
  /health/history:
    get:
      summary: Health history of an entity
      description: |
        State changes of one entity in a range and the time spent in each state, in milliseconds (3.25). Scope
        `cluster:read`.
      operationId: getHealthHistory
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string, maxLength: 300 }
        - in: query
          name: from
          description: Default 30 days before `to`
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: Default now
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Changes and durations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthHistory'
        '400':
          description: Invalid time range
        '403':
          description: Token without the `cluster:read` scope
        '404':
          description: Entity not visible
  /topology:
    get:
      summary: Topology map
      description: |
        The map (3.9): sites ⊃ nodes ⊃ replicas, workload groups with their members, policy edges between groups and
        the outside world, WireGuard tunnels, volume copies, hostnames and the replicas behind them, public addresses
        and their holders. Built from the desired state and the live state on every request. Scoped by access:
        cluster roles see everything; project members see the replicas, groups, volumes and policy edges of the
        projects they may read (replicas without their node parent), plus the hostnames and outside peers connected
        to them — no sites, nodes, tunnels or public addresses.
        With `flows=true`, flow edges (layer `policies`) of the minute before `at` (default now) are added, from the
        raw flows; beyond 30 days the hourly roll-up of the hour containing `at` is used. Endpoints resolve to
        replicas, or stay outside peers (`external:<address>`).
        With `plan`, the answer carries `overlay`: which elements and edges the plan creates, updates or deletes
        (groups, policy edges, deployments' replicas and volumes, virtual machines' replica and disks, DNS records'
        hostnames, nodes, sites); policies the plan creates or changes add their proposed edges
        (`data.proposed: true`). Scope `cluster:read`.
      operationId: getTopology
      parameters:
        - in: query
          name: at
          description: ISO 8601 time for the flow timeline (default now)
          schema: { type: string, format: date-time }
        - in: query
          name: plan
          description: Id of a plan to overlay
          schema: { type: string, format: uuid }
        - in: query
          name: flows
          description: Add flow edges
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        '400':
          description: Invalid `at`, `plan` or `flows`
        '403':
          description: Token without the `cluster:read` scope
        '404':
          description: The plan doesn't exist or isn't visible to the caller
  /topology/preview:
    post:
      summary: Map with a dry-run plan overlay
      description: |
        Same body as `POST /plans`; the plan is built as a dry run (nothing stored, no events, 3.36) and the map
        is returned with its `overlay` plus the plan preview in `plan` (diff, workload changes, failure analysis,
        risk, warnings). Scope `plans:create`.
      operationId: previewTopology
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanDto'
      responses:
        '200':
          description: Map with overlay and the dry-run plan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Topology'
                  - type: object
                    properties:
                      plan: { $ref: '#/components/schemas/PlanResponseDto' }
        '400':
          description: Invalid resources or nothing to plan
        '403':
          description: Missing scope or project / cluster rights for the changes
  /drafts:
    post:
      summary: Create a Workspace draft
      description: |
        A shared, server-side draft of resource changes (3.36): ops upsert a resource (one YAML document) or delete
        one; each op records the resource generation it was based on. Visible and editable to its owner and to
        everyone with developer (or higher) on every touched project plus the cluster permission cluster-level
        kinds need. Audited (`draft.create`). Scope `plans:create`.
      operationId: createDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                ops:
                  {
                    type: array,
                    maxItems: 500,
                    items: { $ref: '#/components/schemas/DraftOpInput' },
                  }
      responses:
        '201':
          description: Draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '400':
          description: Invalid op / resource, limits (500 ops, 2 MiB, 100 open drafts per owner)
        '403':
          description: No developer role / cluster permission for a touched resource
    get:
      summary: List drafts the caller may see
      operationId: listDrafts
      parameters:
        - in: query
          name: status
          schema:
            { type: string, enum: [open, submitted, discarded], default: open }
      responses:
        '200':
          description: Drafts, newest change first
          content:
            application/json:
              schema:
                { type: array, items: { $ref: '#/components/schemas/Draft' } }
  /drafts/{id}:
    get:
      summary: Get a draft
      operationId: getDraft
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '404':
          description: Unknown or not visible
    patch:
      summary: Change a draft
      description: |
        Optimistic concurrency: the version the change is based on comes from `If-Match` or `version`. `set` ops
        replace the op of the same resource key, `remove` drops ops by key (`Kind/project/name`, empty project for
        cluster-level kinds). Audited (`draft.update`). Scope `plans:create`.
      operationId: patchDraft
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - in: header
          name: If-Match
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer, minimum: 1 }
                title: { type: string, minLength: 1, maxLength: 200 }
                set:
                  {
                    type: array,
                    maxItems: 500,
                    items: { $ref: '#/components/schemas/DraftOpInput' },
                  }
                remove: { type: array, maxItems: 500, items: { type: string } }
      responses:
        '200':
          description: Draft (new version)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '400':
          description: Missing version, invalid op, limits
        '404':
          description: Unknown or not visible
        '409':
          description: Version mismatch (body `draft` = the current draft) or the draft isn't open
  /drafts/{id}/preview:
    post:
      summary: Dry-run preview of a draft
      description: |
        Builds the draft's plan as a dry run (nothing stored, no events) and returns it with the map overlay and
        the conflicting ops (base generation no longer current). Scope `plans:create`.
      operationId: previewDraft
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  plan: { $ref: '#/components/schemas/PlanResponseDto' }
                  topology: { $ref: '#/components/schemas/Topology' }
                  conflicts:
                    {
                      type: array,
                      items: { $ref: '#/components/schemas/DraftConflict' },
                    }
        '404':
          description: Unknown or not visible
        '409':
          description: The draft isn't open
  /drafts/{id}/submit:
    post:
      summary: Submit a draft as a plan
      description: |
        Creates an ordinary pending plan from the draft (approvals, Git PR mode and fleet claims as for any plan;
        `source.draft` names the draft) and marks the draft submitted. Audited (`draft.submit`). Scope
        `plans:create`.
      operationId: submitDraft
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - in: header
          name: If-Match
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanResponseDto' }
        '400':
          description: Missing version, nothing to plan, invalid resources
        '404':
          description: Unknown or not visible
        '409':
          description: Version mismatch, not open, or `conflicts` (ops based on an outdated generation)
  /drafts/{id}/discard:
    post:
      summary: Discard a draft
      description: Anyone who may edit the draft may discard it. Audited (`draft.discard`). Scope `plans:create`.
      operationId: discardDraft
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - in: header
          name: If-Match
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Draft (discarded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '409':
          description: Version mismatch or not open
  /topology/trace:
    get:
      summary: Path trace for a hostname
      description: |
        The path of a hostname (3.9): the hostname, the public ingress addresses and the nodes holding them (cluster
        roles only), the replicas behind the hostname (with their node for cluster roles) and the volumes of their
        deployments. Project members only see the replicas and volumes of projects they may read; a hostname with
        none of them answers `404`. Scope `cluster:read`.
      operationId: traceTopology
      parameters:
        - in: query
          name: host
          required: true
          schema: { type: string, maxLength: 253, pattern: '^[A-Za-z0-9.-]+$' }
      responses:
        '200':
          description: Steps, in path order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyTrace'
        '400':
          description: Invalid hostname
        '403':
          description: Token without the `cluster:read` scope
        '404':
          description: Unknown hostname, or none of its replicas is visible to the caller
  /slos:
    get:
      summary: List SLOs
      description: |
        SLOs of exposed services (`x-loadweaver.slo`, 3.25) measured at the ingress: SLI, error budget use, 1 h burn
        rate and monthly uptime per objective. Computed at most once a minute; services of projects the caller may
        read. Scope `metrics:read`.
      operationId: listSlos
      parameters:
        - in: query
          name: project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
      responses:
        '200':
          description: SLOs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slo' }
        '403':
          description: Token without the `metrics:read` scope
        '404':
          description: The `project` is not visible to the caller
  /autoscaling:
    get:
      summary: List autoscaled services
      description: |
        Horizontal autoscaling (3.23): every service with `x-loadweaver.autoscale` the caller may read, with its range,
        metric and target, the replicas placed now and the count plans use, the autoscaler's last evaluation (value,
        recommendation, reason, why a scale-up is blocked: project quota, cluster capacity, N+1 reserve or `max`) and
        the last scaling action. Scaling itself is automatic (every 15 s, leader-elected), audited as
        `workload.autoscaled` and recorded as `autoscale` events. Scope `projects:read`.
      operationId: listAutoscaling
      parameters:
        - in: query
          name: project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
      responses:
        '200':
          description: Autoscaled services
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutoscaledService' }
        '403':
          description: Token without the `projects:read` scope
        '404':
          description: The `project` is not visible to the caller
  /public/status/:
    get:
      summary: Public status page (HTML)
      description: |
        The `StatusPage` whose `host` matches the request's `Host` header (3.25), reached through the ingress for the
        page's hostname (`/` is rewritten to this path). No login. Listed services' public state, monthly uptime and
        incidents (open, or resolved within 14 days) — no reasons, nodes or authors. Cached for 30 s; refreshes every
        60 s; CSP `default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'`.
      operationId: getPublicStatusPage
      security: []
      parameters:
        - $ref: '#/components/parameters/StatusPageHost'
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema: { type: string }
        '404':
          description: No status page for this hostname
  /public/status/status.json:
    get:
      summary: Public status page (JSON)
      description: The same as `GET /public/status/`, as JSON. No login; cached for 30 s.
      operationId: getPublicStatus
      security: []
      parameters:
        - $ref: '#/components/parameters/StatusPageHost'
      responses:
        '200':
          description: Public status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatus'
        '404':
          description: No status page for this hostname
  /projects/{project}/incidents:
    get:
      summary: List incidents
      description: Incident notes of a project, newest first (at most 200), for everyone who may read it. Scope `projects:read`.
      operationId: listIncidents
      parameters:
        - $ref: '#/components/parameters/ProjectName'
      responses:
        '200':
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }
        '403':
          description: Token without the `projects:read` scope
        '404':
          description: Project not visible
    post:
      summary: Open an incident
      description: |
        Creates an incident with its first update; shown on the project's status pages. Project operators and admins;
        audited. Scope `projects:admin`.
      operationId: createIncident
      parameters:
        - $ref: '#/components/parameters/ProjectName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncident'
      responses:
        '201':
          description: The incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          description: Invalid body
        '403':
          description: Missing operator role, or token without the `projects:admin` scope
        '404':
          description: Project not visible
  /projects/{project}/incidents/{id}:
    put:
      summary: Update an incident
      description: |
        Appends an update (status and note; at most 100 per incident). `resolved` sets the resolution time, any other
        status reopens it. Project operators and admins; audited. Scope `projects:admin`.
      operationId: updateIncident
      parameters:
        - $ref: '#/components/parameters/ProjectName'
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncident'
      responses:
        '200':
          description: The incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          description: Invalid body, or 100 updates reached
        '403':
          description: Missing operator role, or token without the `projects:admin` scope
        '404':
          description: Project or incident not found
  /search:
    get:
      summary: Global search and command palette
      description: |
        Prefix search over every entity (resources, services with their hostnames, nodes, the newest 500 plans, open
        alerts; never spec contents), scoped by access: project documents for readers of the project, cluster-level
        ones for cluster roles. Favourites first, then recently visited, then relevance. `actions` are the
        command-palette actions matching the query that the caller may do. Scope `cluster:read`.
      operationId: search
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Results and actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Empty or invalid query
        '403':
          description: Token without the `cluster:read` scope
  /search/favorites:
    get:
      summary: List favourites
      description: The caller's favourite search items (document ids). Scope `cluster:read`.
      operationId: listSearchFavorites
      responses:
        '200':
          description: Item ids
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '403':
          description: Token without the `cluster:read` scope
  /search/favorites/{item}:
    parameters:
      - $ref: '#/components/parameters/SearchItem'
    put:
      summary: Add a favourite
      description: Scope `cluster:read`.
      operationId: addSearchFavorite
      responses:
        '204':
          description: Added (or already there)
        '400':
          description: Invalid item, or a caller without a user
        '403':
          description: Token without the `cluster:read` scope
    delete:
      summary: Remove a favourite
      description: Scope `cluster:read`.
      operationId: removeSearchFavorite
      responses:
        '204':
          description: Removed
        '400':
          description: Invalid item, or a caller without a user
        '403':
          description: Token without the `cluster:read` scope
  /search/recent:
    post:
      summary: Record a visit
      description: The console records visited items; the last 20 per user are kept and rank before other results. Scope `cluster:read`.
      operationId: recordSearchVisit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              additionalProperties: false
              properties:
                item:
                  {
                    type: string,
                    pattern: '^[A-Za-z]{1,32}:[A-Za-z0-9_./:-]{1,400}$',
                  }
      responses:
        '204':
          description: Recorded
        '400':
          description: Invalid item
        '403':
          description: Token without the `cluster:read` scope
  /views:
    get:
      summary: List the caller's saved views
      description: |
        Saved views / filters per user, server-side (3.37): only the caller's own views (user id, the API key, or
        through a fleet the verified person `fleet:<issuer>:<user>`), sorted by scope and name. Through a fleet without
        a verified person the list is empty. Scope `cluster:read`.
      operationId: listSavedViews
      parameters:
        - in: query
          name: scope
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9:._-]{0,99}$' }
      responses:
        '200':
          description: Views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedView' }
        '403':
          description: Token without the `cluster:read` scope
    post:
      summary: Save a view
      description: |
        Stores the opaque console state of one list (`scope`: a list id such as `contents`, `audit`, `plans`, `tree`,
        or `settings` for console settings) under a name unique per scope. At most 200 views per user, `state` at most
        16 KiB serialized. Audited (`view.create`, target `view/<scope>/<name>`). Scope `cluster:read`.
      operationId: createSavedView
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavedViewDto' }
      responses:
        '201':
          description: View
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '400':
          description: Invalid scope / name / state, state over 16 KiB, 200 views reached, or a caller without a user
        '403':
          description: Token without the `cluster:read` scope, or a fleet relay without a verified person
        '409':
          description: A view with this name already exists in this scope
  /views/{id}:
    parameters:
      - $ref: '#/components/parameters/SavedViewId'
    patch:
      summary: Rename a view or replace its state
      description: Only the caller's own views. Audited (`view.update`). Scope `cluster:read`.
      operationId: updateSavedView
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSavedViewDto' }
      responses:
        '200':
          description: View
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '400':
          description: Nothing to change, invalid name / state, state over 16 KiB
        '403':
          description: Token without the `cluster:read` scope, or a fleet relay without a verified person
        '404':
          description: Unknown or not the caller's
        '409':
          description: A view with this name already exists in this scope
    delete:
      summary: Delete a view
      description: Only the caller's own views. Audited (`view.delete`). Scope `cluster:read`.
      operationId: deleteSavedView
      responses:
        '204':
          description: Deleted
        '403':
          description: Token without the `cluster:read` scope, or a fleet relay without a verified person
        '404':
          description: Unknown or not the caller's
  /wallboards:
    get:
      summary: List wallboard tokens
      description: |
        Tokens that are not revoked and that the caller could create: all for cluster admins, those of projects the
        caller administers for project admins. Scope `projects:admin`.
      operationId: listWallboardTokens
      responses:
        '200':
          description: Tokens (without the secret)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WallboardToken' }
        '403':
          description: Token without the `projects:admin` scope
    post:
      summary: Create a wallboard token
      description: |
        A read-only token for the kiosk view (`GET /public/wallboard`) only. Without `projects`: cluster-wide, for
        cluster admins; with `projects`: for admins of all of them. The token is answered once and stored as
        SHA-256. Audited. Scope `projects:admin`.
      operationId: createWallboardToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWallboardToken'
      responses:
        '201':
          description: The token, with its secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WallboardToken'
                  - type: object
                    required: [token]
                    properties:
                      token:
                        {
                          type: string,
                          description: '`lw_wb_` + 43 characters; shown only now',
                        }
        '400':
          description: Invalid body
        '403':
          description: Missing admin role, or token without the `projects:admin` scope
        '404':
          description: A project is not visible
  /wallboards/{id}:
    delete:
      summary: Revoke a wallboard token
      description: Audited. Same roles as creating it. Scope `projects:admin`.
      operationId: revokeWallboardToken
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Revoked
        '403':
          description: Token without the `projects:admin` scope
        '404':
          description: Token not found, already revoked or not manageable by the caller
  /public/wallboard:
    get:
      summary: Wallboard kiosk view
      description: |
        Kiosk data for a wallboard token (3.25): for the scope and each project, the health headline, the
        not-user-specific inbox (failed rollbacks, failed / at-risk entities, unsilenced firing alerts; at most 20) and
        the summary — as an auditor sees it for cluster-wide tokens, as a project viewer for project tokens. Only
        `Authorization: Wallboard <token>` is accepted (no bearer token, no query parameter); the console keeps the
        token in the URL fragment.
      operationId: getWallboard
      security:
        - wallboardAuth: []
      responses:
        '200':
          description: Kiosk sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallboard'
        '401':
          description: Missing, unknown, expired or revoked wallboard token
  /reports:
    get:
      summary: List reports
      description: |
        Monthly reports (3.25) the caller may read, newest month first: cluster reports for cluster roles, project
        reports for readers of the project. Scope `cluster:read`.
      operationId: listReports
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Report' }
        '403':
          description: Token without the `cluster:read` scope
  /reports/run:
    post:
      summary: Run a report
      description: |
        Queues the report of a finished month (through the job queue, idempotent per scope and month); replaces its
        files. Cluster admins for `cluster`, project admins for their project. Scope `projects:admin`.
      operationId: runReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunReport'
      responses:
        '202':
          description: Queued
        '400':
          description: Invalid body, or a month that hasn't ended
        '403':
          description: Missing admin role, or token without the `projects:admin` scope
        '404':
          description: Scope not visible
  /reports/files:
    get:
      summary: Report file tree
      description: |
        Folder entries at `path` (folders first) of the files of completed reports the caller may read (`cluster/…`,
        `projects/<project>/…`). `..`, `.` and NUL bytes are rejected. Scope `cluster:read`.
      operationId: listReportFiles
      parameters:
        - $ref: '#/components/parameters/ReportPath'
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReportFileEntry' }
        '400':
          description: Invalid path
        '403':
          description: Token without the `cluster:read` scope
  /reports/files/download:
    get:
      summary: Download a report file
      description: |
        One recorded file the caller may read, as an attachment (`X-Content-Type-Options: nosniff`). Scope
        `cluster:read`.
      operationId: downloadReportFile
      parameters:
        - $ref: '#/components/parameters/ReportPath'
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: Invalid path
        '403':
          description: Token without the `cluster:read` scope
        '404':
          description: File not found or not visible
  /reports/files/archive:
    get:
      summary: Download a report folder as ZIP
      description: |
        Every visible file under `path` (empty: all) as a ZIP archive, at most 500 files and 100 MiB. Scope
        `cluster:read`.
      operationId: downloadReportArchive
      parameters:
        - $ref: '#/components/parameters/ReportPath'
      responses:
        '200':
          description: ZIP archive (attachment)
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400':
          description: Invalid path
        '403':
          description: Token without the `cluster:read` scope
        '404':
          description: No visible file under the path
        '413':
          description: More than 500 files or 100 MiB
  /live/files:
    get:
      summary: List a directory
      description: |
        Entries of a directory in a replica's container filesystem or a volume (on the node holding its primary
        replica), folders first, at most 10,000. The final path component is followed if it is a symbolic link
        inside the target. Project operators / admins, developers with the project's `developerExec`. Scope
        `live:access`.
      operationId: listLiveFiles
      parameters:
        - $ref: '#/components/parameters/LiveTarget'
        - $ref: '#/components/parameters/LivePath'
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LiveFileEntry' }
        '400':
          $ref: '#/components/responses/LiveFileBadRequest'
        '403':
          $ref: '#/components/responses/LiveFileForbidden'
        '404':
          $ref: '#/components/responses/LiveFileNotFound'
        '413':
          description: More than 10,000 entries
        '504':
          $ref: '#/components/responses/LiveNodeTimeout'
    post:
      summary: Create an empty file or a directory
      description: |
        Fails with `409` if the path exists. Audited as `files.create`. Scope `live:access`.
      operationId: createLiveFile
      parameters:
        - $ref: '#/components/parameters/LiveTarget'
        - $ref: '#/components/parameters/LivePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [file, directory] }
      responses:
        '201':
          description: Created
          headers:
            X-Loadweaver-Warning:
              $ref: '#/components/headers/LiveWarning'
        '400':
          $ref: '#/components/responses/LiveFileBadRequest'
        '403':
          $ref: '#/components/responses/LiveFileForbidden'
        '404':
          $ref: '#/components/responses/LiveFileNotFound'
        '409':
          description: The path exists
        '504':
          $ref: '#/components/responses/LiveNodeTimeout'
    delete:
      summary: Delete a file or directory
      description: |
        Recursively, never following symbolic links (a link is removed, not its target). The target's root can't be
        deleted. Audited as `files.delete`. Scope `live:access`.
      operationId: deleteLiveFile
      parameters:
        - $ref: '#/components/parameters/LiveTarget'
        - $ref: '#/components/parameters/LivePath'
      responses:
        '204':
          description: Deleted
          headers:
            X-Loadweaver-Warning:
              $ref: '#/components/headers/LiveWarning'
        '400':
          $ref: '#/components/responses/LiveFileBadRequest'
        '403':
          $ref: '#/components/responses/LiveFileForbidden'
        '404':
          $ref: '#/components/responses/LiveFileNotFound'
        '504':
          $ref: '#/components/responses/LiveNodeTimeout'
    patch:
      summary: Move or rename
      description: |
        Moves `path` to `destination` inside the same target. With `overwrite`, an existing destination is removed
        first; otherwise `409`. A directory can't be moved into itself. Audited as `files.move`. Scope `live:access`.
      operationId: moveLiveFile
      parameters:
        - $ref: '#/components/parameters/LiveTarget'
        - $ref: '#/components/parameters/LivePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveFileMove'
      responses:
        '204':
          description: Moved
          headers:
            X-Loadweaver-Warning:
              $ref: '#/components/headers/LiveWarning'
        '400':
          $ref: '#/components/responses/LiveFileBadRequest'
        '403':
          $ref: '#/components/responses/LiveFileForbidden'
        '404':
          $ref: '#/components/responses/LiveFileNotFound'
        '409':
          description: The destination exists and `overwrite` is false
        '504':
          $ref: '#/components/responses/LiveNodeTimeout'
  /live/files/copy:
    post:
      summary: Copy a file or directory
      description: |
        Recursively, symbolic links copied as links. With `overwrite`, an existing destination is removed first;
        otherwise `409`. Audited as `files.copy`. Scope `live:access`.
      operationId: copyLiveFile
      parameters:
        - $ref: '#/components/parameters/LiveTarget'
        - $ref: '#/components/parameters/LivePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveFileMove'
      responses:
        '204':
          description: Copied
          headers:
            X-Loadweaver-Warning:
              $ref: '#/components/headers/LiveWarning'
        '400':
          $ref: '#/components/responses/LiveFileBadRequest'
        '403':
          $ref: '#/components/responses/LiveFileForbidden'
        '404':
          $ref: '#/components/responses/LiveFileNotFound'
        '409':
          description: The destination exists and `overwrite` is false
        '504':
          $ref: '#/components/responses/LiveNodeTimeout'
  /live/files/content:
    head:
      summary: File size and type
      description: '`Content-Length` is the file size. Scope `live:access`.'
      operationId: headLiveFile
      parameters:
        - $ref: '#/components/parameters/LiveTarget'
        - $ref: '#/components/parameters/LivePath'
      responses:
        '200':
          description: The file exists
          headers:
            Content-Length: { schema: { type: integer } }
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            X-File-Type:
              $ref: '#/components/headers/LiveFileType'
        '403':
          $ref: '#/components/responses/LiveFileForbidden'
        '404':
          $ref: '#/components/responses/LiveFileNotFound'
        '504':
          $ref: '#/components/responses/LiveNodeTimeout'
    get:
      summary: Read a file
      description: |
        The whole file (at most 100 MB) or one byte range. Always `application/octet-stream` with
        `X-Content-Type-Options: nosniff`; `download=true` adds `Content-Disposition: attachment`. Scope
        `live:access`.
      operationId: readLiveFile
      parameters:
        - $ref: '#/components/parameters/LiveTarget'
        - $ref: '#/components/parameters/LivePath'
        - in: query
          name: download
          schema: { type: string, enum: ['true', 'false'] }
        - in: header
          name: Range
          description: '`bytes=start-end`, `bytes=start-` or `bytes=-suffix` (one range, at most 100 MB)'
          schema: { type: string }
      responses:
        '200':
          description: The whole file
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            X-File-Type:
              $ref: '#/components/headers/LiveFileType'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: The requested range
          headers:
            Content-Range:
              description: '`bytes start-end/size`'
              schema: { type: string }
            X-File-Type:
              $ref: '#/components/headers/LiveFileType'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: Not a file, or an invalid target / path
        '403':
          $ref: '#/components/responses/LiveFileForbidden'
        '404':
          $ref: '#/components/responses/LiveFileNotFound'
        '413':
          description: Larger than 100 MB without a `Range`, or a range over 100 MB
        '416':
          description: Range outside the file
          headers:
            Content-Range:
              description: '`bytes */size`'
              schema: { type: string }
        '504':
          $ref: '#/components/responses/LiveNodeTimeout'
    put:
      summary: Write a file
      description: |
        Raw bytes as the body (any content type). Without `Content-Range`: the whole file, at most 10 MB, created or
        replaced. With `Content-Range: bytes start-end/total`: one chunk of a sequential upload of up to 100 MB; each
        chunk (at most 10 MB) must start where the previous one with the same `X-Upload-Id` ended, the first one
        (start 0) creates or truncates the file. Upload state expires after 30 minutes and lives on the control-plane
        replica that received the chunks. Audited as `files.write` when complete. Scope `live:access`.
      operationId: writeLiveFile
      parameters:
        - $ref: '#/components/parameters/LiveTarget'
        - $ref: '#/components/parameters/LivePath'
        - in: header
          name: Content-Range
          description: '`bytes start-end/total` of this chunk'
          schema: { type: string, pattern: '^bytes \d+-\d+/\d+$' }
        - in: header
          name: X-Upload-Id
          description: Ties the chunks of one upload together (default `default`)
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 10485760 }
      responses:
        '202':
          description: Chunk written, the upload continues
          headers:
            X-Loadweaver-Warning:
              $ref: '#/components/headers/LiveWarning'
        '204':
          description: File complete
          headers:
            X-Loadweaver-Warning:
              $ref: '#/components/headers/LiveWarning'
        '400':
          description: Invalid target / path / `Content-Range`, or a chunk out of order (`expected start <n>`)
        '403':
          $ref: '#/components/responses/LiveFileForbidden'
        '404':
          $ref: '#/components/responses/LiveFileNotFound'
        '413':
          description: More than 10 MB in one request, or an upload over 100 MB
        '504':
          $ref: '#/components/responses/LiveNodeTimeout'
  /live/sessions:
    get:
      summary: Terminal sessions
      description: |
        The latest terminal sessions (at most 1000 rows read, newest first), filtered to what the caller may read:
        auditors and cluster admins all, project admins their projects' sessions. Node shells have `project: null`.
        Scope `audit:read`.
      operationId: listTerminalSessions
      parameters:
        - in: query
          name: project
          schema:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TerminalSession' }
        '403':
          description: Token without the `audit:read` scope
  /live/sessions/{id}/recording:
    get:
      summary: Download a terminal recording
      description: |
        The session's asciicast v2 recording (`.cast`) as an attachment, for auditors, cluster admins and admins of
        the session's project. Recordings are deleted after the Cluster's `terminalRecordingRetentionDays`. Scope
        `audit:read`.
      operationId: downloadTerminalRecording
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: asciicast v2 file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: Invalid id
        '403':
          description: Token without the `audit:read` scope
        '404':
          description: Unknown session, not visible, or without a (retained) recording
  /live/tunnels:
    get:
      summary: Open debug tunnels
      description: |
        Open, unexpired debug tunnels in projects the caller may read (the map's temporary operator edges), newest
        first, at most 1000. Tunnels are opened over the Socket.IO namespace `socket/tunnels` (see `asyncapi.yaml`).
        Scope `projects:read`.
      operationId: listLiveTunnels
      responses:
        '200':
          description: Tunnels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LiveTunnel' }
        '403':
          description: Token without the `projects:read` scope
  /install/install.sh:
    get:
      summary: Node installer script
      description: Installs the node agent and joins or bootstraps the node (3.21).
      operationId: installScript
      security: []
      responses:
        '200':
          description: Shell script
          content:
            text/x-shellscript:
              schema: { type: string }
  /install/agent/{arch}:
    get:
      summary: Node agent binary
      operationId: agentBinary
      security: []
      parameters:
        - in: path
          name: arch
          required: true
          schema: { type: string, enum: [amd64, arm64] }
      responses:
        '200':
          description: Single executable
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /install/waf/coraza.wasm:
    get:
      summary: WAF module of the ingress
      description: Coraza proxy-wasm with the OWASP Core Rule Set from the release bundle (3.6); agents verify its pinned SHA-256.
      operationId: wafModule
      security: []
      responses:
        '200':
          description: WebAssembly module
          content:
            application/wasm:
              schema: { type: string, format: binary }
        '404':
          description: Not in the release bundle
  /install/geoip/country.mmdb:
    get:
      summary: GeoIP country database
      description: |
        For geo and latency DNS steering on hosted bind9 (3.28): DB-IP Lite from the release bundle, or the
        operator's own database (`LOADWEAVER_GEOIP_DB`). Agents verify the SHA-256 their desired state carries.
      operationId: geoipDatabase
      security: []
      responses:
        '200':
          description: MaxMind DB file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: No database configured
  /install/components.sh:
    get:
      summary: Node components script
      description: >-
        The installer's component setup (Docker with live-restore, gVisor, WireGuard, nftables, BIRD, keepalived,
        storage userland) as a standalone, idempotent script without a join, for a first node bootstrapped from a
        verified release agent (Decabill's `loadweaver` service kind). Contains no secrets; never restarts Docker.
      operationId: componentsScript
      security: []
      responses:
        '200':
          description: Shell script
          content:
            text/x-shellscript:
              schema: { type: string }
  /install/claim-status:
    get:
      summary: Admin claim status
      description: >-
        Whether the first console registration still needs the one-time admin claim token: true only with
        `AUTHENTICATION_METHOD=users`, `ADMIN_CLAIM_TOKEN_SHA256` set (by `loadweaver-agent bootstrap
        --admin-claim-token-file`, Decabill's Loadweaver Cloud) and no account yet. While true, `POST /auth/register`
        needs `adminClaimToken` (403 without / with a wrong one, 429 after repeated failures per client); afterwards
        registration is closed (503, as with `DISABLE_SIGNUP`) — the claimed administrator creates or invites users.
        `claimConfigured` says whether this instance has the claim hash at all; only `claimConfigured: true` with
        `claimRequired: false` means the cluster was claimed (older clusters omit `claimConfigured`: unknown).
        Contains no secrets.
      operationId: adminClaimStatus
      security: []
      responses:
        '200':
          description: Claim status
          content:
            application/json:
              schema:
                type: object
                required: [claimRequired, claimConfigured]
                properties:
                  claimRequired: { type: boolean }
                  claimConfigured:
                    {
                      type: boolean,
                      description: ADMIN_CLAIM_TOKEN_SHA256 is configured on this instance (users authentication),
                    }
  /install/loadweaver-agent.service:
    get:
      summary: systemd unit of the node agent
      operationId: agentUnit
      security: []
      responses:
        '200':
          description: Unit file
          content:
            text/plain:
              schema: { type: string }
  /schemas:
    get:
      summary: List resource kinds
      operationId: listResourceSchemas
      security: []
      responses:
        '200':
          description: Kinds with descriptions
  /schemas/{kind}:
    get:
      summary: JSON Schema of a resource kind
      operationId: getResourceSchema
      security: []
      parameters:
        - in: path
          name: kind
          required: true
          schema:
            type: string
      responses:
        '200':
          description: JSON Schema (draft 2020-12)
  /git/connections:
    get:
      summary: Git connections
      description: Connections of the scopes the caller may read (cluster roles see the cluster connection, project readers their project's) (3.29). Scope `resources:read`.
      operationId: listGitConnections
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GitConnection' }
    post:
      summary: Connect a scope to a repository
      description: |
        One connection per scope, managed directly (never by plans): cluster admins the cluster scope (`project`
        omitted), project admins their project. Validates the URL (HTTPS / SSH only), branch and path; a project
        connection may only reference its own secrets. Returns the derived webhook secret once. Audited as
        `git.connection.create`. Scope `git:admin`.
      operationId: createGitConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GitConnectionSettings'
                - type: object
                  required: [provider, repoUrl, branch, mode]
                  properties:
                    project:
                      {
                        type: string,
                        pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$',
                      }
      responses:
        '201':
          description: The connection and its webhook secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GitConnection'
                  - type: object
                    properties:
                      webhookSecret: { type: string, pattern: '^[0-9a-f]{64}$' }
        '400':
          description: Invalid URL, branch, path, credentials or trigger
        '403':
          description: Not an admin of the scope
        '404':
          description: Unknown project
        '409':
          description: The scope already has a connection
  /git/connections/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: One Git connection
      description: Scope `resources:read`.
      operationId: getGitConnection
      responses:
        '200':
          description: The connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitConnection' }
        '404':
          description: Unknown connection (or not visible)
    patch:
      summary: Change a Git connection
      description: |
        Omitted fields stay; `null` only clears the optional ones (`credentials`, `apiUrl`, `caCertificate`,
        `pollIntervalSeconds`), for the others it is a `400`. Another repository URL forgets the pinned host key;
        another URL, branch or path syncs from scratch and forgets the per-resource sync state. With
        `membershipsFromGit` on, changing the repository, branch, path, credentials, provider, API URL or CA by someone
        other than a cluster admin or the project creator turns it off (`403` if it is set explicitly with such a
        change). Audited as `git.connection.update`. Scope `git:admin`.
      operationId: updateGitConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitConnectionSettings' }
      responses:
        '200':
          description: The connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitConnection' }
        '400':
          description: Invalid settings
        '403':
          description: Not an admin of the scope
    delete:
      summary: Disconnect a scope
      description: Pending plans of its pull requests are discarded and their locks released. Audited as `git.connection.delete`. Scope `git:admin`.
      operationId: deleteGitConnection
      responses:
        '204':
          description: Deleted
        '403':
          description: Not an admin of the scope
  /git/connections/{id}/commits:
    get:
      summary: Commits of a connection
      description: Synced pushes (with their plan, state and reported status) and commits Loadweaver wrote (commit-back, export, PR branches), newest first. Scope `resources:read`.
      operationId: listGitCommits
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Commits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GitCommit' }
  /git/connections/{id}/webhook-secret:
    get:
      summary: The webhook secret
      description: Derived (HKDF from `ENCRYPTION_KEY`, the connection id and its rotatable salt), not stored. Reading it is audited (`git.connection.webhook-secret`). Scope `git:admin`.
      operationId: getGitWebhookSecret
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookSecret: { type: string }
        '403':
          description: Not an admin of the scope
  /git/connections/{id}/webhook-secret/rotate:
    post:
      summary: Rotate the webhook secret
      description: |
        A new random salt in the derivation: the old secret stops working at once (update it at the provider).
        Audited as `git.connection.webhook-secret-rotated`. Admins of the scope; scope `git:admin`.
      operationId: rotateGitWebhookSecret
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The new secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookSecret: { type: string, pattern: '^[0-9a-f]{64}$' }
                  webhookGeneration: { type: integer, minimum: 1 }
        '403':
          description: Not an admin of the scope
        '404':
          description: Unknown connection (or not visible)
  /git/connections/{id}/host-key/reset:
    post:
      summary: Forget the pinned SSH host key
      description: |
        The next contact pins the key it sees (after a legitimate rotation). Audited as `git.connection.host-key-reset`. Scope `git:admin`.
      operationId: resetGitHostKey
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitConnection'
        '403':
          description: Not an admin of the connection's scope, or the token lacks `git:admin`
        '404':
          description: Unknown connection (or not visible)
  /git/connections/{id}/test:
    post:
      summary: Test a connection
      description: |
        `ls-remote` of the branch with the connection's credentials (pins the SSH host key on first contact) and, with a provider API token, the default branch. Scope `git:admin`.
      operationId: testGitConnection
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  head: { type: [string, 'null'] }
                  defaultBranch: { type: [string, 'null'] }
                  hostKey: { type: [string, 'null'] }
                  error:
                    {
                      type: string,
                      description: 'A fixed reason (authentication failed, not found, host key changed, timeout, the provider API status code); never a remote response body',
                    }
        '403':
          description: Not an admin of the connection's scope, or the token lacks `git:admin`
        '404':
          description: Unknown connection (or not visible)
  /git/connections/{id}/sync:
    post:
      summary: Sync now
      description: |
        Syncs the branch head now, also an unchanged one: secret scan, validation, scope rule, plan with `source`. Scope `git:admin`.
      operationId: syncGitConnection
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitSyncResult'
        '403':
          description: Not an admin of the connection's scope, or the token lacks `git:admin`
        '404':
          description: Unknown connection (or not visible)
  /git/connections/{id}/export:
    post:
      summary: Export the scope to its repository
      description: |
        One commit with the scope's current state at `<path>/<project|cluster>/<kind>-<name>.yaml` (and `access.yaml` with memberships from Git). A path with YAML files is only replaced with `force: true` (else `409`). SOPS-encrypted files are never deleted or overwritten, and resources that came from SOPS files are never written in clear (`skipped`). Every written file is secret-scanned; a finding refuses the export (`409`, audited as `git.write-refused`). Audited as `git.export`. Scope `git:admin`.
      operationId: exportGitConnection
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  commit: { type: [string, 'null'] }
                  resources: { type: integer }
                  changed: { type: boolean }
                  skipped:
                    type: array
                    description: Resources (`Kind/project/name`) from SOPS files, not exported in clear
                    items: { type: string }
        '403':
          description: Not an admin of the connection's scope, or the token lacks `git:admin`
        '404':
          description: Unknown connection (or not visible)
  /git/sops/recipient:
    get:
      summary: The cluster's SOPS age recipient
      description: |
        The public age recipient (`age1…`) to encrypt SOPS files to (`sops encrypt --age <recipient>`). The cluster's
        X25519 identity is generated on first need (audited as `git.sops.identity-created`) and stored envelope-encrypted
        with the master key. Members of the cluster or a project; PAT scope `resources:read`.
      operationId: getGitSopsRecipient
      responses:
        '200':
          description: Recipient
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipient:
                    {
                      type: string,
                      example: age1qyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqszqgpqyqs3290gq,
                    }
                  createdAt: { type: string, format: date-time }
        '403':
          description: Neither a cluster nor a project role
        '409':
          description: The master key is not available (sealed), so no identity can be created
  /git/accounts:
    get:
      summary: The caller's linked Git accounts
      description: Accounts linked for the plan bot (3.30). Users only (not the API key); PAT scope `git:accounts`.
      operationId: listGitAccounts
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitAccount'
        '400':
          description: The session has no user (API key)
  /git/accounts/{provider}/authorize:
    post:
      summary: Start linking a Git account
      description: |
        Returns the provider's OAuth authorize URL with a state signed with HMAC-SHA256 (user, provider, nonce, expiry of
        at most 10 minutes; key derived from `ENCRYPTION_KEY`). The nonce is single use. Needs the provider's OAuth app in
        `Cluster.spec.git` and `LOADWEAVER_PUBLIC_URL`. PAT scope `git:accounts`.

        Through a trusted fleet (3.41) the link belongs to the verified fleet person (`fleet:<iss>:<sub>`; the fleet's
        service credential without a verified person gets 403), and the body may name the fleet console's Git accounts
        page (`returnUrl`): kept in the signed state, the callback returns there. Without a verified fleet identity a
        `returnUrl` is refused (400).
      operationId: authorizeGitAccount
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [github, gitlab] }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                returnUrl:
                  type: string
                  format: uri
                  maxLength: 512
                  description: http(s) URL whose path ends in `/account/git-accounts`, without query / fragment / credentials
      responses:
        '200':
          description: Where the console sends the browser
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '400':
          description: The session has no user (API key), or a `returnUrl` without a verified fleet identity
        '403':
          description: A fleet's service credential without a verified fleet person
        '404':
          description: Unknown provider
        '409':
          description: Account linking for the provider (or `LOADWEAVER_PUBLIC_URL`) is not configured
  /git/accounts/{provider}/callback:
    get:
      summary: OAuth callback (provider redirect)
      description: |
        Public. Verifies the signed state in constant time and consumes its nonce (single use), exchanges the code,
        reads the provider user once and records only its id and login as a **pending link** of the user who started
        the flow (10 minutes; the token is discarded). Nothing is linked until that user confirms it
        (`POST /git/accounts/confirm`). Redirects (`302`) to `<LOADWEAVER_CONSOLE_URL>/account/git-accounts?confirm=<nonce>`
        or `?error=<code>`; the target never comes from the request. Without a console URL it answers with the result
        as JSON (`{ confirm }` / `{ error }`).
      operationId: gitAccountCallback
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [github, gitlab] }
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        '302':
          description: To the console's Git account settings (`confirm=<nonce>` or `error=invalid-state|denied|not-configured|exchange-failed|already-linked`)
        '200':
          description: Pending link recorded (no console URL configured)
        '400':
          description: Not linked (no console URL configured)
  /git/accounts/pending/{nonce}:
    parameters:
      - in: path
        name: nonce
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
    get:
      summary: A pending account link
      description: The provider account the caller's OAuth flow returned, waiting for confirmation. Only the user who started the flow; PAT scope `git:accounts`.
      operationId: getPendingGitAccount
      responses:
        '200':
          description: Pending link
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, enum: [github, gitlab] }
                  login: { type: string }
                  providerUserId: { type: string }
                  expiresAt: { type: string, format: date-time }
        '404':
          description: Unknown, expired or another user's
    delete:
      summary: Cancel a pending account link
      description: PAT scope `git:accounts`.
      operationId: cancelPendingGitAccount
      responses:
        '204':
          description: Cancelled
        '404':
          description: Unknown, expired or another user's
  /git/accounts/confirm:
    post:
      summary: Confirm a pending account link
      description: |
        Links the provider account of a pending link to the caller (single use). Only the user who started the flow;
        audited as `git.account.link`. PAT scope `git:accounts`.
      operationId: confirmGitAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitAccount'
        '404':
          description: Unknown, expired or another user's
        '409':
          description: The provider account is linked to another user
  /git/accounts/{id}:
    delete:
      summary: Unlink a Git account
      description: The caller's own link only; audited as `git.account.unlink`. PAT scope `git:accounts`.
      operationId: deleteGitAccount
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Unlinked
        '404':
          description: Not the caller's account
  /git/webhooks/{connection}:
    post:
      summary: Webhook delivery
      description: |
        Public; authenticated by the connection's webhook secret over the raw body, in constant time: GitHub / Gitea
        `X-Hub-Signature-256: sha256=<hmac>` (Gitea also `X-Gitea-Signature`), GitLab `X-Gitlab-Token`. Deliveries are
        handled once (a repeated `X-GitHub-Delivery` / `X-Gitea-Delivery` / `X-Gitlab-Event-UUID` is `ignored`), and
        deliveries naming another repository (`repository.full_name`, `project.path_with_namespace`) are ignored.
        Comments are read back from the provider API (author, body, time); the payload is never trusted for them. A
        push to the connection's branch queues a sync. On GitHub / GitLab connections, pull / merge request events (opened,
        pushed, reopened, closed, merged) and comments on them (`loadweaver plan|apply|approve|unlock|drift|help`) are
        queued for the plan bot (`event`: `pull-request` / `comment`); everything else is ignored.
      operationId: receiveGitWebhook
      security: []
      parameters:
        - in: path
          name: connection
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [queued, ignored] }
                  event:
                    {
                      type: string,
                      example: pull-request,
                      description: 'push, pull-request, comment, ping or other',
                    }
        '401':
          description: Unknown connection or wrong signature
        '403':
          description: Webhooks are disabled for the connection
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Static API key, users-mode JWT, Keycloak token or personal access token (scopes in `LOADWEAVER_PAT_SCOPES`).
    basicAuth:
      type: http
      scheme: basic
      description: '`docker login`: any user name, the API key or a personal access token as password (registry token realm only).'
    wallboardAuth:
      type: apiKey
      in: header
      name: Authorization
      description: '`Wallboard <token>` with a wallboard token (`lw_wb_…`); only for `GET /public/wallboard`.'
  headers:
    LiveWarning:
      description: |
        Set for writes into a replica's container filesystem: `Changes in a container filesystem are lost on restart
        or migration` (also recorded as a `drift` event).
      schema: { type: string }
    LiveFileType:
      description: Preview type from the file extension (files without one count as `text`)
      schema: { type: string, enum: [text, image, video, audio, pdf, binary] }
  responses:
    Forbidden:
      description: Missing cluster permission
    LiveFileBadRequest:
      description: Invalid target or path, or the node failed the operation (e.g. the volume isn't mounted on its primary node, or the runtime has no browsable filesystem)
    LiveFileForbidden:
      description: |
        Role not sufficient (exec / files not allowed), token without the `live:access` scope, or a path / symbolic
        link that leads outside the target
    LiveFileNotFound:
      description: Unknown or unreadable replica / volume, or no such file or directory
    LiveNodeTimeout:
      description: The node is not connected or didn't answer within 30 seconds
  parameters:
    NodeName:
      in: path
      name: name
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    CertificateId:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
    PlanId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    SavedViewId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    VpnClientId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9@._:|-]{1,255}$' }
    LiveTarget:
      in: query
      name: target
      required: true
      description: '`replica:<project/deployment/service/index>` or `volume:<project/deployment/volume>`'
      schema:
        type: string
        pattern: '^(replica|volume):[a-z0-9_./-]{1,300}$'
        examples: ['replica:shop/site/web/0', 'volume:shop/site/data']
    LivePath:
      in: query
      name: path
      description: Absolute path inside the target (default `/`), no control characters
      schema: { type: string, maxLength: 4096 }
    ProjectName:
      in: path
      name: project
      required: true
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
    LogFrom:
      in: query
      name: from
      description: Start of the time range; default one hour before `to`
      schema: { type: string, format: date-time }
    LogTo:
      in: query
      name: to
      description: End of the time range; default now
      schema: { type: string, format: date-time }
    LogSources:
      in: query
      name: sources
      description: Comma-separated or repeated
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/LogSource' }
    LogLevels:
      in: query
      name: levels
      description: Comma-separated or repeated
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/LogLevel' }
    LogProject:
      in: query
      name: project
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
    LogDeployment:
      in: query
      name: deployment
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
    LogService:
      in: query
      name: service
      schema: { type: string, pattern: '^[a-z0-9_.-]{1,63}$' }
    LogReplica:
      in: query
      name: replica
      description: '`<project>/<deployment>/<service>/<index>`'
      schema:
        {
          type: string,
          pattern: '^[a-z0-9-]+/[a-z0-9_.-]+/[a-z0-9_.-]+/\d{1,9}$',
        }
    LogNode:
      in: query
      name: node
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
    LogPolicy:
      in: query
      name: policy
      description: Exact `labels.policy`
      schema: { type: string, maxLength: 256 }
    LogText:
      in: query
      name: text
      description: Full text over the message (OpenSearch simple query string; the first 256 characters count)
      schema: { type: string, maxLength: 256 }
    MetricName:
      in: query
      name: metric
      required: true
      description: '`node.cpu_cores`, `replica.memory_bytes`, `ingress.requests_per_s`, … (see docs/loadweaver/features/metrics.md)'
      schema: { type: string, pattern: '^[a-z][a-z0-9_.]{0,63}$' }
    UsageFrom:
      in: query
      name: from
      description: Start (floored to the granularity, UTC); default the start of the current month
      schema: { type: string, format: date-time }
    UsageTo:
      in: query
      name: to
      description: End (exclusive); default now
      schema: { type: string, format: date-time }
    UsageGranularity:
      in: query
      name: granularity
      schema: { type: string, enum: [hour, day, month], default: day }
    UsageMeter:
      in: query
      name: meter
      schema: { $ref: '#/components/schemas/UsageMeterKey' }
    UsageFinalOnly:
      in: query
      name: finalOnly
      description: Only final buckets (what billing consumes)
      schema: { type: boolean, default: false }
    MetricFrom:
      in: query
      name: from
      description: 'Start of the time range; default one hour before `to` (events: one day)'
      schema: { type: string, format: date-time }
    MetricTo:
      in: query
      name: to
      description: End of the time range; default now
      schema: { type: string, format: date-time }
    MetricEntity:
      in: query
      name: entity
      description: Exact entity, or a prefix ending in `*` (`shop/web/*`)
      schema: { type: string, maxLength: 255 }
    MetricNode:
      in: query
      name: node
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
    MetricProject:
      in: query
      name: project
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
    MetricGroupBy:
      in: query
      name: groupBy
      description: One series per entity, node, project, or a single series `all`
      schema:
        { type: string, enum: [entity, node, project, none], default: entity }
    MetricAggregation:
      in: query
      name: aggregation
      description: Within each step and group
      schema: { type: string, enum: [avg, min, max, sum], default: avg }
    AuditFrom:
      in: query
      name: from
      description: Start of the time range (inclusive); default no limit
      schema: { type: string, format: date-time }
    AuditTo:
      in: query
      name: to
      description: End of the time range (exclusive); default no limit
      schema: { type: string, format: date-time }
    AuditProject:
      in: query
      name: project
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
    AuditAction:
      in: query
      name: action
      description: Exact action, or a prefix ending in `*` (`plan.*`)
      schema: { type: string, pattern: '^[a-z0-9._-]{1,127}\*?$' }
    AuditActor:
      in: query
      name: actor
      description: Exact actor id
      schema: { type: string, maxLength: 255 }
    AuditTarget:
      in: query
      name: target
      description: Target prefix (`plan/`, `project/shop`)
      schema: { type: string, maxLength: 512 }
    AuditText:
      in: query
      name: text
      description: Full text over action, target and details
      schema: { type: string, maxLength: 256 }
    AuditBefore:
      in: query
      name: before
      description: '`before` of the previous page: only older entries'
      schema: { type: string, pattern: '^\d{1,19}$' }
    AlertId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    AlertSilenceId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    StatusPageHost:
      in: header
      name: Host
      required: true
      description: The status page's hostname, as forwarded by the ingress (port ignored)
      schema: { type: string }
    SearchItem:
      in: path
      name: item
      required: true
      description: 'A search document id, `Kind:key` (e.g. `Node:n3`, `Deployment:shop/web`); `/` URL-encoded'
      schema:
        { type: string, pattern: '^[A-Za-z]{1,32}:[A-Za-z0-9_./:-]{1,400}$' }
    ReportPath:
      in: query
      name: path
      description: 'Relative path (`cluster/2026/09`, `projects/shop/2026/09/report.html`); empty: the top'
      schema: { type: string, maxLength: 512 }
  schemas:
    IsolationLevelCapability:
      type: object
      description: One isolation level in a project's placement (`GET /projects/{project}/isolation-capabilities`).
      required: [state, nodes]
      properties:
        state:
          {
            type: string,
            enum: [ready, unsupported, probe-failed, disabled-by-admin],
          }
        nodes:
          {
            type: integer,
            description: 'Schedulable nodes in the placement with the level ready',
          }
        reasonCode:
          {
            type: string,
            description: "Agenstra's reason code of the most common cause (not ready only), e.g. E_KVM_UNAVAILABLE",
          }
        reason:
          {
            type: string,
            maxLength: 512,
            description: 'Per-node causes (not ready only)',
          }
    SecretVersionDto:
      type: object
      required: [version, fingerprint, createdBy, createdAt]
      properties:
        version: { type: integer, minimum: 1 }
        fingerprint:
          { type: string, description: 'Keyed fingerprint, never the value' }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ClusterSummaryDto:
      type: object
      properties:
        clusterId: { type: string }
        displayName: { type: string }
        caCertificate: { type: string }
        desiredRevision: { type: integer }
        nodes:
          type: object
          properties:
            total: { type: integer }
            connected: { type: integer }
            sites: { type: array, items: { type: string } }
        controlPlane:
          type: object
          properties:
            members: { type: array, items: { type: string } }
            votingWitnesses: { type: array, items: { type: string } }
            automaticFailover: { type: boolean }
            warnings: { type: array, items: { type: string } }
    AuditVerification:
      type: object
      properties:
        ok:
          type: boolean
          description: The chain verifies and no anchor disagrees with it
        checked: { type: integer }
        brokenAt:
          type: string
          description: First entry whose hash does not match, or the newest anchored entry that no longer matches its anchor
        head: { type: string }
        anchors: { $ref: '#/components/schemas/AnchorVerification' }
    AnchorVerification:
      type: object
      required: [checked, mismatched, available]
      properties:
        checked:
          {
            type: integer,
            description: 'Anchors in the log store compared with the chain (the newest 1,000)',
          }
        mismatched:
          type: array
          items: { type: string }
          description: Anchored `seq`s whose entry is missing or has a different hash (the chain was rewritten after the anchor)
        available: { type: boolean, description: false without a log store }
    AuditEntry:
      type: object
      required:
        [seq, at, actorType, actorId, action, target, project, details, hash]
      properties:
        seq:
          {
            type: string,
            description: Position in the chain (a bigint as string),
          }
        at: { type: string, format: date-time }
        actorType: { type: string }
        actorId: { type: [string, 'null'] }
        actorEmail: { type: [string, 'null'] }
        action: { type: string, description: 'e.g. `plan.applied`' }
        target:
          { type: string, description: 'e.g. `plan/<id>`, `project/<name>`' }
        project: { type: [string, 'null'] }
        details: { type: object, additionalProperties: true }
        hash: { type: string }
    AuditPage:
      type: object
      required: [entries, before]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        before:
          type: [string, 'null']
          description: Pass as `before` for the next (older) page; null on the last page
    SiemTargetStatus:
      type: object
      required: [name, forwarded, failures, lastError, nextAttemptAt]
      properties:
        name: { type: string }
        forwarded:
          { type: integer, description: Records accepted by the target so far }
        failures:
          {
            type: integer,
            description: Consecutive failed deliveries; 0 after an accepted batch,
          }
        lastError: { type: [string, 'null'] }
        nextAttemptAt:
          type: [string, 'null']
          format: date-time
          description: While backing off (10 s doubling up to 10 minutes), the next attempt
    JoinRequest:
      type: object
      required: [token, nodeName, csrPem, hello]
      properties:
        token: { type: string }
        nodeName: { type: string }
        csrPem:
          { type: string, description: PKCS#10 CSR with an ECDSA P-256 key }
        hello:
          {
            type: object,
            description: Agent inventory (see agent protocol `hello`),
          }
        site: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        discover:
          type: boolean
          enum: [true]
          description: Join for an import (3.21); the node joins as `pending` and gets no desired state until its join plan is applied. Needs `discovery`.
        discovery:
          type: object
          description: The agent's read-only discovery report (agent protocol `discoveryReportSchema`), redacted on the node and again by the control plane.
    ImportSummary:
      type: object
      properties:
        node: { type: string }
        lifecycle: { type: string }
        connected: { type: boolean }
        hostname: { type: string }
        discoveryId: { type: string, format: uuid }
        discoveredAt: { type: string, format: date-time }
        composeProjects: { type: integer }
        containers: { type: integer }
        volumes: { type: integer }
        former:
          {
            type: string,
            enum: [none, same-cluster, other-cluster, unknown-cluster],
          }
        selection:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/ImportStatus' }
            planId: { type: [string, 'null'], format: uuid }
    ImportStatus:
      type: string
      enum: [draft, planned, running, done, failed, rolled-back, discarded]
    ImportDetail:
      type: object
      properties:
        node: { type: string }
        lifecycle: { type: string }
        connected: { type: boolean }
        discovery:
          type: object
          properties:
            id: { type: string, format: uuid }
            source: { type: string, enum: [join, refresh] }
            receivedAt: { type: string, format: date-time }
            requestedAt: { type: [string, 'null'], format: date-time }
