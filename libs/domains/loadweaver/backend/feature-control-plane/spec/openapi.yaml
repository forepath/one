        kind: { type: string, enum: [postgres, opensearch, etcd] }
        status: { type: string, enum: [succeeded, failed, unavailable, busy] }
        backup:
          type: [string, 'null']
          description: WAL-G backup name, OpenSearch snapshot or etcd snapshot name
        bytes: { type: integer }
        error: { type: [string, 'null'] }
        deleted:
          {
            type: array,
            items: { type: string },
            description: Backups removed by the retention afterwards,
          }
    PlatformRestore:
      type: object
      description: Point-in-time restore of the control-plane database into a new scope (3.20).
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [postgres] }
        state:
          {
            type: string,
            enum: [requested, restoring, ready, failed, discarded, adopted],
          }
        node: { type: string }
        scope: { type: string, description: Patroni scope of the clone }
        sourceScope: { type: string }
        targetTime: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        requestedBy: { type: string }
        createdAt: { type: string, format: date-time }
        readyAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        endpoint:
          type: object
          properties:
            host:
              {
                type: [string, 'null'],
                description: Overlay address of the member,
              }
            port: { type: integer, description: Postgres port of the clone }
