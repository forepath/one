asyncapi: 3.0.0
info:
  title: Loadweaver control plane WebSocket (plans, logs, terminals, machine exec, tunnels, topology)
  version: 1.0.0
  description: |
    Socket.IO events of the Loadweaver control plane on the shared HTTP `PORT` (default 3400). Engine.IO path is
    `/socket.io/`; REST stays under `/api/` (see `openapi.yaml`). Namespace **socket/plans**
    (env `LOADWEAVER_PLANS_WEBSOCKET_NAMESPACE`, default "socket/plans") sends live plans (3.19): approvals,
    applies, progress and rollbacks. Namespace **socket/logs** (env `LOADWEAVER_LOGS_WEBSOCKET_NAMESPACE`, default
    "socket/logs") live-tails log lines (3.14). Namespace **socket/terminals** (env
    `LOADWEAVER_TERMINALS_WEBSOCKET_NAMESPACE`, default "socket/terminals") runs terminals in replicas and node
    shells (3.19). Namespace **socket/tunnels** (env `LOADWEAVER_TUNNELS_WEBSOCKET_NAMESPACE`, default
    "socket/tunnels") carries debug tunnels to a replica's port (3.19, `loadweaver port-forward`). Namespace
    **socket/topology** (env `LOADWEAVER_TOPOLOGY_WEBSOCKET_NAMESPACE`, default "socket/topology") sends live
    traffic for the topology map (3.9). Namespace **socket/exec** (env `LOADWEAVER_EXEC_WEBSOCKET_NAMESPACE`, default
    "socket/exec") runs non-interactive commands in replicas for machines (3.19 machine exec, Agenstra on
    Loadweaver): no TTY, binary stdin / stdout / stderr, exit code.
    Connections authenticate with the `Authorization` header in the handshake (`Bearer <token>`: static API key,
    users-mode JWT or Keycloak token), or `handshake.auth.Authorization` for browser WebSockets. Personal access
    tokens (machine sessions) are refused on every namespace except **socket/exec**, which accepts them with the
    scope `live:exec` (validated like API requests: revocation, expiry and demotion apply at once). Unauthenticated connections are rejected with
    connect_error "Unauthorized".
    Each socket only gets plans the user may see (cluster role for cluster-level changes, read access to every
    touched project). Changes are read from the database, so every control-plane replica serves every plan.
    Log tails are scoped like `GET /api/logs` and read from the log store, so every replica serves every tail.
    Live flows are scoped like `GET /api/topology` and read from the database, so every replica serves them.
    Terminals and tunnels live on the replica the socket is connected to; the control plane reaches the node over
    the node's stream (on whichever replica holds it, relayed through Postgres LISTEN / NOTIFY), so every replica
    serves every node. On the node stream (gRPC envelope, `agent.proto`) each session has its own envelope
    `channel`; the payloads are defined in `libs/domains/loadweaver/shared/util-agent-protocol/src/lib/live.ts`:
    control plane → node `execOpen` {target: {kind: replica, replica} | {kind: node}, command?, cols, rows, tty?,
    user?, workingDir?, env?}, `execInput` {data, eof?}, `execResize` {cols, rows}, `execClose` {}, `fileRequest` {op: list | stat | read | write |
    mkdir | delete | move | copy, target: {kind: replica, replica} | {kind: volume, volume}, path, …},
    `tunnelOpen` {replica, port}, `tunnelData` {data}, `tunnelClose` {reason?}; node → control plane
    `execOutput` {data, stream?}, `execExit` {code, error?}, `fileResponse` {ok, error?, entries?, entry?, data?},
    `tunnelData` {data}, `tunnelClose` {reason?}. `data` is base64, at most 256 KiB per message. The desired state
    carries `liveAccess.nodeShell` (the Cluster's `nodeShellEnabled`); the node refuses node shells without it.
    `tty: false` (with `user`, `workingDir`, `env`), `execInput.eof` and `execOutput.stream: stderr` are machine exec
    (protocol feature `exec-stdio`): only sent to nodes that advertise it.
servers:
  local:
    host: localhost:3400
    protocol: ws
    description: |
      Socket.IO on shared HTTP PORT (env `PORT`, default 3400); Engine.IO path `/socket.io/`.
      Namespaces **socket/plans** (LOADWEAVER_PLANS_WEBSOCKET_NAMESPACE), **socket/logs**
      (LOADWEAVER_LOGS_WEBSOCKET_NAMESPACE), **socket/terminals** (LOADWEAVER_TERMINALS_WEBSOCKET_NAMESPACE),
      **socket/tunnels** (LOADWEAVER_TUNNELS_WEBSOCKET_NAMESPACE), **socket/exec**
      (LOADWEAVER_EXEC_WEBSOCKET_NAMESPACE) and **socket/topology** (LOADWEAVER_TOPOLOGY_WEBSOCKET_NAMESPACE). CORS via WEBSOCKET_CORS_ORIGIN
      (falls back to CORS_ORIGIN).
      Pass Authorization header in handshake (or handshake.auth.Authorization for browser WebSockets).
channels:
  plans/plansSnapshot:
    address: plans/plansSnapshot
    messages:
      plansSnapshotEvent:
        $ref: '#/components/messages/PlansSnapshot'
    description: |
      Unicast to the connecting socket only, once on connect: up to 50 visible plans in `pending`, `applying`,
      `rolling-back` or `rollback-failed`, newest first.
  plans/planPatch:
    address: plans/planPatch
    messages:
      planPatchEvent:
        $ref: '#/components/messages/PlanPatch'
    description: |
      The whole plan each time a visible plan changed (status, approvals, progress, rollback), polled from the
      database about every second. A plan can arrive more than once; the latest one wins.
  logs/subscribe:
    address: logs/subscribe
    messages:
      subscribeCommand:
        $ref: '#/components/messages/LogSubscribe'
    description: |
      Client → server on **socket/logs**: start (or replace) the socket's tail with a filter. Access is checked
      right away; an invalid filter, a project the caller can't see, a caller who sees no logs or more than 5000
      tails on the replica answer with `error` and start no tail. The tail starts at the time of subscribing.
  logs/unsubscribe:
    address: logs/unsubscribe
    messages:
      unsubscribeCommand:
        $ref: '#/components/messages/LogUnsubscribe'
    description: "Client → server on **socket/logs**: end the socket's tail (disconnecting does the same)."
  logs/logLines:
    address: logs/logLines
    messages:
      logLinesEvent:
        $ref: '#/components/messages/LogLines'
    description: |
      Unicast to the subscribed socket: new matching lines, oldest first, polled from the log store about every
      2 seconds (at most 500 per poll). Each poll continues after the last line sent; lines that arrive later with
      an older timestamp are not sent (query them with `GET /api/logs`).
  logs/error:
    address: logs/error
    messages:
      logsErrorEvent:
        $ref: '#/components/messages/LogsError'
    description: Unicast to the socket whose `subscribe` was refused.
  terminals/createTerminal:
    address: terminals/createTerminal
    messages:
      createTerminalCommand:
        $ref: '#/components/messages/CreateTerminal'
    description: |
      Client → server on **socket/terminals**: open a terminal in a replica (`docker exec` with a TTY; project
      operators / admins, developers with the project's `developerExec`) or a root shell on a node (cluster admins,
      only while the Cluster's `nodeShellEnabled` is on). At most 10 sessions per socket; sessions belong to their
      socket and close on disconnect or after 30 minutes without input or output. Audited as `terminal.open`.
  terminals/terminalCreated:
    address: terminals/terminalCreated
    messages:
      terminalCreatedEvent:
        $ref: '#/components/messages/TerminalCreated'
    description: Unicast to the socket once the node was asked to start the session.
  terminals/terminalInput:
    address: terminals/terminalInput
    messages:
      terminalInputCommand:
        $ref: '#/components/messages/TerminalInput'
    description: 'Client → server on **socket/terminals**: keystrokes / pasted text for a session of this socket.'
  terminals/terminalResize:
    address: terminals/terminalResize
    messages:
      terminalResizeCommand:
        $ref: '#/components/messages/TerminalResize'
    description: 'Client → server on **socket/terminals**: new terminal size.'
  terminals/terminalOutput:
    address: terminals/terminalOutput
    messages:
      terminalOutputEvent:
        $ref: '#/components/messages/TerminalOutput'
    description: Unicast to the owning socket; the node batches output every 20 ms or 32 KiB.
  terminals/closeTerminal:
    address: terminals/closeTerminal
    messages:
      closeTerminalCommand:
        $ref: '#/components/messages/CloseTerminal'
    description: "Client → server on **socket/terminals**: end a session (the shell's stdin is closed)."
  terminals/terminalClosed:
    address: terminals/terminalClosed
    messages:
      terminalClosedEvent:
        $ref: '#/components/messages/TerminalClosed'
    description: |
      Unicast to the owning socket when the session ended (shell exited, closed, idle, disconnected, or the node
      didn't confirm a close within 5 seconds). Audited as `terminal.close`; a recording is stored now.
  terminals/error:
    address: terminals/error
    messages:
      terminalsErrorEvent:
        $ref: '#/components/messages/TerminalsError'
    description: Unicast to the socket whose request was refused.
  exec/exec:
    address: exec/exec
    messages:
      execExecMessage:
        $ref: '#/components/messages/Exec'
    description: |
      Client → server on **socket/exec**: start a command in a replica without a TTY (operators / admins of
      the replica's project; PATs need `live:exec`). 20 starts per second per user (bursts of 200), 128 sessions per
      socket, 256 per user, 24 h per session. The node needs the protocol feature `exec-stdio`.
  exec/started:
    address: exec/started
    messages:
      execStartedMessage:
        $ref: '#/components/messages/ExecStarted'
    description: |
      Unicast to the socket once the node was asked to start the command.
  exec/stdin:
    address: exec/stdin
    messages:
      execStdinMessage:
        $ref: '#/components/messages/ExecStdin'
    description: |
      Client → server on **socket/exec**: binary stdin (at most 8 MiB/s, bursts of 32 MiB, per session);
      `eof` closes the program's stdin after `data`.
  exec/stdout:
    address: exec/stdout
    messages:
      execStdoutMessage:
        $ref: '#/components/messages/ExecOutput'
    description: |
      Unicast: binary stdout of the program.
  exec/stderr:
    address: exec/stderr
    messages:
      execStderrMessage:
        $ref: '#/components/messages/ExecOutput'
    description: |
      Unicast: binary stderr of the program.
  exec/kill:
    address: exec/kill
    messages:
      execKillMessage:
        $ref: '#/components/messages/ExecKill'
    description: |
      Client → server on **socket/exec**: end the program.
  exec/exit:
    address: exec/exit
    messages:
      execExitMessage:
        $ref: '#/components/messages/ExecExit'
    description: |
      Unicast when the program ended (or the session failed / was killed / timed out: `exitCode` null with
      `error`). Audited as `exec.run` (node, program, exit code, duration, bytes).
  exec/error:
    address: exec/error
    messages:
      execErrorMessage:
        $ref: '#/components/messages/ExecError'
    description: |
      Unicast to the socket whose request was refused.
  tunnels/openTunnel:
    address: tunnels/openTunnel
    messages:
      openTunnelCommand:
        $ref: '#/components/messages/OpenTunnel'
    description: |
      Client → server on **socket/tunnels**: open a TCP connection from the replica's node to `port` of the replica
      (project operators / admins). At most 16 per socket. Recorded in `lw_tunnels` and audited as `tunnel.open`;
      the node adds a temporary nftables allowance for exactly that address and port while it is open.
  tunnels/tunnelOpened:
    address: tunnels/tunnelOpened
    messages:
      tunnelOpenedEvent:
        $ref: '#/components/messages/TunnelOpened'
    description: Unicast to the socket once the node was asked to connect; data may be sent from now on.
  tunnels/tunnelData:
    address: tunnels/tunnelData
    messages:
      tunnelDataMessage:
        $ref: '#/components/messages/TunnelData'
    description: "Both directions on **socket/tunnels**: bytes of the tunnel's TCP stream, base64."
  tunnels/closeTunnel:
    address: tunnels/closeTunnel
    messages:
      closeTunnelCommand:
        $ref: '#/components/messages/CloseTunnel'
    description: 'Client → server on **socket/tunnels**: close a tunnel of this socket.'
  tunnels/tunnelClosed:
    address: tunnels/tunnelClosed
    messages:
      tunnelClosedEvent:
        $ref: '#/components/messages/TunnelClosed'
    description: |
      Unicast to the owning socket when the tunnel ended: closed by the client, `expired` (TTL), `disconnected`,
      or closed by the node / replica (with its reason). Audited as `tunnel.close`.
  tunnels/tunnelError:
    address: tunnels/tunnelError
    messages:
      tunnelErrorEvent:
        $ref: '#/components/messages/TunnelError'
    description: Unicast to the socket whose `openTunnel` was refused.
  topology/subscribe:
    address: topology/subscribe
    messages:
      topologySubscribeCommand:
        $ref: '#/components/messages/TopologySubscribe'
    description: |
      Client → server on **socket/topology**: start receiving live flows. The caller's access is resolved once, at
      subscribe; a replica holds up to 2000 subscribers (beyond that `error`). The first `flows` usually follows
      right away.
  topology/unsubscribe:
    address: topology/unsubscribe
    messages:
      topologyUnsubscribeCommand:
        $ref: '#/components/messages/TopologyUnsubscribe'
    description: 'Client → server on **socket/topology**: stop the live flows (disconnecting does the same).'
  topology/flows:
    address: topology/flows
    messages:
      topologyFlowsEvent:
        $ref: '#/components/messages/TopologyFlows'
    description: |
      Unicast to each subscribed socket about every 10 seconds: the flow edges of the last minute, computed once per
      tick for all subscribers and scoped per socket like `GET /api/topology?flows=true`.
  topology/error:
    address: topology/error
    messages:
      topologyErrorEvent:
        $ref: '#/components/messages/TopologyError'
    description: Unicast to the socket whose `subscribe` was refused.
operations:
  plansServerEmitsPlansSnapshot:
    action: receive
    channel:
      $ref: '#/channels/plans~1plansSnapshot'
  plansServerEmitsPlanPatch:
    action: receive
    channel:
      $ref: '#/channels/plans~1planPatch'
  logsClientSendsSubscribe:
    action: send
    channel:
      $ref: '#/channels/logs~1subscribe'
  logsClientSendsUnsubscribe:
    action: send
    channel:
      $ref: '#/channels/logs~1unsubscribe'
  logsServerEmitsLogLines:
    action: receive
    channel:
      $ref: '#/channels/logs~1logLines'
  logsServerEmitsError:
    action: receive
    channel:
      $ref: '#/channels/logs~1error'
  terminalsClientSendsCreateTerminal:
    action: send
    channel:
      $ref: '#/channels/terminals~1createTerminal'
  terminalsServerEmitsTerminalCreated:
    action: receive
    channel:
      $ref: '#/channels/terminals~1terminalCreated'
  terminalsClientSendsTerminalInput:
    action: send
    channel:
      $ref: '#/channels/terminals~1terminalInput'
  terminalsClientSendsTerminalResize:
    action: send
    channel:
      $ref: '#/channels/terminals~1terminalResize'
  terminalsServerEmitsTerminalOutput:
