    channel:
      $ref: '#/channels/topology~1error'
components:
  messages:
    PlansSnapshot:
      name: PlansSnapshot
      title: Active plans on connect
      contentType: application/json
      payload:
        type: object
        required: [plans]
        properties:
          plans:
            type: array
            description: Plans in the shape of OpenAPI `PlanResponseDto`; `approvals` is always empty here
            items:
              type: object
              additionalProperties: true
    PlanPatch:
      name: PlanPatch
      title: Plan changed
      contentType: application/json
      payload:
        type: object
        required: [plan]
        properties:
          plan:
            type: object
            description: |
              The plan in the shape of OpenAPI `PlanResponseDto`, including `status`, `progress` (step, percent,
              per node and layer) and `resolves`. `approvals` is always empty here; read them with `GET /api/plans/{id}`.
            additionalProperties: true
    LogSubscribe:
      name: LogSubscribe
      title: Start a tail
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        description: |
          The filter of `GET /api/logs`. Unknown properties are refused. `from`, `to`, `cursor`, `order` and
          `limit` are accepted but ignored.
        properties:
          sources:
            description: Array or comma-separated string
            oneOf:
              - type: array
                items: { $ref: '#/components/schemas/LogSource' }
              - type: string
          levels:
            description: Array or comma-separated string
            oneOf:
              - type: array
                items: { $ref: '#/components/schemas/LogLevel' }
              - type: string
          project:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
          deployment:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
          service: { type: string, pattern: '^[a-z0-9_.-]{1,63}$' }
          replica:
            {
              type: string,
              pattern: '^[a-z0-9-]+/[a-z0-9_.-]+/[a-z0-9_.-]+/\d{1,9}$',
            }
          node:
            { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
          policy: { type: string, maxLength: 256 }
          text:
            {
              type: string,
              maxLength: 256,
              description: Full text over the message,
            }
          from: { type: string, format: date-time }
          to: { type: string, format: date-time }
          cursor: { type: string, maxLength: 512 }
          order: { type: string, enum: [asc, desc] }
          limit: { type: integer, minimum: 1, maximum: 1000 }
    LogUnsubscribe:
      name: LogUnsubscribe
      title: End the tail
      contentType: application/json
      payload:
        description: No payload
    LogLines:
      name: LogLines
      title: New log lines
      contentType: application/json
      payload:
        type: object
        required: [lines]
        properties:
          lines:
            type: array
            items: { $ref: '#/components/schemas/LogLine' }
    LogsError:
      name: LogsError
      title: Subscribe refused
      contentType: application/json
      payload:
        type: object
        required: [message]
        properties:
          message:
            type: string
            description: '`invalid filter`, `too many tails`, `project not found`, `no logs visible`, or another access error'
    CreateTerminal:
      name: CreateTerminal
      title: Open a terminal
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [target]
        properties:
          sessionId:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,64}$'
            description: Chosen by the client (unique per socket); generated when missing
          target:
            oneOf:
              - type: object
                additionalProperties: false
                required: [replica]
                properties:
                  replica:
                    type: string
                    pattern: '^[a-z0-9-]{1,63}/[a-z0-9-]{1,63}/[a-z0-9_.-]{1,63}/\d{1,4}$'
              - type: object
                additionalProperties: false
                required: [node]
                properties:
                  node:
                    type: string
                    pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
          shell:
            type: string
            pattern: '^/[A-Za-z0-9_./-]{1,64}$'
            description: Program to start; default `bash -l` if present, else `sh -l`
          cols: { type: integer, minimum: 1, maximum: 1000, default: 80 }
          rows: { type: integer, minimum: 1, maximum: 1000, default: 24 }
    Exec:
      name: Exec
      title: Start a command (machine exec)
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [execId, replica, command]
        properties:
          execId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
          replica:
            {
              type: string,
              description: '`<project>/<deployment>/<service>/<index>`',
            }
          command:
            {
              type: array,
              minItems: 1,
              maxItems: 256,
              items: { type: string, maxLength: 32768 },
            }
          user: { type: string, description: 'name, uid or uid:gid' }
          workingDir: { type: string, description: absolute path }
          env:
            {
              type: array,
              maxItems: 256,
              items: { type: string, description: '`NAME=value`' },
            }
    ExecStarted:
      name: ExecStarted
      title: Command started
      contentType: application/json
      payload:
        type: object
        required: [execId]
        properties:
          execId: { type: string }
    ExecStdin:
      name: ExecStdin
      title: Stdin (binary)
      contentType: application/octet-stream
      payload:
        type: object
        additionalProperties: false
        required: [execId]
        properties:
          execId: { type: string }
          data:
            {
              type: string,
              format: binary,
              description: Socket.IO binary attachment,
            }
          eof: { type: boolean }
    ExecOutput:
      name: ExecOutput
      title: Stdout / stderr (binary)
      contentType: application/octet-stream
      payload:
        type: object
        required: [execId, data]
        properties:
          execId: { type: string }
          data:
            {
              type: string,
              format: binary,
              description: Socket.IO binary attachment,
            }
    ExecKill:
      name: ExecKill
      title: End a command
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [execId]
        properties:
          execId: { type: string }
    ExecExit:
      name: ExecExit
      title: Command ended
      contentType: application/json
      payload:
        type: object
        required: [execId, exitCode]
        properties:
          execId: { type: string }
          exitCode: { type: [integer, 'null'] }
          error: { type: string }
    ExecError:
      name: ExecError
      title: Request refused
      contentType: application/json
      payload:
        type: object
        required: [message]
        properties:
          execId: { type: string }
          message: { type: string }
    TerminalCreated:
      name: TerminalCreated
      title: Terminal started
      contentType: application/json
      payload:
        type: object
        required: [sessionId, recorded]
        properties:
          sessionId: { type: string }
          recorded:
            type: boolean
            description: The session is recorded (node shells always; replicas per Cluster / project policy)
    TerminalInput:
      name: TerminalInput
      title: Terminal input
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [sessionId, data]
        properties:
          sessionId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
          data: { type: string, maxLength: 65536, description: UTF-8 text }
    TerminalResize:
      name: TerminalResize
      title: Terminal resized
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [sessionId, cols, rows]
        properties:
          sessionId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
          cols: { type: integer, minimum: 1, maximum: 1000 }
          rows: { type: integer, minimum: 1, maximum: 1000 }
    TerminalOutput:
      name: TerminalOutput
      title: Terminal output
      contentType: application/json
      payload:
        type: object
        required: [sessionId, data]
        properties:
          sessionId: { type: string }
          data:
            {
              type: string,
              description: UTF-8 text (split multi-byte characters are joined),
            }
    CloseTerminal:
      name: CloseTerminal
      title: Close a terminal
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [sessionId]
        properties:
          sessionId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    TerminalClosed:
      name: TerminalClosed
      title: Terminal ended
      contentType: application/json
      payload:
        type: object
        required: [sessionId, exitCode]
        properties:
          sessionId: { type: string }
          exitCode: { type: [integer, 'null'] }
          error:
            type: string
            description: Why the session ended without an exit code (e.g. `node shells are disabled for this cluster`, `idle`, `node not connected`)
    TerminalsError:
      name: TerminalsError
      title: Terminal request refused
      contentType: application/json
      payload:
        type: object
        required: [message]
        properties:
          sessionId: { type: string }
          message:
            type: string
            description: '`invalid payload`, `too many terminals`, `session exists`, `unknown session`, `replica not found`, `exec not allowed`, `cluster admin role required`, `node shells are disabled for this cluster`, …'
    OpenTunnel:
      name: OpenTunnel
      title: Open a debug tunnel
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [tunnelId, replica, port]
        properties:
          tunnelId:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,64}$'
            description: Chosen by the client, unique per socket
          replica:
            type: string
            pattern: '^[a-z0-9-]{1,63}/[a-z0-9-]{1,63}/[a-z0-9_.-]{1,63}/\d{1,4}$'
          port: { type: integer, minimum: 1, maximum: 65535 }
          ttlSeconds:
            { type: integer, minimum: 60, maximum: 28800, default: 3600 }
    TunnelOpened:
      name: TunnelOpened
      title: Tunnel opened
      contentType: application/json
      payload:
        type: object
        required: [tunnelId, expiresAt]
        properties:
          tunnelId: { type: string }
          expiresAt: { type: string, format: date-time }
    TunnelData:
      name: TunnelData
      title: Tunnel bytes
      contentType: application/json
      payload:
        type: object
        required: [tunnelId, data]
        properties:
          tunnelId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
          data:
            type: string
            contentEncoding: base64
            description: At most 256 KiB of bytes per message
    CloseTunnel:
      name: CloseTunnel
      title: Close a tunnel
      contentType: application/json
      payload:
        type: object
        additionalProperties: false
        required: [tunnelId]
        properties:
          tunnelId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    TunnelClosed:
      name: TunnelClosed
      title: Tunnel closed
      contentType: application/json
      payload:
        type: object
        required: [tunnelId, reason]
        properties:
          tunnelId: { type: string }
          reason: { type: string }
    TunnelError:
      name: TunnelError
      title: Tunnel refused
      contentType: application/json
      payload:
        type: object
        required: [message]
        properties:
          tunnelId: { type: string }
          message:
            type: string
            description: '`invalid payload`, `too many tunnels or duplicate id`, `replica not found`, `operator role required`, …'
    TopologySubscribe:
      name: TopologySubscribe
      title: Start live flows
      contentType: application/json
      payload:
        description: No payload
    TopologyUnsubscribe:
      name: TopologyUnsubscribe
      title: Stop live flows
      contentType: application/json
      payload:
        description: No payload
    TopologyFlows:
      name: TopologyFlows
      title: Flows of the last minute
      contentType: application/json
      payload:
        type: object
        required: [at, edges]
        properties:
          at: { type: string, format: date-time }
          edges:
            type: array
            items: { $ref: '#/components/schemas/TopologyFlowEdge' }
    TopologyError:
      name: TopologyError
      title: Subscribe refused
      contentType: application/json
      payload:
        type: object
        required: [message]
        properties:
          message:
            type: string
            description: '`too many subscribers`'
  schemas:
    TopologyFlowEdge:
      type: object
      description: |
        A flow edge in the shape of OpenAPI `TopologyEdge` (`kind: flow`, layer `policies`). `source` and `target`
        are element ids of `GET /api/topology`: `replica:<id>`, or `external:<address>` for endpoints that aren't
        replicas (not in the map's elements unless the map was loaded with `flows=true`).
      required: [id, kind, source, target, layer, data]
      properties:
        id: { type: string }
        kind: { type: string, enum: [flow] }
        source: { type: string }
        target: { type: string }
        layer: { type: string, enum: [policies] }
        data:
          type: object
          properties:
            protocol: { type: string }
            port: { type: integer }
            decision: { type: string }
            policy: { type: [string, 'null'] }
            packets: { type: integer }
            bytes: { type: integer }
            bytesPerSecond: { type: number }
    LogSource:
      type: string
      enum:
        [
          container,
          proxy,
          firewall,
          routing,
          tunnel,
          ingress,
          failover,
          storage,
          runtime,
          control-plane,
        ]
    LogLevel:
      type: string
      enum: [debug, info, warn, error]
    LogLine:
      type: object
      description: The same shape as OpenAPI `LogLine`.
      required: [id, at, source, level, message, node, labels, fields]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/LogSource' }
        level: { $ref: '#/components/schemas/LogLevel' }
        message: { type: string, maxLength: 16384 }
        node:
          type: string
          description: Sending node, or `control-plane` for the control plane's own events
        site: { type: [string, 'null'] }
        cluster: { type: string }
        labels:
          type: object
          properties:
            project: { type: string }
            deployment: { type: string }
            service: { type: string }
            replica:
              {
                type: string,
                description: '`<project>/<deployment>/<service>/<index>`',
              }
            policy: { type: string }
            peer: { type: string }
            component: { type: string }
            stream: { type: string, enum: [stdout, stderr] }
        fields:
          type: object
          additionalProperties: { type: [string, number, boolean] }
