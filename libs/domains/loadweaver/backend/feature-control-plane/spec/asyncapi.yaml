      $ref: '#/channels/tunnels~1tunnelData'
  tunnelsClientSendsCloseTunnel:
    action: send
    channel:
      $ref: '#/channels/tunnels~1closeTunnel'
  tunnelsServerEmitsTunnelClosed:
    action: receive
    channel:
      $ref: '#/channels/tunnels~1tunnelClosed'
  tunnelsServerEmitsTunnelError:
    action: receive
    channel:
      $ref: '#/channels/tunnels~1tunnelError'
  topologyClientSendsSubscribe:
