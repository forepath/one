    channel:
      $ref: '#/channels/terminals~1terminalOutput'
  terminalsClientSendsCloseTerminal:
    action: send
    channel:
      $ref: '#/channels/terminals~1closeTerminal'
  terminalsServerEmitsTerminalClosed:
    action: receive
    channel:
      $ref: '#/channels/terminals~1terminalClosed'
  terminalsServerEmitsError:
    action: receive
    channel:
      $ref: '#/channels/terminals~1error'
  execClientSendsExec:
    action: send
    channel:
      $ref: '#/channels/exec~1exec'
  execServerEmitsStarted:
    action: receive
    channel:
      $ref: '#/channels/exec~1started'
  execClientSendsStdin:
    action: send
    channel:
      $ref: '#/channels/exec~1stdin'
  execServerEmitsStdout:
    action: receive
    channel:
      $ref: '#/channels/exec~1stdout'
  execServerEmitsStderr:
    action: receive
    channel:
      $ref: '#/channels/exec~1stderr'
  execClientSendsKill:
    action: send
    channel:
      $ref: '#/channels/exec~1kill'
  execServerEmitsExit:
    action: receive
    channel:
      $ref: '#/channels/exec~1exit'
  execServerEmitsError:
    action: receive
    channel:
      $ref: '#/channels/exec~1error'
  tunnelsClientSendsOpenTunnel:
    action: send
    channel:
      $ref: '#/channels/tunnels~1openTunnel'
  tunnelsServerEmitsTunnelOpened:
