# Spike: append-only-ish S3 proxy in front of Garage. Denies DELETE and multi-object delete (POST ?delete),
# Spike proxy: append-only-ish S3 in front of Garage, logs every request (envoyproxy/envoy:v1.40.0@sha256:459f2a64...).
# logs every request so overwrites (second PUT of the same key) can be found in the access log.
static_resources:
  listeners:
    - name: s3
      address: { socket_address: { address: 0.0.0.0, port_value: 3900 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: s3
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        {
                          text_format_source:
                            {
                              inline_string: "S3LOG %REQ(:METHOD)% %REQ(:PATH)% %RESPONSE_CODE%\n",
                            },
                        }
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ['*']
                      routes:
                        [
                          {
                            match: { prefix: '/' },
                            route: { cluster: garage, timeout: 300s },
                          },
                        ]
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(h)
                            local m = h:headers():get(":method")
                            local p = h:headers():get(":path")
                            if m == "DELETE" or (m == "POST" and string.find(p, "[?&]delete") ~= nil) then
                              h:respond({[":status"] = "403", ["content-type"] = "application/xml"},
                                "<?xml version=\"1.0\" encoding=\"UTF-8\"?><Error><Code>AccessDenied</Code><Message>append-only</Message></Error>")
                            end
                          end
                  - name: envoy.filters.http.router
                    typed_config:
                      {
                        '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router,
                      }
  clusters:
    - name: garage
      type: STRICT_DNS
      load_assignment:
        cluster_name: garage
        endpoints:
          [
            {
              lb_endpoints:
                [
                  {
                    endpoint:
                      {
                        address:
                          {
                            socket_address:
                              { address: lw-spike-garage, port_value: 3900 },
                          },
                      },
                  },
                ],
            },
          ]
