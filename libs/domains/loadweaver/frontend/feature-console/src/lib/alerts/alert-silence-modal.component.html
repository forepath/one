<fpc-modal [open]="open()" (openChange)="open.set($event)" [title]="title">
  <form (ngSubmit)="submit()" id="lw-silence-form" data-testid="silence-form">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <fpc-form-field forId="lw-silence-rule" i18n-label="@@lwConsoleSilence-rule" label="Rule">
          <fpc-form-control
            controlId="lw-silence-rule"
            name="rule"
            size="sm"
            controlClass="font-monospace"
            placeholder="builtin:node-down, rule:shop/*"
            [(ngModel)]="rule"
          />
        </fpc-form-field>
      </div>
      <div class="col-12 col-md-6">
        <fpc-form-field forId="lw-silence-project" i18n-label="@@lwConsoleSilence-project" label="Project">
          <fpc-typeahead-select
            inputId="lw-silence-project"
            listboxId="lw-silence-projects"
            size="sm"
            [placeholder]="null"
            [query]="project"
            (queryChange)="project = $event"
            [(open)]="projectSuggestionsOpen"
          >
            <div fpcTypeaheadSuggestions>
              @for (p of projectSuggestions(); track p) {
                <button type="button" class="dropdown-item small" (mousedown)="pickProject(p, $event)">
                  {{ p }}
                </button>
              }
            </div>
          </fpc-typeahead-select>
        </fpc-form-field>
      </div>
      <div class="col-12">
        <fpc-form-field forId="lw-silence-key" i18n-label="@@lwConsoleSilence-key" label="Key">
          <fpc-form-control
            controlId="lw-silence-key"
            name="key"
            size="sm"
            controlClass="font-monospace"
            [(ngModel)]="key"
          />
        </fpc-form-field>
      </div>
      <div class="col-12">
        <fpc-form-field forId="lw-silence-reason" i18n-label="@@lwConsoleSilence-reason" label="Reason" required>
          <fpc-form-control
            controlType="textarea"
            controlId="lw-silence-reason"
            name="reason"
            size="sm"
            [rows]="2"
            required
            [(ngModel)]="reason"
          />
        </fpc-form-field>
      </div>
      <div class="col-12 col-md-6">
        <fpc-form-field forId="lw-silence-starts" i18n-label="@@lwConsoleSilence-starts" label="Starts (empty: now)">
          <fpc-form-control
            controlId="lw-silence-starts"
            name="startsAt"
            inputType="datetime-local"
            size="sm"
            [(ngModel)]="startsAt"
          />
        </fpc-form-field>
      </div>
      <div class="col-12 col-md-6">
        <fpc-form-field forId="lw-silence-ends" i18n-label="@@lwConsoleSilence-ends" label="Ends" required>
          <fpc-form-control
            controlId="lw-silence-ends"
            name="endsAt"
            inputType="datetime-local"
            size="sm"
            required
            [(ngModel)]="endsAt"
          />
        </fpc-form-field>
      </div>
    </div>
    @if (invalid(); as message) {
      <fpc-alert class="mt-3" variant="warning" [message]="message" />
    }
    @if (error(); as message) {
      <fpc-alert class="mt-3" variant="danger" [message]="message" />
    }
  </form>
  <div *fpcModalFooter class="d-flex justify-content-end gap-2">
    <fpc-button variant="secondary" (clicked)="open.set(false)">
      <span i18n="@@lwConsoleSilence-cancel">Cancel</span>
    </fpc-button>
    <fpc-button variant="primary" [loading]="saving()" (clicked)="submit()" data-testid="silence-submit">
      <span i18n="@@lwConsoleSilence-create">Create silence</span>
    </fpc-button>
  </div>
</fpc-modal>
