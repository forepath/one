<div class="docs-layout d-flex flex-column h-100">
  <fpc-top-bar class="docs-layout__top-bar">
    <a
      fpcTopBarBrand
      [routerLink]="getBasePath()"
      class="docs-layout__brand text-decoration-none text-white d-flex align-items-center gap-2 gap-md-3 min-w-0"
    >
      <span class="docs-layout__brand-mark bg-primary flex-shrink-0">
        <img
          src="assets/images/icon_light.svg"
          i18n-alt="@@featureDocsLayout-brandAlt"
          [attr.alt]="productName"
          class="docs-layout__brand-icon"
        />
      </span>
      <h5 class="mb-0 d-none d-md-block text-truncate" i18n="@@featureDocsLayout-documentation">Documentation</h5>
    </a>

    <fpc-language-switcher
      data-bs-theme="dark"
      [locales]="localeService.getAvailableLocales()"
      [locale]="localeService.getCurrentLocale()"
      [ariaLabel]="languageSwitcherAriaLabel"
      (localeChange)="onLocaleChange($event)"
    />

    @if (isBrowser) {
      <framework-docs-search [searchField]="!isMobile()" />
    }

    <fpc-button
      class="d-none d-md-inline-flex fpc-top-bar__action"
      variant="link"
      size="sm"
      iconOnly
      href="https://github.com/forepath/one"
      target="_blank"
      rel="noopener noreferrer"
      [ariaLabel]="githubAriaLabel"
      [title]="githubTitle"
    >
      <i class="bi bi-github fs-5" aria-hidden="true"></i>
    </fpc-button>

    <fpc-theme-switcher
      [dark]="themeService.isDarkMode()"
      [ariaLabel]="toggleDarkModeTitle"
      (darkChange)="themeService.setTheme($event)"
    />

    <fpc-button
      class="d-md-none fpc-top-bar__action"
      variant="link"
      size="sm"
      iconOnly
      [ariaLabel]="toggleNavAriaLabel"
      [title]="toggleNavAriaLabel"
      (clicked)="toggleMobileMenu()"
    >
      <i class="bi bi-list fs-5" aria-hidden="true"></i>
    </fpc-button>
  </fpc-top-bar>

  <div class="docs-main border-top flex-grow-1 d-flex overflow-hidden">
    <aside class="docs-sidebar border-end" [class.mobile-open]="mobileMenuOpen()">
      <div class="docs-sidebar-content">
        <framework-docs-navigation [navigationNodes]="navigationNodes()!" />
      </div>
      @if (mobileMenuOpen()) {
        <div class="docs-sidebar-overlay" (click)="closeMobileMenu()"></div>
      }
    </aside>

    <fpc-section-container>
      <router-outlet></router-outlet>
    </fpc-section-container>
  </div>
</div>
