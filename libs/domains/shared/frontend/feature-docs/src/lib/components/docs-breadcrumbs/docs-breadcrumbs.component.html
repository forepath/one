<fpc-breadcrumbs [ariaLabel]="breadcrumbAriaLabel">
  <fpc-breadcrumb-item [label]="documentationLabel" href="/docs" (selected)="onCrumbSelected($event, '/docs')" />
  @for (crumb of breadcrumbs(); track crumb.path) {
    <fpc-breadcrumb-item
      [label]="crumb.title"
      [href]="$last ? null : crumb.path"
      [active]="$last"
      (selected)="onCrumbSelected($event, crumb.path)"
    />
  }
</fpc-breadcrumbs>
