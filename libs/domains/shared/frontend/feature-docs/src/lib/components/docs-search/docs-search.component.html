<!-- Field-like trigger (top-bar search concept): icon only on narrow bars, label and shortcut from lg. -->
<button
  type="button"
  class="fpc-top-bar__search"
  [title]="searchTitle"
  [attr.aria-label]="searchPlaceholder"
  aria-haspopup="dialog"
  [attr.aria-expanded]="paletteOpen()"
  (click)="openPalette()"
  data-testid="docs-search-trigger"
>
  <i class="bi bi-search" aria-hidden="true"></i>
  <span class="fpc-top-bar__search-text d-none d-lg-inline">{{ searchPlaceholder }}</span>
  <kbd class="fpc-top-bar__search-key d-none d-lg-inline">Ctrl K</kbd>
</button>

<fpc-command-palette
  [open]="paletteOpen()"
  (openChange)="onPaletteOpenChange($event)"
  [query]="searchQuery()"
  (queryChange)="onQueryChange($event)"
  [groups]="groups()"
  [loading]="loading()"
  [title]="searchLabel"
  [placeholder]="searchPlaceholder"
  [inputLabel]="searchPlaceholder"
  (itemActivate)="onActivate($event)"
>
  <span fpcCommandPaletteEmpty>{{ searchQuery().trim() ? noResultsMessage : typeToSearchMessage }}</span>
  <div fpcCommandPaletteFooter class="d-flex align-items-center gap-3">
    <span class="d-none d-md-inline">↑ ↓ · Enter · Ctrl + Enter</span>
    <button
      type="button"
      class="btn btn-link btn-sm p-0 ms-auto text-decoration-none"
      (click)="onViewAllResults()"
      data-testid="docs-search-all-results"
    >
      {{ viewAllResultsLabel }}
    </button>
  </div>
</fpc-command-palette>
