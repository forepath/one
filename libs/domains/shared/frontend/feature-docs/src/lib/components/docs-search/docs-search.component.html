<div
  class="docs-search-container"
  [class.docs-search-container--field]="searchField()"
  [class.docs-search-container--icon]="!searchField()"
  (keydown.enter)="onSearchClick()"
>
  @if (searchField()) {
    <fpc-typeahead-select
      inputId="docsSearchInput"
      listboxId="docsSearchInput-listbox"
      [query]="searchQuery()"
      [open]="suggestionsOpen()"
      [openOnFocus]="false"
      [placeholder]="searchPlaceholder"
      [ariaLabel]="searchPlaceholder"
      (queryChange)="onSearchValueChange($event)"
      (openChange)="onSuggestionsOpenChange($event)"
      (cleared)="onCleared()"
    >
      <div fpcTypeaheadSuggestions>
        @if (searchResults().length > 0) {
          @for (result of searchResults(); track result.entry.path) {
            <button type="button" class="dropdown-item py-2 text-start" (mousedown)="onResultClick(result, $event)">
              <span class="fw-medium d-block text-break">{{ result.entry.title }}</span>
              @if (result.entry.summary) {
                <small class="d-block text-muted text-break">{{ result.entry.summary }}</small>
              }
              @if (result.highlights.length > 0) {
                <small class="d-block text-muted" [innerHTML]="result.highlights[0]"></small>
              }
            </button>
          }
          <button type="button" class="dropdown-item py-2 text-center text-primary" (mousedown)="onSearchClick($event)">
            {{ viewAllResultsLabel }}
          </button>
        } @else if (searchQuery().trim().length > 0) {
          <span class="dropdown-item-text text-muted small">{{ noResultsMessage }}</span>
        }
      </div>
    </fpc-typeahead-select>
  } @else {
    <fpc-button
      class="fpc-top-bar__action"
      variant="link"
      size="sm"
      iconOnly
      [ariaLabel]="searchPlaceholder"
      [title]="searchPlaceholder"
      (clicked)="onSearchClick()"
    >
      <i class="bi bi-search" aria-hidden="true"></i>
    </fpc-button>
  }
</div>
