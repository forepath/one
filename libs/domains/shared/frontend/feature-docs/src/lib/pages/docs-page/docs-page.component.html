<!-- The brand character at the end (below) watches the pointer over all of the content, the table of
     contents included. -->
<div class="docs-content-area-container" data-hero-mascot-track>
  <main class="docs-content-area">
    @if (loading()) {
      <div class="d-flex justify-content-center align-items-center p-5">
        <fpc-spinner variant="primary" i18n-label="@@featureDocsPage-loading" label="Loading..." />
      </div>
    } @else if (error()) {
      <fpc-alert variant="danger" [message]="error()!" />
    } @else if (metadata()) {
      <div class="docs-page">
        <framework-docs-breadcrumbs [currentPath]="currentPath()" [navigationNodes]="navigationNodes()!" />

        <div class="row mt-4">
          <div class="col-lg-9">
            <framework-docs-content [metadata]="metadata()!" />
          </div>
          <div class="col-lg-3 d-none d-lg-block">
            <framework-docs-table-of-contents [headings]="metadata()!.headings" />
          </div>
        </div>
      </div>
    }
  </main>
  @if (mascotBrand && metadata()) {
    <!-- The brand character peeking up from the bottom of the content, centred (like the landing footers):
         it pulls itself up while the pointer is in this end area. -->
    <div class="docs-page-end" data-hero-mascot-area>
      <shared-hero-mascot [brand]="mascotBrand" pose="peek" class="docs-page-end__mascot" />
    </div>
  }
</div>
