{{#> email-layout}}
<h1 class="email-title">Login verification</h1>
<p>Use the following code to finish signing in:</p>
<p><span class="code-box">{{code}}</span></p>
<p class="muted">Enter this code on the login verification page. The code expires shortly.</p>
<p class="muted">If you did not try to sign in, you can ignore this email. Your password was not changed.</p>
{{/email-layout}}
