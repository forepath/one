<div class="projects-container border-top d-flex flex-column flex-grow-1 min-h-0">
  <fpc-page-header [title]="pageTitle" />

  <!-- One data list: State · Project (link to the board) · rate · unbilled time · open amount; server paging. -->
  <fpc-data-table
    class="flex-grow-1 min-h-0"
    [ariaLabel]="pageTitle"
    [columns]="columns"
    [rows]="projects()"
    [rowLink]="projectLink"
    paging="server"
    [total]="total()"
    [(page)]="paging.page"
    [(pageSize)]="paging.pageSize"
    persistKey="decabill-projects"
    [(query)]="paging.search"
    [searchPlaceholder]="searchPlaceholder"
    [loading]="loading()"
    [error]="error()"
    [rowMenu]="rowMenu"
    (rowAction)="onRowAction($event.row, $event.item.id)"
    emptyIcon="kanban"
    data-testid="projects-list"
  >
    <span fpcDataTableEmpty>
      <fpc-empty-state icon="kanban" size="sm" message="No projects yet" i18n-message="@@featureProjects-empty" />
    </span>
  </fpc-data-table>
</div>
