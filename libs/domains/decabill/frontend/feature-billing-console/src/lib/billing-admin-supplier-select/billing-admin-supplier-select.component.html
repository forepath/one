<div class="billing-admin-user-select">
  @if (selectedSupplier(); as supplier) {
    <fpc-badge variant="info" color="secondary" class="billing-admin-user-select__chip">
      <span class="text-truncate">{{ supplierPrimaryLabel(supplier) }}</span>
      <button
        type="button"
        class="btn-close billing-admin-user-select__clear"
        [disabled]="disabled()"
        (click)="clearSelection()"
        i18n-aria-label="@@featureBillingAdminSupplierSelect-clearSelectionAria"
        aria-label="Clear selected supplier"
      ></button>
    </fpc-badge>
  } @else {
    <fpc-typeahead-select
      [inputId]="inputId()"
      [listboxId]="inputId() + '-listbox'"
      [size]="size()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [required]="required()"
      [loading]="loading()"
      [openOnFocus]="showSuggestionsOnFocus()"
      [query]="searchQuery()"
      (queryChange)="onSearchChange($event)"
      [open]="suggestionsOpen()"
      (openChange)="suggestionsOpen.set($event)"
      (cleared)="reset()"
    >
      <div fpcTypeaheadSuggestions>
        @if (filteredSuppliers().length > 0) {
          @for (supplier of filteredSuppliers(); track supplier.id) {
            <button type="button" class="dropdown-item py-2 text-start" (mousedown)="pickSupplier(supplier, $event)">
              <span class="d-block small fw-medium text-truncate">{{ supplierPrimaryLabel(supplier) }}</span>
              <span class="d-block font-monospace text-muted small text-truncate">{{ supplier.supplierNumber }}</span>
            </button>
          }
        } @else if (searchQuery().trim() && !loading()) {
          <span class="dropdown-item-text text-muted small" i18n="@@featureBillingAdminSupplierSelect-noSuppliers"
            >No suppliers found.</span
          >
        }
      </div>
    </fpc-typeahead-select>
  }
</div>
