<div class="admin-projects-container border-top d-flex flex-column flex-grow-1 min-h-0">
  <fpc-page-header [title]="pageTitle" />

  @if (bulkResult(); as result) {
    <fpc-alert
      [flush]="true"
      [variant]="result.tone"
      [message]="result.message"
      [dismissible]="true"
      (closed)="bulkResult.set(null)"
      data-testid="admin-projects-bulk-result"
    />
  }

  <!-- One data list: State · Project (link to the board) · facts · customer; ⋮ Edit / Delete; bulk Archive / Delete. -->
  <fpc-data-table
    class="flex-grow-1 min-h-0"
    [ariaLabel]="pageTitle"
    [columns]="columns"
    [rows]="projects()"
    [rowLink]="projectLink"
    paging="server"
    [total]="total()"
    [(page)]="paging.page"
    [(pageSize)]="paging.pageSize"
    persistKey="decabill-admin-projects"
    [(query)]="paging.search"
    [searchPlaceholder]="searchPlaceholder"
    [loading]="loading()"
    [error]="error()"
    selectable
    [(selected)]="selected"
    [rowMenu]="rowMenu"
    (rowAction)="onRowAction($event.row, $event.item.id)"
    emptyIcon="kanban"
    data-testid="admin-projects-list"
  >
    <fpc-button
      fpcDataTableToolbar
      variant="primary"
      size="sm"
      iconOnly
      [disabled]="(creating$ | async) === true"
      [ariaLabel]="addProjectAriaLabel"
      [title]="addProjectAriaLabel"
      (clicked)="openCreateModal()"
    >
      <i class="bi bi-plus" aria-hidden="true"></i>
    </fpc-button>
    <fpc-button
      fpcDataTableBatch
      variant="secondary"
      size="sm"
      [disabled]="!canArchiveSelection()"
      (clicked)="archiveSelected()"
      data-testid="admin-projects-bulk-archive"
      iconOnly
      [ariaLabel]="archiveLabel"
      [title]="archiveLabel"
    >
      <i class="bi bi-archive" aria-hidden="true"></i>
    </fpc-button>
    <fpc-button
      fpcDataTableBatch
      variant="danger"
      size="sm"
      [disabled]="selectedProjects().length === 0"
      (clicked)="confirmBulkDelete.set(true)"
      data-testid="admin-projects-bulk-delete"
      iconOnly
      [ariaLabel]="deleteLabel"
      [title]="deleteLabel"
    >
      <i class="bi bi-trash" aria-hidden="true"></i>
    </fpc-button>

    <span fpcDataTableEmpty>
      <fpc-empty-state icon="kanban" size="sm" message="No projects yet" i18n-message="@@featureAdminProjects-empty" />
    </span>
    <ng-template fpcTableCell="customer" let-row
      ><span [attr.title]="customerTitle(row)">{{ customerLabel(row) }}</span></ng-template
    >
  </fpc-data-table>
</div>

<fpc-modal
  [(open)]="createModalOpen"
  i18n-title="@@featureAdminProjects-createTitle"
  title="Create project"
  cancelLabel="Cancel"
  i18n-cancelLabel="@@featureBillingModal-cancel"
>
  <framework-billing-admin-user-select
    #createUserSelect
    inputId="createProjectUser"
    [users]="usersWithoutProject()"
    [(selectedUserId)]="createForm.userId"
    [required]="true"
  />
  <fpc-form-field
    class="mt-3"
    forId="createProjectName"
    i18n-label="@@featureAdminProjects-nameLabel"
    label="Name"
    required
  >
    <fpc-form-control controlId="createProjectName" [(ngModel)]="createForm.name" name="createName" required />
  </fpc-form-field>
  <fpc-form-field forId="createProjectRate" i18n-label="@@featureAdminProjects-rateLabel" label="Hourly rate (net)">
    <fpc-form-control
      controlId="createProjectRate"
      inputType="number"
      [(ngModel)]="createForm.hourlyRateNet"
      name="createRate"
      min="0"
      step="0.01"
    />
  </fpc-form-field>
  <fpc-form-field
    forId="createProjectTargetHours"
    i18n-label="@@featureAdminProjects-targetHoursLabel"
    label="Target hours"
    i18n-hint="@@featureAdminProjects-targetHoursHint"
    hint="Optional. Leave empty for no target."
  >
    <fpc-form-control
      controlId="createProjectTargetHours"
      inputType="number"
      [(ngModel)]="createTargetHoursInput"
      name="createTargetHours"
      min="0.01"
      step="0.25"
    />
  </fpc-form-field>
  <div *fpcModalFooter class="d-flex justify-content-end gap-2">
    <fpc-button
      variant="primary"
      (clicked)="submitCreate()"
      [disabled]="(creating$ | async) === true"
      i18n="@@featureAdminProjects-create"
    >
      Create
    </fpc-button>
  </div>
</fpc-modal>

<fpc-modal
  [(open)]="editModalOpen"
  i18n-title="@@featureAdminProjects-editTitle"
  title="Edit project"
  cancelLabel="Cancel"
  i18n-cancelLabel="@@featureBillingModal-cancel"
>
  <fpc-form-field forId="editProjectName" i18n-label="@@featureAdminProjects-nameLabel" label="Name">
    <fpc-form-control controlId="editProjectName" [(ngModel)]="editForm.name" name="editName" />
  </fpc-form-field>
  <fpc-form-field forId="editProjectRate" i18n-label="@@featureAdminProjects-rateLabel" label="Hourly rate (net)">
    <fpc-form-control
      controlId="editProjectRate"
      inputType="number"
      [(ngModel)]="editForm.hourlyRateNet"
      name="editRate"
      min="0"
      step="0.01"
    />
  </fpc-form-field>
  <fpc-form-field
    forId="editProjectTargetHours"
    i18n-label="@@featureAdminProjects-targetHoursLabel"
    label="Target hours"
    i18n-hint="@@featureAdminProjects-targetHoursHint"
    hint="Optional. Leave empty for no target."
  >
    <fpc-form-control
      controlId="editProjectTargetHours"
      inputType="number"
      [(ngModel)]="editTargetHoursInput"
      name="editTargetHours"
      min="0.01"
      step="0.25"
    />
  </fpc-form-field>
  <fpc-form-field forId="editProjectStatus" i18n-label="@@featureAdminProjects-statusLabel" label="Status">
    <fpc-form-control
      controlType="select"
      controlId="editProjectStatus"
      [(ngModel)]="editForm.status"
      name="editStatus"
    >
      <option value="active" i18n="@@featureAdminProjects-statusActive">Active</option>
      <option value="archived" i18n="@@featureAdminProjects-statusArchived">Archived</option>
    </fpc-form-control>
  </fpc-form-field>
  <div *fpcModalFooter class="d-flex justify-content-end gap-2">
    <fpc-button
      variant="primary"
      (clicked)="submitEdit()"
      [disabled]="(updating$ | async) === true"
      i18n="@@featureAdminProjects-save"
    >
      Save
    </fpc-button>
  </div>
</fpc-modal>

<fpc-confirm-dialog
  [(open)]="deleteModalOpen"
  i18n-title="@@featureAdminProjects-deleteTitle"
  title="Delete project"
  i18n-confirmLabel="@@featureAdminProjects-delete"
  confirmLabel="Delete"
  [danger]="true"
  [busy]="(deleting$ | async) === true"
  (confirmed)="submitDelete()"
>
  <p i18n="@@featureAdminProjects-deleteConfirm">Delete this project? Unbilled time must be cleared first.</p>
  <p class="text-danger mb-0">
    <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
    <span i18n="@@featureAdminProjects-cannotUndo">This action cannot be undone.</span>
  </p>
</fpc-confirm-dialog>

<fpc-confirm-dialog
  [(open)]="confirmBulkDelete"
  [title]="bulkDeleteTitle"
  [message]="bulkDeleteMessage()"
  [confirmLabel]="deleteLabel"
  [cancelLabel]="cancelLabel"
  [danger]="true"
  (confirmed)="deleteSelected()"
/>
