<div class="meters-container border-top d-flex flex-column flex-grow-1 min-h-0">
  <fpc-page-header [title]="pageTitle" />

  @if (bulkResult(); as result) {
    <fpc-alert
      [flush]="true"
      [variant]="result.tone"
      [message]="result.message"
      [dismissible]="true"
      (closed)="bulkResult.set(null)"
      data-testid="meters-bulk-result"
    />
  }

  <!-- One data list: State · Meter · facts; ⋮ Edit / Delete / Copy ID; bulk Activate / Deactivate / Delete. -->
  <fpc-data-table
    class="flex-grow-1 min-h-0"
    [ariaLabel]="pageTitle"
    [columns]="columns"
    [rows]="meters()"
    paging="client"
    persistKey="decabill-meters"
    [(query)]="searchQuery"
    [searchPlaceholder]="searchPlaceholder"
    [loading]="(loading$ | async) === true"
    [error]="(error$ | async) ?? null"
    selectable
    [(selected)]="selected"
    [rowMenu]="rowMenu"
    (rowAction)="onRowAction($event.row, $event.item.id)"
    (rowActivate)="openEditModal($event)"
    emptyIcon="speedometer2"
    data-testid="meters-list"
  >
    <fpc-button
      fpcDataTableToolbar
      variant="primary"
      size="sm"
      iconOnly
      [disabled]="(loadingAny$ | async) === true"
      [ariaLabel]="addMeterAriaLabel"
      [title]="addMeterAriaLabel"
      (clicked)="openCreateModal()"
    >
      <i class="bi bi-plus" aria-hidden="true"></i>
    </fpc-button>
    <fpc-button
      fpcDataTableBatch
      variant="secondary"
      size="sm"
      [disabled]="!selectedMeters().some((meter) => !meter.isActive)"
      (clicked)="setActiveSelected(true)"
      data-testid="meters-bulk-activate"
      iconOnly
      [ariaLabel]="activateLabel"
      [title]="activateLabel"
    >
      <i class="bi bi-toggle-on" aria-hidden="true"></i>
    </fpc-button>
    <fpc-button
      fpcDataTableBatch
      variant="secondary"
      size="sm"
      [disabled]="!selectedMeters().some((meter) => meter.isActive)"
      (clicked)="setActiveSelected(false)"
      data-testid="meters-bulk-deactivate"
      iconOnly
      [ariaLabel]="deactivateLabel"
      [title]="deactivateLabel"
    >
      <i class="bi bi-toggle-off" aria-hidden="true"></i>
    </fpc-button>
    <fpc-button
      fpcDataTableBatch
      variant="danger"
      size="sm"
      [disabled]="selectedMeters().length === 0"
      (clicked)="confirmBulkDelete.set(true)"
      data-testid="meters-bulk-delete"
      iconOnly
      [ariaLabel]="deleteLabel"
      [title]="deleteLabel"
    >
      <i class="bi bi-trash" aria-hidden="true"></i>
    </fpc-button>

    <span fpcDataTableEmpty>
      <fpc-empty-state icon="speedometer2" size="sm" message="No meters yet" i18n-message="@@featureMeters-empty" />
    </span>
  </fpc-data-table>
</div>

<fpc-confirm-dialog
  [(open)]="confirmBulkDelete"
  [title]="bulkDeleteTitle"
  [message]="bulkDeleteMessage()"
  [confirmLabel]="deleteLabel"
  [cancelLabel]="cancelLabel"
  [danger]="true"
  (confirmed)="deleteSelected()"
/>

<fpc-modal
  [(open)]="createModalOpen"
  size="lg"
  i18n-title="@@featureMeters-createTitle"
  title="Create meter"
  cancelLabel="Cancel"
  i18n-cancelLabel="@@featureBillingModal-cancel"
>
  <form (ngSubmit)="onSubmitCreate()">
    <ng-container
      *ngTemplateOutlet="meterForm; context: { form: createForm, prefix: 'create', disabled: (creating$ | async) }"
    ></ng-container>
    <div *fpcModalFooter class="d-flex justify-content-end gap-2">
      <fpc-button variant="primary" type="submit" [disabled]="(creating$ | async) === true">
        <span i18n="@@featureMeters-create">Create</span>
      </fpc-button>
    </div>
  </form>
</fpc-modal>

<fpc-modal
  [(open)]="editModalOpen"
  size="lg"
  i18n-title="@@featureMeters-editTitle"
  title="Edit meter"
  cancelLabel="Cancel"
  i18n-cancelLabel="@@featureBillingModal-cancel"
>
  <form (ngSubmit)="onSubmitEdit()">
    <ng-container
      *ngTemplateOutlet="meterForm; context: { form: editForm, prefix: 'edit', disabled: (updating$ | async) }"
    ></ng-container>
    <div *fpcModalFooter class="d-flex justify-content-end gap-2">
      <fpc-button variant="primary" type="submit" [disabled]="(updating$ | async) === true">
        <span i18n="@@featureMeters-save">Save changes</span>
      </fpc-button>
    </div>
  </form>
</fpc-modal>

<ng-template #meterForm let-form="form" let-prefix="prefix" let-disabled="disabled">
  <div class="row g-3">
    <div class="col-md-6">
      <fpc-form-field [forId]="prefix + 'MeterKey'" i18n-label="@@featureMeters-key" label="Key" required>
        <fpc-form-control
          [controlId]="prefix + 'MeterKey'"
          [(ngModel)]="form.key"
          [name]="prefix + 'MeterKey'"
          [disabled]="prefix === 'edit' || disabled"
          required
        />
      </fpc-form-field>
    </div>
    <div class="col-md-6">
      <fpc-form-field [forId]="prefix + 'MeterName'" i18n-label="@@featureMeters-name" label="Name" required>
        <fpc-form-control
          [controlId]="prefix + 'MeterName'"
          [(ngModel)]="form.name"
          [name]="prefix + 'MeterName'"
          [disabled]="disabled"
          required
        />
      </fpc-form-field>
    </div>
    <div class="col-12">
      <fpc-form-field
        [forId]="prefix + 'MeterDescription'"
        i18n-label="@@featureMeters-description"
        label="Description"
      >
        <fpc-form-control
          controlType="textarea"
          [rows]="2"
          [controlId]="prefix + 'MeterDescription'"
          [(ngModel)]="form.description"
          [name]="prefix + 'MeterDescription'"
          [disabled]="disabled"
        />
      </fpc-form-field>
    </div>
    <div class="col-md-4">
      <fpc-form-field [forId]="prefix + 'MeterUnitLabel'" i18n-label="@@featureMeters-unitLabel" label="Unit label">
        <fpc-form-control
          [controlId]="prefix + 'MeterUnitLabel'"
          [(ngModel)]="form.unitLabel"
          [name]="prefix + 'MeterUnitLabel'"
          [disabled]="disabled"
        />
      </fpc-form-field>
    </div>
    <div class="col-md-4">
      <fpc-form-field [forId]="prefix + 'MeterAggregator'" i18n-label="@@featureMeters-aggregator" label="Aggregator">
        <fpc-form-control
          controlType="select"
          [controlId]="prefix + 'MeterAggregator'"
          [(ngModel)]="form.aggregator"
          [name]="prefix + 'MeterAggregator'"
          [disabled]="disabled"
        >
          @for (aggregator of aggregators; track aggregator) {
            <option [value]="aggregator">{{ aggregatorLabel(aggregator) }}</option>
          }
        </fpc-form-control>
      </fpc-form-field>
    </div>
    <div class="col-md-4">
      <fpc-form-field
        [forId]="prefix + 'MeterDefaultPrice'"
        i18n-label="@@featureMeters-defaultUnitPriceNet"
        label="Default unit price (net)"
        required
      >
        <fpc-form-control
          inputType="number"
          min="0"
          step="0.0001"
          [controlId]="prefix + 'MeterDefaultPrice'"
          [(ngModel)]="form.defaultUnitPriceNet"
          [name]="prefix + 'MeterDefaultPrice'"
          [disabled]="disabled"
          required
        />
      </fpc-form-field>
    </div>
    <div class="col-md-4">
      <fpc-form-field
        [forId]="prefix + 'MeterDefaultIncludedUsage'"
        i18n-label="@@featureMeters-defaultIncludedUsage"
        label="Default included usage"
      >
        <fpc-form-control
          inputType="number"
          min="0"
          step="1"
          [controlId]="prefix + 'MeterDefaultIncludedUsage'"
          [(ngModel)]="form.defaultIncludedUsage"
          [name]="prefix + 'MeterDefaultIncludedUsage'"
          [disabled]="disabled"
        />
      </fpc-form-field>
    </div>
    <div class="col-12">
      <fpc-form-switch
        [switchId]="prefix + 'MeterActive'"
        [(ngModel)]="form.isActive"
        [name]="prefix + 'MeterActive'"
        [disabled]="disabled"
        i18n-label="@@featureMeters-active"
        label="Active"
      />
    </div>
  </div>
</ng-template>

<fpc-confirm-dialog
  [(open)]="deleteConfirmModalOpen"
  i18n-title="@@featureMeters-deleteTitle"
  title="Delete meter"
  i18n-confirmLabel="@@featureMeters-delete"
  confirmLabel="Delete"
  [danger]="true"
  [busy]="(deleting$ | async) === true"
  (confirmed)="confirmDelete()"
>
  @if (meterToDelete) {
    <p i18n="@@featureMeters-deleteConfirm">Delete meter "{{ meterToDelete.name }}"?</p>
    <p class="text-danger mb-0" i18n="@@featureMeters-cannotUndo">This action cannot be undone.</p>
  }
</fpc-confirm-dialog>
