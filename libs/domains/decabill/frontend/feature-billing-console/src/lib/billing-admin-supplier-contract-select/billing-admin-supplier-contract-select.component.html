<div class="billing-admin-user-select">
  @if (selectedContract(); as contract) {
    <fpc-badge variant="info" color="secondary" class="billing-admin-user-select__chip">
      <span class="text-truncate">{{ contract.contractNumber }}</span>
      <button
        type="button"
        class="btn-close billing-admin-user-select__clear"
        [disabled]="disabled()"
        (click)="clearSelection()"
        i18n-aria-label="@@featureBillingAdminSupplierContractSelect-clearSelectionAria"
        aria-label="Clear selected contract"
      ></button>
    </fpc-badge>
  } @else {
    <fpc-typeahead-select
      [inputId]="inputId()"
      [listboxId]="inputId() + '-listbox'"
      [placeholder]="supplierId()?.trim() ? placeholder() : loadingPlaceholder"
      [disabled]="isInputDisabled()"
      [loading]="searchLoading()"
      [openOnFocus]="showSuggestionsOnFocus()"
      [query]="searchQuery()"
      (queryChange)="onSearchChange($event)"
      [open]="suggestionsOpen()"
      (openChange)="suggestionsOpen.set($event)"
      (cleared)="reset()"
    >
      <div fpcTypeaheadSuggestions>
        @if (filteredContracts().length > 0) {
          @for (contract of filteredContracts(); track contract.id) {
            <button type="button" class="dropdown-item py-2 text-start" (mousedown)="pickContract(contract, $event)">
              <span class="d-block small fw-medium text-truncate">{{ contract.contractNumber }}</span>
            </button>
          }
        } @else if (searchQuery().trim() && !searchLoading()) {
          <span
            class="dropdown-item-text text-muted small"
            i18n="@@featureBillingAdminSupplierContractSelect-noContracts"
            >No contracts found.</span
          >
        }
      </div>
    </fpc-typeahead-select>
  }
</div>
