<div class="section__content-wrapper d-flex flex-column h-100">
  @if (bulkResult(); as result) {
    <fpc-alert
      [flush]="true"
      [variant]="result.tone"
      [message]="result.message"
      [dismissible]="true"
      (closed)="bulkResult.set(null)"
      data-testid="milestones-bulk-result"
    />
  }

  <!-- Table: State · Milestone · progress · open / done tickets · target date; ⋮ Edit / Lock / Delete. -->
  <fpc-data-table
    class="flex-grow-1 min-h-0"
    nested
    [ariaLabel]="pageTitle"
    [columns]="columns"
    [rows]="milestones()"
    paging="client"
    persistKey="decabill-project-milestones"
    [searchPlaceholder]="searchPlaceholder"
    [loading]="loading()"
    [error]="error()"
    [selectable]="isAdmin"
    [(selected)]="selected"
    [rowMenu]="rowMenu"
    (rowAction)="onRowAction($event.row, $event.item.id)"
    emptyIcon="flag"
    data-testid="project-milestones-list"
  >
    <!-- The tab names the list (DB-12): no lane header repeating "Milestones"; Create sits in the toolbar strip. -->
    @if (isAdmin) {
      <fpc-button
        fpcDataTableToolbar
        variant="primary"
        size="sm"
        iconOnly
        [ariaLabel]="addTitle"
        [title]="addTitle"
        (clicked)="openCreateModal()"
      >
        <i class="bi bi-plus" aria-hidden="true"></i>
      </fpc-button>
    }
    <!-- Only admins can select rows, so the batch bar only ever shows for them. -->
    <fpc-button
      fpcDataTableBatch
      variant="dark"
      size="sm"
      [disabled]="lockableSelection().length === 0"
      (clicked)="lockSelected()"
      data-testid="milestones-bulk-lock"
      iconOnly
      [ariaLabel]="lockLabel"
      [title]="lockLabel"
    >
      <i class="bi bi-lock" aria-hidden="true"></i>
    </fpc-button>
    <fpc-button
      fpcDataTableBatch
      variant="danger"
      size="sm"
      [disabled]="lockableSelection().length === 0"
      (clicked)="confirmBulkDelete.set(true)"
      data-testid="milestones-bulk-delete"
      iconOnly
      [ariaLabel]="deleteLabel"
      [title]="deleteLabel"
    >
      <i class="bi bi-trash" aria-hidden="true"></i>
    </fpc-button>
    <span fpcDataTableEmpty>
      <fpc-empty-state
        icon="flag"
        size="sm"
        message="No milestones yet"
        i18n-message="@@featureProjectMilestones-empty"
      />
    </span>
    <ng-template fpcTableCell="progress" let-row>{{ progressLabel(row) }}</ng-template>
    <ng-template fpcTableCell="target" let-row>{{ targetDateOf(row) | fpcDate }}</ng-template>
  </fpc-data-table>
</div>

<fpc-modal
  [(open)]="createModalOpen"
  i18n-title="@@featureProjectMilestones-createTitle"
  title="Create milestone"
  cancelLabel="Cancel"
  i18n-cancelLabel="@@featureBillingModal-cancel"
>
  <fpc-form-field forId="milestoneName" i18n-label="@@featureProjectMilestones-nameLabel" label="Name">
    <fpc-form-control
      controlId="milestoneName"
      [(ngModel)]="createForm.name"
      name="milestoneName"
      placeholder="Name"
      i18n-placeholder="@@featureProjectMilestones-namePlaceholder"
    />
  </fpc-form-field>
  <div *fpcModalFooter class="d-flex justify-content-end gap-2">
    <fpc-button
      variant="primary"
      (clicked)="submitCreate()"
      [disabled]="(saving$ | async) === true || !createForm.name.trim()"
      i18n="@@featureProjectMilestones-create"
    >
      Create
    </fpc-button>
  </div>
</fpc-modal>

<fpc-modal
  [(open)]="editModalOpen"
  i18n-title="@@featureProjectMilestones-editTitle"
  title="Edit milestone"
  cancelLabel="Cancel"
  i18n-cancelLabel="@@featureBillingModal-cancel"
>
  <fpc-form-field forId="editMilestoneName" i18n-label="@@featureProjectMilestones-nameLabel" label="Name">
    <fpc-form-control
      controlId="editMilestoneName"
      [(ngModel)]="editForm.name"
      name="editMilestoneName"
      placeholder="Name"
      i18n-placeholder="@@featureProjectMilestones-namePlaceholder"
    />
  </fpc-form-field>
  <fpc-form-field
    forId="editMilestoneDescription"
    i18n-label="@@featureProjectMilestones-descriptionLabel"
    label="Description"
  >
    <fpc-form-control
      controlType="textarea"
      controlId="editMilestoneDescription"
      [rows]="3"
      [(ngModel)]="editForm.description"
      name="editMilestoneDescription"
    />
  </fpc-form-field>
  <fpc-form-field
    forId="editMilestoneTargetDate"
    i18n-label="@@featureProjectMilestones-targetDateLabel"
    label="Target date"
  >
    <fpc-form-control
      controlId="editMilestoneTargetDate"
      inputType="date"
      [(ngModel)]="editForm.targetDate"
      name="editMilestoneTargetDate"
    />
  </fpc-form-field>
  <div *fpcModalFooter class="d-flex justify-content-end gap-2">
    <fpc-button
      variant="primary"
      (clicked)="submitEdit()"
      [disabled]="(saving$ | async) === true || !editForm.name.trim()"
      i18n="@@featureProjectMilestones-save"
    >
      Save
    </fpc-button>
  </div>
</fpc-modal>

<fpc-confirm-dialog
  [(open)]="deleteModalOpen"
  i18n-title="@@featureProjectMilestones-deleteTitle"
  title="Delete milestone"
  i18n-confirmLabel="@@featureProjectMilestones-delete"
  confirmLabel="Delete"
  [danger]="true"
  [busy]="(saving$ | async) === true"
  (confirmed)="submitDelete()"
>
  @if (milestoneToDelete; as milestone) {
    <p class="mb-0" i18n="@@featureProjectMilestones-deleteConfirm">
      Delete milestone "{{ milestone.name }}"? This cannot be undone.
    </p>
  }
</fpc-confirm-dialog>

<fpc-confirm-dialog
  [(open)]="confirmBulkDelete"
  [title]="bulkDeleteTitle"
  [message]="bulkDeleteMessage()"
  [confirmLabel]="deleteLabel"
  [cancelLabel]="cancelLabel"
  [danger]="true"
  (confirmed)="deleteSelected()"
/>
