<div class="project-milestone-select">
  @if (selectedMilestone(); as milestone) {
    <fpc-badge variant="info" color="secondary" class="project-milestone-select__chip">
      <span class="text-truncate">{{ milestone.name }}</span>
      <button
        type="button"
        class="btn-close project-milestone-select__clear"
        [disabled]="disabled()"
        (click)="clearSelection()"
        i18n-aria-label="@@featureProjectMilestoneSelect-clearSelectionAria"
        aria-label="Clear selected milestone"
      ></button>
    </fpc-badge>
  } @else {
    <fpc-typeahead-select
      [inputId]="inputId()"
      [listboxId]="inputId() + '-listbox'"
      [size]="compact() ? 'sm' : 'md'"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [loading]="loading()"
      [openOnFocus]="showSuggestionsOnFocus()"
      [query]="searchQuery()"
      (queryChange)="onSearchChange($event)"
      [open]="suggestionsOpen()"
      (openChange)="suggestionsOpen.set($event)"
      (cleared)="reset()"
    >
      <div fpcTypeaheadSuggestions>
        @if (filteredMilestones().length > 0) {
          @for (milestone of filteredMilestones(); track milestone.id) {
            <button type="button" class="dropdown-item py-2 text-start" (mousedown)="pickMilestone(milestone, $event)">
              <span class="d-block small fw-medium text-truncate">{{ milestone.name }}</span>
              @if (milestone.targetDate) {
                <span class="d-block text-muted small">{{ milestone.targetDate | date: 'mediumDate' }}</span>
              }
            </button>
          }
        } @else if (searchQuery().trim() && !loading()) {
          <span class="dropdown-item-text text-muted small" i18n="@@featureProjectMilestoneSelect-noMilestones"
            >No milestones found.</span
          >
        }
      </div>
    </fpc-typeahead-select>
  }
</div>
