            enum: [tenant, unified]
            default: tenant
          description: Unified scope requires allowlisted X-Tenant
        - name: viewTenantId
          in: query
          schema: { type: string }
          description: Tenant tab id for tenant scope; foreign ids require TENANTS_ALLOW_GLOBAL_VIEWS
      responses:
        '200':
          description: Paginated DATEV export list
