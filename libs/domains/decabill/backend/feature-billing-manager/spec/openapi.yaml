  /subscriptions/{subscriptionId}/withdraw:
    post:
      summary: Statutory withdrawal (Widerruf)
      operationId: withdrawSubscription
      security:
        - bearerAuth: [subscriptions:write]
      description: |
        Exercises the statutory withdrawal right, distinct from commercial cancellation.
        Unprovisioned orders are always withdrawable. Provisioned orders may withdraw within
        BILLING_STATUTORY_WITHDRAWAL_PERIOD_DAYS unless the service type disallows post-provisioning withdrawal.
        Provisioned withdrawals trigger prorated partial refunds for the unused billing period.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawSubscriptionDto'
      responses:
        '200':
          description: Subscription withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Withdrawal not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/config-change/preview:
    post:
      summary: Preview a subscription configuration change
      operationId: previewSubscriptionConfigChange
      security:
        - bearerAuth: [subscriptions:read]
      description: |
        Validates a mid-life configuration change (server type resize, addon add/remove) and returns
        the price delta, the prorated immediate adjustment, and the billing disclaimer the customer
        must accept. For prepaid plans, an unbilled **recurring period charge** (open position with
        null `adjustmentNet`) uses an elapsed signed correction; an already-invoiced period uses the
        remaining-period delta (charge OP or partial credit document). Rejections carry a stable
        machine-readable `code`.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigChangeRequestDto'
      responses:
        '200':
          description: Configuration change preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigChangePreviewResponse'
        '400':
          description: Configuration change not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
