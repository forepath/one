  /admin/billing/offers/{id}/archive:
    post:
      tags: [Admin Billing]
      summary: Archive offer, optionally sending it to the customer (admin)
      description: |
        Finalizes a draft (number, totals, frozen terms, PDF); the offer is visible in the customer's account either
        way. With `notifyCustomer` (default `true`) it is also emailed right away; with `false` it can be emailed
        later via `POST …/send`.
      operationId: archiveAdminOffer
      security:
        - bearerAuth: [offers:admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveAdminOfferDto'
      responses:
        '200':
          description: Archived offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOfferDetailResponseDto'
  /admin/billing/offers/{id}/send:
    post:
      tags: [Admin Billing]
      summary: Send an archived offer that was not sent yet (admin)
      description: |
        Emails the offer PDF to the customer. 400 when the offer is not
        archived, was already sent, has expired, or the customer has no billing email address (nothing is sent then).
      operationId: sendAdminOffer
      security:
        - bearerAuth: [offers:admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sent offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOfferDetailResponseDto'
  /admin/billing/offers/{id}/revoke:
    post:
      tags: [Admin Billing]
      summary: Revoke archived offer (admin)
      description: |
        The customer is emailed that the offer was withdrawn unless `notifyCustomer` is `false`.
      operationId: revokeAdminOffer
      security:
        - bearerAuth: [offers:admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAdminOfferDto'
      responses:
        '200':
          description: Revoked offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOfferDetailResponseDto'
  /admin/billing/offers/{id}/accept:
    post:
      tags: [Admin Billing]
      summary: Record the customer's acceptance (admin)
      description: |
        For an answer given outside the system (e.g. an offer that was not sent through it). Same checks and
        fulfillment as `POST /offers/{offerRefId}/accept`: 400 when the offer is not archived, has expired or the
        customer profile is incomplete, or when another answer won a concurrent request. The acceptance confirmation
        is emailed unless `notifyCustomer` is `false`; invoices issued right away are emailed unless
        `notifyInvoices` is `false` (they can be sent later).
      operationId: acceptAdminOffer
      security:
        - bearerAuth: [offers:admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAdminOfferDto'
      responses:
        '200':
          description: Accepted offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOfferDetailResponseDto'
  /admin/billing/offers/{id}/decline:
    post:
      tags: [Admin Billing]
      summary: Record the customer's decline (admin)
      description: |
        Same checks as `POST /offers/{offerRefId}/decline`: 400 when the offer is not archived (or another answer
        won a concurrent request). The customer is emailed a decline confirmation unless `notifyCustomer` is `false`.
      operationId: declineAdminOffer
      security:
        - bearerAuth: [offers:admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
