          opening,
          closing,
          reversal,
          depreciation,
          vat_settlement,
        ]
    AccountingJournalSourceType:
      type: string
      enum:
        [
          invoice,
          credit_document,
          void_document,
          settlement,
          supplier_invoice,
          bank_transaction,
          processor_transaction,
          inventory_movement,
          fixed_asset,
          vat_return,
          fiscal_year,
          manual,
          opening_balance,
        ]
    AccountingJournalLinkType:
      type: string
      enum:
        [
          invoice,
          credit_document,
          void_document,
          supplier_invoice,
          settlement,
          payment_attempt,
          payment_refund,
          bank_transaction,
          processor_transaction,
          inventory_movement,
          fixed_asset,
          offer,
          project,
          subscription,
          stored_file,
          vat_return,
          journal_entry,
        ]
    AccountingJournalLinkRole:
      type: string
      enum: [source, receipt, settles, related]
    AccountingFeatureAvailability:
      type: object
      required: [key, available, missing]
      properties:
        key:
          {
            type: string,
            description: VAT return definition key or export kind,
          }
        available: { type: boolean }
        missing:
          type: array
          items: { type: string }
          description: Env vars still missing for this feature
    AccountingOverview:
      type: object
      properties:
        enabled: { type: boolean }
        country:
          { type: string, description: ISO country of the active profile }
        profile:
          type: object
          properties:
            country: { type: string }
            name: { type: string }
            templates: { type: array, items: { type: string } }
            defaultTemplate: { type: string }
            vatReturns:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  name: { type: string }
                  kind:
                    {
                      type: string,
                      enum: [periodic, annual, ec_sales_list, oss],
                    }
                  periods:
                    type: array
                    items: { type: string, enum: [month, quarter, year] }
                  filingChannel: { type: string }
                  filingUrl: { type: string, nullable: true }
                  dueRule: { type: string }
            exports:
              type: array
              description: Export kinds implemented for this profile
              items:
                {
                  type: string,
                  enum:
                    [datev, gdpdu, fec, saft, journal_csv, trial_balance_csv],
                }
            hasCashBasis: { type: boolean }
            retention:
              type: object
              properties:
                booksYears: { type: integer }
                vouchersYears: { type: integer }
            complianceNotice: { type: string, nullable: true }
            mandatoryChart: { type: boolean }
        method:
          {
            type: string,
            enum: [accrual, cash],
            description: Accrual (balance sheet and P&L) or cash-basis profit,
          }
        vatBasis:
          {
            type: string,
            enum: [invoice, payment],
            description: VAT due when invoiced (Soll) or when paid (Ist),
          }
        startDate:
          { type: string, format: date, description: Bookkeeping start }
        fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
        functionalCurrency: { type: string }
        vatReturnPeriod: { type: string, enum: [month, quarter, year] }
        features:
          type: array
          items:
            $ref: '#/components/schemas/AccountingFeatureAvailability'
        fiscalYears:
          type: array
          items:
            $ref: '#/components/schemas/AccountingFiscalYear'
        openPostingIssues: { type: integer }
        globalAccess:
          {
            type: boolean,
            description: Request tenant is on TENANTS_ALLOW_GLOBAL_VIEWS,
          }
        tenantFilter:
          {
            type: string,
            nullable: true,
            description: Tenant filter of this view; null = all tenants,
          }
    AccountingChartTemplate:
      type: object
      properties:
        key: { type: string, example: DE-SKR03 }
        country: { type: string, nullable: true }
        name: { type: string }
        description: { type: string }
        source: { type: string, description: Licence / source note }
        accountCount: { type: integer }
        taxCodeCount: { type: integer }
    AccountingChart:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: DE-SKR03 }
        name: { type: string }
        country: { type: string, nullable: true }
        templateKey: { type: string, nullable: true }
        accountLength:
          {
            type: integer,
            description: Digits of general-ledger account numbers (DATEV Sachkontenlänge),
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateAccountingChartDto:
      type: object
      description: With `templateKey` the chart is created from the template (code / name optional); without it an empty chart needs `code`.
      properties:
        templateKey: { type: string, maxLength: 32, example: DE-SKR03 }
        code: { type: string, pattern: '^[A-Za-z0-9-]{2,32}$' }
        name: { type: string, minLength: 1, maxLength: 255 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        accountLength: { type: integer, minimum: 3, maximum: 8 }
    AccountingAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        chartId: { type: string, format: uuid }
        number: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountingAccountType' }
        role:
          oneOf:
            - $ref: '#/components/schemas/AccountingAccountRole'
            - { type: 'null' }
        statementPosition:
          {
            type: string,
            nullable: true,
            description: Statement position code of the country profile (e.g. BS.A.B.IV / PL.1),
          }
        isAutomatic:
          {
            type: boolean,
            description: Automatic account (DATEV Automatikkonto); VAT derived from defaultTaxCodeId,
          }
        defaultTaxCodeId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
        isTemplate: { type: boolean }
        description: { type: string, nullable: true }
        externalCodes:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: Export mapping codes (saftGroupingCategory, saftGroupingCode, xbrl, fecCompte)
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateAccountingAccountDto:
      type: object
      description: Number and type of accounts with bookings cannot be changed.
      properties:
        number: { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.-]{0,19}$' }
        name: { type: string, minLength: 1, maxLength: 255 }
        type: { $ref: '#/components/schemas/AccountingAccountType' }
        role:
          oneOf:
            - $ref: '#/components/schemas/AccountingAccountRole'
            - { type: 'null' }
        statementPosition: { type: string, nullable: true, maxLength: 64 }
        isAutomatic: { type: boolean }
        defaultTaxCodeId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
        description: { type: string, nullable: true, maxLength: 2000 }
        externalCodes:
          type: object
          nullable: true
          additionalProperties: { type: string }
    AccountingAccountInput:
      allOf:
        - $ref: '#/components/schemas/UpdateAccountingAccountDto'
        - type: object
          required: [number, name, type]
    AccountingAccountImportResult:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
    AccountingTaxCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        chartId: { type: string, format: uuid }
        code: { type: string, example: OUT_STD }
        name: { type: string }
        kind: { $ref: '#/components/schemas/AccountingTaxCodeKind' }
        rate:
          type: [string, number, 'null']
          description: Percent; null = rate taken from the document line (OSS destination rates)
        accountId:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: VAT account (output VAT for output codes; input VAT for input and reverse-charge codes),
          }
        reverseAccountId:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Output VAT account of a reverse-charge code,
          }
        baseBox:
          {
            type: string,
            nullable: true,
            description: VAT return box of the net base,
          }
        taxBox:
          {
            type: string,
            nullable: true,
            description: VAT return box of the tax,
          }
        reverseTaxBox:
          {
            type: string,
            nullable: true,
            description: Second tax box of a reverse-charge code (input VAT side),
          }
        ecSalesList: { type: boolean }
        oss: { type: boolean }
        datevBuKey: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateAccountingTaxCodeDto:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        rate: { type: number, nullable: true, minimum: 0, maximum: 100 }
        accountId: { type: string, format: uuid, nullable: true }
        reverseAccountId: { type: string, format: uuid, nullable: true }
        baseBox:
          { type: string, nullable: true, pattern: '^[A-Za-z0-9._-]{1,16}$' }
        taxBox:
          { type: string, nullable: true, pattern: '^[A-Za-z0-9._-]{1,16}$' }
        reverseTaxBox:
          { type: string, nullable: true, pattern: '^[A-Za-z0-9._-]{1,16}$' }
        ecSalesList: { type: boolean }
        oss: { type: boolean }
        datevBuKey: { type: string, nullable: true, pattern: '^\d{1,4}$' }
        isActive: { type: boolean }
    AccountingTaxCodeInput:
      allOf:
        - $ref: '#/components/schemas/UpdateAccountingTaxCodeDto'
        - type: object
          required: [code, name, kind]
          properties:
            code: { type: string, pattern: '^[A-Z0-9_]{2,32}$' }
            kind: { $ref: '#/components/schemas/AccountingTaxCodeKind' }
    AccountingFiscalYear:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        chartId: { type: string, format: uuid }
        status: { type: string, enum: [open, closed] }
        closedAt: { type: string, format: date-time, nullable: true }
        closedByUserId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    AccountingPeriod:
      type: object
      properties:
        id: { type: string, format: uuid }
        fiscalYearId: { type: string, format: uuid }
        periodIndex: { type: integer, description: 1-based month index }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status:
          {
            type: string,
            enum: [open, locked],
            description: locked = Festschreibung (no new postings),
          }
        lockedAt: { type: string, format: date-time, nullable: true }
        lockedByUserId: { type: string, format: uuid, nullable: true }
    AccountingFiscalYearWithPeriods:
      allOf:
        - $ref: '#/components/schemas/AccountingFiscalYear'
        - type: object
          properties:
            periods:
              type: array
              items:
                $ref: '#/components/schemas/AccountingPeriod'
    OpenAccountingFiscalYearDto:
      type: object
      properties:
        chartId:
          {
            type: string,
            format: uuid,
            description: Chart for the new year (defaults to the previous year's chart),
          }
        endDate:
          {
            type: string,
            format: date,
            description: Shortened year end (at most 12 months),
          }
    ChangeAccountingYearChartDto:
      type: object
