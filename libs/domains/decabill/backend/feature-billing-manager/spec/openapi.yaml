      type: object
      required: [targets]
      properties:
        targets:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [type, amount]
            properties:
              type: { type: string, enum: [invoice, supplier_invoice, account] }
              id:
                {
                  type: string,
                  format: uuid,
                  description: Invoice / supplier_invoice targets need this or number,
                }
              number:
                type: string
                minLength: 1
                maxLength: 64
                description: Invoice / supplier invoice number (alternative to id; resolved within the bank account's tenant)
