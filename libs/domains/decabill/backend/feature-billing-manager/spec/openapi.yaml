  /auth/apps/token:
    post:
      summary: Exchange an app authorization code or refresh token for an app access token
      description: |
        Server-to-server endpoint for apps (authenticated by app id + app secret).
        - `authorization_code`: the `code` from the return URL (+ `code_verifier` when PKCE S256 was used).
          Codes are single-use and expire after 10 minutes; replaying a code revokes the session it created.
        - `refresh_token`: rotating refresh token; every refresh returns a new one and replaying an old one revokes
          the session.
        Access tokens are JWTs with `amr: ["pat", "app"]` and the effective `scopes` (consented ∩ app scopes ∩ what the
        user's role may grant). They are checked live on every request and stop working when the authorization, the
        session or the app is revoked or deleted. Accepts JSON or `application/x-www-form-urlencoded` bodies.
      operationId: exchangeAppToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppTokenRequestDto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppTokenRequestDto'
      responses:
        '200':
          description: Access + refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppTokenResponseDto'
        '400':
          description: '`invalid_grant` (unknown, expired, replayed or foreign code / refresh token) or invalid request'
        '401':
          description: '`invalid_client` (unknown app or wrong secret)'
        '429':
          description: Too many attempts
  /auth/apps/authorize:
    get:
      summary: Grant page data (interactive sessions only)
      description: |
        Returns the app, the scopes the signed-in user can grant and those they cannot, whether an up-to-date
        authorization already exists (consent can be skipped) and the second factor needed to approve.
      operationId: getAppAuthorization
      parameters:
        - {
            in: query,
            name: app_id,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            in: query,
            name: state,
            required: false,
            schema: { type: string, maxLength: 512 },
          }
        - {
            in: query,
            name: code_challenge,
            required: false,
            schema: { type: string },
          }
        - {
            in: query,
            name: code_challenge_method,
            required: false,
            schema: { type: string, enum: [S256] },
          }
      responses:
        '200':
          description: Authorization request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppAuthorizationInfoDto'
        '401':
          description: Unauthorized
        '403':
          description: Personal access tokens and app tokens cannot use this endpoint
        '404':
          description: App not found
    post:
      summary: Approve or deny an app (interactive sessions only)
      description: |
        Approve stores the consent (capped to what the user may grant) and returns the redirect to the app's return URL
        with `status=approved&app_id&code&state`. Deny returns `status=denied&error=access_denied&state`.
        When the user has two-factor authentication and the app is not yet authorized (or needs re-authorization),
        approve without `code` answers 401 `APP_AUTHORIZATION_2FA_REQUIRED` (an email code is sent for email 2FA).
      operationId: decideAppAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppAuthorizationDecisionDto'
      responses:
        '200':
          description: Redirect to the app
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl:
                    type: string
                    format: uri
        '401':
          description: Unauthorized, or `APP_AUTHORIZATION_2FA_REQUIRED` / `APP_AUTHORIZATION_2FA_INVALID`
        '403':
          description: Personal access tokens and app tokens cannot use this endpoint
        '404':
          description: App not found
