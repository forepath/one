      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum:
            [
              payment,
              payment_reversal,
              credit,
              refund,
              write_off,
              discount,
              credit_transfer_in,
              credit_transfer_out,
            ]
          description: payment / credit / write_off / discount / credit_transfer_in reduce the balance due; payment_reversal / refund / credit_transfer_out raise it
