  /auth/login:
    post:
      summary: Login
      description: |
        Interactive console login with account password only.
        Personal access tokens are not accepted; use POST /auth/token instead.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: |
            Unauthorized. When the password is valid but the email is not confirmed, the body includes
            `code: EMAIL_NOT_CONFIRMED` so the client can resume confirmation.
            When a second factor is required, the body includes `code: LOGIN_2FA_REQUIRED` and
            `method: email|totp`. Retry with the same email/password plus `code`.
            When a submitted code is wrong or expired, the body includes `code: LOGIN_2FA_INVALID`
            (show the message; do not treat as a fresh challenge).
            When the login-2FA email cannot be sent, the API returns 503 instead of a challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/2fa:
    get:
      summary: Get current user two-factor status (users auth only)
      operationId: getTwoFactorStatus
      responses:
        '200':
