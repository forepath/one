        chartId: { type: string, format: uuid }
    CloseAccountingFiscalYearDto:
      type: object
      properties:
        nextChartId:
          {
            type: string,
            format: uuid,
            description: Chart of the next year (only when that year has no bookings yet),
          }
        accountMapping:
          type: object
          additionalProperties: { type: string }
          description: Old account number to new account number (chart change at year rollover); default same number then same role
    AccountingClosePreview:
      type: object
      properties:
        fiscalYear: { $ref: '#/components/schemas/AccountingFiscalYear' }
        targetChartId: { type: string, format: uuid }
        chartChanges: { type: boolean }
        result: { type: number, description: Annual result }
        balances:
          type: array
          items:
            type: object
            properties:
              number: { type: string }
              name: { type: string }
              balance: { type: number }
              targetNumber: { type: string, nullable: true }
        unmapped:
          type: array
          items: { type: string }
          description: Account numbers without a target in the next chart
    AccountingFxRate:
      type: object
      properties:
        id: { type: string, format: uuid }
        currency: { type: string }
        rateDate: { type: string, format: date }
        rate:
          $ref: '#/components/schemas/AccountingDecimal'
        source: { type: string, enum: [ecb, manual] }
        createdByUserId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    AccountingFxRateInput:
      type: object
      required: [currency, rateDate, rate]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        rateDate: { type: string, format: date }
        rate:
          {
            type: number,
            exclusiveMinimum: 0,
            description: Units of currency per 1 EUR (ECB convention),
          }
    PaginatedAccountingFxRates:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountingFxRate'
        total: { type: integer }
    AccountingPostingIssue:
      type: object
      properties:
        id: { type: string, format: uuid }
        idempotencyKey: { type: string }
        sourceType: { $ref: '#/components/schemas/AccountingJournalSourceType' }
        sourceId: { type: string }
        sourceLabel:
          type: string
          nullable: true
          description: Document number of the source (e.g. the invoice number), when known
        sourceEvent: { type: string }
        tenantId: { type: string, nullable: true }
        error: { type: string }
        attempts: { type: integer }
        resolvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaginatedAccountingPostingIssues:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountingPostingIssue'
        total: { type: integer }
    AccountingCatchUpResult:
      type: object
      properties:
        invoicesIssued: { type: integer }
        invoicesVoided: { type: integer }
        creditDocuments: { type: integer }
        settlements: { type: integer }
        supplierInvoicesIssued: { type: integer }
        supplierInvoicesVoided: { type: integer }
        openingItems: { type: integer }
    AccountingJournalLine:
      type: object
      description: One debit or credit line (amounts in functional currency)
      properties:
        id: { type: string, format: uuid }
        entryId: { type: string, format: uuid }
        lineNo: { type: integer }
        accountId: { type: string, format: uuid }
        debit: { $ref: '#/components/schemas/AccountingDecimal' }
        credit: { $ref: '#/components/schemas/AccountingDecimal' }
        originalAmount:
          type: [string, number, 'null']
          description: Signed amount in document currency (debit +, credit -) when it differs from the functional currency
        originalCurrency: { type: string, nullable: true }
        taxCodeId: { type: string, format: uuid, nullable: true }
        taxRate: { type: [string, number, 'null'] }
        taxRole:
          { type: string, enum: [base, tax, reverse_tax], nullable: true }
        counterpartyType:
          { type: string, enum: [customer, supplier], nullable: true }
        counterpartyId:
          {
            type: string,
            nullable: true,
            description: Customer user id or supplier profile id,
          }
        counterpartyLabel:
          type: string
          nullable: true
          description: Customer / supplier number and name (entry detail only)
        openItemId:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Invoice / supplier invoice whose open item this line opens or clears,
          }
        tenantId: { type: string, nullable: true }
        costCenter: { type: string, nullable: true }
        description: { type: string, nullable: true }
        serviceDate: { type: string, format: date, nullable: true }
        euCountry: { type: string, nullable: true }
        euVatId: { type: string, nullable: true }
    AccountingJournalEntry:
      type: object
      description: Journal entry (Buchungssatz); immutable, corrected by reversal entries. entryNumber is gap-free per fiscal year.
      properties:
        id: { type: string, format: uuid }
        fiscalYearId: { type: string, format: uuid }
        periodId: { type: string, format: uuid }
        entryNumber: { type: integer }
        postingDate: { type: string, format: date }
        documentDate: { type: string, format: date }
        documentNumber: { type: string, nullable: true }
        description: { type: string }
        kind: { $ref: '#/components/schemas/AccountingJournalEntryKind' }
        sourceType: { $ref: '#/components/schemas/AccountingJournalSourceType' }
        sourceId: { type: string, nullable: true }
        sourceEvent:
          {
            type: string,
            nullable: true,
            description: Business event of the source (issued / voided / payment / fee …),
          }
        idempotencyKey: { type: string }
        tenantId:
          {
            type: string,
            nullable: true,
            description: Tenant dimension; null for entity-wide entries,
          }
        currency: { type: string }
        fxRate: { $ref: '#/components/schemas/AccountingDecimal' }
        total:
          $ref: '#/components/schemas/AccountingDecimal'
        reversalOfEntryId: { type: string, format: uuid, nullable: true }
        reversedByEntryId: { type: string, format: uuid, nullable: true }
        createdByUserId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/AccountingJournalLine'
    AccountingEntryLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        entryId: { type: string, format: uuid }
        linkType: { $ref: '#/components/schemas/AccountingJournalLinkType' }
        targetId: { type: string }
        targetLabel:
          type: string
          nullable: true
          description: Document number of the target (e.g. the invoice number), when known (entry detail only)
        role: { $ref: '#/components/schemas/AccountingJournalLinkRole' }
        label: { type: string, nullable: true }
        createdByUserId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    AccountingJournalEntryDetail:
      allOf:
        - $ref: '#/components/schemas/AccountingJournalEntry'
        - type: object
          properties:
            links:
              type: array
              items:
                $ref: '#/components/schemas/AccountingEntryLink'
    PaginatedAccountingJournalEntries:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountingJournalEntry'
        total: { type: integer }
    AccountingJournalLinkDto:
      type: object
      required: [linkType, targetId]
      properties:
        linkType: { $ref: '#/components/schemas/AccountingJournalLinkType' }
        targetId:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Document number (invoice, credit / void document, supplier invoice, offer, subscription, inventory
            movement, asset or entry number; resolved within the entry's tenant, ambiguous numbers are rejected), the
            target id, or the external id of a processor transaction
        role:
          { type: string, enum: [receipt, related, settles], default: related }
        label: { type: string, maxLength: 255 }
    AccountingManualEntryLineDto:
      type: object
      required: [accountNumber]
