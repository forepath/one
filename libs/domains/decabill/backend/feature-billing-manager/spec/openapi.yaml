  /auth/2fa/totp/setup:
    post:
      summary: Start authenticator (TOTP) enrollment (users auth only)
      description: |
        Generates a provisional TOTP secret. Requires the account password (step-up).
        Rejected with 400 when authenticator is already enabled;
        disable the current authenticator first (requires a valid TOTP code).
      operationId: setupTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPasswordDto'
      responses:
        '200':
          description: Provisional TOTP secret and otpauth URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResponseDto'
        '400':
          description: Authenticator already enabled
        '401':
          description: Not authenticated or incorrect password
  /auth/2fa/totp/confirm:
    post:
      summary: Confirm authenticator enrollment with a TOTP code (users auth only)
      description: |
        Enables authenticator 2FA after setup (password step-up already completed on setup).
        Invalidates existing sessions (token version bump) and returns a fresh interactive JWT.
      operationId: confirmTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTotpDto'
      responses:
        '200':
          description: Authenticator enabled; returns a new access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          description: Invalid code, setup not started, or authenticator already enabled
        '401':
          description: Not authenticated
  /auth/2fa/totp:
    delete:
      summary: Disable authenticator (requires current TOTP code)
      description: |
        Disables authenticator 2FA and invalidates existing sessions (token version bump).
        Returns a fresh interactive JWT for the current session.
      operationId: disableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableTotpDto'
      responses:
        '200':
          description: Authenticator disabled; returns a new access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          description: Invalid code or not enabled
        '401':
          description: Not authenticated
