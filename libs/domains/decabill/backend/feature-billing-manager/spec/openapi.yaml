          vat_output_reduced,
          vat_output_oss,
          vat_output_reverse_charge,
          vat_input_standard,
          vat_input_reduced,
          vat_input_reverse_charge,
          vat_prepayments,
          vat_settlement,
          expense_default,
          expense_reverse_charge_eu,
          expense_reverse_charge_third_country,
          payment_fees,
          bad_debt,
          inventory,
          cost_of_goods_sold,
          fixed_assets,
          low_value_assets,
          asset_pool,
          depreciation,
          asset_disposal_gain,
          asset_disposal_loss,
          fx_gain,
          fx_loss,
          rounding,
          suspense,
          owner_drawings,
          owner_contributions,
          retained_earnings,
