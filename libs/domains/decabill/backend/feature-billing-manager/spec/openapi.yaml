      tags: [Admin Billing]
      summary: Verify an uploaded file against the signed stored-file registry (admin only; never persists upload)
      operationId: verifyAdminBillingFile
      security:
        - bearerAuth: [files:admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  format: binary
                  description: File bytes to verify (not stored)
      responses:
        '200':
          description: Authenticity verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFileVerifyResponse'
        '400':
          description: Missing document
        '413':
          description: Document exceeds size limit
