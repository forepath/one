    post:
      tags: [Admin Billing]
      summary: Email an invoice that was issued without notification (admin only)
      description: |
        400 when the invoice is a draft or voided, was already sent, or the customer has no billing email address
        (nothing is sent then).
      operationId: adminSendInvoice
      security:
        - bearerAuth: [invoices:admin]
      parameters:
        - name: invoiceRefId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sent invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvoiceListItem'
  /admin/billing/invoices/{invoiceRefId}/send-credit-note:
    post:
      tags: [Admin Billing]
      summary: Email the credit note of an invoice voided without notification (admin only)
      description: |
        400 when the invoice is not voided, its credit note was already sent, or the customer has no billing email
        address (nothing is sent then).
      operationId: adminSendInvoiceCreditNote
      security:
        - bearerAuth: [invoices:admin]
      parameters:
        - name: invoiceRefId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Voided invoice with the credit note sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvoiceListItem'
  /admin/billing/invoices/{invoiceRefId}/mark-paid:
    post:
      tags: [Admin Billing]
      summary: Mark invoice paid manually (admin only)
      description: |
        Records a manual payment settlement. Optional `amount` books a partial payment (status `partially_paid`);
        omitted, the full balance due is paid.
      operationId: adminMarkInvoicePaid
      security:
        - bearerAuth: [invoices:admin]
      parameters:
        - name: invoiceRefId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkInvoicePaymentStatusDto'
      responses:
        '200':
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvoiceListItem'
        '400':
          description: Invoice status does not allow payment, nothing left to pay, or amount exceeds the balance due
  /admin/billing/invoices/{invoiceRefId}/mark-unpaid:
    post:
      tags: [Admin Billing]
      summary: Mark invoice unpaid manually (admin only)
      operationId: adminMarkInvoiceUnpaid
      security:
        - bearerAuth: [invoices:admin]
      parameters:
        - name: invoiceRefId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkInvoicePaymentStatusDto'
      responses:
        '200':
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvoiceListItem'
  /admin/billing/invoices/{invoiceRefId}/write-off:
    post:
      tags: [Admin Billing]
      summary: Write off an uncollectible balance (admin only)
      description: |
        Records a `write_off` settlement (Forderungsverlust). Optional `amount` writes off part of the balance due;
        omitted, the whole balance is written off and the invoice becomes `written_off`.
      operationId: adminWriteOffInvoice
      security:
        - bearerAuth: [invoices:admin]
      parameters:
        - name: invoiceRefId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInvoiceSettlementDto'
      responses:
        '201':
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvoiceListItem'
        '400':
          description: Invoice status does not allow a write-off, or amount not positive / exceeds the balance due
        '404':
          description: Invoice not found
  /admin/billing/invoices/{invoiceRefId}/refund:
    post:
      tags: [Admin Billing]
      summary: Record a manual refund of a customer credit (admin only)
      description: |
        For invoices with a negative `balanceDue` (customer credit from overpayment or credit notes). Records a `refund`
        settlement; optional `amount` refunds part of the credit, omitted the whole credit.
      operationId: adminRefundInvoiceCredit
      security:
        - bearerAuth: [invoices:admin]
      parameters:
        - name: invoiceRefId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInvoiceSettlementDto'
      responses:
        '201':
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvoiceListItem'
        '400':
          description: Invoice has no customer credit, or amount not positive / exceeds the credit
        '404':
          description: Invoice not found
  /admin/billing/invoices/{invoiceRefId}/settlements:
