    BillingCapabilitiesResponse:
      type: object
      required:
        [
          datevExportEnabled,
          unifiedExportAllowed,
          globalViewsAllowed,
          viewableTenants,
          fileSigningEnabled,
          accountingEnabled,
          accountingGlobalAccess,
          accountingCountry,
          accountingMissingPrerequisites,
          einvoiceFormats,
          einvoiceDefaultFormat,
        ]
      properties:
        datevExportEnabled:
          type: boolean
          description: Mirrors BILLING_DATEV_EXPORT_ENABLED
        unifiedExportAllowed:
          type: boolean
          description: True when unified export is enabled and request tenant is in TENANTS_ALLOW_GLOBAL_VIEWS
        globalViewsAllowed:
          type: boolean
          description: True when request tenant is in TENANTS_ALLOW_GLOBAL_VIEWS (cross-tenant admin tabs)
        viewableTenants:
          type: array
          items: { type: string }
          description: Tenant ids available as admin view tabs; all configured tenants when globalViewsAllowed, else the request tenant only
        fileSigningEnabled:
          type: boolean
          description: True when BILLING_FILE_SIGNING_SECRET is configured
        accountingEnabled:
          type: boolean
          description: Accounting enabled with its prerequisites (BILLING_ACCOUNTING_ENABLED and a complete issuer)
        accountingGlobalAccess:
          type: boolean
          description: Entity-wide accounting functions available (accounting enabled and request tenant in TENANTS_ALLOW_GLOBAL_VIEWS)
        accountingCountry:
          type: string
          nullable: true
          description: ISO country of the active accounting profile; null when accounting is disabled
        accountingMissingPrerequisites:
          type: array
          items: { type: string }
          description: Env prerequisites missing for accounting (empty when enabled or not requested)
        einvoiceFormats:
          type: array
          description: Selectable e-invoice formats
          items:
            type: object
            required: [format, label]
            properties:
              format: { $ref: '#/components/schemas/EInvoiceFormat' }
              label: { type: string }
        einvoiceDefaultFormat:
          $ref: '#/components/schemas/EInvoiceFormat'
    EInvoiceFormat:
      type: string
      enum:
        [
          factur-x-en16931,
          factur-x-basic,
          factur-x-extended,
          xrechnung-cii,
          xrechnung-ubl,
          peppol-bis-3,
          ubl-en16931,
        ]
      description: |
        E-invoice format. Factur-X / ZUGFeRD profiles and XRechnung CII embed CII in the PDF; XRechnung UBL,
        Peppol BIS Billing 3.0 and EN 16931 UBL are UBL 2.1. XRechnung needs a buyer reference (BT-10) and
        electronic addresses; Peppol needs electronic addresses.
