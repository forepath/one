components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Interactive session JWT, or a JWT exchanged from a personal access token (`POST /auth/token`).
        Interactive sessions are users / SAML session JWTs or, with `AUTHENTICATION_METHOD=oidc`, OIDC access tokens.
        For personal access tokens, the role names listed on an operation's `bearerAuth` requirement are the
        PAT scopes it requires (OpenAPI 3.1 role names; not enforced for interactive sessions).
        Scopes follow `<resource>:read|write|admin`; `write` implies `read`, and `admin` implies `write` and `read`.
        `:admin` scopes are only grantable to and effective for admin users. Operations without listed scopes
        either do not accept personal access tokens or are public.
    basicAuth:
      type: http
      scheme: basic
    mutualTLS:
      type: mutualTLS
      description: |
        `AUTHENTICATION_METHOD=mtls` with the native TLS listener (`MTLS_SERVER_CERT` / `MTLS_SERVER_KEY`): a client
        certificate of a CA in `MTLS_CA_CERT` presented in the TLS handshake. Grants full admin access, like the
        static API key.
    certificateAssertion:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `AUTHENTICATION_METHOD=mtls`: `Certificate <assertion>`, a short-lived compact JWS signed with the client
        certificate's private key (`typ: cert-assertion+jwt`, certificate chain in `x5c`, `exp - iat` at most
        `MTLS_ASSERTION_MAX_LIFETIME`). Used by browsers and behind TLS-terminating proxies. Grants full admin
        access, like the static API key.
  parameters:
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 0
      description: Maximum number of results to return (default 10)
    Offset:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
      description: Number of results to skip (default 0)
    Search:
      in: query
      name: search
      schema:
        type: string
      description: Free-text search across indexed entity fields (OpenSearch with SQL ILIKE fallback)
    ServiceTypeId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Service type ID
    ServicePlanId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Service plan ID
    SubscriptionId:
      in: path
      name: subscriptionId
      required: true
      schema:
        type: string
        format: uuid
      description: Subscription ID
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
      description: Project ID
    TicketId:
      in: path
      name: ticketId
      required: true
      schema:
        type: string
        format: uuid
      description: Project ticket ID
    MilestoneId:
      in: path
      name: milestoneId
      required: true
      schema:
        type: string
        format: uuid
      description: Project milestone ID
    TimeEntryId:
      in: path
      name: timeEntryId
      required: true
      schema:
        type: string
        format: uuid
      description: Project time entry ID
    BackorderId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Backorder ID
    UserId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: User ID
    XTentHeader:
      in: header
      name: X-Tenant
      required: false
      schema:
        type: string
        default: default
      description: |
        Tenant id for request scoping. Defaults to `default` when omitted (unless `TENANTS_ALLOW_DEFAULT=false`).
        When default is disabled, missing, blank, or `default` values are rejected. Must be listed in the server
        `TENANTS` allowlist. Invalid values return 400.
    AccountingViewTenantId:
      in: query
      name: viewTenantId
      required: false
      schema:
        type: string
        maxLength: 64
      description: |
        Accounting view scope. Defaults to the request tenant. Another tenant id or `all` (entity-wide, no tenant
        filter) requires the request tenant on `TENANTS_ALLOW_GLOBAL_VIEWS`; otherwise 403.
    AccountingFrom:
      in: query
      name: from
      required: true
      schema:
        type: string
        format: date
      description: Range start (YYYY-MM-DD)
    AccountingTo:
      in: query
      name: to
      required: true
      schema:
        type: string
        format: date
      description: Range end (YYYY-MM-DD, inclusive)
    AccountingLimit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 500
      description: Page size (route-specific default)
    AccountingOffset:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of results to skip
    AccountingChartId:
      in: path
      name: chartId
      required: true
      schema:
        type: string
        format: uuid
      description: Chart of accounts ID
    AccountingAccountId:
      in: path
      name: accountId
      required: true
      schema:
        type: string
        format: uuid
      description: General-ledger account ID
    AccountingEntryId:
      in: path
      name: entryId
      required: true
      schema:
        type: string
        format: uuid
      description: Journal entry ID
    AccountingResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Accounting resource ID
  schemas:
    AppTokenRequestDto:
      type: object
      required: [grant_type, app_id, app_secret]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        app_id:
          type: string
          format: uuid
        app_secret:
          type: string
          description: '`fp_aps_…`'
        code:
          type: string
          description: Authorization code (`fp_apc_…`) for `authorization_code`
        code_verifier:
          type: string
          description: PKCE verifier when the authorization used `code_challenge`
        refresh_token:
          type: string
          description: Refresh token (`fp_apr_…`) for `refresh_token`
    AppTokenResponseDto:
      type: object
      required:
        [
          access_token,
          token_type,
          expires_in,
          refresh_token,
          scope,
          scopes,
          reauthorization_required,
          user,
        ]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires
        refresh_token:
          type: string
          description: Rotating refresh token; store it and use it once
        scope:
          type: string
          description: Space-separated effective scopes
        scopes:
          type: array
          items:
            type: string
        reauthorization_required:
          type: boolean
          description: The app requests scopes the user has not consented to yet; send the user to /authorize again
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            role:
              type: string
    AppAuthorizationInfoDto:
      type: object
      properties:
        app:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            description:
              type: string
              nullable: true
            returnUrl:
              type: string
              format: uri
        grantableScopes:
          type: array
          items:
            type: string
        ungrantableScopes:
          type: array
          items:
            type: string
        alreadyAuthorized:
          type: boolean
        secondFactor:
          type: string
          enum: [email, totp]
          nullable: true
    AppAuthorizationDecisionDto:
      type: object
      required: [appId, decision]
      properties:
        appId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [approve, deny]
        state:
          type: string
          maxLength: 512
        codeChallenge:
          type: string
        codeChallengeMethod:
          type: string
          enum: [S256]
        code:
          type: string
          description: Second factor (TOTP or email code)
    IdentityAppInputDto:
      type: object
      required: [name, returnUrl, scopes]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        returnUrl:
          type: string
          format: uri
          description: Absolute https URL (http only for localhost), no credentials or fragment
        scopes:
          type: array
          minItems: 1
          items:
            type: string
    IdentityAppResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: App id
        name:
          type: string
        description:
          type: string
          nullable: true
        returnUrl:
          type: string
        scopes:
          type: array
          items:
            type: string
        secretPrefix:
          type: string
        secretRotatedAt:
          type: string
          format: date-time
          nullable: true
        grantCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        secret:
          type: string
          description: Present only on create and secret rotation
    IdentityAppGrantResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        appName:
          type: string
        appDescription:
          type: string
          nullable: true
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
        consentedScopes:
          type: array
          items:
            type: string
        scopes:
          type: array
          description: Effective scopes app tokens carry
          items:
            type: string
        needsReauthorization:
          type: boolean
        sessionCount:
          type: integer
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderProvisioningOption:
      type: object
      required: [optionKey, type, label]
      properties:
        optionKey:
          type: string
        type:
          type: string
          enum: [integrated, custom, none]
          description: |
            `integrated` (first-party stack), `custom` (admin CloudInit template), or `none`
            (bare server without a provisioning process; option key `none`).
        service:
          type: string
          enum: [agenstra-controller, agenstra-manager, decabill-billing]
          description: Integrated stack (type `integrated` only)
        cloudInitConfigId:
          type: string
          format: uuid
          description: Cloud-init template (type `custom` only)
        label:
          type: string
        description:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
        code:
          type: string
          description: Optional machine-readable error code (e.g. EMAIL_NOT_CONFIRMED on login)
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    ChangePasswordResponse:
      type: object
      properties:
        message:
          type: string
        access_token:
          type: string
    LogoutDto:
      type: object
      properties:
        invalidateAllSessions:
          type: boolean
          description: When true, invalidates every active JWT session for the user. Default is false (current session only).
    SamlTokenExchangeDto:
      type: object
      required: [code, codeVerifier]
      properties:
        code:
          type: string
          maxLength: 128
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
    SamlTokenResponse:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
    LoginDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        code:
          type: string
          pattern: '^[A-Za-z0-9]{6}$'
          description: Second-factor code (email OTP or TOTP) after LOGIN_2FA_REQUIRED
    EnableEmail2faDto:
      type: object
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9]{6}$'
    ConfirmTotpDto:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    DisableTotpDto:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: 6-digit authenticator code (possession proves step-up)
    CurrentPasswordDto:
      type: object
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          description: Account password for step-up verification
    TotpSetupResponseDto:
      type: object
      required: [secret, otpauthUrl]
      properties:
        secret:
          type: string
        otpauthUrl:
          type: string
    TwoFactorStatusDto:
      type: object
      required: [forceEnabled, emailEnabled, totpEnabled, method]
      properties:
        forceEnabled:
          type: boolean
        emailEnabled:
          type: boolean
        totpEnabled:
          type: boolean
        method:
          type:
            - string
            - 'null'
          enum: [email, totp, null]
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'
        scopes:
          type: array
          items:
            type: string
    PatLoginResponse:
      $ref: '#/components/schemas/LoginResponse'
    ExchangePersonalAccessTokenDto:
      type: object
      required: [token]
      properties:
        token:
          type: string
    CreatePersonalAccessTokenDto:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    UpdatePersonalAccessTokenDto:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
    PersonalAccessTokenScopeDto:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
    PersonalAccessTokenResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tokenPrefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        token:
          type: string
    RegisterDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        message:
          type: string
    ConfirmEmailDto:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[A-Z0-9]{6}$'
    RequestPasswordResetDto:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordDto:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[A-Z0-9]{6}$'
        newPassword:
          type: string
          format: password
          minLength: 8
    ChangePasswordDto:
      type: object
      required: [currentPassword, newPassword, newPasswordConfirmation]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
        newPasswordConfirmation:
          type: string
          format: password
          minLength: 8
    CreateUserDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'
        emailConfirmed:
          type: boolean
          default: false
          description: Create the account with its email already confirmed; no confirmation email is sent.
        sendConfirmationEmail:
          type: boolean
          default: true
          description: >
            Email a confirmation code to an unconfirmed account. With false the account stays unconfirmed
            until an admin confirms it via POST /users/{id}/confirm-email.
    UpdateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'
        emailConfirmed:
          type: boolean
          default: false
          description: Only when the email changes. Keep the new address confirmed; no confirmation email is sent.
        sendConfirmationEmail:
          type: boolean
          default: true
          description: >
            Only when the email changes to an unconfirmed address. With false no code is sent and the address
            stays unconfirmed until an admin confirms it.
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        emailConfirmedAt:
          type: string
          format: date-time
          nullable: true
        totpEnabled:
          type: boolean
        email2faEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserRole:
      type: string
      enum: [user, admin]
    ProviderDetail:
      type: object
      required: [id, displayName]
      description: A registered provisioning provider (e.g. Hetzner) with id, display name, and optional config schema.
      properties:
        id:
          type: string
          description: Provider identifier (e.g. hetzner, digital-ocean). Used as the value for service type provider field.
        displayName:
          type: string
          description: Human-readable display name (e.g. Hetzner Cloud-Init).
        compatibilityGroup:
          type: string
          description: |
            Compatibility group for interchangeable providers on one service type.
            Providers sharing the same group may be selected together (e.g. host-cloud-init for Hetzner and DigitalOcean).
            Omitted or empty means the provider is only compatible with itself.
        configSchema:
          type: object
          description: |
            Optional JSON schema for provider-specific configuration when creating subscriptions.
            - `properties`: each property may include `type`, `description`, optionally `enum` (array of allowed values), `scope` (`server` or `product`), and `productServices` (`agenstra-controller`, `agenstra-manager`, `decabill-billing`).
              Server-scoped fields appear under provider defaults in the plan editor; product-scoped fields appear under product defaults when required by selected customer options.
            - `basePriceFromField`: optional string (e.g. "serverType") indicating which field's selected option drives the plan base price;
              the UI should fetch options from GET .../providers/{id}/server-types and use the selected option's price as base price.
        envDefaultFields:
          type: array
          description: Platform environment variables that can be overridden per service type (e.g. HETZNER_API_TOKEN).
          items:
            $ref: '#/components/schemas/ProviderEnvDefaultField'
        supportsAddons:
          type: boolean
          description: |
            When true, plans for this provider may offer customer-selectable addons.
            Omitted or false means the provider lacks required provision/teardown or cloud-init append hooks (fail closed).
        supportsServerTypeUpgrade:
          type: boolean
          description: When true, in-place server type upgrades are supported for this provider.
        supportsServerTypeDowngrade:
          type: boolean
          description: When true, in-place server type downgrades are supported for this provider.
        meters:
          type: array
          description: |
            Required usage meters declared by the provider (or product) implementation.
            Sideloaded onto service types as non-removable attachments (`source=provider`, `required=true`).
          items:
            $ref: '#/components/schemas/DeclaredMeterDefinition'
    DeclaredMeterDefinition:
      type: object
      required: [key, name, aggregator, defaultUnitPriceNet]
      description: Fixed meter declaration from a provider or addon module.
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        unitLabel: { type: string }
        aggregator:
          {
            type: string,
            enum: [max, min, avg, first, last, sum, sum_positive_deltas],
          }
        defaultUnitPriceNet: { type: number }
        defaultIncludedUsage: { type: number, minimum: 0, default: 0 }
    AddonModuleDetail:
      type: object
      required: [key, displayName, meters]
      description: Registered addon module with optional declared required meters.
      properties:
        key: { type: string }
        displayName: { type: string }
        meters:
          type: array
          items:
            $ref: '#/components/schemas/DeclaredMeterDefinition'
    ProviderEnvDefaultField:
      type: object
      required: [envKey, label, sensitive, type]
      properties:
        envKey:
          type: string
          description: Environment variable name (e.g. HETZNER_API_TOKEN)
        label:
          type: string
          description: Human-readable field label for the admin UI
        sensitive:
          type: boolean
          description: When true, value is write-only in API responses
        type:
          type: string
          enum: [string]
    ServerType:
      type: object
      description: Provider server type with specs and pricing (from GET .../providers/{providerId}/server-types).
      properties:
        id: { type: string, description: 'Unique identifier (e.g. cax11)' }
        name: { type: string, description: 'Human-readable name' }
        cores: { type: number }
        memory: { type: number, description: 'RAM in GB' }
        disk: { type: number, description: 'Disk in GB' }
        priceMonthly:
          {
            type: number,
            description: 'Provider price per month (e.g. EUR); admins only',
          }
        priceHourly:
          {
            type: number,
            description: 'Provider price per hour (e.g. EUR); admins only',
          }
        description: { type: string }
        customerPrice:
          {
            type: number,
            description: 'Final net period price of the requested plan (planId) on this server type',
          }
    ProviderLocation:
      type: object
      description: Provider geography option (location or region) with human-readable label.
      required: [id, name]
      properties:
        id:
          type: string
          description: Technical slug used for provisioning (e.g. fsn1, fra1)
        name:
          type: string
          description: Human-readable display name from provider API or static fallback
        city:
          type: string
          description: City when provided by the provider API (Hetzner)
        country:
          type: string
          description: ISO country code when provided by the provider API
    CreateServiceTypeDto:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          description: Unique service type key
        name:
          type: string
          description: Display name
        description:
          type: string
          description: Optional description
        provider:
          type: string
          nullable: true
          description: |
            Primary provider id (first of allowedProviders). Null/empty with empty allowedProviders means None (no cloud provider).
            When omitted, derived from allowedProviders[0].
        allowedProviders:
          type: array
          items: { type: string }
          description: |
            Interchangeable provider ids (order preserved; first is primary). Empty means None.
            All entries must share the same compatibilityGroup from GET /service-types/providers.
        configSchema:
          type: object
          description: JSON schema for provider configuration
        isActive:
          type: boolean
          description: Whether the service type is active
        disallowStatutoryWithdrawal:
          type: boolean
          description: When true, statutory withdrawal is blocked after provisioning (unprovisioned orders remain withdrawable).
        providerDefaults:
          type: object
          additionalProperties:
            type: string
          description: Write-only platform credential overrides (e.g. HETZNER_API_TOKEN). Omit or leave values blank to use environment defaults.
    UpdateServiceTypeDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        provider:
          type: string
          nullable: true
          description: Primary provider id; null/empty with empty allowedProviders means None.
        allowedProviders:
          type: array
          items: { type: string }
          description: Interchangeable provider ids (first is primary). Empty means None.
        configSchema:
          type: object
        isActive:
          type: boolean
        disallowStatutoryWithdrawal:
          type: boolean
          description: When true, statutory withdrawal is blocked after provisioning.
        providerDefaults:
          type: object
          additionalProperties:
            type: string
          description: Write-only platform credential overrides. Empty values clear overrides on update.
    ServiceTypeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        provider:
          type: string
          nullable: true
          description: Primary provider id; null when None (no cloud provider).
        allowedProviders:
          type: array
          items: { type: string }
          description: Interchangeable provider ids (first is primary). Empty means None.
        configSchema: { type: object }
        isActive: { type: boolean }
        disallowStatutoryWithdrawal: { type: boolean }
        providerDefaultsConfigured:
          type: object
          additionalProperties:
            type: boolean
          description: Indicates which platform env overrides are configured (never returns secret values).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentDueDays:
      type: integer
      minimum: 0
      maximum: 365
      nullable: true
      description: Payment terms — payable within N days of the invoice date (0 = immediately). Null inherits (service plan → BILLING_DEFAULT_PAYMENT_DUE_DAYS, default 14).
    DeliveryTermsCode:
      type: string
      enum: [EXW, FCA, CPT, CIP, DAP, DPU, DDP, FAS, FOB, CFR, CIF, CUSTOM]
      nullable: true
      description: Delivery terms — an Incoterms® 2020 rule, or CUSTOM for free text (digital goods/services). Null inherits (service plan → BILLING_DEFAULT_DELIVERY_TERMS_*).
    DeliveryTermsPlace:
      type: string
      maxLength: 255
      nullable: true
      description: Named place for an Incoterms rule (ignored for CUSTOM).
    DeliveryTermsText:
      type: string
      maxLength: 1000
      nullable: true
      description: Free-text delivery terms; required when deliveryTermsCode is CUSTOM (ignored otherwise).
    DocumentNote:
      type: string
      maxLength: 2000
      nullable: true
      description: >-
        Optional free-text document note. Printed on the PDF and embedded in the e-invoice XML as invoice note
        (EN 16931 BG-1 / BT-22, CII ExchangedDocument/IncludedNote without subject code). Line breaks are kept;
        control characters are stripped; blank means no note.
    EffectiveDocumentTerms:
      type: object
      description: Terms after the cascade (document / service plan → global default). Payment terms are always set.
      required:
        [
          paymentDueDays,
          deliveryTermsCode,
          deliveryTermsPlace,
          deliveryTermsText,
        ]
      properties:
        paymentDueDays: { type: integer, minimum: 0, maximum: 365 }
        deliveryTermsCode:
          $ref: '#/components/schemas/DeliveryTermsCode'
        deliveryTermsPlace:
          $ref: '#/components/schemas/DeliveryTermsPlace'
        deliveryTermsText:
          $ref: '#/components/schemas/DeliveryTermsText'
    ServicePlanOrderingHighlight:
      type: object
      required: [icon, text]
      description: |
        One ordered line for catalog or checkout UI. `icon` is an opaque string (e.g. icon-set key or URL)
        interpreted by the client; `text` is human-readable copy shown beside the icon.
      properties:
        icon:
          type: string
          maxLength: 128
        text:
          type: string
          maxLength: 512
    PublicWithdrawalAddressee:
      type: object
      required:
        - name
        - lines
      properties:
        name:
          type: string
        lines:
          type: array
          items:
            type: string
        vatId:
          type: string
        email:
          type: string
          format: email
    RequestPublicWithdrawal:
      type: object
      required:
        - subscriptionNumber
        - customerName
        - email
        - orderedOn
      properties:
        subscriptionNumber:
          type: string
          pattern: '^SUB-\d{6}$'
        customerName:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        company:
          type: string
          maxLength: 255
        orderedOn:
          type: string
          format: date
        receivedOn:
          type: string
          format: date
    PublicWithdrawalRequestResponse:
      type: object
      required:
        - requestId
        - resumed
        - resumeStep
        - message
      properties:
        requestId:
          type: string
          format: uuid
        resumed:
          type: boolean
        resumeStep:
          type: string
          enum: [code, acknowledge]
        message:
          type: string
    VerifyPublicWithdrawalCode:
      type: object
      required:
        - requestId
        - code
      properties:
        requestId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z0-9]{6}$'
    PublicWithdrawalVerifyCodeResponse:
      type: object
      required:
        - resumeStep
        - message
      properties:
        resumeStep:
          type: string
          enum: [acknowledge]
        message:
          type: string
    ConfirmPublicWithdrawal:
      type: object
      required:
        - requestId
        - acknowledgeWithdrawal
      properties:
        requestId:
          type: string
          format: uuid
        acknowledgeWithdrawal:
          type: boolean
          enum: [true]
    PublicWithdrawalConfirmResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    PublicServicePlanOffering:
      type: object
      required:
        - id
        - name
        - serviceTypeId
        - serviceTypeName
        - billingIntervalType
        - billingIntervalValue
        - billInAdvance
        - autoRecalculatePriceDaily
        - totalPrice
        - totalGross
        - taxRate
        - orderingHighlights
        - allowCustomerLocationSelection
        - allowCustomerServerTypeSelection
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        serviceTypeId:
          type: string
          format: uuid
          nullable: true
          description: >
            Service type UUID, or null when the plan has no service type
            and deploys nothing.
        serviceTypeName:
          type: string
          description: Display name of the service type (no config schema); empty when serviceTypeId is null
        billingIntervalType:
          type: string
          enum: [hour, day, month, year]
        billingIntervalValue:
          type: integer
          minimum: 1
        billInAdvance:
          type: boolean
          description: When true, the billing period is charged at period start (prepaid). When false, debt is created at period end (arrear). Usage-based metering is not available for advance-billed plans.
        autoRecalculatePriceDaily:
          type: boolean
          description: When true, the package may have its price recalculated nightly from the provider catalog. Checkout UIs must disclose this and the statutory withdrawal restart on change.
        totalPrice:
          type: number
          description: Customer-facing net total price (same formula as internal pricing preview; margin breakdown not exposed)
        totalGross:
          type: number
          description: Customer-facing gross total price (incl. VAT)
        taxRate:
          type: number
          description: Applied VAT rate in percent for this plan
        totalPriceFrom:
          type: number
          description: Lowest customer-facing net total across allowed server types when allowCustomerServerTypeSelection is true; omitted when not applicable.
        totalGrossFrom:
          type: number
          description: Lowest customer-facing gross total across allowed server types when allowCustomerServerTypeSelection is true; omitted when not applicable.
        orderingHighlights:
          type: array
          items:
            $ref: '#/components/schemas/ServicePlanOrderingHighlight'
        allowCustomerLocationSelection:
          type: boolean
          description: When true, authenticated checkout may send region or location in subscription requestedConfig (schema must define a string enum for that field on the service type).
        allowCustomerServerTypeSelection:
          type: boolean
          description: When true, authenticated checkout may send serverType in subscription requestedConfig; value must be in allowedServerTypes on the plan.
        allowCustomerProviderSelection:
          type: boolean
          description: When true, authenticated checkout may send provider in subscription requestedConfig; value must be in allowedProviders on the plan.
        allowedProviders:
          type: array
          items: { type: string }
          description: Provider ids available for customer selection when allowCustomerProviderSelection is true.
        withdrawalPolicy:
          $ref: '#/components/schemas/WithdrawalPolicy'
        effectiveDocumentTerms:
          $ref: '#/components/schemas/EffectiveDocumentTerms'
    CreateServicePlanDto:
      type: object
      required: [name, billingIntervalType, billingIntervalValue]
      properties:
        inventoryArticles:
          type: array
          nullable: true
          maxItems: 50
          description: Articles withdrawn per billing period; each issued period invoice raises withdrawal requests (null / empty clears).
          items:
            type: object
            required: [articleId, quantity]
            properties:
              articleId: { type: string, format: uuid }
              quantity: { type: number, exclusiveMinimum: 0 }
        serviceTypeId:
          type: string
          format: uuid
          nullable: true
          description: >
            UUID of an existing service type, or null/omitted for a billing-only plan that deploys
            nothing (default in the admin UI).
        name:
          type: string
        description:
          type: string
        billingIntervalType:
          type: string
          enum: [hour, day, month, year]
        billingIntervalValue:
          type: integer
          minimum: 1
        billingDayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
        cancelAtPeriodEnd:
          type: boolean
        billInAdvance:
          type: boolean
          description: When true, debt is created at period start. Default false (arrear). Incompatible with usage-based metering.
        autoRecalculatePriceDaily:
          type: boolean
          description: When true, nightly automatic price recalculation from the provider catalog is enabled. Default false (opt-in).
        minCommitmentDays:
          type: integer
        noticeDays:
          type: integer
        basePrice:
          type: string
          description: Decimal string
        marginPercent:
          type: string
          description: Decimal string
        marginFixed:
          type: string
          description: Decimal string
        providerConfigDefaults:
          type: object
          description: |
            Provider defaults merged with customer requestedConfig on order.
            Provisioning-enabled plans store customer-selectable stacks in provisioningOptions
            (integrated agenstra-controller/agenstra-manager/decabill-billing, custom CloudInit config ids,
            and/or `{ type: none }` for a bare server without a provisioning process).
            Legacy service and cloudInitConfigId keys are derived at persistence time only for single-option plans.
        orderingHighlights:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ServicePlanOrderingHighlight'
          description: Ordered icon/text lines shown with the plan in addition to description.
        isActive:
          type: boolean
        allowCustomerLocationSelection:
          type: boolean
          description: Requires service type schema with region or location string enum. Ignored when false or omitted.
        allowCustomerServerTypeSelection:
          type: boolean
          description: Requires provider schema with basePriceFromField serverType. When true, allowedServerTypes must list at least one server type id.
        allowedServerTypes:
          type: array
          items: { type: string }
          description: Server type ids customers may choose at checkout when allowCustomerServerTypeSelection is true.
        allowCustomerProviderSelection:
          type: boolean
          description: >
            When true, the service type must have at least two allowed providers and allowedProviders must list
            at least two provider ids that are a subset of the service type allowedProviders.
        allowedProviders:
          type: array
          items: { type: string }
          description: >
            When allowCustomerProviderSelection is true: subset of service type providers (at least two).
            When false and the service type has multiple providers: exactly one pinned provider for the plan.
            When the service type has a single provider: that provider is assumed (may be omitted).
        taxCategory:
          type: string
          enum: [standard, reduced]
          description: VAT category applied to automated subscription charges for this plan
        paymentDueDays:
          $ref: '#/components/schemas/PaymentDueDays'
        deliveryTermsCode:
          $ref: '#/components/schemas/DeliveryTermsCode'
        deliveryTermsPlace:
          $ref: '#/components/schemas/DeliveryTermsPlace'
        deliveryTermsText:
          $ref: '#/components/schemas/DeliveryTermsText'
    UpdateServicePlanDto:
      type: object
      properties:
        inventoryArticles:
          type: array
          nullable: true
          maxItems: 50
          description: Articles withdrawn per billing period; each issued period invoice raises withdrawal requests (null / empty clears).
          items:
            type: object
            required: [articleId, quantity]
            properties:
              articleId: { type: string, format: uuid }
              quantity: { type: number, exclusiveMinimum: 0 }
        name: { type: string }
        description: { type: string }
        billingIntervalType: { type: string, enum: [hour, day, month, year] }
        billingIntervalValue: { type: integer, minimum: 1 }
        billingDayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        cancelAtPeriodEnd: { type: boolean }
        billInAdvance:
          type: boolean
          description: When true, debt is created at period start. Default false (arrear). Incompatible with usage-based metering.
        autoRecalculatePriceDaily:
          type: boolean
          description: When true, nightly automatic price recalculation from the provider catalog is enabled. Default false (opt-in).
        migrateExistingSubscriptions:
          type: boolean
          description: >
            Request-only. When true and basePrice, marginPercent, marginFixed, or taxCategory change,
            enqueue migration of eligible subscriptions (settlement, withdrawal restart, price-change email).
            Default false. Not stored on the plan.
        minCommitmentDays: { type: integer }
        noticeDays: { type: integer }
        basePrice: { type: string }
        marginPercent: { type: string }
        marginFixed: { type: string }
        providerConfigDefaults: { type: object }
        orderingHighlights:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ServicePlanOrderingHighlight'
        isActive: { type: boolean }
        allowCustomerLocationSelection: { type: boolean }
        allowCustomerServerTypeSelection: { type: boolean }
        allowedServerTypes:
          type: array
          items: { type: string }
        allowCustomerProviderSelection: { type: boolean }
        allowedProviders:
          type: array
          items: { type: string }
        taxCategory:
          type: string
          enum: [standard, reduced]
        paymentDueDays:
          $ref: '#/components/schemas/PaymentDueDays'
        deliveryTermsCode:
          $ref: '#/components/schemas/DeliveryTermsCode'
        deliveryTermsPlace:
          $ref: '#/components/schemas/DeliveryTermsPlace'
        deliveryTermsText:
          $ref: '#/components/schemas/DeliveryTermsText'
    ServicePlanResponse:
      type: object
      description: >
        `basePrice`, `marginPercent`, `marginFixed` and `inventoryArticles` are internal and only returned to admins
        (and the static API key). Everyone gets `customerPrice`.
      properties:
        customerPrice:
          type: number
          description: Final net period price (base price plus margins) for the plan's own base price.
        inventoryArticles:
          type: array
          nullable: true
          maxItems: 50
          description: Admins only. Articles withdrawn per billing period; each issued period invoice raises withdrawal requests.
          items:
            type: object
            required: [articleId, quantity]
            properties:
              articleId: { type: string, format: uuid }
              quantity: { type: number, exclusiveMinimum: 0 }
        id: { type: string, format: uuid }
        serviceTypeId:
          type: string
          format: uuid
          nullable: true
          description: Service type UUID, or null when the plan has no service type / no deployment
        name: { type: string }
        description: { type: string, nullable: true }
        billingIntervalType: { type: string, enum: [hour, day, month, year] }
        billingIntervalValue: { type: integer }
        billingDayOfMonth: { type: integer, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        billInAdvance:
          type: boolean
          description: When true, the period is billed at start (prepaid). Usage-based metering is not available.
        autoRecalculatePriceDaily:
          type: boolean
          description: When true, nightly automatic price recalculation from the provider catalog is enabled (opt-in; default false).
        minCommitmentDays: { type: integer }
        noticeDays: { type: integer }
        basePrice: { type: string, nullable: true, description: Admins only }
        marginPercent:
          { type: string, nullable: true, description: Admins only }
        marginFixed: { type: string, nullable: true, description: Admins only }
        providerConfigDefaults: { type: object }
        orderingHighlights:
          type: array
          items:
            $ref: '#/components/schemas/ServicePlanOrderingHighlight'
          description: Ordered icon/text lines for display alongside description.
        allowCustomerLocationSelection:
          type: boolean
          description: When true, POST /subscriptions may include region or location in requestedConfig to override plan defaults (values must match service type schema enum).
        allowCustomerServerTypeSelection:
          type: boolean
          description: When true, POST /subscriptions may include serverType in requestedConfig; value must be listed in allowedServerTypes.
        allowedServerTypes:
          type: array
          items: { type: string }
          description: Server type ids available for customer selection when allowCustomerServerTypeSelection is true.
        allowCustomerProviderSelection:
          type: boolean
          description: When true, POST /subscriptions may include provider in requestedConfig; value must be listed in allowedProviders.
        allowedProviders:
          type: array
          items: { type: string }
          description: >
            Effective plan provider set. With customer selection: options at checkout.
            Without customer selection: single pinned provider when the service type has multiple providers.
        taxCategory:
          type: string
          enum: [standard, reduced]
        paymentDueDays:
          $ref: '#/components/schemas/PaymentDueDays'
        deliveryTermsCode:
          $ref: '#/components/schemas/DeliveryTermsCode'
        deliveryTermsPlace:
          $ref: '#/components/schemas/DeliveryTermsPlace'
        deliveryTermsText:
          $ref: '#/components/schemas/DeliveryTermsText'
        effectiveDocumentTerms:
          $ref: '#/components/schemas/EffectiveDocumentTerms'
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        withdrawalPolicy:
          $ref: '#/components/schemas/WithdrawalPolicy'
        meters:
          type: array
          items:
            $ref: '#/components/schemas/AttachedMeterResponse'
    AvailabilityCheckDto:
      type: object
      required: [serviceTypeId, region, serverType]
      properties:
        serviceTypeId:
          type: string
          format: uuid
        region:
          type: string
        serverType:
          type: string
        requestedConfig:
          type: object
    AvailabilityResponse:
      type: object
      properties:
        isAvailable: { type: boolean }
        reason: { type: string }
        alternatives: { type: object }
    RequestedConfig:
      type: object
      description: |
        Optional cloud-init and provisioning config merged with plan defaults.
        May also include provider-specific fields (e.g. serverType, location, firewallId for Hetzner).
        Region or location overrides are accepted only when the plan has allowCustomerLocationSelection and the service type schema defines that field with an enum; otherwise they are ignored server-side.
        serverType overrides are accepted only when the plan has allowCustomerServerTypeSelection and the value is listed in allowedServerTypes; otherwise serverType is stripped from requestedConfig before merge.
        The FQDN (hostname.DNS_BASE_DOMAIN) is used for SSL certificates and CORS; DNS_BASE_DOMAIN
        defaults to spirde.com when not set.
        For service agenstra-manager, disableSignup and provisioning tokens are ignored; authenticationMethod must be api-key or oidc (anything else falls back to api-key).
      additionalProperties: true
      properties:
        provisioningOptionKey:
          type: string
          description: |
            Customer choice when the plan offers multiple provisioningOptions entries
            (for example integrated:agenstra-controller, custom:<cloud-init-config-uuid> or none).
            Required when the plan has more than one option; omitted when the plan has exactly one option.
        service:
          type: string
          enum:
            [
              agenstra-controller,
              agenstra-manager,
              decabill-billing,
              custom,
              none,
            ]
          description: Product service kind. Use agenstra-controller for the full Agenstra stack, agenstra-manager for the agent manager only, decabill-billing for the Decabill billing stack, custom for admin-defined Docker templates, or none for a bare server without a provisioning process (only when the plan offers it).
        env:
          type: object
          additionalProperties: { type: string }
          description: Customer-provided environment variables for custom service plans. Merged with admin defaults server-side.
        region:
          type: string
          description: DigitalOcean-style region; use the key matching the service type schema (region or location).
        location:
          type: string
          description: Hetzner-style location; use the key matching the service type schema (region or location).
        authenticationMethod:
          type: string
          enum: [users, api-key, oidc, saml]
          description: Authentication method (users, api-key, oidc, saml). Default users. agenstra-manager supports api-key and oidc only.
        staticApiKey:
          type: string
          description: Static API key for api-key authentication. Required when authenticationMethod is api-key.
        disableSignup:
          type: boolean
          description: Whether to disable user signup. Default false.
        smtp:
          type: object
          description: SMTP configuration for email.
          properties:
            host: { type: string, description: 'SMTP host (default mailhog)' }
            port: { type: number, description: 'SMTP port (default 1025)' }
            user: { type: string }
            password: { type: string }
            from:
              {
                type: string,
                description: 'From address (default noreply@localhost)',
              }
        oidc:
          type: object
          description: OpenID Connect provider when authenticationMethod is oidc (written as OIDC_* env; console signs in with frontendClientId or clientId).
          properties:
            issuer:
              {
                type: string,
                description: 'Issuer URL (exact iss of access tokens)',
              }
            clientId:
              {
                type: string,
                description: 'Confidential API client (token introspection)',
              }
            clientSecret:
              {
                type: string,
                description: 'Secret of the API client. Sensitive.',
              }
            audience:
              {
                type: string,
                description: 'Optional comma-separated aud allowlist',
              }
            frontendClientId:
              {
                type: string,
                description: 'Public console client (Authorization Code + PKCE); defaults to clientId',
              }
        saml:
          type: object
          description: |
            SAML 2.0 identity provider when authenticationMethod is saml (agenstra-controller, decabill-billing).
            The instance is the service provider: ACS https://<fqdn>/api/auth/saml/acs, metadata https://<fqdn>/api/auth/saml/metadata.
          properties:
            idpSsoUrl:
              {
                type: string,
                description: 'IdP single sign-on URL (HTTP-Redirect binding)',
              }
            idpCert:
              {
                type: string,
                description: 'IdP signing certificate (PEM or base64 body)',
              }
            idpIssuer:
              { type: string, description: 'Optional expected IdP entity id' }
            spEntityId:
              {
                type: string,
                description: 'Optional SP entity id; defaults to https://<fqdn>',
              }
            nameIdFormat:
              {
                type: string,
                description: 'Optional NameID format; defaults to persistent',
              }
            emailAttribute:
              {
                type: string,
                description: 'Optional assertion attribute holding the email address',
              }
        hetznerApiToken:
          type: string
          description: Optional Hetzner API token for nested provisioning from the instance. Sensitive.
        digitaloceanApiToken:
          type: string
          description: Optional DigitalOcean API token for nested provisioning from the instance. Sensitive.
        git:
          type: object
          description: Optional Git configuration for manager instances (GIT_* env vars).
          properties:
            repositoryUrl: { type: string, description: 'Git repository URL' }
            username: { type: string, description: 'Git username (HTTPS)' }
            token: { type: string, description: 'Git token (e.g. PAT)' }
            password:
              {
                type: string,
                description: 'Git password (alternative to token)',
              }
            privateKey:
              { type: string, description: 'SSH private key for git@ URLs' }
            commitAuthorName:
              { type: string, description: 'Default commit author name' }
            commitAuthorEmail:
              { type: string, description: 'Default commit author email' }
    CreateSubscriptionDto:
      type: object
      required: [planId]
      properties:
        planId: { type: string, format: uuid }
        requestedConfig:
          $ref: '#/components/schemas/RequestedConfig'
        addonIds:
          type: array
          description: Selected plan addon IDs (must be subset of plan allowedAddonIds; provider must support addons)
          items: { type: string, format: uuid }
        addonConfigs:
          type: object
          description: Per-addon customer config keyed by addon UUID (merged with admin defaults and random fills)
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        preferredAlternatives: { type: object }
        autoBackorder: { type: boolean }
        promotionCode: { type: string }
        promotionBenefitStartsAt: { type: string, format: date-time }
    SubscriptionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        planId: { type: string, format: uuid }
        planName: { type: string, nullable: true }
        userId: { type: string, format: uuid }
        status:
          {
            type: string,
            enum:
              [
                active,
                pending_backorder,
                pending_cancel,
                pending_withdrawal,
                pending_instant_cancel,
                pending_config_change,
                canceled,
              ],
          }
        currentPeriodStart: { type: string, format: date-time, nullable: true }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }
        nextBillingAt: { type: string, format: date-time, nullable: true }
        cancelRequestedAt: { type: string, format: date-time, nullable: true }
        cancelEffectiveAt: { type: string, format: date-time, nullable: true }
        resumedAt: { type: string, format: date-time, nullable: true }
        withdrawnAt: { type: string, format: date-time, nullable: true }
        instantRemoval: { type: boolean }
        instantCanceledAt: { type: string, format: date-time, nullable: true }
        withdrawalEligibility:
          $ref: '#/components/schemas/WithdrawalEligibility'
        withdrawalResult:
          $ref: '#/components/schemas/WithdrawalResult'
        periodTotalPrice:
          type: number
          description: Total gross price charged per billing period for this subscription
        meters:
          type: array
          description: Plan- and addon-scoped meter summaries for the current billing period
          items:
            $ref: '#/components/schemas/SubscriptionMeterSummary'
        items:
          type: array
          description: Subscription items (services) linked to this subscription
          items:
            $ref: '#/components/schemas/SubscriptionItemResponse'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WithdrawSubscriptionDto:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    InstantCancelSubscriptionDto:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    WithdrawalPolicy:
      type: object
      required:
        - periodDays
        - allowedAfterProvisioning
        - unprovisionedAlwaysWithdrawable
        - provisionedRefundPolicy
      properties:
        periodDays:
          type: integer
          description: Statutory withdrawal window in days after provisioning (from BILLING_STATUTORY_WITHDRAWAL_PERIOD_DAYS).
        allowedAfterProvisioning:
          type: boolean
          description: False when the service type disallows post-provisioning withdrawal.
        unprovisionedAlwaysWithdrawable:
          type: boolean
          enum: [true]
        provisionedRefundPolicy:
          type: string
          enum: [unused_period_prorated]
    WithdrawalEligibility:
      type: object
      properties:
        canWithdraw: { type: boolean }
        phase:
          type: string
          description: unprovisioned, withdrawal_period, expired, or excluded_by_service_type
        deadline: { type: string, format: date-time, nullable: true }
        reason: { type: string, nullable: true }
        estimatedRefundGross: { type: number, nullable: true }
    WithdrawalResult:
      type: object
      properties:
        refundNet: { type: number, nullable: true }
        refundGross: { type: number, nullable: true }
        creditNoteNumber: { type: string, nullable: true }
        paymentRefundStatus:
          type: string
          enum: [not_applicable, pending, succeeded, failed]
    CancelSubscriptionDto:
      type: object
      properties:
        reason: { type: string }
    ResumeSubscriptionDto:
      type: object
      properties:
        reason: { type: string }
    ConfigChangeRequestDto:
      type: object
      description: |
        Mid-life configuration change for an active subscription. Location is intentionally not
        changeable: moving a provisioned server across regions is a re-provision, not an in-place change.
      properties:
        serverType:
          type: string
          description: Target provider server type; must be offered by the plan.
        addAddonIds:
          type: array
          items: { type: string, format: uuid }
        removeAddonIds:
          type: array
          items: { type: string, format: uuid }
        addonConfigs:
          type: object
          description: Per-addon config keyed by addon UUID; only allowed for addons being added.
          additionalProperties:
            type: object
            additionalProperties: { type: string }
    ConfigChangeEligibility:
      type: object
      required:
        - canRequestChange
        - hasPendingChange
        - allowedServerTypes
        - supportsServerTypeUpgrade
        - supportsServerTypeDowngrade
        - availableAddonIds
        - activeAddonIds
      properties:
        canRequestChange: { type: boolean }
        reasonCode:
          type: string
          nullable: true
          enum:
            - CONFIG_CHANGE_NOT_ELIGIBLE
            - CONFIG_CHANGE_NOOP
            - CONFIG_CHANGE_SERVER_TYPE_UNSUPPORTED
            - CONFIG_CHANGE_SERVER_TYPE_LATERAL_UNSUPPORTED
            - CONFIG_CHANGE_ADDON_INVALID
            - CONFIG_CHANGE_ADDON_CONFIG_IMMUTABLE
            - CONFIG_CHANGE_FAILED
        reason: { type: string, nullable: true }
        hasPendingChange: { type: boolean }
        provider:
          type: string
          nullable: true
          description: Effective cloud provider for this subscription (configSnapshot, then service-type primary).
        currentServerType: { type: string, nullable: true }
        allowedServerTypes:
          type: array
          items: { type: string }
        supportsServerTypeUpgrade: { type: boolean }
        supportsServerTypeDowngrade: { type: boolean }
        availableAddonIds:
          type: array
          items: { type: string, format: uuid }
        activeAddonIds:
          type: array
          items: { type: string, format: uuid }
    ConfigChangeAmounts:
      type: object
      properties:
        currency: { type: string }
        currentPeriodNet: { type: number }
        newPeriodNet: { type: number }
        periodDeltaNet: { type: number }
        immediateAdjustmentNet:
          type: number
          description: |
            Prorated net settled with the change; positive is charged, negative is credited.
            Prepaid with an unbilled recurring period charge uses `-periodDeltaNet × elapsed`;
            prepaid with the period already invoiced uses `periodDeltaNet × remaining`.
            Post-usage uses the elapsed share of the old period net. End state matches a new
            booking (`old×elapsed + new×remaining`).
        remainingPeriodRatio:
          type: number
          description: Share of the current billing period still unconsumed, in [0, 1].
    ConfigChangeDisclaimer:
      type: object
      properties:
        kind: { type: string, enum: [charge, credit, none] }
        effectiveAt: { type: string, format: date-time }
        notes:
          type: array
          items: { type: string }
          description: |
            Human-readable settlement notes (e.g. next-invoice charge/credit, or pending period
            reprice with elapsed correction). Not a cash refund promise.
    ConfigChangeDiscount:
      type: object
      properties:
        redemptionId: { type: string, format: uuid }
        code: { type: string }
        advantageType: { type: string }
        remainingBillingPeriods: { type: integer, nullable: true }
        remainingAmountNet: { type: number, nullable: true }
    ConfigChangePreviewResponse:
      type: object
      properties:
        eligibility: { $ref: '#/components/schemas/ConfigChangeEligibility' }
        amounts: { $ref: '#/components/schemas/ConfigChangeAmounts' }
        disclaimer: { $ref: '#/components/schemas/ConfigChangeDisclaimer' }
        discounts:
          type: array
          items: { $ref: '#/components/schemas/ConfigChangeDiscount' }
    ConfigChangeResponse:
      type: object
      description: Status view of a config change run; never contains the requested payload.
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, processing, completed, failed] }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        appliedSteps:
          type: array
          items: { type: string }
        billingOutcome:
          type: string
          nullable: true
          enum: [none, charged, credited, deferred]
          description: |
            One-shot settlement result. `credited` may be an open-position correction (next invoice)
            or a partial credit document (PDF/eInvoice; DATEV on later export) when the prepaid
            period charge was already invoiced.
