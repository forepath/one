        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, rejected] }
        sourceType: { type: string, enum: [offer, invoice, subscription] }
        sourceLabel: { type: string, example: 'INV-2026-00012, pos. 2' }
        quantity: { type: number }
        article: { type: object, additionalProperties: true }
        availableQuantity: { type: number }
        userId: { type: string, format: uuid, nullable: true }
        customerEmail: { type: string, nullable: true }
        offerId: { type: string, format: uuid, nullable: true }
        invoiceId: { type: string, format: uuid, nullable: true }
        subscriptionId: { type: string, format: uuid, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionNote: { type: string, nullable: true }
        movementIds: { type: array, items: { type: string, format: uuid } }
        createdAt: { type: string, format: date-time }
