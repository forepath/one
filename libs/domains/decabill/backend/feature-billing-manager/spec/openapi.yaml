          {
            type: string,
            nullable: true,
            maxLength: 255,
            description: Customer-defined label for the service in dashboards and lists,
          }
        service:
          {
            type: string,
            enum:
              [
                agenstra-controller,
                agenstra-manager,
                decabill-billing,
                custom,
                none,
              ],
            description: Product service from config snapshot; agenstra-controller (full stack),
            agenstra-manager (agent manager only),
            decabill-billing (Decabill billing stack),
            custom Docker template,
            or none (bare server without provisioning). Defaults to agenstra-controller.,
