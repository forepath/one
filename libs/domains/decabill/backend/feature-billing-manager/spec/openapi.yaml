            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/saml/login:
    get:
      summary: Start SAML sign-in (saml auth only)
      description: |
        Redirects the browser to the IdP (HTTP-Redirect binding). The console generates a PKCE verifier and passes its
        S256 challenge; only the browser holding the verifier can redeem the resulting code.
      operationId: samlLogin
      security: []
      parameters:
        - in: query
          name: code_challenge
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
          description: base64url(SHA-256(code_verifier))
        - in: query
          name: redirect
          required: false
          schema:
            type: string
          description: Same-origin console path to return to (anything else falls back to `/`)
      responses:
        '302':
          description: Redirect to the identity provider
        '400':
          description: Missing or invalid `code_challenge`
  /auth/saml/acs:
    post:
      summary: SAML Assertion Consumer Service (saml auth only)
      description: |
        Receives the IdP response (HTTP-POST binding). Validates signatures, audience, issuer, `InResponseTo`
        (single use; unsolicited responses are rejected) and assertion replay, links the identity to a local user,
        and redirects to `SAML_FRONTEND_CALLBACK_URL` with `code` and `redirect`, or `error=saml_failed`.
      operationId: samlAssertionConsumerService
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
