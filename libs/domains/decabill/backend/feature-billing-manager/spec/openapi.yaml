          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [compartmentId, quantity]
            properties:
              compartmentId: { type: string, format: uuid }
              quantity: { type: number, exclusiveMinimum: 0 }
              serialNumbers:
                {
                  type: array,
                  items: { type: string },
                  description: Serial-tracked articles; units in stock in this compartment,
