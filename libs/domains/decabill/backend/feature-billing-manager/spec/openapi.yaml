    InventoryWarehouseInput:
      type: object
      description: Create requires code and name; update accepts any subset. Empty strings clear optional fields.
      properties:
        code:
          {
            type: string,
            maxLength: 32,
            pattern: '^[A-Za-z0-9][A-Za-z0-9._\-/ ]*$',
          }
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        addressLine1: { type: string, nullable: true }
        addressLine2: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country:
          { type: string, nullable: true, description: ISO 3166-1 alpha-2 }
        isActive: { type: boolean }
    InventoryWarehouse:
      allOf:
        - $ref: '#/components/schemas/InventoryWarehouseInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            compartmentCount: { type: integer }
            articleCount:
              { type: integer, description: Distinct articles with stock }
            totalQuantity: { type: number }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    InventoryCompartmentInput:
      type: object
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
    InventoryCompartment:
      allOf:
        - $ref: '#/components/schemas/InventoryCompartmentInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            warehouseId: { type: string, format: uuid }
            warehouseCode: { type: string }
            warehouseName: { type: string }
            articleCount: { type: integer }
            totalQuantity: { type: number }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    InventoryArticleInput:
      type: object
      description: Create requires name. Prices are net and optional; the sales price is prefilled on offer / invoice article positions.
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string, nullable: true }
        ean:
          {
            type: string,
            nullable: true,
            description: 'GTIN-8 / UPC-A / EAN-13 / GTIN-14 with valid check digit; unique per tenant',
          }
        unit:
          {
            type: string,
            enum: [piece, pack, box, pallet, set, kg, g, l, ml, m, m2, m3],
          }
        manufacturer: { type: string, nullable: true }
        manufacturerPartNumber: { type: string, nullable: true }
        supplierId: { type: string, format: uuid, nullable: true }
        supplierArticleNumber: { type: string, nullable: true }
        purchasePriceNet: { type: number, nullable: true }
        salesPriceNet: { type: number, nullable: true }
        currency: { type: string }
        taxCategory: { type: string, enum: [standard, reduced] }
        reorderPoint: { type: number, nullable: true }
        reorderQuantity: { type: number, nullable: true }
        weightKg: { type: number, nullable: true }
        lengthCm: { type: number, nullable: true }
        widthCm: { type: number, nullable: true }
        heightCm: { type: number, nullable: true }
        hsCode: { type: string, nullable: true }
        countryOfOrigin: { type: string, nullable: true }
        isActive: { type: boolean }
        serialTracking:
          {
            type: boolean,
            description: 'Every unit carries a serial number. Switchable only while the article has no stock and no open lendings (409 otherwise).',
          }
        placements:
          type: array
          maxItems: 50
          description: Create only. Quantity > 0 books a putaway document; 0 maps the location. Serial-tracked articles name one serial number per unit.
          items:
            type: object
            required: [compartmentId]
            properties:
              compartmentId: { type: string, format: uuid }
              quantity: { type: number, minimum: 0 }
              serialNumbers: { type: array, items: { type: string } }
    InventoryArticle:
      allOf:
        - $ref: '#/components/schemas/InventoryArticleInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            articleNumber:
              {
                type: string,
                example: ART-000001,
                description: Internal identifier (Code 128 barcode),
              }
            averageCost:
              {
                type: number,
                nullable: true,
                description: Moving weighted average unit cost of the stock on hand (accounting valuation); omitted when unset,
              }
            totalQuantity: { type: number }
            lentQuantity:
              {
                type: number,
                description: On loan (open lendings); not part of totalQuantity,
              }
            locationCount: { type: integer }
            requestedQuantity:
              {
                type: number,
                description: Quantity of pending withdrawal requests,
              }
            lowStock: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    InventoryPlacementInput:
      type: object
      required: [articleId, compartmentId]
      properties:
        articleId: { type: string, format: uuid }
        compartmentId: { type: string, format: uuid }
    InventoryStock:
      type: object
      properties:
        id: { type: string, format: uuid }
        quantity: { type: number }
        article: { type: object, additionalProperties: true }
        compartment: { type: object, additionalProperties: true }
        warehouse: { type: object, additionalProperties: true }
        updatedAt: { type: string, format: date-time }
    InventoryPutawayInput:
      type: object
      required: [articleId, targetCompartmentId, quantity]
      properties:
        articleId: { type: string, format: uuid }
        targetCompartmentId: { type: string, format: uuid }
        quantity:
          { type: number, exclusiveMinimum: 0, description: At most 3 decimals }
        reason: { type: string, enum: [receipt, return, correction, other] }
        serialNumbers:
          type: array
          maxItems: 1000
          description: Serial-tracked articles only. Single serial numbers and ranges (`SN-0001..SN-0050`, last digit group counts up, padding of the first end kept); their expanded count must equal `quantity`.
          items: { type: string, maxLength: 300 }
        reference: { type: string, nullable: true }
        note: { type: string, nullable: true }
        supplierInvoiceId:
          {
            type: string,
            format: uuid,
            nullable: true,
            description: Supplier invoice the stock was bought with (valuation at its line price),
          }
        unitCost:
          {
            type: number,
            minimum: 0,
            nullable: true,
            description: Unit cost override for valuation (net; functional currency; at most 4 decimals); defaults to invoice line / article price,
          }
    InventoryTransferInput:
      type: object
      required: [articleId, sourceCompartmentId, targetCompartmentId, quantity]
      properties:
        articleId: { type: string, format: uuid }
        sourceCompartmentId: { type: string, format: uuid }
        targetCompartmentId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0 }
        serialNumbers:
          type: array
          maxItems: 1000
          description: Serial-tracked articles only. Single serial numbers and ranges (`SN-0001..SN-0050`, last digit group counts up, padding of the first end kept); their expanded count must equal `quantity`.
          items: { type: string, maxLength: 300 }
        reference: { type: string, nullable: true }
        note: { type: string, nullable: true }
    InventoryWithdrawalInput:
      type: object
      required: [articleId, sourceCompartmentId, quantity]
      properties:
        articleId: { type: string, format: uuid }
        sourceCompartmentId: { type: string, format: uuid }
        quantity: { type: number, exclusiveMinimum: 0 }
        reason:
          { type: string, enum: [consumption, damage, loss, correction, other] }
        serialNumbers:
          type: array
          maxItems: 1000
          description: Serial-tracked articles only. Single serial numbers and ranges (`SN-0001..SN-0050`, last digit group counts up, padding of the first end kept); their expanded count must equal `quantity`.
          items: { type: string, maxLength: 300 }
        reference: { type: string, nullable: true }
        note: { type: string, nullable: true }
    InventoryMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          {
            type: string,
            enum: [putaway, transfer, withdrawal, lending, lending_return],
          }
        documentNumber: { type: string, example: PUT-2026-00001 }
        articleId: { type: string, format: uuid }
        articleNumber: { type: string }
        articleName: { type: string }
        unit: { type: string }
        quantity: { type: number }
        reason: { type: string, nullable: true }
        source: { type: object, nullable: true, additionalProperties: true }
        target: { type: object, nullable: true, additionalProperties: true }
        sourceQuantityAfter: { type: number, nullable: true }
        targetQuantityAfter: { type: number, nullable: true }
        reference: { type: string, nullable: true }
        note: { type: string, nullable: true }
        withdrawalRequestId: { type: string, format: uuid, nullable: true }
        serialNumbers: { type: array, items: { type: string } }
        lendingId: { type: string, format: uuid, nullable: true }
        lending:
          {
            type: object,
            nullable: true,
            additionalProperties: true,
            description: Borrower and due date (lendings and their returns),
          }
        performedByEmail: { type: string, nullable: true }
        hasPdf: { type: boolean }
        createdAt: { type: string, format: date-time }
    AcceptInventoryWithdrawalRequest:
      type: object
      required: [allocations]
      properties:
