      properties:
        accountNumber:
          { type: string, pattern: '^[0-9A-Za-z][0-9A-Za-z.-]{0,19}$' }
        debit: { type: number, minimum: 0 }
        credit: { type: number, minimum: 0 }
        taxCode:
          {
            type: string,
            pattern: '^[A-Z0-9_]{2,32}$',
            description: Amount is gross; the VAT line is split off automatically,
          }
        description: { type: string, maxLength: 255 }
        costCenter: { type: string, maxLength: 32 }
    AccountingManualEntryDto:
      type: object
      required: [documentDate, description, lines]
      properties:
        documentDate: { type: string, format: date }
        documentNumber: { type: string, maxLength: 64 }
        description: { type: string, minLength: 1, maxLength: 255 }
        tenantId:
          {
            type: string,
            maxLength: 64,
            description: Tenant dimension (defaults to the request tenant; other tenants or none only in global views),
          }
        lines:
          type: array
          minItems: 2
          maxItems: 200
          items:
            $ref: '#/components/schemas/AccountingManualEntryLineDto'
        links:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AccountingJournalLinkDto'
    AccountingReverseEntryDto:
      type: object
      properties:
        documentDate:
          {
            type: string,
            format: date,
            description: Date of the reversal entry; defaults to today,
          }
        reason: { type: string, maxLength: 200 }
    AccountingJournalStatistics:
      type: object
      properties:
        kpis:
          type: object
          properties:
            entries: { type: integer }
            manualShare:
              { type: number, description: Share of manual entries (0..1) }
            volume: { type: number }
            revenue: { type: number }
            expenses: { type: number }
            result: { type: number }
        series:
          type: array
          items:
            type: object
            properties:
              bucket:
                {
                  type: string,
                  format: date,
                  description: First day of the month,
                }
              entries: { type: integer }
              volume: { type: number }
              manual: { type: integer }
        result:
          type: array
          items:
            type: object
            properties:
              month: { type: string, example: 2026-01 }
              revenue: { type: number }
              expenses: { type: number }
        bySource:
          type: array
          items:
            type: object
            properties:
              source:
                { $ref: '#/components/schemas/AccountingJournalSourceType' }
