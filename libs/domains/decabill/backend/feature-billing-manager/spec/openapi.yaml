      responses:
        '200':
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerDatevExportResponse'
        '403':
          description: Unified export access denied for this tenant
        '404':
          description: DATEV export feature disabled
  /admin/billing/datev-exports/{exportId}:
    get:
      tags: [Admin Billing]
      summary: Get DATEV export metadata (admin only)
      operationId: getAdminDatevExport
      security:
        - bearerAuth: [datev:admin]
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Export metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDatevExportListItem'
        '403':
          description: Export belongs to another tenant or unified access denied
