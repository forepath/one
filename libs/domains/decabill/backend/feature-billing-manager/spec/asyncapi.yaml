asyncapi: 3.0.0
info:
  title: Billing Manager WebSocket Gateways
  version: 1.0.0
  description: |
    Socket.IO events for billing-manager gateways on the shared HTTP `PORT` (default 3200).
    Engine.IO path is `/socket.io/`; REST remains under `/api/`.

    **Namespaces:** `socket/billing` (dashboard status polling), `socket/projects` (live project board) and
    `socket/inventory` (live inventory for administrators).

    **Inventory:** after `subscribeInventory`, ADMIN sockets of the tenant receive the current state (same shape as the
    REST responses) of every changed warehouse, compartment, article, stock placement, movement, withdrawal
    request and lending; `serialUnitsChanged` names articles whose serial-tracked units moved. Non-admins get `error` (`Access denied`). Machine tokens need `websocket:inventory:read` and
    `inventory:admin`. Requests raised outside the API process (subscription billing runs) are announced with
    `requestsChanged` (polled every `INVENTORY_REQUESTS_POLL_INTERVAL` ms, default 15000, while admins are subscribed).

    All connections require authentication via `Authorization` in the handshake. Pass `X-Tenant` in handshake
    `extraHeaders` or `auth.tenantId`. Static API key auth is not sufficient for end-user streams.

    `subscribeSubscriptionMeters` joins room `subscription:{id}`. Customers must own the subscription.
    ADMIN sockets may join any tenant subscription after an existence check (no ownership required).

    **Container Manager:** Live container/network diagnostics are primarily fetched via REST polling
    (`GET .../container-manager/containers` and related paths). An optional future push event
    `billing/containerManagerUpdate` on room `subscription:{id}:container-manager` is documented below
    so clients can adopt push when the gateway emits it; until then, treat REST as the source of truth.
servers:
  billing:
    host: localhost:3200
    protocol: ws
    description: Socket.IO namespace /socket/billing (WEBSOCKET_NAMESPACE) on shared PORT
  projects:
    host: localhost:3200
    protocol: ws
    description: Socket.IO namespace /socket/projects (PROJECTS_WEBSOCKET_NAMESPACE) on shared PORT
  inventory:
    host: localhost:3200
    protocol: ws
    description: Socket.IO namespace /socket/inventory (INVENTORY_WEBSOCKET_NAMESPACE) on shared PORT
channels:
  billing/subscribeDashboardStatus:
    address: billing/subscribeDashboardStatus
    messages:
      subscribeCommand:
        $ref: '#/components/messages/SubscribeDashboardStatus'
  billing/unsubscribeDashboardStatus:
    address: billing/unsubscribeDashboardStatus
    messages:
      unsubscribeCommand:
        $ref: '#/components/messages/UnsubscribeDashboardStatus'
  billing/subscribeSubscriptionMeters:
    address: billing/subscribeSubscriptionMeters
    messages:
      subscribeMetersCommand:
        $ref: '#/components/messages/SubscribeSubscriptionMeters'
  billing/unsubscribeSubscriptionMeters:
    address: billing/unsubscribeSubscriptionMeters
    messages:
      unsubscribeMetersCommand:
        $ref: '#/components/messages/UnsubscribeSubscriptionMeters'
  billing/dashboardStatusUpdate:
    address: billing/dashboardStatusUpdate
    messages:
      statusEvent:
        $ref: '#/components/messages/DashboardStatusUpdate'
  billing/meterSummaryUpdate:
    address: billing/meterSummaryUpdate
    messages:
      meterSummaryEvent:
        $ref: '#/components/messages/MeterSummaryUpdate'
  billing/containerManagerUpdate:
    address: billing/containerManagerUpdate
    messages:
      containerManagerEvent:
        $ref: '#/components/messages/ContainerManagerUpdate'
  billing/error:
    address: billing/error
    messages:
      errorEvent:
        $ref: '#/components/messages/Error'
  projects/setProject:
    address: projects/setProject
    messages:
      setProjectCommand:
        $ref: '#/components/messages/SetProject'
  projects/setProjectSuccess:
    address: projects/setProjectSuccess
    messages:
      setProjectSuccessEvent:
        $ref: '#/components/messages/SetProjectSuccess'
  projects/ticketUpsert:
    address: projects/ticketUpsert
    messages:
      ticketUpsertEvent:
        $ref: '#/components/messages/ProjectTicketUpsert'
  projects/ticketRemoved:
    address: projects/ticketRemoved
    messages:
      ticketRemovedEvent:
        $ref: '#/components/messages/ProjectTicketRemoved'
  projects/ticketCommentCreated:
    address: projects/ticketCommentCreated
    messages:
      ticketCommentCreatedEvent:
        $ref: '#/components/messages/ProjectTicketCommentCreated'
  projects/ticketActivityCreated:
    address: projects/ticketActivityCreated
    messages:
      ticketActivityCreatedEvent:
        $ref: '#/components/messages/ProjectTicketActivityCreated'
  projects/milestoneUpsert:
    address: projects/milestoneUpsert
    messages:
      milestoneUpsertEvent:
        $ref: '#/components/messages/ProjectMilestoneUpsert'
  projects/milestoneRemoved:
    address: projects/milestoneRemoved
    messages:
      milestoneRemovedEvent:
        $ref: '#/components/messages/ProjectMilestoneRemoved'
  projects/timeEntryUpsert:
    address: projects/timeEntryUpsert
    messages:
      timeEntryUpsertEvent:
        $ref: '#/components/messages/ProjectTimeEntryUpsert'
  projects/timeEntryRemoved:
    address: projects/timeEntryRemoved
    messages:
      timeEntryRemovedEvent:
        $ref: '#/components/messages/ProjectTimeEntryRemoved'
  projects/projectSummaryChanged:
    address: projects/projectSummaryChanged
    messages:
      projectSummaryChangedEvent:
        $ref: '#/components/messages/ProjectSummaryChanged'
  projects/error:
    address: projects/error
    messages:
      errorEvent:
        $ref: '#/components/messages/Error'
  inventory/subscribeInventory:
    address: inventory/subscribeInventory
    messages:
      subscribeInventoryMessage:
        $ref: '#/components/messages/InventorySubscribeInventory'
  inventory/unsubscribeInventory:
    address: inventory/unsubscribeInventory
    messages:
      unsubscribeInventoryMessage:
        $ref: '#/components/messages/InventoryUnsubscribeInventory'
  inventory/subscribeInventorySuccess:
    address: inventory/subscribeInventorySuccess
    messages:
      subscribeInventorySuccessMessage:
        $ref: '#/components/messages/InventorySubscribeInventorySuccess'
  inventory/warehouseUpsert:
    address: inventory/warehouseUpsert
    messages:
      warehouseUpsertMessage:
        $ref: '#/components/messages/InventoryWarehouseUpsert'
  inventory/warehouseRemoved:
    address: inventory/warehouseRemoved
    messages:
      warehouseRemovedMessage:
        $ref: '#/components/messages/InventoryWarehouseRemoved'
  inventory/compartmentUpsert:
    address: inventory/compartmentUpsert
    messages:
      compartmentUpsertMessage:
        $ref: '#/components/messages/InventoryCompartmentUpsert'
  inventory/compartmentRemoved:
    address: inventory/compartmentRemoved
    messages:
      compartmentRemovedMessage:
        $ref: '#/components/messages/InventoryCompartmentRemoved'
  inventory/articleUpsert:
    address: inventory/articleUpsert
    messages:
      articleUpsertMessage:
        $ref: '#/components/messages/InventoryArticleUpsert'
  inventory/articleRemoved:
    address: inventory/articleRemoved
    messages:
      articleRemovedMessage:
        $ref: '#/components/messages/InventoryArticleRemoved'
  inventory/stockUpsert:
    address: inventory/stockUpsert
    messages:
      stockUpsertMessage:
        $ref: '#/components/messages/InventoryStockUpsert'
  inventory/stockRemoved:
    address: inventory/stockRemoved
    messages:
      stockRemovedMessage:
        $ref: '#/components/messages/InventoryStockRemoved'
  inventory/movementCreated:
    address: inventory/movementCreated
    messages:
      movementCreatedMessage:
        $ref: '#/components/messages/InventoryMovementCreated'
  inventory/requestUpsert:
    address: inventory/requestUpsert
    messages:
      requestUpsertMessage:
        $ref: '#/components/messages/InventoryRequestUpsert'
  inventory/requestsChanged:
    address: inventory/requestsChanged
    messages:
      requestsChangedMessage:
        $ref: '#/components/messages/InventoryRequestsChanged'
  inventory/lendingUpsert:
    address: inventory/lendingUpsert
    messages:
      lendingUpsertMessage:
        $ref: '#/components/messages/InventoryLendingUpsert'
  inventory/serialUnitsChanged:
    address: inventory/serialUnitsChanged
    messages:
      serialUnitsChangedMessage:
        $ref: '#/components/messages/InventorySerialUnitsChanged'
operations:
  clientSubscribesDashboard:
    action: send
    channel:
      $ref: '#/channels/billing~1subscribeDashboardStatus'
  clientUnsubscribesDashboard:
    action: send
    channel:
      $ref: '#/channels/billing~1unsubscribeDashboardStatus'
  clientSubscribesSubscriptionMeters:
    action: send
    channel:
      $ref: '#/channels/billing~1subscribeSubscriptionMeters'
  clientUnsubscribesSubscriptionMeters:
    action: send
    channel:
      $ref: '#/channels/billing~1unsubscribeSubscriptionMeters'
  serverEmitsDashboardStatus:
    action: receive
    channel:
      $ref: '#/channels/billing~1dashboardStatusUpdate'
  serverEmitsMeterSummary:
    action: receive
    channel:
      $ref: '#/channels/billing~1meterSummaryUpdate'
  serverEmitsContainerManagerUpdate:
    action: receive
    channel:
      $ref: '#/channels/billing~1containerManagerUpdate'
  serverBillingError:
    action: receive
    channel:
      $ref: '#/channels/billing~1error'
  clientSetsProject:
    action: send
    channel:
      $ref: '#/channels/projects~1setProject'
  serverSetProjectSuccess:
    action: receive
    channel:
      $ref: '#/channels/projects~1setProjectSuccess'
  serverProjectTicketUpsert:
    action: receive
    channel:
      $ref: '#/channels/projects~1ticketUpsert'
  serverProjectTicketRemoved:
    action: receive
    channel:
      $ref: '#/channels/projects~1ticketRemoved'
  serverProjectTicketCommentCreated:
    action: receive
    channel:
      $ref: '#/channels/projects~1ticketCommentCreated'
  serverProjectTicketActivityCreated:
    action: receive
    channel:
      $ref: '#/channels/projects~1ticketActivityCreated'
  serverProjectMilestoneUpsert:
    action: receive
    channel:
      $ref: '#/channels/projects~1milestoneUpsert'
  serverProjectMilestoneRemoved:
    action: receive
    channel:
      $ref: '#/channels/projects~1milestoneRemoved'
  serverProjectTimeEntryUpsert:
    action: receive
    channel:
      $ref: '#/channels/projects~1timeEntryUpsert'
  serverProjectTimeEntryRemoved:
    action: receive
    channel:
      $ref: '#/channels/projects~1timeEntryRemoved'
  serverProjectSummaryChanged:
    action: receive
    channel:
      $ref: '#/channels/projects~1projectSummaryChanged'
  serverProjectsError:
    action: receive
    channel:
      $ref: '#/channels/projects~1error'
  inventorySubscribeInventory:
    action: send
    channel:
      $ref: '#/channels/inventory~1subscribeInventory'
  inventoryUnsubscribeInventory:
    action: send
    channel:
      $ref: '#/channels/inventory~1unsubscribeInventory'
  inventorySubscribeInventorySuccess:
    action: receive
    channel:
      $ref: '#/channels/inventory~1subscribeInventorySuccess'
  inventoryWarehouseUpsert:
    action: receive
    channel:
      $ref: '#/channels/inventory~1warehouseUpsert'
  inventoryWarehouseRemoved:
    action: receive
    channel:
      $ref: '#/channels/inventory~1warehouseRemoved'
  inventoryCompartmentUpsert:
    action: receive
    channel:
      $ref: '#/channels/inventory~1compartmentUpsert'
  inventoryCompartmentRemoved:
    action: receive
    channel:
      $ref: '#/channels/inventory~1compartmentRemoved'
  inventoryArticleUpsert:
    action: receive
    channel:
      $ref: '#/channels/inventory~1articleUpsert'
  inventoryArticleRemoved:
    action: receive
    channel:
      $ref: '#/channels/inventory~1articleRemoved'
  inventoryStockUpsert:
    action: receive
    channel:
      $ref: '#/channels/inventory~1stockUpsert'
  inventoryStockRemoved:
    action: receive
    channel:
      $ref: '#/channels/inventory~1stockRemoved'
  inventoryMovementCreated:
    action: receive
    channel:
      $ref: '#/channels/inventory~1movementCreated'
  inventoryRequestUpsert:
    action: receive
    channel:
      $ref: '#/channels/inventory~1requestUpsert'
  inventoryRequestsChanged:
    action: receive
    channel:
      $ref: '#/channels/inventory~1requestsChanged'
  inventoryLendingUpsert:
    action: receive
    channel:
      $ref: '#/channels/inventory~1lendingUpsert'
  inventorySerialUnitsChanged:
    action: receive
    channel:
      $ref: '#/channels/inventory~1serialUnitsChanged'
components:
  messages:
    InventorySubscribeInventory:
      name: InventorySubscribeInventory
      summary: 'Subscribe to live inventory changes of the tenant (admins only)'
      contentType: application/json
      payload: {}
    InventoryUnsubscribeInventory:
      name: InventoryUnsubscribeInventory
      summary: 'Stop live inventory changes'
      contentType: application/json
      payload: {}
    InventorySubscribeInventorySuccess:
      name: InventorySubscribeInventorySuccess
      summary: 'Subscription confirmed'
      contentType: application/json
      payload: { type: object, properties: { message: { type: string } } }
    InventoryWarehouseUpsert:
      name: InventoryWarehouseUpsert
      summary: 'Warehouse created or changed (InventoryWarehouse)'
      contentType: application/json
      payload:
        {
          type: object,
          additionalProperties: true,
          description: Same shape as the REST response,
        }
    InventoryWarehouseRemoved:
      name: InventoryWarehouseRemoved
      summary: 'Warehouse deleted'
      contentType: application/json
      payload:
        { type: object, properties: { id: { type: string, format: uuid } } }
    InventoryCompartmentUpsert:
      name: InventoryCompartmentUpsert
      summary: 'Compartment created or changed (InventoryCompartment)'
      contentType: application/json
      payload:
        {
          type: object,
          additionalProperties: true,
          description: Same shape as the REST response,
        }
    InventoryCompartmentRemoved:
      name: InventoryCompartmentRemoved
      summary: 'Compartment deleted'
      contentType: application/json
      payload:
        {
          type: object,
          properties:
            {
              id: { type: string, format: uuid },
              warehouseId: { type: string, format: uuid },
            },
        }
    InventoryArticleUpsert:
      name: InventoryArticleUpsert
      summary: 'Article created or changed, including stock totals (InventoryArticle)'
      contentType: application/json
      payload:
        {
          type: object,
          additionalProperties: true,
          description: Same shape as the REST response,
        }
    InventoryArticleRemoved:
      name: InventoryArticleRemoved
      summary: 'Article deleted'
      contentType: application/json
      payload:
        { type: object, properties: { id: { type: string, format: uuid } } }
    InventoryStockUpsert:
      name: InventoryStockUpsert
      summary: 'Placement created or its quantity changed (InventoryStock)'
      contentType: application/json
      payload:
        {
          type: object,
          additionalProperties: true,
          description: Same shape as the REST response,
        }
    InventoryStockRemoved:
      name: InventoryStockRemoved
      summary: 'Empty placement removed'
      contentType: application/json
      payload:
        {
          type: object,
          properties:
            {
              id: { type: string, format: uuid },
              compartmentId: { type: string, format: uuid },
              articleId: { type: string, format: uuid },
            },
        }
    InventoryMovementCreated:
      name: InventoryMovementCreated
      summary: 'Movement booked (InventoryMovement; document number PUT-/TRF-/WDR-)'
      contentType: application/json
      payload:
        {
          type: object,
          additionalProperties: true,
          description: Same shape as the REST response,
        }
    InventoryRequestUpsert:
      name: InventoryRequestUpsert
      summary: 'Withdrawal request raised or decided (InventoryWithdrawalRequest)'
      contentType: application/json
      payload:
        {
          type: object,
          additionalProperties: true,
          description: Same shape as the REST response,
        }
    InventoryRequestsChanged:
      name: InventoryRequestsChanged
      summary: 'Requests changed outside this API process; reload request views'
      contentType: application/json
      payload: { type: object, properties: { pendingCount: { type: integer } } }
    InventoryLendingUpsert:
      name: InventoryLendingUpsert
      summary: 'Lending opened or (partly) returned (InventoryLending)'
      contentType: application/json
      payload:
        {
          type: object,
          additionalProperties: true,
          description: Same shape as the REST response,
        }
    InventorySerialUnitsChanged:
      name: InventorySerialUnitsChanged
      summary: 'Serial-tracked units of an article moved; reload its serial number views'
      contentType: application/json
      payload:
        {
          type: object,
          properties: { articleId: { type: string, format: uuid } },
        }
    SubscribeDashboardStatus:
      name: SubscribeDashboardStatus
      contentType: application/json
      payload:
        type: object
        properties:
          pollIntervalMs:
            type: integer
    UnsubscribeDashboardStatus:
      name: UnsubscribeDashboardStatus
      contentType: application/json
      payload:
        type: object
    SubscribeSubscriptionMeters:
      name: SubscribeSubscriptionMeters
      summary: Join a subscription meter room
      description: |
        Customers must own the subscription. ADMIN users may subscribe to any tenant subscription
        after the subscription is verified to exist.
      contentType: application/json
      payload:
        type: object
        required: [subscriptionId]
        properties:
          subscriptionId:
            type: string
            format: uuid
    UnsubscribeSubscriptionMeters:
      name: UnsubscribeSubscriptionMeters
      contentType: application/json
      payload:
        type: object
        required: [subscriptionId]
        properties:
          subscriptionId:
            type: string
            format: uuid
    DashboardStatusUpdate:
      name: DashboardStatusUpdate
      contentType: application/json
      payload:
        type: object
        required: [generatedAt, items]
        properties:
          generatedAt:
            type: string
            format: date-time
          items:
            type: array
            items:
              type: object
              properties:
                subscriptionId: { type: string, format: uuid }
                itemId: { type: string, format: uuid }
                service:
                  {
                    type: string,
                    enum:
                      [
                        agenstra-controller,
                        agenstra-manager,
                        decabill-billing,
                        custom,
                        none,
                      ],
                  }
                serviceTypeName:
                  {
                    type: string,
                    description: User-facing service type name from the catalog,
                  }
                displayName:
                  {
                    type: string,
                    nullable: true,
                    description: Customer-defined label; null when unset,
                  }
                name: { type: string }
                publicIp: { type: string }
                privateIp: { type: string }
                status: { type: string }
                hostname: { type: string }
                hostnameFqdn: { type: string }
                sshAccessGranted:
                  type: boolean
                  description: True after the customer has revealed the provisioning SSH private key at least once
                metadata:
                  type: object
                  additionalProperties: true
    MeterSummaryUpdate:
      name: MeterSummaryUpdate
      contentType: application/json
      payload:
        type: object
        required: [subscriptionId, generatedAt, meters]
        properties:
          subscriptionId:
            type: string
            format: uuid
          generatedAt:
            type: string
            format: date-time
          meters:
            type: array
            items:
              type: object
              required:
                [
                  meterId,
                  key,
                  name,
                  aggregator,
                  attachmentType,
                  effectiveUnitPriceNet,
                  effectiveIncludedUsage,
                  aggregatedValue,
                  billableValue,
                  estimatedChargeNet,
                  entryCount,
                ]
              properties:
                meterId: { type: string, format: uuid }
                key: { type: string }
                name: { type: string }
                unitLabel: { type: string, nullable: true }
                aggregator:
                  type: string
                  enum: [sum, max, last]
                attachmentType:
                  type: string
                  enum: [plan, addon]
                addonId: { type: string, format: uuid, nullable: true }
                addonName: { type: string, nullable: true }
                effectiveUnitPriceNet: { type: number }
                effectiveIncludedUsage: { type: number }
                aggregatedValue: { type: number }
                billableValue: { type: number }
                estimatedChargeNet: { type: number }
                entryCount: { type: integer }
                periodStart: { type: string, format: date-time, nullable: true }
                periodEnd: { type: string, format: date-time, nullable: true }
    ContainerManagerUpdate:
      name: ContainerManagerUpdate
      summary: Optional push of Container Manager containers summary
      description: |
        Room: `subscription:{subscriptionId}:container-manager`.

        Container Manager currently uses REST polling. This message aligns with the containers
        summary (`ContainerManagerContainersResponse`) for optional future Socket.IO push.
        Until the gateway emits it, clients should keep calling the REST endpoints.
      contentType: application/json
      payload:
        type: object
        required: [subscriptionId, itemId, containers, collectedAt]
        properties:
          subscriptionId: { type: string, format: uuid }
          itemId: { type: string, format: uuid }
          collectedAt: { type: string, format: date-time }
          containers:
            type: array
            items:
              type: object
              required: [id, name, image, state, status]
              properties:
                id: { type: string }
                name: { type: string }
                image: { type: string }
                state: { type: string }
                status: { type: string }
                createdAt: { type: string, nullable: true }
                stats:
                  type: object
                  nullable: true
                  properties:
                    cpuPercent: { type: number, nullable: true }
                    memoryUsageBytes: { type: number, nullable: true }
                    memoryLimitBytes: { type: number, nullable: true }
                    memoryPercent: { type: number, nullable: true }
                    blockReadBytes: { type: number, nullable: true }
                    blockWriteBytes: { type: number, nullable: true }
                    networkRxBytes: { type: number, nullable: true }
                    networkTxBytes: { type: number, nullable: true }
    SetProject:
      name: SetProject
      contentType: application/json
      payload:
        type: object
        required: [projectId]
        properties:
          projectId:
            type: string
            format: uuid
    SetProjectSuccess:
      name: SetProjectSuccess
      contentType: application/json
      payload:
        type: object
        properties:
          message: { type: string }
          projectId: { type: string, format: uuid }
    ProjectTicketUpsert:
      name: ProjectTicketUpsert
      contentType: application/json
      payload:
        type: object
        required:
          [
            id,
            projectId,
            title,
            status,
            priority,
            shas,
            tasks,
            locked,
            createdAt,
            updatedAt,
          ]
        properties:
          id: { type: string, format: uuid }
          projectId: { type: string, format: uuid }
          parentId: { type: string, format: uuid, nullable: true }
          milestoneId: { type: string, format: uuid, nullable: true }
          title: { type: string }
          content: { type: string, nullable: true }
          status: { type: string }
          priority: { type: string }
          shas:
            type: object
            properties:
              short: { type: string }
              long: { type: string }
          tasks:
            type: object
            properties:
              open: { type: integer }
              done: { type: integer }
              children:
                type: object
                properties:
                  open: { type: integer }
                  done: { type: integer }
          createdByUserId: { type: string, format: uuid, nullable: true }
          createdByEmail: { type: string }
          locked: { type: boolean }
          attachments:
            type: array
            items:
              type: object
              required:
                [
                  id,
                  ticketId,
                  fileName,
                  contentType,
                  byteSize,
                  downloadUrl,
                  createdAt,
                ]
              properties:
                id: { type: string, format: uuid }
                ticketId: { type: string, format: uuid }
                fileName: { type: string }
                contentType: { type: string }
                byteSize: { type: integer }
                downloadUrl: { type: string }
                createdByUserId: { type: string, format: uuid, nullable: true }
                createdAt: { type: string, format: date-time }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }
          children:
            type: array
            items:
              type: object
    ProjectTicketRemoved:
      name: ProjectTicketRemoved
      contentType: application/json
      payload:
        type: object
        required: [id, projectId]
        properties:
          id: { type: string, format: uuid }
          projectId: { type: string, format: uuid }
    ProjectTicketCommentCreated:
      name: ProjectTicketCommentCreated
      contentType: application/json
      payload:
        type: object
        required: [id, ticketId, userId, body, createdAt]
        properties:
          id: { type: string, format: uuid }
          ticketId: { type: string, format: uuid }
          userId: { type: string, format: uuid }
          userEmail: { type: string }
          body: { type: string }
          createdAt: { type: string, format: date-time }
    ProjectTicketActivityCreated:
      name: ProjectTicketActivityCreated
      contentType: application/json
      payload:
        type: object
        required: [id, ticketId, occurredAt, actorType, actionType, payload]
        properties:
          id: { type: string, format: uuid }
          ticketId: { type: string, format: uuid }
          occurredAt: { type: string, format: date-time }
          actorType: { type: string }
          actorUserId: { type: string, format: uuid, nullable: true }
          actionType: { type: string }
          payload:
            type: object
            additionalProperties: true
    ProjectMilestoneUpsert:
      name: ProjectMilestoneUpsert
      contentType: application/json
      payload:
        type: object
        required:
