      properties:
        name:
          type: string
          description: Branch name (will be prefixed with conventional commit prefix if useConventionalPrefix is true)
        useConventionalPrefix:
          type: boolean
          description: Whether to use conventional commit prefix (feat/, fix/, chore/, etc.)
        conventionalType:
          type: string
