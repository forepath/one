          gitPrivateKey,
          agentDefaultImage,
          autoEnrichEnabledGlobal,
          autoEnrichVectorMaxCosineDistance,
        ]
    UpsertWorkspaceConfigurationOverrideDto:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: Override value
    WorkspaceConfigurationSettingResponseDto:
      type: object
      required: [settingKey, envVarName, source, hasOverride]
      properties:
        settingKey:
          $ref: '#/components/schemas/WorkspaceConfigurationSettingKey'
        envVarName:
          type: string
        value:
          type: string
        source:
          type: string
          enum: [override, default_env, unset]
        hasOverride:
          type: boolean
    EgressMode:
      type: string
      enum: [off, monitor, enforce, offline]
      description: |
        `off` no enforcement; `monitor` all traffic allowed, would-be blocks recorded as `observed`;
        `enforce` allow/deny lists apply (deny wins; empty allowlist = unrestricted); `offline` all egress blocked.
    PlatformPolicyLayer:
      type: string
      enum: [global, workspace, environment]
      description: Configuration layer that contributed a policy entry
    EgressRule:
      type: string
      enum:
        [
          offline,
          deny_host,
          private_network,
          ip_literal,
          deny_url,
          not_allowlisted,
          quic,
          dns_over_tls,
          undeclared_protocol,
          guard,
        ]
    EffectiveEgressEntry:
      type: object
      required: [value, source]
      properties:
        value:
          type: string
        source:
          $ref: '#/components/schemas/PlatformPolicyLayer'
    EffectiveEgressNetworkRule:
      type: object
      required: [protocol, ports, destinations, source]
      properties:
        protocol:
          type: string
          enum: [tcp, udp]
        ports:
          type: string
          description: Port or port range, e.g. `22` or `1000-2000`
        destinations:
          type: array
          items:
            type: string
          description: IP addresses or CIDRs
        description:
          type: string
        source:
          $ref: '#/components/schemas/PlatformPolicyLayer'
    EffectiveEgressPolicy:
      type: object
      description: Fully resolved egress (web traffic) policy (global -> workspace -> environment)
      required:
        [
          mode,
          allowHosts,
          denyHosts,
          denyUrlPatterns,
          networkAllow,
          blockPrivateNetworks,
          blockIpLiterals,
          logAllowed,
          scalarSources,
        ]
      properties:
        mode:
          $ref: '#/components/schemas/EgressMode'
        allowHosts:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveEgressEntry'
        denyHosts:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveEgressEntry'
        denyUrlPatterns:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveEgressEntry'
        networkAllow:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveEgressNetworkRule'
        blockPrivateNetworks:
          type: boolean
        blockIpLiterals:
          type: boolean
        logAllowed:
          type: boolean
        scalarSources:
          type: object
          description: Layer that set each scalar setting (null = platform default)
          required: [mode, blockPrivateNetworks, blockIpLiterals, logAllowed]
          properties:
            mode:
              oneOf:
                - $ref: '#/components/schemas/PlatformPolicyLayer'
                - type: 'null'
            blockPrivateNetworks:
              oneOf:
                - $ref: '#/components/schemas/PlatformPolicyLayer'
                - type: 'null'
            blockIpLiterals:
              oneOf:
                - $ref: '#/components/schemas/PlatformPolicyLayer'
                - type: 'null'
            logAllowed:
              oneOf:
                - $ref: '#/components/schemas/PlatformPolicyLayer'
                - type: 'null'
    EffectiveMessageFilterRule:
