    post:
      summary: Create a short-lived VNC desktop session ticket
      description: |
        Mints a single-use ticket for the raw VNC WebSocket gateway on HTTP `PORT` path `/socket/vnc` (default 3000).
        The ticket is bound to the agent container and expires quickly. The browser must never connect
        to the worker websockify port directly — only through controller/manager VNC gateways.
      operationId: createAgentVncSession
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: VNC session ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVncSessionResponseDto'
        '404':
          description: Agent or container not found
        '503':
          description: Agent container is not running
