components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    basicAuth:
      type: http
      scheme: basic
    agentContextToken:
      type: http
      scheme: bearer
      description: Per-agent context token (worker MCP server only; derived by the manager, never user-issued)
  parameters:
    agentContextAgentId:
      name: x-agenstra-agent-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    agentContextTicket:
      name: ticket
      in: path
      required: true
      schema:
        type: string
      description: Context ticket from the prompt hint (bound to one agent and chat session)
    fileManagerContext:
      name: context
      in: query
      required: false
      schema:
        type: string
        enum: [app]
        default: app
      description: Filesystem root for relative paths. `app` (default) uses the provider workspace root (e.g. /app).
  schemas:
    AgentGraphNode:
      type: object
      required: [id, type, label]
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        path: { type: string }
        community: { type: integer }
        attrs: { type: object, additionalProperties: true }
    AgentGraphEdge:
      type: object
      required: [from, to, type]
      properties:
        from: { type: string }
        to: { type: string }
        type: { type: string }
        confidence: { type: string, enum: [extracted, inferred] }
        attrs: { type: object, additionalProperties: true }
    AgentGraphDocument:
      type: object
      required:
        [
          version,
          scope,
          layer,
          generatedAt,
          nodes,
          edges,
          truncated,
          totalNodes,
          totalEdges,
        ]
      properties:
        version: { type: integer, enum: [1] }
        scope: { type: string, enum: [environment, workspace, global] }
        layer:
          {
            type: string,
            enum: [all, code, paths, references, knowledge, global],
          }
        environmentId: { type: string }
        clientId: { type: string }
        generatedAt: { type: string, format: date-time }
        nodes:
          {
            type: array,
            items: { $ref: '#/components/schemas/AgentGraphNode' },
          }
        edges:
          {
            type: array,
            items: { $ref: '#/components/schemas/AgentGraphEdge' },
          }
        truncated: { type: boolean }
        totalNodes: { type: integer }
        totalEdges: { type: integer }
        offset: { type: integer }
        nextOffset: { type: integer, nullable: true }
    AgentGraphStatus:
      type: object
      required: [environmentId, status, builtAt, truncated, fileCount]
      properties:
        environmentId: { type: string }
        status:
          { type: string, enum: [missing, building, ready, stale, failed] }
        builtAt: { type: string, format: date-time, nullable: true }
        buildDurationMs: { type: integer, nullable: true }
        truncated: { type: boolean }
        error: { type: string, nullable: true }
        layers: { type: object, additionalProperties: true }
        languages: { type: object, additionalProperties: { type: integer } }
        fileCount: { type: integer }
    AgentGraphComposeRequest:
      type: object
      required: [environmentIds, layer]
      properties:
        environmentIds:
          { type: array, maxItems: 200, items: { type: string, format: uuid } }
        layer: { type: string, enum: [all, code, paths, references] }
        limit:
          {
            type: integer,
            description: Nodes per environment; omitted for every node,
          }
        names: { type: object, additionalProperties: { type: string } }
    AgentGraphObject:
      type: object
      description: Graph response object (see `graph-platform.ts` in `@forepath/agenstra/shared/util-opencode-config` for the exact shape).
      additionalProperties: true
    AgentContextItemSummary:
      type: object
      required: [ref, kind, title, granted]
      properties:
        ref:
          type: string
          description: '`item:<n>`, `ticket:<sha>`, `knowledge:<sha>` or `plan:<sha>`'
        kind:
          type: string
          enum: [ticket, knowledge, plan, context]
        title:
          type: string
        sha:
          type: string
        status:
          type: string
        priority:
          type: string
        nodeType:
          type: string
        parentSha:
          type: [string, 'null']
        size:
          type: integer
        granted:
          type: boolean
    AgentContextListResponse:
      type: object
      required: [ticket, items, attachments, environments, canRequestAccess]
      properties:
        ticket:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentContextItemSummary'
        attachments:
          type: array
          items:
            type: object
            properties:
              fileName:
                type: string
              contentType:
                type: string
              byteSize:
                type: integer
              agentPath:
                type: string
        workspace:
          type: object
          properties:
            mountPath:
              type: string
        environments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
        canRequestAccess:
          type: boolean
    AgentContextAccessResponse:
      type: object
      required: [requestId, decision, refs]
      properties:
        requestId:
          type: string
        decision:
          type: string
          enum: [granted, denied, pending]
        refs:
          type: array
          items:
            type: string
        message:
          type: string
    AgentTaskInput:
      type: object
      description: >-
        All fields are required on create except `timezone` (UTC), `model`, `enabled` (true) and
        `allowedHandoffAgentIds` (none).
      properties:
        title:
          type: string
          maxLength: 200
        prompt:
          type: string
          maxLength: 20000
        cronExpression:
          type: string
          maxLength: 128
          description: Five-field cron expression (minute hour day-of-month month day-of-week)
        timezone:
          type: string
          maxLength: 64
        model:
          type: string
          maxLength: 256
          description: OpenCode provider/model
        enabled:
          type: boolean
        allowedHandoffAgentIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
          description: >-
            Proposed agents of the workspace the runs may hand off work to; take effect only after a user approved the
            task (any change clears the approval)
        allowedContentWrites:
          type: array
          items:
            type: string
          description: >-
            Proposed ticket / knowledge changes the runs may make (`ticket.create`, `ticket.comment`, ...); take effect
            only after a user approved the task
        allowedDeploymentOperations:
          type: array
          items:
            type: string
            enum: [deployment.trigger, deployment.cancel]
          description: >-
            Proposed deployment run actions the runs may take (`deployments_trigger` / `deployments_cancel_run`); take
            effect only after a user approved the task
    AgentHandoffAgentSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        handoffProfile:
          type: string
          description: Responsibilities and what the agent can take over
        repositoryUrl:
          type: string
    AgentHandoffSelfSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        handoffProfile:
          type: string
    AgentHandoffCreateInput:
      type: object
      required: [targetAgentId, title, message]
      properties:
        targetAgentId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 20000
          description: Self-contained task description (the target does not see the caller's chat)
        model:
          type: string
          maxLength: 256
          description: OpenCode provider/model for the target turn
    AgentHandoffRespondInput:
      type: object
      required: [status, response]
      properties:
        status:
          type: string
          enum: [completed, failed]
        response:
          type: string
          maxLength: 20000
    AgentHandoffResponse:
      type: object
      required: [handoff]
      properties:
        handoff:
          $ref: '#/components/schemas/AgentHandoffSummary'
    AgentHandoffSummary:
      type: object
      required:
        [
          id,
          sourceAgentId,
          sourceAgentName,
          sourceChatId,
          sourceTaskId,
          sourceTaskRunId,
          targetAgentId,
          targetAgentName,
          targetChatId,
          title,
          message,
          status,
          response,
          failureMessage,
          delivery,
          deliveryFailureMessage,
          createdAt,
          finishedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        sourceAgentId:
          type: string
          format: uuid
        sourceAgentName:
          type: string
        sourceChatId:
          type: string
          format: uuid
          nullable: true
          description: Chat the handoff was made in; the response is delivered there only (null for task runs)
        sourceTaskId:
          type: string
          format: uuid
          nullable: true
          description: Approved task whose run made the handoff
        sourceTaskRunId:
          type: string
          format: uuid
          nullable: true
          description: Task run that made the handoff; the response continues that run in its own session
        targetAgentId:
          type: string
          format: uuid
        targetAgentName:
          type: string
        targetChatId:
          type: string
          format: uuid
          description: Chat (kind handoff) opened on the target agent
        title:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        response:
          type: string
          nullable: true
        failureMessage:
          type: string
          nullable: true
        delivery:
          type: string
          enum: [pending, delivered, undeliverable]
          description: undeliverable — the requesting chat no longer exists or delivery retries are exhausted
        deliveryFailureMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
    AgentTaskSummary:
      type: object
      required:
        [
          id,
          agentId,
          title,
          prompt,
          cronExpression,
          timezone,
          model,
          enabled,
          allowedHandoffAgentIds,
          createdBy,
          updatedBy,
        ]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        title:
          type: string
        prompt:
          type: string
        cronExpression:
          type: string
        timezone:
          type: string
        model:
          type: string
        enabled:
          type: boolean
        allowedHandoffAgentIds:
          type: array
          items:
            type: string
            format: uuid
          description: >-
            Agents of the workspace the runs may hand off work to (approved content: proposing a change clears the
            approval; empty: no handoffs)
        allowedContentWrites:
          type: array
          items:
            type: string
          description: Ticket / knowledge changes the runs may make (approved content; empty — none)
        allowedDeploymentOperations:
          type: array
          items:
            type: string
            enum: [deployment.trigger, deployment.cancel]
          description: Deployment run actions the runs may take (approved content; empty — none)
        nextRunAt:
          type: string
          format: date-time
          nullable: true
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastRunStatus:
          type: string
          enum: [running, awaiting_handoff, succeeded, failed]
          nullable: true
        createdBy:
          type: string
          enum: [user, agent]
        updatedBy:
          type: string
          enum: [user, agent]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentTaskRunSummary:
      type: object
      required: [id, taskId, agentId, trigger, status, scheduledFor, startedAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [schedule, manual]
        status:
          type: string
          enum: [running, awaiting_handoff, succeeded, failed]
        scheduledFor:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        outputExcerpt:
          type: string
          nullable: true
        failureMessage:
          type: string
          nullable: true
        awaitingHandoffSince:
          type: string
          format: date-time
          nullable: true
          description: Set while the run waits for the response to one of its handoffs
    AgentDeploymentWorkflowSummary:
      type: object
      description: Deployment workflow of the workspace (controller-owned; see the controller API `DeploymentWorkflowSummary`)
      required:
        [
          id,
          clientId,
          connectionId,
          provider,
          name,
          repository,
          scope,
          agentIds,
          agentTriggerEnabled,
          enabled,
        ]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        connectionId:
          type: string
          format: uuid
        provider:
          type: string
          enum: [github, gitlab, jenkins]
        connectionLabel:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        repository:
          type: string
        workflow:
          type: string
          nullable: true
        defaultRef:
          type: string
          nullable: true
        defaultInputs:
          type: object
          additionalProperties:
            type: string
        scope:
          type: string
          enum: [global, environments]
        agentIds:
          type: array
          items:
            type: string
            format: uuid
        agentTriggerEnabled:
          type: boolean
          description: Whether environments may trigger and cancel runs (otherwise read only)
        enabled:
          type: boolean
        approvalStatus:
          type: string
          enum: [approved, pending]
          description: '`pending`: proposed or changed by an environment, waiting for a workspace admin (no runs)'
        approvedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          enum: [user, agent]
        updatedBy:
          type: string
          enum: [user, agent]
        createdByAgentId:
          type: string
          format: uuid
          nullable: true
        lastRunStatus:
          type: string
          enum: [queued, in_progress, completed]
          nullable: true
        lastRunConclusion:
          type: string
          enum: [success, failure, cancelled, skipped, timed_out, neutral]
          nullable: true
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentDeploymentRunSummary:
      type: object
      required: [id, clientId, workflowId, workflowName, status, triggeredBy]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        workflowName:
          type: string
        agentId:
          type: string
          format: uuid
          nullable: true
        providerRunId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        status:
          type: string
          enum: [queued, in_progress, completed]
        conclusion:
          type: string
          enum: [success, failure, cancelled, skipped, timed_out, neutral]
          nullable: true
        ref:
          type: string
          nullable: true
        sha:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        inputs:
          type: object
          additionalProperties:
            type: string
        triggeredBy:
          type: string
          enum: [user, agent, external]
        triggeredByUserId:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentDeploymentRunJobSummary:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [queued, in_progress, completed]
        conclusion:
          type: string
          enum: [success, failure, cancelled, skipped, timed_out, neutral]
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          nullable: true
    AgentDeploymentTriggerInput:
      type: object
      additionalProperties: false
      required: [ticket]
      properties:
        ticket:
          type: string
          maxLength: 128
          description: Context ticket of the prompt (starts with `ctx-`)
        ref:
          type: string
          maxLength: 255
          description: Branch / tag; defaults to the workflow default ref (or the repository default branch)
        inputs:
          type: object
          maxProperties: 25
          description: Overrides of the workflow default inputs (names up to 100, values up to 1000 characters)
          additionalProperties:
            type: string
            maxLength: 1000
    AgentDeploymentActionResponse:
      type: object
      required: [requestId, decision, operation]
      properties:
        requestId:
          type: string
          description: '`ctx_dep_*` id of an action that waited for the user (empty when decided right away)'
        decision:
          type: string
          enum: [applied, pending, denied, failed]
          description: |
            `applied`: carried out (`run` describes the run); `pending`: waiting for the user (poll
            `GET /agent-context/deployments/actions/{requestId}`); `denied`: rejected by the user or not allowed in this
            session; `failed`: approved but refused by the controller (`message` says why).
        operation:
          type: string
          enum: [deployment.trigger, deployment.cancel]
        run:
          $ref: '#/components/schemas/AgentDeploymentRunSummary'
        message:
          type: string
    AgentDeploymentConnectionOption:
      type: object
      required: [id, label, provider, lastTestStatus]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        provider:
          type: string
          enum: [github, gitlab, jenkins]
        lastTestStatus:
          type: string
          enum: [ok, failed, untested]
    AgentDeploymentWorkflowInput:
      type: object
      description: |
        Workflow an environment proposes for itself (always assigned to that environment only, pending until a workspace
        admin approves it). Unknown fields (e.g. `scope`, `agentIds`) are ignored.
      required: [connectionId, name, repository]
      properties:
        connectionId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        repository:
          type: string
          maxLength: 512
        workflow:
          type: string
          nullable: true
          maxLength: 512
          description: GitHub workflow file or id (required for GitHub)
        defaultRef:
          type: string
          nullable: true
          maxLength: 255
        defaultInputs:
          type: object
          maxProperties: 25
          additionalProperties:
            type: string
            maxLength: 1000
        agentTriggerEnabled:
          type: boolean
          default: false
          description: Requested permission to trigger / cancel runs itself (effective once approved)
        enabled:
          type: boolean
          default: true
    AgentDeploymentWorkflowUpdateInput:
      type: object
      description: Same fields as `AgentDeploymentWorkflowInput`, all optional (at least one).
      minProperties: 1
      properties:
        connectionId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        repository:
          type: string
          maxLength: 512
        workflow:
          type: string
          nullable: true
          maxLength: 512
        defaultRef:
          type: string
          nullable: true
          maxLength: 255
        defaultInputs:
          type: object
          nullable: true
          maxProperties: 25
          additionalProperties:
            type: string
            maxLength: 1000
        agentTriggerEnabled:
          type: boolean
        enabled:
          type: boolean
    EnvironmentProgressDto:
      type: object
      required:
        [
          operationId,
          agentId,
          agentName,
          operation,
          status,
          step,
          stepIndex,
          stepCount,
          progress,
          startedAt,
          updatedAt,
        ]
      properties:
        operationId:
          type: string
          format: uuid
          description: Unique id of the provisioning operation
        agentId:
          type: [string, 'null']
          format: uuid
          description: Agent UUID; null while a newly created environment is not persisted yet
        agentName:
          type: string
        operation:
          type: string
          enum: [create, update]
          description: create = new environment; update = container recreation (environment variables, workspace overrides, config sync)
        status:
          type: string
          enum: [running, completed, failed]
          description: Terminal statuses (completed/failed) are emitted once and then dropped from the active list
        step:
          type: string
          enum:
            [
              queued,
              preparing,
              pullingImage,
              creatingContainer,
              preparingRepository,
              persisting,
              waitingForHealthy,
              summarizingContext,
              recreatingContainer,
              restartingContainer,
              restoringGitCredentials,
              finalizing,
            ]
        stepIndex:
          type: integer
          minimum: 0
          description: Zero-based index of the current step in the operation plan
        stepCount:
          type: integer
          minimum: 1
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Weighted overall percentage (monotonic; 100 only on completion). Image pull reports real layer byte progress.
        error:
          type: string
          description: Failure reason when status is failed
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateAgentDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
        agentType:
          type: string
          enum: [opencode]
          description: Agent provider type (defaults to 'opencode' if not provided)
        gitRepositorySetupMode:
          type: string
          enum: [clone, empty]
          description: |
            How to initialize the agent workspace Git repository. `clone` (default) clones a remote;
            `empty` runs `git init` with no remote. When `empty`, do not send `gitRepositoryUrl`.
        gitRepositoryUrl:
          type: [string, 'null']
          description: Git repository URL to clone when creating the agent (required for clone mode unless GIT_REPOSITORY_URL is set on the instance)
        egressPolicy:
          $ref: '#/components/schemas/EffectiveEgressPolicy'
          description: |
            Effective egress policy (set by the agent controller from the layered agent configuration).
            When it requires filtering, the egress guard is provisioned and its policy applied before the
            agent container starts.
        isolationLevel:
          $ref: '#/components/schemas/IsolationLevel'
          description: |
            Container isolation level (`microvm` = KVM microVM, `sandboxed-kvm` = gVisor on KVM,
            `sandboxed` = gVisor, `standard` = runc). When omitted, the strongest level that is ready on this host is used. An explicit level is never replaced by another one:
            an unavailable level is rejected with 409.
        capabilityRevision:
          type: string
          maxLength: 128
          description: |
            Isolation capability revision the selection was made against (`HostIsolationCapabilitiesDto.revision`).
            When set and the host's capabilities changed in the meantime, the request is rejected with 409.
        isolationSelection:
          type: object
          additionalProperties: true
          description: |
            Selection metadata set by the agent controller. Only `selectedBy` (user id, max 255 characters)
            is used; every other field of the persisted selection record is derived by the agent manager.
          properties:
            selectedBy:
              type: string
              maxLength: 255
    UpdateAgentDto:
      type: object
      properties:
        name:
          type: [string, 'null']
        description:
          type: [string, 'null']
        handoffProfile:
          type: string
          maxLength: 4000
          description: Responsibilities / what other agents can hand over (empty string clears it)
        agentType:
          type: string
          enum: [opencode]
          description: Agent provider type
        egressPolicy:
          $ref: '#/components/schemas/EffectiveEgressPolicy'
          description: |
            Effective egress policy (set by the agent controller from the layered agent configuration).
            When it requires filtering, the egress guard is provisioned and its policy applied before the
            agent container starts.
    AgentModelsResponseDto:
      type: object
      additionalProperties:
        type: string
      description: Model catalog for an agent; keys are model identifiers, values are display names
    AgentResponseDto:
      type: object
      required:
        [id, name, agentType, createdAt, updatedAt, chats, primaryChatId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        handoffProfile:
          type: string
          description: Responsibilities / what other agents of the workspace can hand over (agent handoffs)
        agentType:
          type: string
          description: Agent provider type identifier
        capabilities:
          $ref: '#/components/schemas/AgentTypeCapabilities'
        git:
          type: [object, 'null']
          properties:
            repositoryUrl:
              type: string
              description: Git repository URL associated with the agent (clone mode only)
            setupMode:
              type: string
              enum: [clone, empty]
              description: How the workspace repository was initialized
          description: Git information when the agent has an associated repository or empty local repo
        chats:
          type: array
          description: User-visible chat sessions for this environment
          items:
            $ref: '#/components/schemas/AgentChatSessionSummaryDto'
        primaryChatId:
          type: string
          format: uuid
          description: Id of the primary chat session for this environment
        egress:
          $ref: '#/components/schemas/AgentEgressStatusDto'
          description: Egress guard (web traffic filtering) status of this environment
        isolation:
          $ref: '#/components/schemas/AgentIsolationDto'
          description: Container isolation level of this environment (runtime and selection record)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LatestAgentMessageDto:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    CreateAgentResponseDto:
      allOf:
        - $ref: '#/components/schemas/AgentResponseDto'
        - type: object
          required: [password]
          properties:
            password:
              type: string
    AgentTypeInfo:
      type: object
      required: [type, displayName, capabilities]
      properties:
        type:
          type: string
          description: The unique type identifier (e.g., 'opencode')
        displayName:
          type: string
          description: Human-readable display name (e.g., 'OpenCode')
        capabilities:
          $ref: '#/components/schemas/AgentTypeCapabilities'
    AgentTypeCapabilities:
      type: object
      required:
        [supportsChat, supportsStreaming, supportsToolEvents, supportsQuestions]
      properties:
        transport:
          type: string
          enum: [opencode-http, http]
          description: Wire transport for agent messaging (OpenCode HTTP server API + SSE events)
        supportsChat:
          type: boolean
        supportsStreaming:
          type: boolean
        supportsToolEvents:
          type: boolean
        supportsQuestions:
          type: boolean
    DependencyHealthStatus:
      type: string
      enum: [healthy, degraded, unknown, not_applicable]
    InstanceDependencyHealthDto:
      type: object
      properties:
        redis: { $ref: '#/components/schemas/DependencyHealthStatus' }
        queue: { $ref: '#/components/schemas/DependencyHealthStatus' }
        database: { $ref: '#/components/schemas/DependencyHealthStatus' }
        opensearch: { $ref: '#/components/schemas/DependencyHealthStatus' }
    InstanceStatusResponseDto:
      type: object
      properties:
        instanceId: { type: string }
        serviceName: { type: string }
        role: { type: string }
        hostname: { type: string }
        installedVersion: { type: string }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer }
        dependencies:
          { $ref: '#/components/schemas/InstanceDependencyHealthDto' }
    ConfigResponseDto:
      type: object
      required: [agentTypes]
      properties:
        gitRepositoryUrl:
          type: [string, 'null']
          description: Git repository URL used for cloning repositories when creating agents (clone mode)
        gitRepositorySetupMode:
          type: string
          enum: [clone, empty]
          description: Default setup mode for new agents on this instance (defaults to clone)
        agentTypes:
          type: array
          items:
            $ref: '#/components/schemas/AgentTypeInfo'
          description: Array of available agent provider types with display names
        isolation:
          $ref: '#/components/schemas/HostIsolationCapabilitiesDto'
          description: Container isolation levels this host can run (from real runtime probes)
    IsolationLevel:
      type: string
      enum: [standard, sandboxed, sandboxed-kvm, microvm]
      description: |
        Container isolation level. `standard` runs the worker on Docker's default runtime (runc, shares
        the host kernel); `sandboxed` runs it on gVisor (`runsc`, systrap platform); `sandboxed-kvm`
        runs it on gVisor's KVM platform (`runsc --platform=kvm`, hardware virtualization, needs
        `/dev/kvm` on the host); `microvm` runs it as a KVM microVM with its own guest kernel (libvirt/QEMU
        inside a hardened runc launcher container of the microVM worker image, needs `/dev/kvm`).
    IsolationRuntimeState:
      type: string
      enum:
        [
          ready,
          unsupported,
          installation-failed,
          probe-failed,
          disabled-by-admin,
        ]
      description: Runtime state of an isolation level on a host (derived from real probes, never from configuration alone)
    IsolationRuntimeFailureDto:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          description: "Operator-facing failure, e.g. 'The microvm (KVM microVM) container could not be started: ...'"
        code:
          type: string
          enum: [E_ISOLATION_RUNTIME_FAILED]
          description: Present when a gVisor or microVM environment container could not be started (never retried on another runtime)
        isolationLevel:
          $ref: '#/components/schemas/IsolationLevel'
    IsolationLevelCapabilityDto:
      type: object
      required: [rank, runtime, state]
      properties:
        rank:
          type: integer
          description: Strength rank (`1` = standard, `2` = sandboxed, `3` = sandboxed-kvm, `4` = microvm); higher is stronger
        runtime:
          type: string
          description: Docker runtime name used for this level (`runc`, `runsc-systrap`, `runsc-kvm`; `runc` for the microVM launcher)
        state:
          $ref: '#/components/schemas/IsolationRuntimeState'
        reasonCode:
          type: string
          description: |
            Stable machine-readable reason when the level is not `ready`, e.g. `E_RUNTIME_NOT_REGISTERED`,
            `E_DOCKER_BASELINE_UNAVAILABLE`, `E_RUNC_PROBE_FAILED`, `E_PROBE_PENDING`, `E_PROBE_IMAGE_UNAVAILABLE`,
            `E_PROBE_START_FAILED`, `E_PROBE_EXEC_FAILED`, `E_PROBE_FILESYSTEM_FAILED`, `E_PROBE_LOGS_FAILED`,
            `E_PROBE_RUNTIME_MISMATCH`, `E_PROBE_TIMEOUT`, `E_SHARED_NETNS_FAILED`, `E_REPEATED_RUNTIME_FAILURES`,
            `E_DISABLED_BY_ADMIN`, `E_SHARED_NETNS_RUNTIME_NOT_REGISTERED`, `E_KVM_UNAVAILABLE` (the KVM
            platform or the microVM launcher cannot open `/dev/kvm`), `E_RUNTIME_MISCONFIGURED` (runtime registered
            with another gVisor platform / network mode), `E_MICROVM_IMAGE_UNSUPPORTED` (the configured microVM
            image does not implement this manager's bridge protocol), `E_MICROVM_BOOT_FAILED` (the probe microVM
            did not boot or failed the worker contract)
        reason:
          type: string
          description: Short operator-facing explanation (never contains secrets or workspace content)
    HostIsolationCapabilitiesDto:
      type: object
      required:
        [revision, probedAt, probing, levels, recommendedLevel, availableLevels]
      properties:
        revision:
          type: string
          description: Content hash (`sha256:...`) of the probed host state; changes whenever capabilities change
        probedAt:
          type: [string, 'null']
          format: date-time
          description: Time of the last completed probe (`null` before the first probe finished)
        probing:
          type: boolean
          description: True while a probe is running (states reflect the previous probe)
        levels:
          type: object
          required: [standard, sandboxed, sandboxed-kvm, microvm]
          properties:
            standard:
              $ref: '#/components/schemas/IsolationLevelCapabilityDto'
            sandboxed:
              $ref: '#/components/schemas/IsolationLevelCapabilityDto'
            sandboxed-kvm:
              $ref: '#/components/schemas/IsolationLevelCapabilityDto'
            microvm:
              $ref: '#/components/schemas/IsolationLevelCapabilityDto'
        recommendedLevel:
          oneOf:
            - $ref: '#/components/schemas/IsolationLevel'
            - type: 'null'
          description: Strongest ready level, or `null` when the host cannot run environments (standard baseline not ready)
        availableLevels:
          type: array
          items:
            $ref: '#/components/schemas/IsolationLevel'
          description: Ready levels, strongest first (empty when the standard baseline is not ready)
    AgentIsolationSelectionDto:
      type: object
      required: [effectiveSelection, selectionSource, selectedAt]
      description: How the isolation level of an environment was selected (audit record)
      properties:
        automaticSelection:
          oneOf:
            - $ref: '#/components/schemas/IsolationLevel'
            - type: 'null'
          description: Level that was automatically recommended when the environment was created
        effectiveSelection:
          $ref: '#/components/schemas/IsolationLevel'
        selectionSource:
          type: string
          enum: [automatic, user-confirmed, user-override]
          description: |
            `automatic` (no explicit level), `user-confirmed` (explicit level at least as strong as the
            recommendation), `user-override` (explicit weaker level than recommended)
        selectedBy:
          type: [string, 'null']
          description: Controller user id that made the selection (when known)
        selectedAt:
          type: string
          format: date-time
        capabilityRevision:
          type: [string, 'null']
          description: Host capability revision the selection was validated against
    AgentIsolationDto:
      type: object
      required: [level, runtime]
      description: Effective container isolation of an environment
      properties:
        level:
          $ref: '#/components/schemas/IsolationLevel'
        runtime:
          type: string
          description: Docker runtime the environment's worker container runs on (`runsc-systrap-hostnet` / `runsc-kvm-hostnet` for gVisor workers behind an egress guard or on the agent network)
        selection:
          oneOf:
            - $ref: '#/components/schemas/AgentIsolationSelectionDto'
            - type: 'null'
          description: Selection record (`null` for environments created before isolation levels existed)
    AgentFileType:
      type: string
      enum: [text, binary, pdf, image, video, audio]
      description: Server-authoritative file classification for editor/preview behavior
    FileNodeDto:
      type: object
      required: [name, type, path]
      properties:
        name:
          type: string
          description: File or directory name
        type:
          type: string
          enum: [file, directory]
          description: Node type
        path:
          type: string
          description: Relative path from /app
        size:
          type: [integer, 'null']
          description: File size in bytes (only for files)
        modifiedAt:
          type: [string, 'null']
          format: date-time
          description: Last modification timestamp
    CreateFileDto:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [file, directory]
          description: Type of node to create (empty file or directory; write content via PUT)
    MoveFileDto:
