      properties:
        variable:
          type: string
          description: Environment variable name
        content:
          type: string
          description: Environment variable content
    UpdateEnvironmentVariableDto:
      type: object
      required: [variable, content]
      properties:
        variable:
          type: string
          description: Environment variable name
        content:
          type: string
          description: Environment variable content
    EnvironmentVariableResponseDto:
      type: object
      required: [id, agentId, variable, content, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        variable:
          type: string
          description: Environment variable name
        content:
          type: string
          description: Environment variable content
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateChatSessionDto:
      type: object
