openapi: 3.1.0
info:
  title: Agent Manager API
  version: 1.0.0
  description: HTTP API for managing agents
  contact:
    name: ForePath
    email: hi@forepath.io
    url: https://forepath.io
servers:
  - url: http://localhost:3000/api
    description: |
      HTTP API (global prefix `/api`). Listen port from env `PORT` (default 3000).
      Socket.IO (`/socket/agents`) and VNC (`/socket/vnc`) share this port; Engine.IO path `/socket.io/`. See AsyncAPI.
  - url: http://localhost:3000
    description: Root (OpenTelemetry metrics; outside /api prefix)
security:
  - bearerAuth: []
paths:
  /agents:
    get:
      summary: List agents
      operationId: listAgents
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
          description: Maximum number of agents to return (default 10)
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
          description: Number of agents to skip (default 0)
      responses:
        '200':
          description: Array of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentResponseDto'
    post:
      summary: Create agent
      description: |
        Prepares the workspace repository and Git credentials as the worker runtime user.
        Repository preparation failures (including authentication or clone errors) abort creation
        and clean up the container; a failed clone is not reported as a ready environment.

        The container isolation level is validated against the host's current (probed) isolation
        capabilities before anything is provisioned. When `isolationLevel` is omitted, the strongest
        ready level is used. An explicit level is never replaced by another one, and a gVisor
        (`sandboxed` / `sandboxed-kvm`) or microVM (`microvm`) container that fails to start is never retried
        on another runtime.
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentDto'
      responses:
        '201':
          description: Created agent with generated password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentResponseDto'
        '400':
          description: |
            Validation error (including an invalid `isolationLevel`), repository preparation failure, or
            the gVisor (`sandboxed` / `sandboxed-kvm`) or microVM (`microvm`) container could not be started
            (the environment was not created). Runtime failures carry `code: E_ISOLATION_RUNTIME_FAILED` and
            `isolationLevel`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsolationRuntimeFailureDto'
        '409':
          description: |
            The requested isolation level is not available on this host, or `capabilityRevision` does not
            match the current isolation capabilities (stale selection)
        '503':
          description: The host cannot run environments (the standard Docker `runc` baseline is not available)
  /agents/progress:
    get:
      summary: List active environment provisioning operations
      description: |
        Returns running create / container-recreating update operations of this manager (oldest first) so clients can
        render progress immediately. Live updates are broadcast via the `environmentProgress` Socket.IO event (see AsyncAPI).
      operationId: getEnvironmentProgress
      responses:
        '200':
          description: Active environment progress operations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvironmentProgressDto'
  /agents/{id}:
    get:
      summary: Get agent by id
      operationId: getAgent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
    post:
      summary: Update agent
      operationId: updateAgent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentDto'
      responses:
        '200':
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
    delete:
      summary: Delete agent
      operationId: deleteAgent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /agents/{id}/messages/latest-agent:
    get:
      summary: Get latest agent chat message metadata
      description: |
        Returns id and createdAt of the latest persisted agent-role chat message for unread tracking.
        Optionally scoped to a visible chat session via `chatSessionId`.
        Returns 404 when no matching agent messages exist.
      operationId: getLatestAgentMessage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: chatSessionId
          required: false
          schema:
            type: string
            format: uuid
          description: When set, return the latest agent message for this chat session only
      responses:
        '200':
          description: Latest agent message metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestAgentMessageDto'
        '404':
          description: No agent messages found for this environment
  /agents/{id}/start:
    post:
      summary: Start agent environment
      operationId: startAgent
      description: Start the agent Docker container.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent environment started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
        '404':
          description: Agent not found
  /agents/{id}/stop:
    post:
      summary: Stop agent environment
      operationId: stopAgent
      description: Stop the agent Docker container.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent environment stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
        '404':
          description: Agent not found
  /agents/{id}/restart:
    post:
      summary: Restart agent environment
      operationId: restartAgent
      description: Restart the agent Docker container.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent environment restarted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
        '404':
          description: Agent not found
  /agents/{id}/models:
    get:
      summary: List models for an agent
      operationId: listAgentModels
      description: |
        Returns models reported by the agent's provider (e.g. by running the provider's list-models
        command in the agent container when a container exists). The response is an empty object if
        the container is missing, stopped, or the command fails. Requires the same authentication as
        other agent manager HTTP endpoints (Bearer OIDC access token or configured static API key).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Map of model id to display name (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelsResponseDto'
        '400':
          description: Agent provider does not support listing models
        '404':
          description: Agent not found
  /agents/{id}/permissions/{permissionId}/reply:
    post:
      summary: Reply to an OpenCode permission request
      description: |
        Also answers Agenstra context access prompts (`question` events with subtype `context_access`, ids starting
        with `ctx_`), content change prompts (subtype `context_change`, ids `ctx_chg_*`) and deployment action prompts
        (subtype `context_deployment`, ids `ctx_dep_*`: trigger / cancel a deployment run). Those are decided by the
        agent-manager (`once` = this request, `always` = this chat, `reject`) and work while the worker container is
        stopped.
      operationId: replyAgentPermission
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: permissionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply]
              properties:
                reply:
                  type: string
                  enum: [once, always, reject]
                sessionId:
                  type: string
      responses:
        '204':
          description: Permission reply accepted
        '404':
          description: Agent not found or not running
  /agent-context/health:
    get:
      summary: Context MCP startup probe
      description: |
        Agent-facing context API used by the worker `agenstra` MCP server. Not reachable with user credentials:
        callers authenticate with the per-agent context token plus `x-agenstra-agent-id`.
      operationId: agentContextHealth
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
      responses:
        '204':
          description: Reachable and authenticated
        '401':
          description: Invalid agent context credentials
  /agent-context/tickets/{ticket}:
    get:
      summary: List the context granted for a prompt
      description: Metadata of granted context items (no content), attachments, workspace and environment mounts.
      operationId: listAgentContext
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - $ref: '#/components/parameters/agentContextTicket'
      responses:
        '200':
          description: Granted context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentContextListResponse'
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown, expired or foreign context ticket
  /agent-context/tickets/{ticket}/search:
    get:
      summary: Search workspace tickets and knowledge (metadata only)
      operationId: searchAgentContext
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - $ref: '#/components/parameters/agentContextTicket'
        - in: query
          name: query
          schema:
            type: string
            maxLength: 200
          description: Title fragment or SHA prefix
        - in: query
          name: kinds
          schema:
            type: string
          description: Comma-separated `ticket`, `knowledge`, `plan` (plans of the authenticated agent only)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Matching elements (metadata only, `granted` flags whether content is readable)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentContextItemSummary'
        '404':
          description: Unknown ticket or no controller connection to resolve metadata
  /agent-context/tickets/{ticket}/items/{ref}:
    get:
      summary: Read a granted context element
      operationId: getAgentContextItem
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - $ref: '#/components/parameters/agentContextTicket'
        - in: path
          name: ref
          required: true
          schema:
            type: string
            pattern: '^(item:\d{1,4}|(ticket|knowledge):[0-9a-fA-F]{4,40})$'
      responses:
        '200':
          description: Full content (same text that used to be inlined into prompts)
          content:
            application/json:
              schema:
                type: object
                required: [ref, kind, title, content]
                properties:
                  ref:
                    type: string
                  kind:
                    type: string
                    enum: [ticket, knowledge, context]
                  title:
                    type: string
                  content:
                    type: string
        '400':
          description: Malformed ref
        '403':
          description: Ref not granted (request access first)
        '404':
          description: Unknown item or element
  /agent-context/tickets/{ticket}/access-requests:
    post:
      summary: Request access to additional tickets / knowledge
      description: |
        Interactive chats show a permission-style prompt (`context_access`) and wait up to 120 s for the decision.
        Auto-approval sessions (ticket automation, plan mode) are granted without asking; hidden helper sessions
        (prompt enhancement, ticket body generation) are denied.
      operationId: requestAgentContextAccess
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - $ref: '#/components/parameters/agentContextTicket'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refs]
              properties:
                refs:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Decision (or `pending` when nobody answered in time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentContextAccessResponse'
        '400':
          description: Invalid refs
  /agent-context/tickets/{ticket}/access-requests/{requestId}:
    get:
      summary: Keep waiting on a pending access request
      operationId: getAgentContextAccessRequest
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - $ref: '#/components/parameters/agentContextTicket'
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Decision (or still `pending`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentContextAccessResponse'
        '404':
          description: Unknown or expired request
  /agent-context/tasks:
    get:
      summary: List the calling agent's recurring tasks
      description: |
        Agent-facing task API used by the worker `agenstra` MCP server (`agenstra_tasks_*` tools). Requests are bound to
        the authenticated agent and forwarded to the controller (`agentTaskRequest`); an agent only reaches its own tasks.
      operationId: listAgentTasks
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
      responses:
        '200':
          description: Tasks of the agent
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentTaskSummary'
        '401':
          description: Invalid agent context credentials
        '503':
          description: No controller connection is available
    post:
      summary: Create a recurring task for the calling agent
      description: "`model` defaults to the model of the agent's most recent visible chat turn."
      operationId: createAgentTask
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTaskInput'
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTaskSummary'
        '400':
          description: Invalid input (schedule, time zone, model, missing fields)
        '409':
          description: Task limit per agent reached
  /agent-context/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/agentContextAgentId'
      - in: path
        name: taskId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Read one of the calling agent's tasks with recent runs
      operationId: getAgentTask
      tags: [Agent context]
      security:
        - agentContextToken: []
      responses:
        '200':
          description: Task and recent runs
          content:
            application/json:
              schema:
                type: object
                required: [task, runs]
                properties:
                  task:
                    $ref: '#/components/schemas/AgentTaskSummary'
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentTaskRunSummary'
        '404':
          description: Unknown task (or a task of another agent)
    patch:
      summary: Change fields of one of the calling agent's tasks
      operationId: updateAgentTask
      tags: [Agent context]
      security:
        - agentContextToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTaskInput'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTaskSummary'
        '400':
          description: Invalid input
        '404':
          description: Unknown task
    delete:
      summary: Delete one of the calling agent's tasks
      operationId: deleteAgentTask
      tags: [Agent context]
      security:
        - agentContextToken: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Unknown task
  /agent-context/tasks/{taskId}/runs:
    post:
      summary: Queue an immediate run of one of the calling agent's tasks
      operationId: runAgentTask
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: '`queued: false` when a run of the task is still in progress'
          content:
            application/json:
              schema:
                type: object
                required: [taskId, queued]
                properties:
                  taskId:
                    type: string
                  queued:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Unknown task
  /agent-context/deployments/workflows:
    get:
      summary: List the deployment workflows available to the calling agent
      description: |
        Agent-facing deployments API used by the worker `agenstra` MCP server (`agenstra_deployments_*` tools). Requests
        are bound to the authenticated agent and forwarded to the controller (`agentDeploymentRequest`), which only
        exposes enabled, approved workflows of the workspace bound to the manager connection that are global or assigned
        to the agent, plus the workflows assigned exclusively to the agent in any state (its own pending or disabled
        proposals). `agentTriggerEnabled` tells whether the agent may trigger / cancel runs of a workflow.
      operationId: listAgentDeploymentWorkflows
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
      responses:
        '200':
          description: Workflows available to the agent
          content:
            application/json:
              schema:
                type: object
                required: [workflows]
                properties:
                  workflows:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentDeploymentWorkflowSummary'
        '401':
          description: Invalid agent context credentials
        '503':
          description: No controller connection is available
    post:
      summary: Propose a deployment workflow for the calling agent
      description: |
        The controller assigns the workflow to the calling environment only (scope and environments are not part of the
        input) and keeps it pending until a workspace admin approves it; nobody can start runs before. The connection
        has to be usable by the workspace. Sent to a single controller connection (never retried).
      operationId: createAgentDeploymentWorkflow
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDeploymentWorkflowInput'
      responses:
        '201':
          description: Proposed (pending) workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeploymentWorkflowSummary'
        '400':
          description: Invalid input (bounds, GitHub without workflow, inputs)
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown connection (or a connection the workspace may not use)
        '409':
          description: Too many workflows proposed by this environment
        '503':
          description: No controller connection is available
  /agent-context/deployments/workflows/{workflowId}:
    get:
      summary: Read one deployment workflow available to the calling agent
      description: |
        Same visibility as the list: enabled, approved workflows available to the environment (global or assigned to
        it), plus its own exclusively assigned workflows in any state (pending / disabled). Everything else answers 404.
      operationId: getAgentDeploymentWorkflow
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeploymentWorkflowSummary'
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown workflow (or one not available to the agent)
        '503':
          description: No controller connection is available
    patch:
      summary: Change a deployment workflow the calling agent manages for itself
      description: |
        Only workflows assigned exclusively to the calling environment; others answer 404. Changes of approved content
        (connection, repository, workflow, default ref / inputs, name, description, `agentTriggerEnabled`) or
        re-enabling make the workflow pending again; disabling keeps the approval.
      operationId: updateAgentDeploymentWorkflow
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDeploymentWorkflowUpdateInput'
      responses:
        '200':
          description: Workflow after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeploymentWorkflowSummary'
        '400':
          description: Invalid input or no field to change
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown workflow (or one not assigned exclusively to the agent)
        '503':
          description: No controller connection is available
    delete:
      summary: Delete a deployment workflow the calling agent manages for itself
      description: Only workflows assigned exclusively to the calling environment; others answer 404.
      operationId: deleteAgentDeploymentWorkflow
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted (with its run history)
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown workflow (or one not assigned exclusively to the agent)
        '503':
          description: No controller connection is available
  /agent-context/deployments/workflows/{workflowId}/sync:
    post:
      summary: Import the provider's latest runs of a deployment workflow available to the calling agent
      description: |
        Only workflows the environment may use (enabled, approved, global or assigned to it) on a usable connection.
        Throttled per workflow (once every 30 s, otherwise 409). Read-only towards the provider (no run is started or
        cancelled), so it needs no context ticket. Sent to a single controller connection.
      operationId: syncAgentDeploymentWorkflow
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Number of runs imported or refreshed
          content:
            application/json:
              schema:
                type: object
                required: [synced]
                properties:
                  synced:
                    type: integer
                    minimum: 0
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown workflow (or one not available to the agent)
        '403':
          description: The workflow's connection is disabled or not usable by the workspace
        '409':
          description: Workflow pending / disabled, or synced less than 30 seconds ago
        '503':
          description: No controller connection is available
  /agent-context/deployments/connections:
    get:
      summary: List the deployment connections the calling agent's workspace may build workflows on
      operationId: listAgentDeploymentConnections
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
      responses:
        '200':
          description: Connection options (no secrets, no repository browsing)
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentDeploymentConnectionOption'
        '401':
          description: Invalid agent context credentials
        '503':
          description: No controller connection is available
  /agent-context/deployments/actions/{requestId}:
    get:
      summary: Keep waiting on a pending deployment action (trigger / cancel)
      description: |
        Long-polls (up to 120 s) for the user's decision on a `pending` trigger / cancel of the same context ticket.
      operationId: getAgentDeploymentActionStatus
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            maxLength: 128
        - in: query
          name: ticket
          required: true
          description: Context ticket of the prompt that requested the action
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Decision (still `pending` when nobody decided in time)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeploymentActionResponse'
        '400':
          description: Missing ticket
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown or expired ticket or request
  /agent-context/deployments/workflows/{workflowId}/trigger:
    post:
      summary: Trigger a run of a deployment workflow available to the calling agent
      description: |
        Needs the context ticket of the prompt and is decided per session (like content changes): visible chats ask the
        user (permission-style prompt `ctx_dep_*`, long-polls up to 120 s, then answers `pending`); scheduled task runs
        and ticket automation are forwarded with their task / automation as source and the controller only allows the
        operations a workspace user allowed for it; plans and other hidden sessions are denied. The workflow rules apply
        on top (enabled, approved, available to the agent, `agentTriggerEnabled`, default ref only, defined inputs only).
        Sent to a single controller connection (never retried on another one), so a slow acknowledgement cannot start a
        run twice. Refusals are answered as decisions (`denied` / `failed`), not as HTTP errors.
      operationId: triggerAgentDeployment
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: workflowId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDeploymentTriggerInput'
      responses:
        '200':
          description: Decision (`applied` carries the started run)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeploymentActionResponse'
        '400':
          description: Invalid input (ticket, ref, inputs)
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown workflow id format, or unknown / expired context ticket
  /agent-context/deployments/runs:
    get:
      summary: List recent runs of the deployment workflows available to the calling agent
      operationId: listAgentDeploymentRuns
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: query
          name: workflowId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentDeploymentRunSummary'
        '400':
          description: Invalid query parameters
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown workflow
        '503':
          description: No controller connection is available
  /agent-context/deployments/runs/{runId}:
    get:
      summary: Read one deployment run with its jobs
      description: Active runs are refreshed from the provider first.
      operationId: getAgentDeploymentRun
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: runId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Run and jobs
          content:
            application/json:
              schema:
                type: object
                required: [run, jobs]
                properties:
                  run:
                    $ref: '#/components/schemas/AgentDeploymentRunSummary'
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentDeploymentRunJobSummary'
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown run (or a run of a workflow not available to the agent)
        '503':
          description: No controller connection is available
  /agent-context/deployments/runs/{runId}/logs:
    get:
      summary: Read the log tail of a deployment run or one of its jobs
      operationId: getAgentDeploymentRunLogs
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: runId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: jobId
          required: false
          schema:
            type: string
            maxLength: 255
            pattern: '^[\w.:-]+$'
      responses:
        '200':
          description: Log tail (at most 200 000 bytes for environments)
          content:
            application/json:
              schema:
                type: object
                required: [logs, truncated]
                properties:
                  logs:
                    type: string
                  truncated:
                    type: boolean
                    description: True when only the tail was returned
        '400':
          description: Invalid job id
        '401':
          description: Invalid agent context credentials
        '403':
          description: The workflow's connection is not available to the workspace
        '404':
          description: Unknown run or job
        '503':
          description: No controller connection is available
  /agent-context/deployments/runs/{runId}/cancel:
    post:
      summary: Cancel an active run of a deployment workflow available to the calling agent
      description: |
        Needs the context ticket of the prompt and is decided per session like triggers. Only possible when the
        workflow has `agentTriggerEnabled`. Sent to a single controller connection (never retried). Refusals are answered
        as decisions (`denied` / `failed`), not as HTTP errors.
      operationId: cancelAgentDeploymentRun
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: runId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket:
                  type: string
                  maxLength: 128
                  description: Context ticket of the prompt (starts with `ctx-`)
      responses:
        '200':
          description: Decision (`applied` carries the run after the cancellation request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeploymentActionResponse'
        '400':
          description: Missing ticket
        '401':
          description: Invalid agent context credentials
        '404':
          description: Unknown run id format, or unknown / expired context ticket
  /agent-context/handoffs/agents:
    get:
      summary: List the other agents of the calling agent's workspace
      description: |
        Agent-facing handoff API used by the worker `agenstra` MCP server (`agenstra_handoff_*` tools). Requests are
        bound to the authenticated agent and forwarded to the controller (`agentHandoffRequest`), which only accepts
        agents of the workspace bound to the manager connection.
      operationId: listAgentHandoffAgents
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
      responses:
        '200':
          description: Possible handoff targets
          content:
            application/json:
              schema:
                type: object
                required: [self, agents]
                properties:
                  self:
                    $ref: '#/components/schemas/AgentHandoffSelfSummary'
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentHandoffAgentSummary'
        '401':
          description: Invalid agent context credentials
        '503':
          description: No controller connection is available
  /agent-context/handoffs/agents/{agentId}/profile:
    get:
      summary: Metadata and handoff profile of one peer (generated first when missing)
      description: |
        Only agents of the caller's workspace (controller list). A missing profile is generated by the peer itself in a
        read-only hidden session with a fixed prompt and stored. Answers within 150 s; generation continues afterwards.
      operationId: getAgentHandoffPeerProfile
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Peer with profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHandoffAgentSummary'
        '404':
          description: Agent not found in this workspace
        '502':
          description: The peer could not describe itself (e.g. environment stopped)
        '504':
          description: Generation still running; ask again later
  /agent-context/handoffs/profile:
    put:
      summary: Set the calling agent's own handoff profile
      operationId: updateAgentHandoffProfile
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile:
                  type: string
                  maxLength: 4000
                  description: Empty string clears the profile
      responses:
        '200':
          description: Own entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHandoffSelfSummary'
  /agent-context/handoffs:
    post:
      summary: Hand a task over to another agent of the workspace
      description: |
        Opens a new chat (kind `handoff`) on the target agent and queues the handoff. The target works on it in that chat
        and answers with `handoff_respond`; the controller delivers the response where the handoff was made, and only
        there. The manager attributes the call to the caller's running turns: it is only accepted when all of them
        belong to one visible chat, or to the hidden session of one task run (not from ticket automation, plan or helper
        sessions, and not while several sessions of the agent are working). From a task run the controller additionally
        requires an approved task, its running run and a target among the task's approved `allowedHandoffAgentIds`
        (one open handoff per run, `AGENT_TASK_RUN_MAX_HANDOFFS` in total); the response continues the run in its own
        session. `model` defaults to the model the target (else the caller) was last used with in a visible chat.
      operationId: createAgentHandoff
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHandoffCreateInput'
      responses:
        '201':
          description: Created handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHandoffResponse'
        '400':
          description: |
            Invalid input, the caller itself as target, or not called from a visible chat or task run (other hidden
            session, no working chat, requesting chat deleted)
        '403':
          description: Task run handoff to an agent the user did not approve for the task
        '404':
          description: Target agent not found in this workspace
        '409':
          description: |
            Several sessions of the caller are working, too many open handoffs, the chain is too deep, a task-run
            handoff chat handing on, the task waits for approval, its run is not working, or the run already waits for
            a handoff / used up its handoffs
  /agent-context/handoffs/{handoffId}:
    get:
      summary: Read a handoff the calling agent sent or received
      operationId: getAgentHandoff
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: handoffId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHandoffResponse'
        '404':
          description: Unknown handoff (or one of other agents)
  /agent-context/handoffs/{handoffId}/response:
    post:
      summary: Answer a handoff the calling agent received
      description: Only the target agent can answer, once. The response is delivered when its turn ended.
      operationId: respondToAgentHandoff
      tags: [Agent context]
      security:
        - agentContextToken: []
      parameters:
        - $ref: '#/components/parameters/agentContextAgentId'
        - in: path
          name: handoffId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHandoffRespondInput'
      responses:
        '200':
          description: Answered handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHandoffResponse'
        '400':
          description: Invalid status or empty response
        '404':
          description: Unknown handoff (or one the agent did not receive)
        '409':
          description: Already answered
  /agents/{id}/questions/{questionId}/reply:
    post:
      summary: Reply to an OpenCode question / form request
      operationId: replyAgentQuestion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: questionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  items:
                    type: string
                  description: Selected option labels for the question
                reply:
                  type: string
                  enum: [reject]
                sessionId:
                  type: string
      responses:
        '204':
          description: Question reply accepted
        '404':
          description: Agent not found or not running
  /agents/{id}/opencode/config:
    get:
      summary: Get agent OpenCode user config
      operationId: getAgentOpencodeConfig
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent OpenCode config overlay
          content:
            application/json:
              schema:
                type: object
                required: [config, overrides, secretKeys]
                properties:
                  config:
                    type: object
                    additionalProperties: true
                  overrides:
                    type: object
                    additionalProperties: true
                    description: Raw JSON overrides merged over config for this agent layer
                  secretKeys:
                    type: array
                    items:
                      type: string
                  updatedAt:
                    type: string
                    format: date-time
                  egress:
                    $ref: '#/components/schemas/AgentEgressStatusDto'
    put:
      summary: Update agent OpenCode user config
      operationId: putAgentOpencodeConfig
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  nullable: true
                  additionalProperties: true
                overrides:
                  type: object
                  nullable: true
                  additionalProperties: true
                  description: Raw JSON patch merged over config; empty object clears
                secrets:
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Updated agent OpenCode config (same shape as the GET response, including `egress`)
  /agents/{id}/opencode/config/agents:
    get:
      summary: List effective OpenCode agents (primary + subagents) from the worker
      operationId: listAgentOpencodeAgents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Effective OpenCode agents available on the worker
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      required: [name, mode, builtIn]
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        mode:
                          type: string
                          enum: [subagent, primary, all]
                        builtIn:
                          type: boolean
  /agents/{id}/opencode/config/commands:
    get:
      summary: List slash-invokable OpenCode commands from the worker
      description: >
        Proxies OpenCode `GET /command`. Includes config commands, builtins (`init`, `review`),
        discovered skills, and MCP prompts registered as slash commands.
      operationId: listAgentOpencodeCommands
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Slash commands available on the worker
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        agent:
                          type: string
                        model:
                          type: string
                        subtask:
                          type: boolean
                        source:
                          type: string
                          enum: [command, mcp, skill]
        '404':
          description: Agent not found
  /agents/{id}/opencode/config/sync:
    post:
      summary: Best-effort sync effective OpenCode config into worker
      description: |
        After successfully applying effective config and secrets, broadcasts `opencodeConfigSynced`
        on `socket/agents` with `data: { agentId }` so clients can refresh cached model and command catalogs.
        Applies to config-only updates and container recreation; failed/deferred syncs do not broadcast.
      operationId: syncAgentOpencodeConfig
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  type: object
                  additionalProperties: true
                secrets:
                  type: object
                  additionalProperties:
                    type: string
                platformPolicy:
                  $ref: '#/components/schemas/SyncAgentPlatformPolicyDto'
                  description: Omitted by older controllers; the stored platform policy then stays in force
      responses:
        '200':
          description: Sync attempted
  /agents/{id}/opencode/mcp:
    get:
      summary: List live MCP server statuses from the OpenCode worker
      description: >
        Proxies OpenCode `GET /mcp`. Statuses include `connected`, `disabled`, `failed`,
        `needs_auth`, and `needs_client_registration`.
      operationId: listAgentOpencodeMcpStatuses
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: MCP server statuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpencodeMcpStatusListResponseDto'
        '404':
          description: Agent not found
  /agents/{id}/opencode/mcp/{name}/auth:
    post:
      summary: Start interactive MCP OAuth for a server
      description: >
        Proxies OpenCode `POST /mcp/{name}/auth`. When `redirectUri` is set, patches the worker
        MCP oauth.redirectUri first so the IdP returns to the Agenstra public callback.
      operationId: startAgentOpencodeMcpAuth
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                redirectUri:
                  type: string
                  format: uri
      responses:
        '200':
          description: OAuth flow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpencodeMcpAuthStartResponseDto'
        '400':
          description: Agent not running or MCP OAuth unsupported
        '404':
          description: Agent or MCP server not found
    delete:
      summary: Remove MCP OAuth credentials
      operationId: removeAgentOpencodeMcpAuth
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OAuth credentials removed
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    enum: [true]
        '400':
          description: Agent not running
        '404':
          description: Agent or MCP server not found
  /agents/{id}/opencode/mcp/{name}/auth/callback:
    post:
      summary: Complete MCP OAuth with authorization code
      operationId: completeAgentOpencodeMcpAuth
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Updated MCP status after OAuth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpencodeMcpServerStatusDto'
        '400':
          description: Invalid code or OAuth failed
        '404':
          description: Agent or MCP server not found
  /egress/events:
    get:
      summary: List egress guard decision events (ingestion feed)
      description: |
        Cursor-based feed of aggregated egress guard decisions, ordered by the monotonic `seq`.
        The agent controller polls this endpoint, passing the previous `nextSeq` as `afterSeq`.
      operationId: listEgressEvents
      parameters:
        - in: query
          name: afterSeq
          schema:
            type: string
            pattern: '^\d{1,19}$'
            default: '0'
          description: Return only events with a `seq` greater than this cursor (non-negative integer)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Maximum number of events to return (default 500, capped at the server maximum page size)
        - in: query
          name: agentId
          schema:
            type: string
            format: uuid
          description: Restrict events to one agent
      responses:
        '200':
          description: Page of egress events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEgressEventsPageDto'
        '400':
          description: Invalid afterSeq or agentId
  /agents/{id}/egress:
    get:
      summary: Get egress guard details of an agent
      description: |
        Returns the live guard status, the effective egress policy and message filters in force,
        and the most recent (up to 50) egress events of the agent.
      operationId: getAgentEgress
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Egress details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEgressDetailsDto'
        '404':
          description: Agent not found
  /instance-status:
    get:
      summary: Get agent-manager instance status
      operationId: getInstanceStatus
      responses:
        '200':
          description: Instance status for update tracking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceStatusResponseDto'
  /config:
    get:
      summary: Get configuration parameters
      operationId: getConfig
      responses:
        '200':
          description: Configuration parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponseDto'
  /isolation:
    get:
      summary: Get container isolation capabilities
      description: |
        Current isolation capability record of this host (from the last completed runtime probe):
        state of the `standard` (runc), `sandboxed` (gVisor), `sandboxed-kvm` (gVisor on KVM) and `microvm`
        (KVM microVM) levels,
        recommended level and
        capability revision. `probing` is true while a probe is running.
      operationId: getIsolationCapabilities
      responses:
        '200':
          description: Isolation capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostIsolationCapabilitiesDto'
  /isolation/probe:
    post:
      summary: Re-probe container isolation capabilities
      description: |
        Runs a runtime probe of every isolation level now and returns the result. Joins a probe that is
        already running; results younger than 30 seconds are returned without a new probe.
      operationId: probeIsolationCapabilities
      responses:
        '200':
          description: Isolation capabilities after the probe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostIsolationCapabilitiesDto'
  /agents/{agentId}/files:
    description: |
      User-facing file API, confined to the agent workspace (normally /app). Relative paths resolve under
      the workspace root; absolute paths are only accepted when they point inside it (e.g. /app/src/a.ts).
      Paths outside the workspace, `..` segments, and paths whose canonical (symlink-resolved) target leaves
      the workspace are rejected with 400. All commands run as the unprivileged agent runtime user.
    get:
      summary: List directory contents
      description: |
        Relative paths such as apps resolve under the worker workspace root (normally /app).
        Directory listing and metadata command failures are returned as errors, not empty arrays.
        Listing a path outside the workspace (lexically or via symlinks) is rejected with 400.
      operationId: listDirectory
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: path
          schema:
            type: string
          description: Directory path relative to the selected context root (defaults to '.')
        - $ref: '#/components/parameters/fileManagerContext'
      responses:
        '200':
          description: Array of file nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileNodeDto'
        '400':
          description: Invalid path, invalid context, or agent type does not support configuration file access
        '404':
          description: Agent or directory not found
  /agents/{agentId}/files/{path}:
    description: |
      Workspace-confined file operations (see `/agents/{agentId}/files`). Absolute paths outside the workspace
      and symlinks resolving outside it are rejected with 400; mutations of the workspace root itself are rejected.
      Deleting or moving a symlink affects the link, never its target.
    head:
      summary: Probe file metadata without transferring the body
      operationId: headFile
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: File path relative to the selected context root (supports nested paths)
        - $ref: '#/components/parameters/fileManagerContext'
      responses:
        '200':
          description: Metadata headers only (no body)
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            X-File-Type:
              schema:
                $ref: '#/components/schemas/AgentFileType'
            Content-Type:
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
        '400':
          description: Invalid path, invalid context, or agent type does not support configuration file access
        '404':
          description: Agent or file not found
    get:
      summary: Read file content as raw bytes
      operationId: readFile
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: File path relative to the selected context root (supports nested paths)
        - $ref: '#/components/parameters/fileManagerContext'
        - in: query
          name: download
          schema:
            type: boolean
          description: When true, set Content-Disposition attachment with the file basename
        - in: header
          name: Range
          schema:
            type: string
          description: Optional bytes range (e.g. bytes=0-1023) for partial content
      responses:
        '200':
          description: Full file content
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            X-File-Type:
              schema:
                $ref: '#/components/schemas/AgentFileType'
            Content-Disposition:
              schema: { type: string }
              description: Present when download=true
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, format: binary }
            image/*:
              schema: { type: string, format: binary }
            video/*:
              schema: { type: string, format: binary }
            audio/*:
              schema: { type: string, format: binary }
        '206':
          description: Partial content for Range requests
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Content-Range:
              schema: { type: string }
            X-File-Type:
              schema:
                $ref: '#/components/schemas/AgentFileType'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, format: binary }
            image/*:
              schema: { type: string, format: binary }
            video/*:
              schema: { type: string, format: binary }
            audio/*:
              schema: { type: string, format: binary }
        '400':
          description: Invalid path, invalid context, or agent type does not support configuration file access
        '404':
          description: Agent or file not found
        '416':
          description: Range not satisfiable
    post:
      summary: Create file or directory
      operationId: createFileOrDirectory
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: File or directory path relative to the selected context root (supports nested paths)
        - $ref: '#/components/parameters/fileManagerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileDto'
      responses:
        '201':
          description: File or directory created
        '400':
          description: Invalid request, invalid context, or agent type does not support configuration file access
        '404':
          description: Agent not found
    put:
      summary: Write file content as raw bytes (full file or Content-Range chunk)
      operationId: writeFile
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: File path relative to the selected context root (supports nested paths)
        - $ref: '#/components/parameters/fileManagerContext'
        - in: header
          name: Content-Range
          schema:
            type: string
          description: Optional chunk range (bytes start-end/total) for chunked uploads
        - in: header
          name: X-Upload-Id
          schema:
            type: string
            format: uuid
          description: Optional upload session id for chunked uploads
        - in: header
          name: X-File-Type
          schema:
            $ref: '#/components/schemas/AgentFileType'
          description: Optional client classification hint
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string, format: binary }
          image/*:
            schema: { type: string, format: binary }
          video/*:
            schema: { type: string, format: binary }
          audio/*:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: File written successfully (or chunk accepted; last chunk finalizes)
        '400':
          description: Invalid path, content too large, invalid range, invalid context, or agent type does not support configuration file access
        '404':
          description: Agent not found
    delete:
      summary: Delete file or directory
      operationId: deleteFileOrDirectory
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: File or directory path relative to the selected context root (supports nested paths)
        - $ref: '#/components/parameters/fileManagerContext'
      responses:
        '204':
          description: File or directory deleted successfully
        '400':
          description: Invalid path, invalid context, or agent type does not support configuration file access
        '404':
          description: Agent or file/directory not found
    patch:
      summary: Move file or directory
      operationId: moveFileOrDirectory
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: Source file or directory path relative to the selected context root (supports nested paths)
        - $ref: '#/components/parameters/fileManagerContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveFileDto'
      responses:
        '204':
          description: File or directory moved successfully
        '400':
          description: Invalid path, destination, invalid context, or agent type does not support configuration file access
        '404':
          description: Agent or source file/directory not found
  /agents/{agentId}/system-files:
    description: |
      Trusted system file channel used by the agent-controller only (OpenCode layer files, chat/ticket/knowledge
      context attachments under /opt/agenstra/context). The agent-controller never forwards end-user requests here.
      Relative paths and absolute paths inside the workspace behave like `/agents/{agentId}/files` (runtime user,
      canonical workspace containment). Absolute paths outside the workspace are installed as root and hardened
      (root-owned, 644/755) so the agent runtime user can read but not modify them; such paths must not traverse
      symbolic links (400 otherwise; a final symlink is replaced on write and removed itself on delete).
      The filesystem root `/` and protected system trees (/etc, /usr, /bin, /sbin, /lib*, /boot, /dev, /proc,
      /sys, /root, /run, /var, /opt/workspace) are rejected with 400.
    get:
      summary: List a system or workspace directory
      operationId: listSystemDirectory
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: path
          schema:
            type: string
          description: Absolute container path or workspace-relative path (defaults to '.'). Node paths keep the requested prefix.
        - in: query
          name: refresh
          schema:
            type: boolean
          description: Bypass the cached directory listing
      responses:
        '200':
          description: Array of file nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileNodeDto'
        '400':
          description: Invalid path, path traversing symlinks, or workspace path resolving outside the workspace
        '404':
          description: Agent or directory not found
  /agents/{agentId}/system-files/{path}:
    description: Trusted system file operations (see `/agents/{agentId}/system-files`).
    put:
      summary: Write a system or workspace file as raw bytes (max 10MB, no chunking)
      operationId: writeSystemFile
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: URL-encoded absolute container path or workspace-relative path
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: File written (outside-workspace paths are root-owned and read-only for the agent)
        '400':
          description: Invalid path, path traversing symlinks, or content too large
        '404':
          description: Agent not found
    post:
      summary: Create an empty system or workspace file or directory
      operationId: createSystemFileOrDirectory
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: URL-encoded absolute container path or workspace-relative path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileDto'
      responses:
        '201':
          description: File or directory created
        '400':
          description: Invalid path or path traversing symlinks
        '404':
          description: Agent not found
    delete:
      summary: Delete a system or workspace file or directory
      operationId: deleteSystemFileOrDirectory
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: path
          required: true
          schema:
            type: string
          description: URL-encoded absolute container path or workspace-relative path
      responses:
        '204':
          description: File or directory deleted
        '400':
          description: Invalid path or path traversing symlinks
        '404':
          description: Agent or file/directory not found
