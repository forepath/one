      required: [name, pattern, flags, direction, action, enabled, source]
      properties:
        name:
          type: string
        pattern:
          type: string
        flags:
          type: string
          description: Flags passed to JavaScript RegExp (subset g,i,m,s,u,y,d)
        direction:
          type: string
          enum: [incoming, outgoing, bidirectional]
        action:
          type: string
          enum: [drop, replace, flag]
        replacement:
          type: string
          description: Replacement template when action is replace
        enabled:
          type: boolean
        source:
          $ref: '#/components/schemas/PlatformPolicyLayer'
    SyncAgentPlatformPolicyDto:
      type: object
      description: |
        Effective platform security policy resolved by the controller (global -> workspace -> environment).
        Re-normalized on receipt.
      properties:
        egress:
          $ref: '#/components/schemas/EffectiveEgressPolicy'
        messageFilters:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveMessageFilterRule'
    AgentEgressGuardRuntimeDto:
      type: object
      required: [running, startedAt, activeRevision, proxyRunning, dnsRunning]
      properties:
        running:
          type: boolean
        startedAt:
          type: [string, 'null']
          format: date-time
        activeRevision:
          type: [string, 'null']
          description: Policy revision the guard reports as active
        proxyRunning:
          type: boolean
        dnsRunning:
          type: boolean
    AgentEgressStatusDto:
      type: object
      required:
        [status, mode, guardContainerId, policyRevision, appliedAt, lastError]
      properties:
        status:
          type: string
          enum: [inactive, active, failed]
          description: '`inactive` (no enforcement), `active` (guard applied), `failed` (last apply failed; previous bundle kept)'
        mode:
          $ref: '#/components/schemas/EgressMode'
        guardContainerId:
          type: [string, 'null']
          description: Short guard container id (null when the agent never required egress filtering)
        policyRevision:
          type: [string, 'null']
        appliedAt:
          type: [string, 'null']
          format: date-time
        lastError:
          type: [string, 'null']
        guard:
          $ref: '#/components/schemas/AgentEgressGuardRuntimeDto'
    AgentEgressEventDto:
      type: object
      required:
        [
          seq,
          agentId,
          kind,
          decision,
          host,
          rule,
          matchedEntry,
          matchedSource,
          method,
          httpStatus,
          sampleUrl,
          count,
          bytesIn,
          bytesOut,
          firstSeenAt,
          lastSeenAt,
          mode,
          policyRevision,
          message,
        ]
      properties:
        seq:
          type: string
          description: Monotonic cursor (stringified bigint)
        agentId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [web, dns, network, guard]
        decision:
          type: string
          enum: [allowed, blocked, observed, error]
        host:
          type: [string, 'null']
        rule:
          oneOf:
            - $ref: '#/components/schemas/EgressRule'
            - type: 'null'
        matchedEntry:
          type: [string, 'null']
        matchedSource:
          oneOf:
            - $ref: '#/components/schemas/PlatformPolicyLayer'
            - type: 'null'
        method:
          type: [string, 'null']
        httpStatus:
          type: [integer, 'null']
        sampleUrl:
          type: [string, 'null']
        count:
          type: integer
        bytesIn:
          type: integer
        bytesOut:
          type: integer
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        mode:
          type: [string, 'null']
        policyRevision:
          type: [string, 'null']
        message:
          type: [string, 'null']
    AgentEgressEventsPageDto:
      type: object
      required: [events, nextSeq, hasMore]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentEgressEventDto'
        nextSeq:
          type: string
          description: Cursor to pass as `afterSeq` for the next page (unchanged when no events were returned)
        hasMore:
          type: boolean
    AgentEgressDetailsDto:
      type: object
      required: [agentId, status, policy, messageFilters, recentEvents]
      properties:
        agentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AgentEgressStatusDto'
        policy:
          oneOf:
            - $ref: '#/components/schemas/EffectiveEgressPolicy'
            - type: 'null'
        messageFilters:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveMessageFilterRule'
        recentEvents:
          type: array
          items:
            $ref: '#/components/schemas/AgentEgressEventDto'
    OpencodeMcpServerStatusDto:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum:
            [connected, disabled, failed, needs_auth, needs_client_registration]
        error:
          type: string
    OpencodeMcpStatusListResponseDto:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/OpencodeMcpServerStatusDto'
    OpencodeMcpAuthStartResponseDto:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          format: uri
        oauthState:
          type: string
    CreateVncSessionResponseDto:
      type: object
      required: [ticket, expiresIn]
      properties:
        ticket:
          type: string
          description: Single-use opaque ticket for the VNC WebSocket gateway
        expiresIn:
          type: integer
          minimum: 1
          description: Ticket lifetime in seconds
