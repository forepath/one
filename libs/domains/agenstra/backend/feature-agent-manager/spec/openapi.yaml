        Path is configurable via `OTEL_METRICS_PATH` (default `/otel/metrics`). Requires HTTP Basic authentication
        with `OTEL_USERNAME` and `OTEL_PASSWORD`. Disabled when `OTEL_ENABLED` is not exactly `true`.
      operationId: getOtelMetrics
