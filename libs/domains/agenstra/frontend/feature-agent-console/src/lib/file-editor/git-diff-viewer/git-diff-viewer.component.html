<div class="git-diff-viewer-container d-flex flex-column h-100">
  <div
    class="git-diff-viewer-header p-2 border-bottom bg-body-tertiary d-flex justify-content-between align-items-center gap-2"
  >
    <div class="d-flex flex-wrap align-items-center gap-2 min-w-0">
      <h6 class="mb-0 fw-semibold">
        <i class="bi bi-file-diff me-2"></i><span i18n="@@featureGitDiffViewer-header">File Diff</span>
      </h6>
      @if (filePath()) {
        <span class="text-body-secondary small text-break">{{ filePath() }}</span>
      }
    </div>
    <fpc-button
      class="flex-shrink-0"
      variant="dark"
      size="sm"
      iconOnly
      (clicked)="onClose()"
      i18n-ariaLabel="@@featureGitDiffViewer-closeAriaLabel"
      ariaLabel="Close"
      i18n-title="@@featureGitDiffViewer-closeAriaLabel"
      title="Close"
    >
      <i class="bi bi-x" aria-hidden="true"></i>
    </fpc-button>
  </div>

  <div class="git-diff-viewer-content flex-grow-1 position-relative">
    @if (loading()) {
      <div class="d-flex justify-content-center align-items-center h-100">
        <fpc-spinner
          size="sm"
          variant="primary"
          i18n-label="@@featureGitDiffViewer-loadingDiff"
          label="Loading diff..."
        />
      </div>
    } @else if (error()) {
      <div class="d-flex justify-content-center align-items-center h-100">
        <div class="text-center text-danger p-4">
          <i class="bi bi-exclamation-triangle fs-4 d-block mb-2"></i>
          <p class="mb-0">{{ error() }}</p>
        </div>
      </div>
    } @else {
      <div #diffEditorContainer class="diff-editor-container h-100"></div>
    }
  </div>
</div>
