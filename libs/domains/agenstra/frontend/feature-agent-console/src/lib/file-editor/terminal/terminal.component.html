<div class="terminal-container d-flex flex-column h-100">
  @if (sessionIds().length > 0) {
    <!-- Terminal Header -->
    <div class="terminal-header p-2 border-bottom bg-body-tertiary d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-terminal"></i>
        <fpc-dropdown [(open)]="sessionMenuOpen">
          <fpc-button
            fpcDropdownTrigger
            size="sm"
            variant="primary"
            btnClass="dropdown-toggle"
            controlId="terminalSessionDropdown"
          >
            {{ getSessionName(activeSessionId() || '') }}
          </fpc-button>
          @for (sessionId of sessionIds(); track sessionId) {
            <fpc-dropdown-item [active]="activeSessionId() === sessionId" (selected)="onSwitchSession(sessionId)">
              {{ getSessionName(sessionId) }}
              <span
                fpcDropdownItemEnd
                role="button"
                tabindex="0"
                class="btn-close btn-close-sm terminal-close-btn"
                [class.active]="activeSessionId() === sessionId"
                (click)="onCloseTerminal(sessionId, $event)"
                (keydown.enter)="onCloseTerminal(sessionId, $event)"
                i18n-aria-label="@@featureTerminal-closeTerminalAriaLabel"
                aria-label="Close terminal"
              ></span>
            </fpc-dropdown-item>
          }
        </fpc-dropdown>
      </div>
      <div class="d-flex align-items-center gap-2">
        <fpc-button
          variant="primary"
          size="sm"
          iconOnly
          (clicked)="onCreateTerminal()"
          i18n-title="@@featureTerminal-newTerminalTitle"
          title="New Terminal"
          i18n-aria-label="@@featureTerminal-newTerminalTitle"
          ariaLabel="New Terminal"
        >
          <i class="bi bi-plus" aria-hidden="true"></i>
        </fpc-button>
      </div>
    </div>
  }

  <!-- Terminal Content - Always render when visible to ensure ViewChild is available -->
  <div class="terminal-content flex-grow-1 position-relative" #terminalContainer>
    @if (sessionIds().length === 0) {
      <!-- Placeholder when no terminal sessions -->
      <div
        class="d-flex justify-content-center align-items-center h-100 bg-body-secondary position-absolute top-0 start-0 w-100 h-100"
      >
        <div class="text-center text-muted p-4">
          <i class="bi bi-terminal fs-1 d-block mb-3"></i>
          <p class="mb-0" i18n="@@featureTerminal-noSession">No terminal session</p>
          <small class="text-muted" i18n="@@featureTerminal-createSessionHint"
            >Click "New" to create a terminal session</small
          >
          <div class="mt-3">
            <fpc-button
              variant="primary"
              size="sm"
              (clicked)="onCreateTerminal()"
              i18n="@@featureTerminal-newTerminalButton"
            >
              Create Terminal
            </fpc-button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
