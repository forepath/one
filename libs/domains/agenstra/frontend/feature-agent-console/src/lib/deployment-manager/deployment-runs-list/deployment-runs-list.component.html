<div class="deployment-runs-list-container d-flex flex-column flex-grow-1 min-h-0">
  @if (bulkResult(); as result) {
    <fpc-alert
      [flush]="true"
      [variant]="result.tone"
      [message]="result.message"
      [dismissible]="true"
      (closed)="bulkResult.set(null)"
      data-testid="deployment-runs-bulk-result"
    />
  }

  <fpc-data-table
    class="flex-grow-1 min-h-0"
    [ariaLabel]="tableLabel"
    [columns]="columns"
    [rows]="pageRuns()"
    [activeRowId]="selectedRunId()"
    paging="server"
    [(page)]="page"
    [(pageSize)]="pageSize"
    [hasNext]="hasNext()"
    persistKey="agenstra-deployment-runs"
    [(query)]="searchRunsQuery"
    [searchPlaceholder]="searchPlaceholder"
    [filtered]="!!searchRunsQuery().trim()"
    [loading]="loadingRuns()"
    [error]="filteredError()"
    selectable
    [(selected)]="selectedIds"
    [rowMenu]="runRowMenu"
    (rowAction)="onRunAction($event.row, $event.item.id)"
    (rowActivate)="onRunClick($event.id)"
    emptyIcon="rocket-takeoff"
    data-testid="deployment-runs-table"
  >
    <!-- Toolbar actions of the host page (e.g. Refresh) land in the table head. -->
    <ng-container ngProjectAs="[fpcDataTableToolbar]"><ng-content select="[fpcDataTableToolbar]" /></ng-container>
    <fpc-button
      fpcDataTableBatch
      variant="danger"
      size="sm"
      [disabled]="bulkBusy() || cancellableSelected().length === 0"
      (clicked)="bulkCancelConfirmOpen.set(true)"
      data-testid="deployment-runs-bulk-cancel"
      iconOnly
      [ariaLabel]="cancelLabel"
      [title]="cancelLabel"
    >
      <i class="bi bi-slash-circle" aria-hidden="true"></i>
    </fpc-button>

    <span fpcDataTableEmpty>
      <fpc-empty-state
        size="sm"
        icon="rocket-takeoff"
        message="No deployment runs yet"
        i18n-message="@@featureDeploymentRunsList-noRunsFound"
      />
    </span>

    <ng-template fpcTableCell="created" let-row>{{ row.createdAt | fpcDate: 'datetime' }}</ng-template>
  </fpc-data-table>

  <fpc-confirm-dialog
    [(open)]="bulkCancelConfirmOpen"
    i18n-title="@@featureDeploymentRunsList-bulkCancelTitle"
    title="Cancel runs"
    i18n-confirmLabel="@@featureDeploymentRunsList-cancelRun"
    confirmLabel="Cancel run"
    [danger]="true"
    [busy]="bulkBusy()"
    (confirmed)="onConfirmBulkCancel()"
  >
    <p class="mb-0" i18n="@@featureDeploymentRunsList-bulkCancelBody">
      Cancel the selected queued or running runs? In-progress jobs may be stopped. This cannot be undone.
    </p>
  </fpc-confirm-dialog>
</div>
