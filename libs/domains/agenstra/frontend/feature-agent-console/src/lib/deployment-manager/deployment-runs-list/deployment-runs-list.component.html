<div class="deployment-runs-list-container d-flex flex-column flex-grow-1 min-h-0">
  @if (loadingRuns$ | async) {
    <div class="d-flex justify-content-center align-items-center p-4">
      <fpc-spinner
        size="sm"
        variant="primary"
        i18n-label="@@featureDeploymentRunsList-loadingRuns"
        label="Loading runs..."
      />
    </div>
  } @else {
    <fpc-search-field
      class="border-bottom flex-shrink-0"
      name="search"
      [bordered]="false"
      i18n-placeholder="@@featureDeploymentRunsList-searchPlaceholder"
      placeholder="Search deployment runs"
      [(value)]="searchRunsQuery"
    />
    <div class="flex-grow-1 overflow-auto d-flex flex-column min-h-0">
      @if (!hasRuns()) {
        @if (searchRunsQuery().trim()) {
          <fpc-empty-state
            size="sm"
            icon="search"
            message="No search results"
            i18n-message="@@featureDeploymentRunsList-noSearchResults"
          />
        } @else {
          <fpc-empty-state
            size="sm"
            message="No deployment runs yet"
            i18n-message="@@featureDeploymentRunsList-noRunsFound"
          />
        }
      } @else {
        <fpc-list [flush]="true">
          @for (run of filteredRuns(); track run.id) {
            <fpc-list-item [active]="selectedRunId() === run.id" [clickable]="true" (selected)="onRunClick(run.id)">
              <div fpcListItemTitle class="d-flex justify-content-between align-items-center gap-2">
                <strong class="text-truncate me-2">{{ getRunDisplayName(run.runName) }}</strong>
                <fpc-badge class="flex-shrink-0" [color]="getStatusBadgeColor(run.status)" [attr.title]="run.status">
                  <i class="bi" [ngClass]="getStatusIcon(run.status)"></i>
                  {{ run.status }}
                </fpc-badge>
              </div>
              <div fpcListItemMeta class="small d-flex align-items-center gap-1 row-gap-0 flex-wrap">
                <span class="me-2"> <i class="bi bi-git me-1" aria-hidden="true"></i>{{ run.ref }} </span>
                <span class="me-2">
                  <i class="bi bi-clock me-1" aria-hidden="true"></i>{{ formatDate(run.createdAt) }}
                </span>
              </div>
            </fpc-list-item>
          }
        </fpc-list>
      }
    </div>
  }

  <!-- Error Display (404 errors are hidden since empty state is handled by hasRuns check) -->
  @if (filteredError(); as error) {
    <fpc-alert class="m-3" variant="danger" [message]="error" />
  }
</div>
