<div class="deployment-manager-container d-flex h-100">
  <!-- Configuration and Selection Sidebar -->
  <!-- Phones (< md): configuration and runs stack in one scrolling view; an open run replaces them (back = close). -->
  <div class="deployment-sidebar border-end d-flex flex-row" [class.deployment-sidebar--run-open]="runDetailsVisible()">
    @if (clientId() && agentId()) {
      <!-- Configuration Section -->
      @if (configurationVisible()) {
        <div class="deployment-configuration-wrapper flex-shrink-0 border-end">
          <fpc-page-header [title]="configurationHeaderTitle" />
          <div class="flex-grow-1 overflow-auto">
            <framework-deployment-configuration
              [clientId]="clientId()!"
              [agentId]="agentId()!"
              (configurationSaved)="onConfigurationSaved($event)"
              (configurationDeleted)="onConfigurationDeleted()"
              (repositorySelected)="onRepositorySelected($event)"
              (branchSelected)="onBranchSelected($event)"
              (workflowSelected)="onWorkflowSelected($event)"
              (triggerWorkflow)="onTriggerWorkflow($event.workflow, $event.branch, $event.inputs)"
            ></framework-deployment-configuration>
          </div>
        </div>
      }

      <!-- Runs List Section -->
      @if (runsListVisible()) {
        <div class="deployment-runs-wrapper flex-shrink-0">
          <fpc-page-header [title]="runsHeaderTitle" />
          <div class="min-h-0 flex-grow-1 overflow-auto d-flex flex-column">
            <!-- Runs exist only for a configured workflow: no runs request (404) and a lane empty state until then. -->
            @if (hasConfiguration()) {
              <framework-deployment-runs-list
                [clientId]="clientId()!"
                [agentId]="agentId()!"
                [selectedRunId]="selectedRunId()"
                (runSelected)="onRunSelected($event)"
              >
                <!-- Refresh sits in the runs table's head (projected into its toolbar slot). -->
                <fpc-button
                  fpcDataTableToolbar
                  variant="dark"
                  size="sm"
                  [iconOnly]="true"
                  [loading]="(loadingRuns$ | async) === true"
                  [disabled]="!hasConfiguration() || !!(loadingRuns$ | async)"
                  [title]="refreshRunsTitle"
                  [ariaLabel]="refreshRunsTitle"
                  (clicked)="onRefreshRuns()"
                >
                  <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                </fpc-button>
              </framework-deployment-runs-list>
            } @else {
              <fpc-empty-state
                class="flex-grow-1"
                size="sm"
                icon="rocket-takeoff"
                message="No runs yet"
                i18n-message="@@featureDeploymentManager-noRunsYet"
              >
                <p class="small text-body-secondary mb-0" i18n="@@featureDeploymentManager-noRunsYetHint">
                  Runs appear here once a configuration exists.
                </p>
              </fpc-empty-state>
            }
          </div>
        </div>
      }
    } @else {
      <div class="d-flex justify-content-center align-items-center h-100 p-4">
        <div class="text-center text-body-secondary">
          <i class="bi bi-exclamation-triangle fs-4 d-block mb-2"></i>
          <p class="mb-0 small" i18n="@@featureDeploymentManager-selectWorkspaceAgent">
            Please select a workspace and environment
          </p>
        </div>
      </div>
    }
  </div>

  <!-- Main Content Area -->
  <div
    class="deployment-content flex-grow-1 d-flex flex-column"
    [class.deployment-content--run-open]="runDetailsVisible()"
  >
    @if (runDetailsVisible() && selectedRunSignal()) {
      <div class="deployment-run-details-wrapper flex-grow-1 d-flex flex-column">
        <fpc-page-header [title]="runDetailsHeaderTitle">
          <fpc-button
            fpcPageHeaderActions
            variant="dark"
            size="sm"
            [iconOnly]="true"
            [title]="closeRunDetailsTitle"
            [ariaLabel]="closeRunDetailsTitle"
            (clicked)="onCloseRunDetails()"
          >
            <i class="bi bi-x d-none d-md-inline" aria-hidden="true"></i>
            <i class="bi bi-arrow-left d-md-none" aria-hidden="true"></i>
          </fpc-button>
        </fpc-page-header>
        <div class="min-h-0 flex-grow-1 overflow-auto">
          <framework-deployment-run-details
            [clientId]="clientId()!"
            [agentId]="agentId()!"
            [runId]="selectedRunId()!"
          ></framework-deployment-run-details>
        </div>
      </div>
    } @else {
      <fpc-empty-state
        icon="rocket-takeoff"
        message="No run selected yet"
        i18n-message="@@featureDeploymentManager-noRunSelected"
      />
    }
  </div>
</div>
