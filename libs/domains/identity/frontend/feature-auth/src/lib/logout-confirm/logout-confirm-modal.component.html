<fpc-confirm-dialog
  [open]="dialogOpen()"
  [title]="modalTitle()"
  [message]="modalMessage()"
  [confirmLabel]="confirmLabel"
  [cancelLabel]="cancelLabel"
  (openChange)="dialogOpen.set($event)"
  (confirmed)="onConfirm()"
>
  @if (showLogoutAllSessionsOption()) {
    <fpc-form-check
      class="mt-3"
      checkId="identityLogoutAllSessions"
      [checked]="logoutAllSessions()"
      (checkedChange)="logoutAllSessions.set($event)"
      [label]="logoutAllSessionsLabel()"
    />
    @if (logoutAllSessions()) {
      <p class="text-warning small mb-0 mt-2">
        {{ logoutAllSessionsHint() }}
      </p>
    }
  }
</fpc-confirm-dialog>
