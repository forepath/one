name: Release

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set nx shas
        uses: nrwl/nx-set-shas@v5

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Generate token
        id: generate-token
        uses: forepath/github-app-token@v2
        with:
          app_id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private_key: ${{ secrets.SEMANTIC_RELEASE_KEY_PEM }}

      - name: Semantic release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic-release
        with:
          semantic_version: 22.0.5
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            conventional-changelog-conventionalcommits@7.0.2
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Run build
        if: steps.semantic-release.outputs.new_release_published == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx nx run-many --target=build --configuration=production --parallel=3; then
              exit 0
            fi
            echo "Build attempt ${attempt} failed."
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Generate binaries
        if: steps.semantic-release.outputs.new_release_published == 'true'
        run: npx nx run-many --target=scripts-binary --parallel=3

      - name: Run SBOM generation
        if: steps.semantic-release.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
        run: npx nx run-many --target=sbom --parallel=1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: steps.semantic-release.outputs.new_release_published == 'true'
        with:
          name: build-artifacts
          path: |
            dist/
            node_modules/
          retention-days: 1
          compression-level: 6

  build-api-container-images:
    name: Build API Container Images
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.new_release_published == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set nx shas
        uses: nrwl/nx-set-shas@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: 'Login to container registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API container images
        env:
          VERSION: ${{ needs.publish.outputs.new_release_version }}
        run: |
          npx nx run-many --target=api-container-image --configuration=release --parallel=3

      - name: Generate container image SBOMs
        uses: ./.github/actions/generate-container-image-sboms
        with:
          project-version: ${{ needs.publish.outputs.new_release_version }}
          artifact-name: sbom-container-images-api

  build-worker-container-images:
    name: Build Worker Container Images
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.new_release_published == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set nx shas
        uses: nrwl/nx-set-shas@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: 'Login to container registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The shared microVM launcher is multi-arch (amd64 + arm64, like the OpenSearch image of the bundle job): QEMU
      # emulation for the arm64 build stages.
      - name: Set up QEMU (arm64 microVM launcher)
        uses: docker/setup-qemu-action@v3

      - name: Publish Worker container images
        env:
          VERSION: ${{ needs.publish.outputs.new_release_version }}
        run: |
          npx nx run-many --target=worker-container-image --configuration=release --parallel=3
          # ghcr.io/forepath/microvm-launcher (multi-arch, pushed); the Agenstra microVM worker image is built FROM it.
          npx nx run shared-microvm-launcher:container-image --configuration=release
          # Multi-arch pushes aren't loaded locally: pull the runner's variant for the Trivy SBOM below.
          docker pull "ghcr.io/forepath/microvm-launcher:${VERSION}"
          npx nx run-many --target=worker-microvm-container-image --configuration=release --parallel=1
          npx nx run-many --target=egress-guard-container-image --configuration=release --parallel=3

      - name: Generate container image SBOMs
        uses: ./.github/actions/generate-container-image-sboms
        with:
          project-version: ${{ needs.publish.outputs.new_release_version }}
          artifact-name: sbom-container-images-worker

  build-server-container-images:
    name: Build Server Container Images
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.new_release_published == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set nx shas
        uses: nrwl/nx-set-shas@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: 'Login to container registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Server container images
        env:
          VERSION: ${{ needs.publish.outputs.new_release_version }}
        run: |
          npx nx run-many --target=server-container-image --configuration=release --parallel=3

      - name: Generate container image SBOMs
        uses: ./.github/actions/generate-container-image-sboms
        with:
          project-version: ${{ needs.publish.outputs.new_release_version }}
          artifact-name: sbom-container-images-server

  publish-openapi-clients-js:
    name: Publish OpenAPI JavaScript/TypeScript Clients
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.new_release_published == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set nx shas
        uses: nrwl/nx-set-shas@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Configure npm for GitHub Packages
        run: |
          echo "@forepath:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Install OpenAPI Generator CLI
        run: |
          npm install --ignore-scripts=false @openapitools/openapi-generator-cli
          npx @openapitools/openapi-generator-cli version

      - name: Publish JavaScript/TypeScript clients
        env:
          VERSION: ${{ needs.publish.outputs.new_release_version }}
        run: |
          npx nx run-many --target=openapi-client-js --configuration=release --parallel=3

  build-native-applications-linux:
    name: Publish Linux Applications
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.new_release_published == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set nx shas
        uses: nrwl/nx-set-shas@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Build binaries
        env:
          ELECTRON_FORGE_PLATFORM: linux
          RELEASE_VERSION: ${{ needs.publish.outputs.new_release_version }}
        run: |
          xvfb-run -a npx nx run-many --target=package --configuration=production-linux --parallel=3

      # The rpm is built from Forge's packaged Linux app by the shared desktop release pipeline (tools/desktop-release);
      # it is GPG-signed together with the repositories in "Publish Native Applications".
      - name: Build the rpm packages
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.new_release_version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          npx nx run desktop-release:bundle
          node tmp/desktop-release/desktop-release.cjs linux-rpm --app agenstra --version "${RELEASE_VERSION}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-artifacts-linux
          path: |
            dist/**/out/make/**/*.zip
            dist/**/out/make/**/*.deb
            dist/**/out/make/**/*.rpm
          retention-days: 1
          compression-level: 6

  build-native-applications-windows:
    name: Publish Windows Applications
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.new_release_published == 'true'
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      has_windows_bundle: ${{ steps.detect-windows-bundle.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set nx shas
        uses: nrwl/nx-set-shas@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Setup Windows build environment
        uses: ./.github/actions/setup-windows-build-env

      - name: Build binaries
        env:
          ELECTRON_FORGE_PLATFORM: win32
          RELEASE_VERSION: ${{ needs.publish.outputs.new_release_version }}
        run: |
          xvfb-run -a npx nx run-many --target=package --configuration=production-windows --parallel=3

      - name: Upload Windows Electron bundle
        uses: actions/upload-artifact@v7
        with:
          name: windows-electron-bundle
          path: dist/apps/agenstra/native-agent-console/out/native-agent-console-win32-x64
          if-no-files-found: error
          retention-days: 1

      - name: Detect Windows Electron bundle
        id: detect-windows-bundle
        if: ${{ !cancelled() }}
        run: |
          bundle_path="dist/apps/agenstra/native-agent-console/out/native-agent-console-win32-x64"
          if [ -d "$bundle_path" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-native-applications-windows-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs:
      - publish
      - build-native-applications-windows
    if: >-
      needs.publish.outputs.new_release_published == 'true' &&
      needs.build-native-applications-windows.outputs.has_windows_bundle == 'true'
    # Authenticode certificate (tools/desktop-release/README.md); only the two signing steps receive it.
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Download Windows Electron bundle
        uses: actions/download-artifact@v8
        with:
          name: windows-electron-bundle
          path: windows-electron-bundle

      # Built before any key is in the environment; the signing steps run this bundle only (no nx, no npm).
      - name: Bundle the desktop release CLI
        shell: bash
        run: npx nx run desktop-release:bundle

      - name: Check the Authenticode certificate
        id: authenticode
        shell: bash
        env:
          DESKTOP_WINDOWS_CERTIFICATE_PFX: ${{ secrets.DESKTOP_WINDOWS_CERTIFICATE_PFX }}
          DESKTOP_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "${DESKTOP_WINDOWS_CERTIFICATE_PFX}" ] && [ -n "${DESKTOP_WINDOWS_CERTIFICATE_PASSWORD}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Windows app not signed::DESKTOP_WINDOWS_CERTIFICATE_PFX / DESKTOP_WINDOWS_CERTIFICATE_PASSWORD are not set; the Windows app and installer are published without Authenticode signature."
          fi

      - name: Sign the app binaries (Authenticode)
        if: steps.authenticode.outputs.present == 'true'
        shell: bash
        env:
          DESKTOP_WINDOWS_CERTIFICATE_PFX: ${{ secrets.DESKTOP_WINDOWS_CERTIFICATE_PFX }}
          DESKTOP_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_CERTIFICATE_PASSWORD }}
        run: node tmp/desktop-release/desktop-release.cjs sign-windows --app agenstra --path windows-electron-bundle

      - name: Build NSIS installer from prepackaged bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.new_release_version }}
          REQUIRE_INSTALLER_BUNDLE: '1'
        run: ./tools/ci/build-windows-installer.ps1

      - name: Sign the installer (Authenticode)
        if: steps.authenticode.outputs.present == 'true'
        shell: bash
        env:
          DESKTOP_WINDOWS_CERTIFICATE_PFX: ${{ secrets.DESKTOP_WINDOWS_CERTIFICATE_PFX }}
          DESKTOP_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_CERTIFICATE_PASSWORD }}
        run: node tmp/desktop-release/desktop-release.cjs sign-windows --app agenstra --path apps/agenstra/native-agent-console/installer-out --top-level

      # Same name and layout as Forge's zip maker, but from the (signed) bundle.
      - name: Zip the Windows app
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.new_release_version }}
        run: |
          $name = 'native-agent-console-win32-x64'
          Rename-Item -LiteralPath 'windows-electron-bundle' -NewName $name
          New-Item -ItemType Directory -Force -Path 'windows-zip' | Out-Null
          Compress-Archive -Path $name -DestinationPath "windows-zip/$name-$($env:RELEASE_VERSION).zip"

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-artifacts-windows-installer
          path: |
            apps/agenstra/native-agent-console/installer-out/*.exe
            windows-zip/*.zip
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 6

  build-native-applications-macos:
    name: Build macOS Applications (${{ matrix.arch }})
    runs-on: macos-latest
    needs: publish
    if: needs.publish.outputs.new_release_published == 'true'
    # Apple Developer ID certificate + notarization key (tools/desktop-release/README.md); only the signing step gets them.
    environment: production
    # Best effort until the first signed macOS release has been verified end to end: a failure here must not hold back
    # the Linux / Windows desktop release (the macOS zips are then simply missing from it).
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set nx shas
        uses: nrwl/nx-set-shas@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Package the app (unsigned)
        env:
          ELECTRON_FORGE_PLATFORM: darwin
          ELECTRON_FORGE_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.publish.outputs.new_release_version }}
        run: npx nx run agenstra-native-agent-console:package --configuration=production-macos

      # Built before any key is in the environment; the signing step runs this bundle only (no nx, no npm).
      - name: Bundle the desktop release CLI
        run: npx nx run desktop-release:bundle

      - name: Check the Apple signing secrets
        id: apple
        env:
          DESKTOP_MACOS_CERTIFICATE_P12: ${{ secrets.DESKTOP_MACOS_CERTIFICATE_P12 }}
          DESKTOP_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_MACOS_CERTIFICATE_PASSWORD }}
          DESKTOP_APPLE_API_KEY_P8: ${{ secrets.DESKTOP_APPLE_API_KEY_P8 }}
          DESKTOP_APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          DESKTOP_APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: |
          if [ -n "${DESKTOP_MACOS_CERTIFICATE_P12}" ] && [ -n "${DESKTOP_MACOS_CERTIFICATE_PASSWORD}" ] && \
             [ -n "${DESKTOP_APPLE_API_KEY_P8}" ] && [ -n "${DESKTOP_APPLE_API_KEY_ID}" ] && [ -n "${DESKTOP_APPLE_API_ISSUER}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS app not signed::The DESKTOP_MACOS_* / DESKTOP_APPLE_* secrets are not all set; the macOS app is published ad-hoc signed, not notarized, without in-app updates."
          fi

      - name: Sign and notarize (Developer ID)
        if: steps.apple.outputs.present == 'true'
        env:
          DESKTOP_MACOS_CERTIFICATE_P12: ${{ secrets.DESKTOP_MACOS_CERTIFICATE_P12 }}
          DESKTOP_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_MACOS_CERTIFICATE_PASSWORD }}
          DESKTOP_APPLE_API_KEY_P8: ${{ secrets.DESKTOP_APPLE_API_KEY_P8 }}
          DESKTOP_APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          DESKTOP_APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: node tmp/desktop-release/desktop-release.cjs sign-macos --app agenstra --arch "${{ matrix.arch }}"

      - name: Zip the app
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.new_release_version }}
        run: node tmp/desktop-release/desktop-release.cjs zip-macos --app agenstra --arch "${{ matrix.arch }}" --version "${RELEASE_VERSION}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-artifacts-macos-${{ matrix.arch }}
          path: dist/**/out/make/zip/darwin/**/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-native-applications:
    name: Publish Native Applications
    runs-on: ubuntu-latest
    needs:
      - publish
      - build-native-applications-linux
      - build-native-applications-windows
      - build-native-applications-windows-installer
      - build-native-applications-macos
    # Explicit result checks: the best-effort macOS leg (and a skipped Windows installer) must not skip the publish;
    # missing macOS zips are simply absent from the release (M5).
    if: >-
      ${{ !cancelled() &&
      needs.publish.outputs.new_release_published == 'true' &&
      needs.build-native-applications-linux.result == 'success' &&
      needs.build-native-applications-windows.result == 'success' &&
      (needs.build-native-applications-windows-installer.result == 'success' ||
      needs.build-native-applications-windows-installer.result == 'skipped') }}
    environment: production
    env:
      VERSION: ${{ needs.publish.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set nx shas
        uses: nrwl/nx-set-shas@v5

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: binary-artifacts-*
          merge-multiple: true

      - name: Consolidate binaries
        run: |
          mkdir -p release
          mkdir -p artifacts
          find artifacts -type f -name '*.zip' -exec cp {} release/ \;
          find artifacts -type f -name '*.deb' -exec cp {} release/ \;
          find artifacts -type f -name '*.rpm' -exec cp {} release/ \;
          find artifacts -type f -name '*.exe' -exec cp {} release/ \;
          find artifacts -type f -name '*.msi' -exec cp {} release/ \;
          find artifacts -type f -name '*.msix' -exec cp {} release/ \;

      # Linux packages through signed apt / rpm repositories (tools/desktop-release): channels this release goes to,
      # then rpm signing + repository metadata in the one step that has the GPG key. Without the key: plain downloads.
      - name: Prepare the Linux repository tools
        id: channels
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c apt-utils
          npx nx run desktop-release:bundle
          node tmp/desktop-release/desktop-release.cjs channels --app agenstra --version "${VERSION}"

      - name: Check the GPG key
        id: gpg
        env:
          DESKTOP_LINUX_GPG_PRIVATE_KEY: ${{ secrets.DESKTOP_LINUX_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${DESKTOP_LINUX_GPG_PRIVATE_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Linux packages not signed::DESKTOP_LINUX_GPG_PRIVATE_KEY is not set; rpms stay unsigned and no apt / rpm repository is published."
          fi

      - name: Sign the Linux packages and build the repositories
        if: steps.gpg.outputs.present == 'true' && steps.channels.outputs.channels != ''
        env:
          DESKTOP_LINUX_GPG_PRIVATE_KEY: ${{ secrets.DESKTOP_LINUX_GPG_PRIVATE_KEY }}
          DESKTOP_LINUX_GPG_PASSPHRASE: ${{ secrets.DESKTOP_LINUX_GPG_PASSPHRASE }}
        run: |
          node tmp/desktop-release/desktop-release.cjs linux-repo --app agenstra \
            --channels "${{ steps.channels.outputs.channels }}" --packages release --out dist/desktop-repo

      - name: Generate desktop integrity manifests (SHA256SUMS + integrity-manifest.json)
        run: |
          shopt -s nullglob
          files=(release/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No desktop binaries in release/; skipping integrity manifests."
            exit 0
          fi
          npx nx run release-integrity:build
          node tools/release-integrity/dist/src/cli.js --input release
          node tools/release-integrity/dist/src/cli.js verify --input release

      - name: Upload binaries to Cloudflare R2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.AGENSTRA_CLOUDFLARE_R2_ENDPOINT }}
          AGENSTRA_AWS_BUCKET: ${{ secrets.AGENSTRA_AWS_BUCKET }}
        run: |
          shopt -s nullglob
          files=(release/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No desktop binaries in release/ — aborting R2 upload"
            exit 1
          fi
          if [ -z "${AGENSTRA_AWS_BUCKET}" ]; then
            echo "::error::AGENSTRA_AWS_BUCKET must be configured"
            exit 1
          fi
          aws s3 cp release/ "s3://${AGENSTRA_AWS_BUCKET}/releases/${{ needs.publish.outputs.new_release_version }}/desktop/" --recursive --endpoint-url "${CLOUDFLARE_R2_ENDPOINT}"

      - name: Upload the package repositories to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.AGENSTRA_CLOUDFLARE_R2_ENDPOINT }}
          AGENSTRA_AWS_BUCKET: ${{ secrets.AGENSTRA_AWS_BUCKET }}
        run: |
          set -euo pipefail
          if [ ! -d dist/desktop-repo ]; then
            echo "No package repositories were built; skipping."
            exit 0
          fi
          # Packages first, metadata last: clients never see an index naming a file that is not uploaded yet.
          aws s3 cp dist/desktop-repo/ "s3://${AGENSTRA_AWS_BUCKET}/" --recursive --endpoint-url "${CLOUDFLARE_R2_ENDPOINT}" \
            --exclude '*' --include '*.deb' --include '*.rpm'
          aws s3 cp dist/desktop-repo/ "s3://${AGENSTRA_AWS_BUCKET}/" --recursive --endpoint-url "${CLOUDFLARE_R2_ENDPOINT}" \
            --exclude '*.deb' --exclude '*.rpm' --cache-control 'no-cache'

      # Exactly the files published above (signed rpms, macOS zips, ...) for the signed release manifest.
      - name: Keep the published desktop files for the release manifest
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-files
          path: release/
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  publish-agentctx:
    name: Publish agentctx to Cloudflare R2
    runs-on: ubuntu-latest
    needs: publish
    if: needs.publish.outputs.new_release_published == 'true'
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Upload agentctx to Cloudflare R2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.AGENSTRA_CLOUDFLARE_R2_ENDPOINT }}
          AGENSTRA_AWS_BUCKET: ${{ secrets.AGENSTRA_AWS_BUCKET }}
        run: |
          if [ -z "${AGENSTRA_AWS_BUCKET}" ]; then
            echo "::error::AGENSTRA_AWS_BUCKET must be configured"
            exit 1
          fi
          aws s3 cp dist/tools/ai/bin/ "s3://${AGENSTRA_AWS_BUCKET}/releases/${{ needs.publish.outputs.new_release_version }}/agentctx/" --recursive --endpoint-url "${CLOUDFLARE_R2_ENDPOINT}"
          aws s3 cp dist/tools/ai/bin/ "s3://${AGENSTRA_AWS_BUCKET}/agentctx/" --recursive --endpoint-url "${CLOUDFLARE_R2_ENDPOINT}"

  build-loadweaver-release-bundle:
    name: Build Loadweaver Release Bundle
    runs-on: ubuntu-latest
    needs:
      - publish
      - build-api-container-images
      # The console image (loadweaver-console-server) is pinned by digest in the signed manifest (Loadweaver Cloud).
      - build-server-container-images
      # The shared microVM launcher (microVMs and full VMs) is pinned by digest in the signed manifest.
      - build-worker-container-images
    if: needs.publish.outputs.new_release_published == 'true'
    environment: production
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      VERSION: ${{ needs.publish.outputs.new_release_version }}
      # Node.js the agent's single executable is built on (arm64 cross build: the official binary, checksum-verified).
      NODE_SEA_VERSION: 24.14.1
    steps:
      # Until the production release key exists (`nx run release-integrity:generate-release-key --product loadweaver`,
      # public key in RELEASE_SIGNING_KEYS.loadweaver of util-release-keys, private key in this secret), the bundle is
      # skipped with a warning instead of failing.
      - name: Check the release signing key
        id: signing-key
        env:
          LOADWEAVER_RELEASE_SIGNING_KEY: ${{ secrets.LOADWEAVER_RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "${LOADWEAVER_RELEASE_SIGNING_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Loadweaver bundle skipped::LOADWEAVER_RELEASE_SIGNING_KEY is not set; no release bundle is built."
          fi
      # Images, the apt snapshot's packages (packed per OS) and the bundle tar need well over the runner's free disk.
      - name: Free disk space
        if: steps.signing-key.outputs.present == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Checkout code
        if: steps.signing-key.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the Terraform provider zips
        if: steps.signing-key.outputs.present == 'true' && matrix.product == 'loadweaver'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: terraform-provider-*
          path: dist/terraform-provider
          merge-multiple: true

      - name: Setup environment
        if: steps.signing-key.outputs.present == 'true'
        uses: ./.github/actions/setup-env

      - name: 'Login to container registry'
        if: steps.signing-key.outputs.present == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the node agent (amd64 + arm64 single executables)
        if: steps.signing-key.outputs.present == 'true'
        run: |
          set -euo pipefail
          npx nx run loadweaver-backend-node-agent:build:sea
          node apps/loadweaver/backend-node-agent/scripts/build-sea.mjs --bundle dist/apps/loadweaver/backend-node-agent/main.js --out dist/agent-sea/amd64
          curl -fsSL -o /tmp/node-arm64.tar.xz "https://nodejs.org/dist/v${NODE_SEA_VERSION}/node-v${NODE_SEA_VERSION}-linux-arm64.tar.xz"
          curl -fsSL -o /tmp/SHASUMS256.txt "https://nodejs.org/dist/v${NODE_SEA_VERSION}/SHASUMS256.txt"
          (cd /tmp && grep " node-v${NODE_SEA_VERSION}-linux-arm64.tar.xz\$" SHASUMS256.txt | sha256sum -c -)
          tar -xJf /tmp/node-arm64.tar.xz -C /tmp "node-v${NODE_SEA_VERSION}-linux-arm64/bin/node"
          node apps/loadweaver/backend-node-agent/scripts/build-sea.mjs --bundle dist/apps/loadweaver/backend-node-agent/main.js --out dist/agent-sea/arm64 --node "/tmp/node-v${NODE_SEA_VERSION}-linux-arm64/bin/node"

      - name: Build the OpenSearch image with repository-s3
        if: steps.signing-key.outputs.present == 'true'
        run: |
          set -euo pipefail
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/forepath/loadweaver-opensearch-s3:3.9.0-${VERSION}" \
            -f libs/domains/loadweaver/shared/util-release/images/opensearch-s3.Dockerfile libs/domains/loadweaver/shared/util-release/images

      - name: Export images as OCI archives (air-gapped clusters)
        if: steps.signing-key.outputs.present == 'true'
        run: |
          set -euo pipefail
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          CP="ghcr.io/forepath/loadweaver-control-plane-api:${VERSION}"
          CP="${CP}@$(digest "$CP")"
          OS="ghcr.io/forepath/loadweaver-opensearch-s3:3.9.0-${VERSION}"
          OS="${OS}@$(digest "$OS")"
          # Not a cluster component: Loadweaver Cloud (Decabill) pulls the management endpoint's console by this digest.
          CONSOLE="ghcr.io/forepath/loadweaver-console-server:${VERSION}"
          CONSOLE="${CONSOLE}@$(digest "$CONSOLE")"
          # The shared microVM launcher (multi-arch, built by the worker images job).
          LAUNCHER="ghcr.io/forepath/microvm-launcher:${VERSION}"
          LAUNCHER="${LAUNCHER}@$(digest "$LAUNCHER")"
          # The other component images, pinned by digest in the source of truth (util-release pins).
          npx esbuild libs/domains/loadweaver/shared/util-release/src/lib/pins.ts --bundle --platform=node --format=cjs --outfile=tmp/pins.cjs --log-level=warning
          {
            node -e "const {COMPONENT_IMAGES}=require('./tmp/pins.cjs'); for (const [n,r] of Object.entries(COMPONENT_IMAGES)) if (n!=='control-plane' && n!=='opensearch' && n!=='microvm-launcher') console.log(n+' '+r)"
            echo "control-plane ${CP}"
            echo "opensearch ${OS}"
            echo "microvm-launcher ${LAUNCHER}"
          } > /tmp/images.txt
          mkdir -p dist/images
          ARGS=""
          while read -r name ref; do
            skopeo copy --all --quiet "docker://${ref}" "oci-archive:dist/images/${name}.oci.tar"
            ARGS="${ARGS} --image-archive ${name}=dist/images/${name}.oci.tar"
          done < /tmp/images.txt
          {
            echo "CONTROL_PLANE_IMAGE=${CP}"
            echo "MICROVM_LAUNCHER_IMAGE=${LAUNCHER}"
            echo "OPENSEARCH_IMAGE=${OS}"
            echo "CONSOLE_IMAGE=${CONSOLE}"
            echo "IMAGE_ARCHIVES=${ARGS}"
          } >> "$GITHUB_ENV"

      # Air-gapped clusters update the OS from the bundle (3.26): the indexes of every supported OS release /
      # architecture are frozen now and the packages a node installs or updates (base system, Loadweaver's host
      # packages, kernels + headers, DRBD build tools, with dependencies) are selected; build-bundle fetches them by
      # checksum and packs them per OS (several GB, see docs/loadweaver/features/updates.md). The kernel lists feed
      # the DRBD compat step, so its patches match the snapshot's kernels.
      - name: Freeze the apt snapshot for air-gapped clusters
        if: steps.signing-key.outputs.present == 'true'
        run: |
          set -euo pipefail
          HOSTS=""
          for os in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04; do
            for arch in amd64 arm64; do HOSTS="${HOSTS} --host ${os}/${arch}"; done
          done
          npx nx run loadweaver-shared-util-release:apt-snapshot --release "${VERSION}" ${HOSTS} --out dist/apt
          echo "APT_SNAPSHOT=--apt-snapshot dist/apt/snapshot.json --apt-files dist/apt/blobs" >> "$GITHUB_ENV"

      - name: Set up QEMU (arm64 containers for the DRBD compat patches)
        if: steps.signing-key.outputs.present == 'true'
        uses: docker/setup-qemu-action@v3

      # Air-gapped nodes build DRBD from source without LINBIT's SPAAS: its compat patch for every kernel the release's
      # snapshot installs is generated here (network allowed), in a container of each supported OS release and
      # architecture (for the kernels the frozen apt snapshot selected), and ships in the bundle (signed).
      - name: Pre-generate DRBD compat patches per release kernel
        if: steps.signing-key.outputs.present == 'true'
        run: |
          set -euo pipefail
          DRBD_URL=$(node -e "console.log(require('./tmp/pins.cjs').DRBD_PIN.url)")
          DRBD_SHA=$(node -e "console.log(require('./tmp/pins.cjs').DRBD_PIN.sha256)")
          mkdir -p dist/drbd
          curl -fsSL -o dist/drbd/drbd.tar.gz "${DRBD_URL}"
          echo "${DRBD_SHA}  dist/drbd/drbd.tar.gz" | sha256sum -c -
          ARGS=""
          for os in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04; do
            for arch in amd64 arm64; do
              out="dist/drbd/compat/${os/:/-}/${arch}"
              mkdir -p "${out}"
              # The kernels of the frozen apt snapshot (what an air-gapped node's dist-upgrade installs).
              kernels=$(cat "dist/apt/kernels/${os/:/-}-${arch}.txt" 2>/dev/null || true)
              docker run --rm --platform "linux/${arch}" -v "${PWD}:/w" -w /w "docker.io/library/${os}" \
                bash libs/domains/loadweaver/shared/util-release/scripts/drbd-compat.sh dist/drbd/drbd.tar.gz "${DRBD_SHA}" "${out}" ${kernels}
              for f in "${out}"/*.tar.gz; do
                ARGS="${ARGS} --drbd-compat $(basename "${f}" .tar.gz):${arch}=${f}"
              done
            done
          done
          echo "DRBD_COMPAT=${ARGS}" >> "$GITHUB_ENV"

      # Built without the key (nx, esbuild, downloads); the key only reaches the separate signing step below.
      - name: Build the bundle (unsigned, signature deferred)
        if: steps.signing-key.outputs.present == 'true'
        run: |
          set -euo pipefail
          npx nx run loadweaver-shared-util-release:build-bundle --release "${VERSION}" \
            --require-signature --defer-signature \
            --control-plane-image "${CONTROL_PLANE_IMAGE}" --opensearch-image "${OPENSEARCH_IMAGE}" \
            --console-image "${CONSOLE_IMAGE}" --microvm-launcher-image "${MICROVM_LAUNCHER_IMAGE}" \
            --agent-amd64 dist/agent-sea/amd64/loadweaver-agent --agent-arm64 dist/agent-sea/arm64/loadweaver-agent \
            ${IMAGE_ARCHIVES} --gvisor --drbd-source ${DRBD_COMPAT} ${APT_SNAPSHOT} --out dist/loadweaver-bundle

      - name: Sign the bundle
        if: steps.signing-key.outputs.present == 'true'
        env:
          # Release signing key (ECDSA P-256 PEM); only this step has it. It runs the script the build step compiled
          # (no nx, no network): signs the manifest and assembles the bundle tar. Never printed.
          LOADWEAVER_RELEASE_SIGNING_KEY: ${{ secrets.LOADWEAVER_RELEASE_SIGNING_KEY }}
        run: node tmp/lw-release/build-bundle.cjs --sign-deferred --release "${VERSION}" --out dist/loadweaver-bundle

      - name: Split large bundles
        if: steps.signing-key.outputs.present == 'true'
        run: |
          set -euo pipefail
          # GitHub release assets are limited to 2 GiB: large bundles go up in parts the control plane reads in order.
          cd dist/loadweaver-bundle
          if [ "$(stat -c %s "loadweaver-bundle-${VERSION}.tar")" -gt 1900000000 ]; then
            split -b 1900m -d -a 3 "loadweaver-bundle-${VERSION}.tar" "loadweaver-bundle-${VERSION}.tar.part"
            rm "loadweaver-bundle-${VERSION}.tar"
          fi

      - name: Attach the bundle to the GitHub release
        if: steps.signing-key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" dist/loadweaver-bundle/loadweaver-bundle-"${VERSION}".* --clobber
          # The agent binaries on their own (the same files as in the bundle; their SHA-256 is in the signed manifest):
          # Decabill's `loadweaver` service kind bootstraps a first node from them without downloading the whole bundle.
          mkdir -p dist/loadweaver-agent
          for arch in amd64 arm64; do
            cp "dist/agent-sea/${arch}/loadweaver-agent" "dist/loadweaver-agent/loadweaver-agent-${VERSION}-linux-${arch}"
          done
          gh release upload "v${VERSION}" dist/loadweaver-agent/loadweaver-agent-"${VERSION}"-linux-* --clobber

  # Terraform provider (apps/loadweaver/terraform-provider): one Node single executable per platform, zipped in the
  # Terraform registry layout. macOS binaries need an ad-hoc re-signature after the blob injection, so they are built
  # on macOS; the others cross-build on Linux from checksum-verified official Node binaries.
  build-loadweaver-terraform-provider:
    name: Build Loadweaver Terraform Provider (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: publish
    if: needs.publish.outputs.new_release_published == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platforms: linux_amd64,linux_arm64,windows_amd64
          - os: macos-latest
            platforms: darwin_amd64,darwin_arm64
    env:
      VERSION: ${{ needs.publish.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Build and zip the provider
        run: |
          set -euo pipefail
          npx nx run loadweaver-terraform-provider:build:sea --skip-nx-cache
          node apps/loadweaver/terraform-provider/scripts/package-provider.mjs build \
            --bundle dist/apps/loadweaver/terraform-provider/main.js --out dist/terraform-provider \
            --version "${VERSION}" --platforms "${{ matrix.platforms }}"

      - name: Upload the provider zips
        uses: actions/upload-artifact@v7
        with:
          name: terraform-provider-${{ matrix.os }}
          path: dist/terraform-provider/*.zip
          if-no-files-found: error

  publish-loadweaver-terraform-provider:
    name: Publish Loadweaver Terraform Provider
    runs-on: ubuntu-latest
    needs:
      - publish
      - build-loadweaver-terraform-provider
    if: needs.publish.outputs.new_release_published == 'true'
    environment: production
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.publish.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Download the provider zips
        uses: actions/download-artifact@v8
        with:
          pattern: terraform-provider-*
          path: dist/terraform-provider
          merge-multiple: true

      # Registry files (terraform-provider-loadweaver_<v>_manifest.json + _SHA256SUMS) and, like the desktop
      # artifacts, SHA256SUMS + integrity-manifest.json from tools/release-integrity (verified right away).
      - name: Checksums and integrity manifest
        run: |
          set -euo pipefail
          node apps/loadweaver/terraform-provider/scripts/package-provider.mjs checksums --dir dist/terraform-provider --version "${VERSION}"
          npx nx run release-integrity:build
          node tools/release-integrity/dist/src/cli.js --input dist/terraform-provider
          node tools/release-integrity/dist/src/cli.js verify --input dist/terraform-provider

      # Signature hook: the Terraform registry verifies a detached GPG signature of the SHA256SUMS file with the
      # public key registered for the forepath namespace. Until that key exists (armored private key in this secret),
      # the signature is skipped with a warning; the files are published unsigned (usable via mirrors / dev overrides).
      - name: Sign SHA256SUMS for the Terraform registry
        env:
          TERRAFORM_PROVIDER_GPG_PRIVATE_KEY: ${{ secrets.TERRAFORM_PROVIDER_GPG_PRIVATE_KEY }}
          TERRAFORM_PROVIDER_GPG_PASSPHRASE: ${{ secrets.TERRAFORM_PROVIDER_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${TERRAFORM_PROVIDER_GPG_PRIVATE_KEY}" ]; then
            echo "::warning title=Terraform provider unsigned::TERRAFORM_PROVIDER_GPG_PRIVATE_KEY is not set; SHA256SUMS has no registry signature."
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "${TERRAFORM_PROVIDER_GPG_PRIVATE_KEY}" | gpg --batch --import
          SUMS="dist/terraform-provider/terraform-provider-loadweaver_${VERSION}_SHA256SUMS"
          printf '%s' "${TERRAFORM_PROVIDER_GPG_PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --detach-sign --output "${SUMS}.sig" "${SUMS}"
          gpg --batch --verify "${SUMS}.sig" "${SUMS}"
          rm -rf "${GNUPGHOME}"

      - name: Attach the provider to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/terraform-provider
          mv SHA256SUMS "terraform-provider-loadweaver_${VERSION}_SHA256SUMS.integrity"
          mv integrity-manifest.json "terraform-provider-loadweaver_${VERSION}_integrity-manifest.json"
          gh release upload "v${VERSION}" terraform-provider-loadweaver_"${VERSION}"_* --clobber

  sign-release-manifests:
    name: Sign Release Manifest (${{ matrix.product }})
    runs-on: ubuntu-latest
    needs:
      - publish
      - build-api-container-images
      - build-worker-container-images
      - build-server-container-images
      - publish-native-applications
      # Loadweaver: the Terraform provider zips are listed in the signed manifest too (not required: a failed provider
      # build leaves them out instead of skipping the manifest).
      - build-loadweaver-terraform-provider
    # Result-based, so a failed best-effort macOS leg further up the chain cannot skip the manifests (M5).
    if: >-
      ${{ !cancelled() &&
      needs.publish.outputs.new_release_published == 'true' &&
      needs.build-api-container-images.result == 'success' &&
      needs.build-worker-container-images.result == 'success' &&
      needs.build-server-container-images.result == 'success' &&
      needs.publish-native-applications.result == 'success' }}
    environment: production
    permissions:
      contents: write
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: agenstra
            secret: AGENSTRA_RELEASE_SIGNING_KEY
          - product: decabill
            secret: DECABILL_RELEASE_SIGNING_KEY
          - product: forepath
            secret: FOREPATH_RELEASE_SIGNING_KEY
          # Same key as the release bundle (compiled into the control plane, agent and CLI).
          - product: loadweaver
            secret: LOADWEAVER_RELEASE_SIGNING_KEY
    env:
      VERSION: ${{ needs.publish.outputs.new_release_version }}
    steps:
      # A signed manifest per product (image digests, download checksums, source commit; tools/release-integrity/README.md).
      # Until the product's key exists (`nx run release-integrity:generate-release-key`, public key in
      # libs/domains/shared/shared/util-release-keys, private key in this secret), it is skipped with a warning.
      - name: Check the release signing key
        id: signing-key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -n "${RELEASE_SIGNING_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=${{ matrix.product }} release manifest skipped::${{ matrix.secret }} is not set; no signed release manifest is published."
          fi

      - name: Checkout code
        if: steps.signing-key.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download build artifacts (agentctx)
        if: steps.signing-key.outputs.present == 'true' && matrix.product == 'agenstra'
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: .

      - name: Download desktop binaries
        if: steps.signing-key.outputs.present == 'true' && matrix.product == 'agenstra'
        # The artifact is absent when no desktop files were published (e.g. only the macOS leg produced any and failed).
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-files
          path: artifacts

      - name: Setup environment
        if: steps.signing-key.outputs.present == 'true'
        uses: ./.github/actions/setup-env

      - name: 'Login to container registry'
        if: steps.signing-key.outputs.present == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built without the key; the key only reaches the separate signing step below.
      - name: Build the release manifest
        if: steps.signing-key.outputs.present == 'true'
        run: |
          set -euo pipefail
          FILES=()
          if [ "${{ matrix.product }}" = "agenstra" ]; then
            # The files published to R2 under releases/<version>/desktop/ and releases/<version>/agentctx/.
            mkdir -p release artifacts
            find artifacts -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' -o -name '*.msix' \) -exec cp {} release/ \;
            FILES+=(--files desktop=release --files agentctx=dist/tools/ai/bin)
          fi
          if [ "${{ matrix.product }}" = "loadweaver" ] && compgen -G 'dist/terraform-provider/*.zip' >/dev/null; then
            # The provider zips as attached to the GitHub release (terraform-provider-loadweaver_<v>_<os>_<arch>.zip).
            FILES+=(--files terraform-provider=dist/terraform-provider)
          fi
          npx nx run release-integrity:release-manifest create --product "${{ matrix.product }}" --release "${VERSION}" \
            --commit "${GITHUB_SHA}" --repository "${GITHUB_REPOSITORY}" --images-from-projects "${FILES[@]}" \
            --out dist/release-manifests

      - name: Sign the release manifest
        if: steps.signing-key.outputs.present == 'true'
        env:
          # Release signing key (ECDSA P-256 PEM) of this product only; only this step has it. It runs the CLI the
          # build step compiled (no nx, no network). Never printed.
          AGENSTRA_RELEASE_SIGNING_KEY: ${{ matrix.product == 'agenstra' && secrets.AGENSTRA_RELEASE_SIGNING_KEY || '' }}
          DECABILL_RELEASE_SIGNING_KEY: ${{ matrix.product == 'decabill' && secrets.DECABILL_RELEASE_SIGNING_KEY || '' }}
          FOREPATH_RELEASE_SIGNING_KEY: ${{ matrix.product == 'forepath' && secrets.FOREPATH_RELEASE_SIGNING_KEY || '' }}
          LOADWEAVER_RELEASE_SIGNING_KEY: ${{ matrix.product == 'loadweaver' && secrets.LOADWEAVER_RELEASE_SIGNING_KEY || '' }}
        run: |
          node tmp/release-integrity/release-manifest.cjs sign --product "${{ matrix.product }}" \
            --manifest "dist/release-manifests/${{ matrix.product }}-release-manifest-${VERSION}.json"

      - name: Attach the release manifest to the GitHub release
        if: steps.signing-key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" dist/release-manifests/${{ matrix.product }}-release-manifest-"${VERSION}".json* --clobber

  # In-app update feeds of the desktop apps (tools/desktop-release): `updates/desktop/<channel>.json` points at the
  # signed release manifest, which the apps verify with their compiled-in keys before they install anything. Only
  # published once that manifest exists (and verifies here with the same keys); otherwise skipped with a warning.
  publish-desktop-update-feeds:
    name: Publish Desktop Update Feeds (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs:
      - publish
      - publish-native-applications
      - sign-release-manifests
    if: >-
      ${{ !cancelled() &&
      needs.publish.outputs.new_release_published == 'true' &&
      needs.publish-native-applications.result == 'success' &&
      needs.sign-release-manifests.result == 'success' }}
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: agenstra
            product: agenstra
            bucket_secret: AGENSTRA_AWS_BUCKET
            endpoint_secret: AGENSTRA_CLOUDFLARE_R2_ENDPOINT
    env:
      VERSION: ${{ needs.publish.outputs.new_release_version }}
      MANIFEST: ${{ matrix.product }}-release-manifest-${{ needs.publish.outputs.new_release_version }}.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the signed release manifest
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/desktop-feed
          if gh release download "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir dist/desktop-feed \
              --pattern "${MANIFEST}" --pattern "${MANIFEST}.sig"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=${{ matrix.app }} update feeds unchanged::No signed release manifest on v${VERSION}; desktop apps are not offered this release in-app."
          fi

      - name: Setup environment
        if: steps.manifest.outputs.present == 'true'
        uses: ./.github/actions/setup-env

      # Verifies the manifest with the compiled-in keys (as the apps do) before any feed is written; feeds only for the
      # channels that announce an older version (never backwards).
      - name: Write the update feeds
        if: steps.manifest.outputs.present == 'true'
        run: |
          set -euo pipefail
          npx nx run desktop-release:bundle
          CHANNELS="$(node tmp/desktop-release/desktop-release.cjs channels --app "${{ matrix.app }}" --version "${VERSION}")"
          if [ -z "${CHANNELS}" ]; then
            echo "Every channel already announces ${VERSION} or newer; feeds unchanged."
            exit 0
          fi
          node tmp/desktop-release/desktop-release.cjs feed --app "${{ matrix.app }}" --version "${VERSION}" \
            --channels "${CHANNELS}" --manifest "dist/desktop-feed/${MANIFEST}" --out dist/desktop-feed/updates

      - name: Upload the manifest and feeds to Cloudflare R2
        if: steps.manifest.outputs.present == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets[matrix.endpoint_secret] }}
          BUCKET: ${{ secrets[matrix.bucket_secret] }}
        run: |
          set -euo pipefail
          for f in "${MANIFEST}" "${MANIFEST}.sig"; do
            aws s3 cp "dist/desktop-feed/${f}" "s3://${BUCKET}/releases/${VERSION}/${f}" --endpoint-url "${CLOUDFLARE_R2_ENDPOINT}"
          done
          # Feeds last: they only ever point at a manifest that is already published.
          if [ -d dist/desktop-feed/updates ]; then
            aws s3 cp dist/desktop-feed/updates/ "s3://${BUCKET}/updates/desktop/" --recursive \
              --endpoint-url "${CLOUDFLARE_R2_ENDPOINT}" --cache-control 'no-cache' --content-type 'application/json'
          fi

